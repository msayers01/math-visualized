{
  const INP = [-3, -2, -1, 0, 1, 2, 3];
  const CIRC_PAIRS = [[-5, 0], [-4, 3], [-4, -3], [-3, 4], [-3, -4], [0, 5], [0, -5], [3, 4], [3, -4], [4, 3], [4, -3], [5, 0]];
  const same = (a, b) => Math.abs(a - b) < 1e-6;
  const sgn = v => (v > 0 ? '+' : '') + num(v);
  const SERIF = '"STIX Two Text", "Cambria Math", "Times New Roman", serif';
  const SANS = '"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif';

  /* The rules the student can choose. `outs(x)` lists every output the rule gives for input x. */
  const RULES = {
    lin1: { eq: 'f(x) = 2x − 1', words: 'Double the input, then subtract 1.', f: x => 2 * x - 1, sub: v => `2(${v}) − 1`, inputs: INP },
    lin2: { eq: 'f(x) = −x + 4', words: 'Subtract the input from 4.', f: x => 4 - x, sub: v => `−(${v}) + 4`, inputs: INP },
    lin3: { eq: 'f(x) = x/2 + 3', words: 'Halve the input, then add 3.', f: x => x / 2 + 3, sub: v => `(${v})/2 + 3`, inputs: INP },
    sq:   { eq: 'f(x) = x²', words: 'Multiply the input by itself.', f: x => x * x, sub: v => `(${v})²`, inputs: INP },
    circ: { eq: 'x² + y² = 25', words: 'The input squared plus the output squared is 25.', rel: true, inputs: [-5, -4, -3, 0, 3, 4, 5], pairs: CIRC_PAIRS }
  };
  for (const r of Object.values(RULES)) if (!r.rel) r.outs = x => [r.f(x)];
  RULES.circ.outs = x => {
    const q = 25 - x * x;
    if (q < -1e-9) return [];
    if (q < 1e-9) return [0];
    const y = Math.sqrt(q);
    return [y, -y];
  };
  const pairsOf = r => r.rel ? r.pairs : r.inputs.map(x => [x, r.f(x)]);
  /* inputs spaced d apart, passing through `base` (used for the equal-steps staircase) */
  const chainXs = (base, d) => { const xs = []; for (let x = base - d * Math.floor((base + 3) / d); x <= 3 + 1e-9; x += d) xs.push(x); return xs; };
  const jumpOf = (base, d) => base + d <= 3 ? [base, base + d] : [base - d, base];

  /* canvas drawing helpers (pixel space) */
  const rr = (c, x, y, w, hh, r) => {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + hh, r); c.arcTo(x + w, y + hh, x, y + hh, r);
    c.arcTo(x, y + hh, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  };
  const arrowPx = (c, x0, y0, x1, y1, col, wd = 2.5) => {
    const a = Math.atan2(y1 - y0, x1 - x0), hl = 9;
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = wd; c.lineCap = 'round'; c.setLineDash([]);
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1 - Math.cos(a) * hl * .7, y1 - Math.sin(a) * hl * .7); c.stroke();
    c.beginPath(); c.moveTo(x1, y1);
    c.lineTo(x1 - hl * Math.cos(a - .45), y1 - hl * Math.sin(a - .45)); c.lineTo(x1 - hl * Math.cos(a + .45), y1 - hl * Math.sin(a + .45));
    c.closePath(); c.fill();
  };
  const tx = (c, pal, s, x, y, { size = 14, color, align = 'center', weight = 500, halo = false } = {}) => {
    c.font = `${weight} ${size}px ${SANS}`; c.textAlign = align; c.textBaseline = 'middle';
    if (halo) { c.lineWidth = 4; c.strokeStyle = pal.stage; c.lineJoin = 'round'; c.strokeText(s, x, y); }
    c.fillStyle = color || pal.text; c.fillText(s, x, y);
  };
  /* math text: letters in italic serif, everything else upright sans */
  const mt = (c, pal, s, x, y, { size = 15, color, align = 'center', weight = 500, halo = false } = {}) => {
    const runs = [];
    for (const ch of s) {
      const it = /[a-zA-Z]/.test(ch), last = runs[runs.length - 1];
      if (last && last.it === it) last.t += ch; else runs.push({ t: ch, it });
    }
    const font = it => it ? `italic ${size}px ${SERIF}` : `${weight} ${size * .88}px ${SANS}`;
    let wt = 0;
    for (const r of runs) { c.font = font(r.it); r.w = c.measureText(r.t).width; wt += r.w; }
    let px = align === 'center' ? x - wt / 2 : align === 'right' ? x - wt : x;
    c.textAlign = 'left'; c.textBaseline = 'middle';
    for (const r of runs) {
      c.font = font(r.it);
      if (halo) { c.lineWidth = 4; c.strokeStyle = pal.stage; c.lineJoin = 'round'; c.strokeText(r.t, px, y); }
      c.fillStyle = color || pal.text; c.fillText(r.t, px, y); px += r.w;
    }
  };

  register({
    id: 'what-is-a-function', level: 'school',
    title: 'What is a function?',
    blurb: 'Feed numbers into a rule and watch each input and output become a point on a graph.',
    thumb(c, p) {
      const pal = p.pal; p.cx = 0; p.cy = 1; p.span = 3.6;
      p.grid(1);
      p.path([[-1.3, -3.6], [3.3, 5.6]], { stroke: pal.blue, width: 2.6 });
      p.path([[2, 0], [2, 3]], { stroke: pal.green, width: 2, dash: [4, 4] });
      p.path([[2, 3], [0, 3]], { stroke: pal.red, width: 2, dash: [4, 4] });
      p.dot(2, 3, 5.2, pal.yellow, pal.stage, 1.5);
    },
    hook: String.raw`A rule takes a number in and gives a number out. How can you tell, just by looking at its graph, that it never gives two different answers for the same input?`,
    steps: [
      { title: 'One input, one output',
        text: String.raw`<p>The box is a function machine for the rule \(f(x)=2x-1\). Feed it the input \(x=3\). It doubles the input and subtracts 1, and out comes one number: \(2(3)-1=5\).</p><p>We write \(f(3)=5\). On the graph this is the point \((3,5)\): 3 across and 5 up. The <b>green</b> dashed line marks the input on the x-axis and the <b>red</b> one marks the output on the y-axis. Drag in the graph to try other inputs.</p>`,
        set: { rule: 'lin1', x: 3, tbl: 0, steps: 0, vline: false, dx: 1 } },
      { title: 'A rule that is not a function',
        text: String.raw`<p>Now the rule is \(x^2+y^2=25\), a circle. Feed it \(x=3\) and two numbers fit: \(y=4\) and \(y=-4\), because \(3^2+4^2=25\) and \(3^2+(-4)^2=25\).</p><p>A function must give exactly one output for each input, so this is not a function. The <b>violet</b> vertical line at \(x=3\) crosses the graph twice. Now pick \(f(x)=x^2\) in the Rule menu: every vertical line crosses its graph only once.</p>`,
        set: { rule: 'circ', x: 3, tbl: 0, steps: 0, vline: true, dx: 1 } },
      { title: 'Four ways to show one function',
        text: String.raw`<p>Here is \(f(x)=2x-1\) in four forms. <b>Words:</b> double the input, then subtract 1. <b>Equation:</b> \(f(x)=2x-1\). <b>Table:</b> each row is an input and its output. <b>Graph:</b> each row is a point.</p><p>The highlighted row is \(x=2\) and \(f(2)=3\), so its point is \((2,3)\). The graph is the set of all such points, and the line passes through every one of them.</p><p>You can translate in any direction. The table row with \(x=0\) shows \(f(0)=-1\), the constant in the equation. Pick another linear rule and all four forms change together.</p>`,
        set: { rule: 'lin1', x: 2, tbl: 1, steps: 0, vline: false, dx: 1 } },
      { title: 'Equal steps in, equal steps out',
        text: String.raw`<p>Read down the table. Each time the input goes up by \(1\) (green), the output goes up by \(2\) (red). It is always \(2\), from the first row to the last, and every stair on the graph has the same height.</p><p>That \(2\) is the \(m\) in \(f(x)=2x-1\). With <b>Step size</b> \(2\) or \(3\) the output changes by \(4\) or \(6\). Now choose \(f(x)=x^2\) in the Rule menu: with step size \(1\) the changes are \(-5,-3,-1,+1,+3,+5\). They are not constant, so \(x^2\) is not linear.</p>`,
        set: { rule: 'lin1', x: 1, tbl: 1, steps: 1, vline: false, dx: 1 } }
    ],
    formal: String.raw`
      <p><b>Definition.</b> A <em>function</em> is a rule that assigns each input to <em>exactly one</em> output. The input is the <em>independent</em> variable. The output is the <em>dependent</em> variable, because its value depends on the input.</p>
      <h3>Function notation</h3>
      <p>We name a function with a letter such as \(f\). The symbol \(f(x)\), read "f of x", is the output of \(f\) for the input \(x\). It does not mean \(f\) times \(x\). For \(f(x)=2x-1\),
      \[ f(3)=2(3)-1=5. \]
      The pair \((3,5)\) is an <em>ordered pair</em>: input first, output second.</p>
      <h3>The graph is a set of ordered pairs</h3>
      <p>The graph of \(f\) is the set of all points \((x,\,f(x))\). A table lists a few of them and the graph shows all of them at once. The horizontal position of a point is an input, and its height is the matching output.</p>
      <h3>Function or not?</h3>
      <p>A rule fails to be a function if some input gets two different outputs. On a graph this is the <em>vertical line test</em>: a graph is the graph of a function exactly when no vertical line crosses it more than once.</p>
      <p>The circle \(x^2+y^2=25\) fails. The input \(3\) gives both \((3,4)\) and \((3,-4)\). In a table, look for a repeated input with different outputs.</p>
      <p>The reverse is allowed. Two different inputs may share an output: for \(f(x)=x^2\), \(f(2)=4\) and \(f(-2)=4\). Each input still has exactly one output.</p>
      <h3>Linear functions and constant change</h3>
      <p>A <em>linear function</em> has the form \(f(x)=mx+b\). Change the input by any amount \(\Delta x\) and the output changes by
      \[ f(x+\Delta x)-f(x)=\big(m(x+\Delta x)+b\big)-\big(mx+b\big)=m\,\Delta x. \]
      The change in the output is the constant \(m\) times the change in the input, wherever you start.</p>
      <p>Other functions do not behave this way. For \(f(x)=x^2\), \((x+1)^2-x^2=2x+1\). That is \(-5\) when you start at \(x=-3\) and \(+5\) when you start at \(x=2\).</p>
      <h3>Four ways to describe a linear function</h3>
      <p>The same function can be given in words ("double the input, then subtract 1"), by an equation (\(f(x)=2x-1\)), by a table, or by a graph. To go from a table to an equation, read \(b\) as the output when \(x=0\) and \(m\) as the change in output for each step of \(1\) in the input.</p>
      <p>The table \(x=0,1,2,3\) with \(f(x)=-1,1,3,5\) has \(b=-1\) and \(m=2\), so \(f(x)=2x-1\). Its graph is the line through \((0,-1)\) and \((1,1)\).</p>`,
    check: [
      { q: String.raw`Which list of (input, output) pairs is <b>not</b> a function?`,

        why: String.raw`The input \(2\) appears twice with different outputs, \(5\) and \(9\). A function gives each input exactly one output. In the other lists some outputs repeat, which is allowed. Only a repeated input with different outputs breaks the rule.`,
        hint: 'Look for an input that appears more than once. Does it always come with the same output?' },
      { q: String.raw`A table shows a linear function \(f\): for \(x=0,1,2,3\) the outputs are \(f(x)=5,8,11,14\). What is \(f(10)\)?`,
        choices: ['30', '35', '45', '53'], answer: 1,
        why: String.raw`Each step of \(1\) in the input adds \(3\) to the output, so \(m=3\). At \(x=0\) the output is \(5\), so \(b=5\) and \(f(x)=3x+5\). Then \(f(10)=3(10)+5=35\).`,
        hint: String.raw`Find the change in the output for each step of 1 in the input, then the output when \(x=0\).` }
    ],
    links: { related: ['slope-and-linear-functions', 'functions-as-transformations', 'quadratics-and-the-parabola', 'exponential-growth'] },

    mount({ stage, controls: C }) {
      stage.classList.add('split');
      const top = h('div', { class: 'pane', style: 'flex: 6 1 0' }), bot = h('div', { class: 'pane', style: 'flex: 14 1 0' });
      stage.append(top, bot);
      const P1 = new Plane(top), P2 = new Plane(bot);
      /* tbl: table and plotted points (0..1); steps: equal-steps overlay (0..1); rk: 0 = function window, 1 = circle window */
      const st = { x: 3, tbl: 0, steps: 0, rk: 0 };
      let rule = 'lin1', dx = 1, vline = false, cancel = () => {}, lay = null;

      const R = () => RULES[rule];
      const nearest = x => R().inputs.reduce((b, v) => Math.abs(v - x) < Math.abs(b - x) ? v : b, R().inputs[0]);
      const idxOf = x => R().inputs.indexOf(nearest(x));

      /* ---------- bottom pane layout: graph window (uniform scale) and table ---------- */
      const layout = p => {
        const W = p.w, H = p.h, m = 12, k = st.rk, T = st.tbl, r = R();
        const x0 = lerp(-4.5, -6.5, k), x1 = lerp(4.5, 6.5, k), y0 = lerp(-8, -6.5, k), y1 = lerp(10, 6.5, k);

        const s = Math.max(3, Math.min((H - 2 * m) / (y1 - y0), (W - 2 * m - tw - gap) / (x1 - x0)));
        const pw = (x1 - x0) * s, ph = (y1 - y0) * s, left = (W - (pw + gap + tw)) / 2, py = (H - ph) / 2;
        p.span = Math.min(W, H) / (2 * s);
        p.cx = x0 + (W / 2 - left) / s;
        p.cy = y1 + (py - H / 2) / s;
        const n = pairsOf(r).length, hdr = 34, rowH = Math.min(clamp(H * .075, 22, 34), (H - 2 * m - hdr) / n), ty = (H - hdr - n * rowH) / 2;
        return { W, H, x0, x1, y0, y1, s, px: left, py, pw, ph, tx: left + pw + gap, TW, n, hdr, rowH, ty, zone: TW * .17 };
      };

      /* ---------- top pane: the function machine ---------- */
      P1.onDraw = (c, p) => {
        const pal = p.pal, W = p.w, H = p.h, r = R(), outs = r.outs(st.x), xv = num(st.x);
        const bxW = clamp(W * .3, 120, 220), u = Math.min(clamp(W / 400, .8, 1.3), (W - 20 - bxW) / 228);
        const chW = 90 * u, chH = 36 * u, arr = 24 * u, bxH = 54 * u;

        for (const [t, cx] of [['input', x0 + chW / 2], ['rule', xb + bxW / 2], ['output', xo + chW / 2]])
          tx(c, pal, t, cx, yM - 40 * u - 12, { size: cap, color: pal.muted, weight: 600 });

        c.strokeStyle = pal.blue; c.lineWidth = 3; c.stroke();
        mt(c, pal, r.eq, xb + bxW / 2, yM + 1, { size: big * 1.1, weight: 600 });

        if (outs.length === 0) {
          tx(c, pal, 'no output', xo + chW / 2, yM, { size: big * .8, color: pal.muted });
        } else {
          const two = outs.length === 2, hh = two ? 31 * u : chH;

          });
        }

        const verdict = !r.rel ? 'Every input gets exactly one output.'
          : outs.length === 2 ? 'One input, two outputs: not a function.' : 'This input has one output, but others have two.';
        tx(c, pal, r.words, W / 2, H - 36, { size: Math.max(12, 13.5 * u), color: pal.muted });
        tx(c, pal, verdict, W / 2, H - 15, { size: Math.max(12.5, 14 * u), weight: 600 });
      };

      /* ---------- bottom pane: graph and table ---------- */

      const pts = [[1, 2.3], [1.7, 1.7], [2.4, 3.1], [3.1, 2.6], [3.8, 3.9], [4.5, 3.4], [5.2, 4.7], [5.9, 4.6], [6.6, 5.7], [7.3, 5.2], [8, 6.4], [8.8, 6.2], [9.5, 7.1]];
      pts.forEach(([x, y]) => p.path([[x, y], [x, f(x)]], { stroke: alpha(pal.red, .75), width: 1.6 }));
      p.path([[.4, f(.4)], [10, f(10)]], { stroke: pal.blue, width: 2.8 });
      pts.forEach(([x, y]) => p.dot(x, y, 4.2, alpha(pal.text, .85), pal.stage, 1.2));
    },
    hook: String.raw`The dots rise, but they never sit exactly on a line. How do you draw the one line that fits them, and how far can you trust a prediction made from it?`,
    steps: [
      { title: 'Read the pattern',
        text: String.raw`<p>Each dot is one student. Across is the time spent studying. Up is the quiz score. A scatter plot shows whether two measurements go together.</p><p>The dots climb from lower left to upper right: a <b>positive</b> association. They follow a straight band: a <b>linear</b> association. The readout names the pattern.</p><p>Open the <b>Dataset</b> menu and try to name each pattern before you read the readout.</p>`,
        set: { ds: 'study', line: false, res: false, pred: false, name: true } },
      { title: 'When is a line a good model?',
        text: String.raw`<p>These dots show a thrown ball's height over time. They rise and fall in an arch: a <b>nonlinear</b> association.</p><p>The line shown is the good line from the button, flat at \(9\) m. Even so, it misses by \(3.3\) m on average, exactly as much as a flat line at the average height. The dots sit below the line at both ends and above it in the middle.</p><p>Drag the handles: no straight line gets the average miss anywhere near zero. Use a line only when the dots follow a straight band.</p>`,
        set: { ds: 'ball', line: true, res: true, pred: false, name: false, m: 0, b: 9 } },
      { title: 'Fit a line by eye',
        text: String.raw`<p>Back to the study scores. This rough line, \(y = 2x + 66\), is only a guess. Each red segment is a <b>miss</b>: the vertical gap between a dot and the line. The average miss is \(6.3\) points.</p><p>Drag the two ringed handles, or use the sliders, to bring the average miss down. The left handle sets where the line starts, \(b\). The right handle tilts it, \(m\).</p><p>Then press <b>Show a good line</b>. Its average miss is \(3.4\) points. It is one good line, not the only one.</p>`,
        set: { ds: 'study', line: true, res: true, pred: false, name: false, m: 2, b: 66 } },
      { title: 'Predict and interpret',
        text: String.raw`<p>The good line is \(y = 4.5x + 52\). The yellow guide sits at \(5\) hours, so the line predicts \(4.5\times 5 + 52 = 74.5\) points.</p><p>The <b>slope</b>, \(4.5\), is a rate: each extra hour adds about \(4.5\) points. The <b>intercept</b>, \(52\), is the starting value: with \(0\) hours the line predicts \(52\) points.</p><p>Now drag the guide to \(12\) hours. The line says \(106\), but the quiz is out of \(100\). Far outside the data, a line can fail.</p>`,
        set: { ds: 'study', line: true, res: false, pred: true, name: false, m: 4.5, b: 52, x: 5 } }
    ],
    formal: String.raw`
      <p>A <b>scatter plot</b> shows pairs of measurements, one dot \((x,y)\) for each person or object, with \(x\) across and \(y\) up. It lets you look for a pattern before you calculate anything.</p>
      <h3>Describing association</h3>
      <p>
      <b>Direction.</b> <em>Positive</em>: as \(x\) increases, \(y\) tends to increase. <em>Negative</em>: as \(x\) increases, \(y\) tends to decrease. <em>No association</em>: no trend.<br>
      <b>Shape.</b> <em>Linear</em>: the dots follow a straight band. <em>Nonlinear</em>: they follow a curve, such as an arch.<br>
      <b>Strength.</b> <em>Strong</em>: the dots hug the pattern. <em>Weak</em>: they are widely scattered around it.<br>
      <b>Clusters and outliers.</b> A <em>cluster</em> is a group of dots close together, often with a gap before the next group. An <em>outlier</em> is a dot far from the rest of the pattern.</p>
      <h3>Lines of fit</h3>
      <p>Use a straight line only when the dots suggest a linear association. Then draw a line \(y = mx + b\) with the dots close to it, about as many above as below. It is a <em>model</em>: it describes the trend, and the dots will not lie exactly on it.</p>
      <h3>Residuals: judging the fit</h3>
      <p>For a dot \((x,y)\) the line predicts \(\hat y = mx + b\). The <em>residual</em> is the miss:
      \[ \text{residual} = y - \hat y = \text{actual} - \text{predicted}. \]
      It is positive for a dot above the line and negative for a dot below. Small residuals mean a close fit. The lesson's <em>average miss</em> is the mean of \(|y-\hat y|\).</p>
      <p>Compare your line with the flat line \(y=\bar y\), where \(\bar y\) is the average of the \(y\) values. A line that does no better than that is not describing the pattern. If the residuals themselves form a pattern, for example negative at both ends and positive in the middle, a curve fits better than any line.</p>
      <p>Many lines can fit well. The <em>least-squares line</em> makes the sum of the squared residuals, \(\sum (y-\hat y)^2\), as small as possible. <b>Show a good line</b> draws it. Squaring makes big misses count extra, so one outlier can pull this line toward itself.</p>
      <h3>Reading the equation</h3>
      <p>In context the <b>slope</b> \(m\) is a rate: the predicted change in \(y\) for each 1-unit increase in \(x\), such as points per hour or dollars per year. The <b>intercept</b> \(b\) is the predicted \(y\) when \(x=0\). It is a starting value only if \(x=0\) makes sense. A new car has age \(0\), but a shoe size of \(0\) does not exist.</p>
      <p>Example: with \(y=4.5x+52\), where \(x\) is hours studied and \(y\) is quiz points, each extra hour adds about \(4.5\) points and \(0\) hours predicts \(52\) points. At \(5\) hours, \(\hat y = 4.5(5)+52 = 74.5\).</p>
      <h3>Prediction and extrapolation</h3>
      <p>Predicting inside the range of the data is <em>interpolation</em>. Predicting outside it is <em>extrapolation</em>, which is riskier because the trend may stop or bend. At \(12\) hours this line gives \(106\) out of \(100\), which is impossible.</p>
      <h3>Association is not causation</h3>
      <p>Two quantities can move together without one causing the other. Ice cream sales and sunburns both rise on hot days, yet ice cream does not cause sunburn. A scatter plot shows that two variables are associated. It does not show why.</p>`,
    check: [
      { q: 'A scatter plot compares the outside temperature (across) with the cups of hot chocolate a café sells (up). The dots fall from the upper left to the lower right in a narrow, straight band. How would you describe the association?',
        choices: ['Positive and linear', 'Negative and linear', 'No association', 'Nonlinear'], answer: 1,
        why: 'As the temperature rises, sales fall, so the association is negative. The narrow straight band makes it linear. "Negative" names the direction of the dots, not whether the news is bad.',
        hint: 'Read the dots from left to right. Do they go up or down? Do they follow a straight band or a curve?' },
      { q: String.raw`A line of fit for a phone battery is \(y=-8x+100\), where \(x\) is hours of use and \(y\) is the percent of charge left. Which statement is correct?`,
        choices: ['The charge starts at 8% and falls 100 percentage points each hour',
                  'The charge rises about 8 percentage points each hour, so after 5 hours it is 140%',
                  'The charge falls about 8 percentage points each hour, so after 5 hours the line predicts about 60%',
                  'The charge falls about 8 percentage points each hour, so after 5 hours the line predicts −40%'], answer: 2,
        why: String.raw`The slope \(-8\) is a rate: the charge falls about 8 points per hour. The intercept \(100\) is the charge at \(0\) hours. At \(x=5\): \(-8(5)+100 = 60\). Leaving out the intercept would give \(-40\), which is not a charge at all.`,
        hint: String.raw`Which number is the slope and which is the intercept? Then put \(x=5\) into \(-8x+100\), adding the \(100\).` }
    ],
    links: { prereq: ['slope-and-linear-functions'], related: ['mean-median-and-spread', 'quadratics-and-the-parabola', 'exponential-growth'] },

    mount({ stage, controls: C }) {
      const st = { ds: 'study', m: 0, b: 75, x: 5, line: true, res: true, pred: false, name: false, drop: false };
      let cancel = () => {};
      const P = new Plane(stage, { span: 5 });
      const D = () => DS[st.ds];
      const incl = () => D().pts.filter((_, i) => !(st.drop && i === D().out));
      const startB = d => clamp(rnd(snap(meanY(d.pts), d.bStep)), 0, d.ymax);
      st.b = startB(DS.study);

      /* pixel layout of the plot area, and data <-> pixel maps */
      const geo = p => {
        const d = D(), ml = clamp(p.w * .105, 40, 54), mr = 26, mt = 58, mb = 54, pw = p.w - ml - mr, ph = p.h - mt - mb;
        return { ml, mr, mt, mb, pw, ph,
          X: x => ml + x / d.xmax * pw, Y: y => p.h - mb - y / d.ymax * ph,
          ix: px => (px - ml) / pw * d.xmax, iy: py => (p.h - mb - py) / ph * d.ymax };
      };

      P.onDraw = (c, p) => {
        const pal = p.pal, d = D(), g = geo(p), { X, Y } = g, fs = clamp(p.w / 33, 12, 14.5), pts = d.pts;
        const T = (s, x, y, o = {}) => {
          const px = o.px || fs;
          c.font = o.it ? `italic ${px + 4}px "STIX Two Text","Cambria Math","Times New Roman",serif` : `500 ${px}px "Hanken Grotesk","Helvetica Neue",Arial,sans-serif`;
          c.textAlign = o.align || 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = pal.stage;
          c.strokeText(s, x, y); c.fillStyle = o.color || pal.muted; c.fillText(s, x, y);
        };
        const seg = (x0, y0, x1, y1, col, w, dash) => { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.lineCap = 'round'; c.stroke(); c.setLineDash([]); };

        /* grid, axes, tick numbers */
        c.lineWidth = 1; c.strokeStyle = pal.grid; c.beginPath();
        for (let x = 0; x <= d.xmax + 1e-9; x += d.gx) { c.moveTo(X(x), g.mt); c.lineTo(X(x), Y(0)); }
        for (let y = 0; y <= d.ymax + 1e-9; y += d.gy) { c.moveTo(g.ml, Y(y)); c.lineTo(g.ml + g.pw, Y(y)); }
        c.stroke();
        seg(g.ml, Y(0), g.ml + g.pw, Y(0), pal['grid-strong'], 2); seg(g.ml, Y(0), g.ml, g.mt, pal['grid-strong'], 2);
        for (let x = 0; x <= d.xmax + 1e-9; x += d.gx) T(num(x), X(x), Y(0) + 16);
        for (let y = d.gy; y <= d.ymax + 1e-9; y += d.gy) T(num(y), g.ml - 8, Y(y), { align: 'right' });
        T(d.xt, g.ml + g.pw / 2, Y(0) + 38, { color: pal.text, px: fs + 1 });
        T(d.yt, 30, 16, { align: 'left', color: pal.text, px: fs + 1 });
        if (d.cap) {
          seg(g.ml, Y(d.cap), g.ml + g.pw, Y(d.cap), alpha(pal.muted, .8), 1.5, [3, 5]);
          T(d.capText, g.ml + 8, Y(d.cap) - 11, { align: 'left', px: fs - 1 });
        }

        /* pattern hints: outlier ring, cluster outlines */
        const dotR = clamp(p.w / 80, 4.5, 6.5);
        if (st.name) {
          (d.clusters || []).forEach(([cx, cy, rx, ry]) => {
            c.beginPath(); c.ellipse(X(cx), Y(cy), rx / d.xmax * g.pw, ry / d.ymax * g.ph, 0, 0, Math.PI * 2);
            c.fillStyle = alpha(pal.yellow, .09); c.fill(); c.strokeStyle = pal.yellow; c.lineWidth = 2; c.setLineDash([7, 5]); c.stroke(); c.setLineDash([]);
          });
          if (d.out != null) {
            const [ox, oy] = pts[d.out];
            c.beginPath(); c.arc(X(ox), Y(oy), dotR + 8, 0, Math.PI * 2); c.strokeStyle = pal.yellow; c.lineWidth = 2.5; c.stroke();
            T('outlier', X(ox) + dotR + 14, Y(oy), { align: 'left', color: pal.text });
          }
        }

        /* line of fit, misses (clipped to the plot) */
        const ys = x => st.m * x + st.b, keep = pts.map((_, i) => !(st.drop && i === d.out));
        if (st.line) {
          c.save(); c.beginPath(); c.rect(g.ml, g.mt - 2, g.pw + 2, g.ph + 4); c.clip();
          if (st.res) pts.forEach(([x, y], i) => { if (keep[i]) seg(X(x), Y(y), X(x), Y(ys(x)), alpha(pal.red, .85), 2.4); });
          seg(X(0), Y(ys(0)), X(d.xmax), Y(ys(d.xmax)), pal.blue, 3.6);
          c.restore();
        }

        /* the dots */
        pts.forEach(([x, y], i) => {
          c.beginPath(); c.arc(X(x), Y(y), dotR, 0, Math.PI * 2);
          if (keep[i]) { c.fillStyle = alpha(pal.text, .85); c.fill(); c.strokeStyle = pal.stage; c.lineWidth = 2; c.stroke(); }
          else { c.fillStyle = pal.stage; c.fill(); c.strokeStyle = pal.muted; c.lineWidth = 1.8; c.stroke(); }
        });

        if (st.line) {
          /* equation and average miss, in the top margin */
          const sub = incl(), ms = missOf(sub, st.m, st.b);
          T(linEq(st.m, st.b), 30, 40, { align: 'left', color: pal.blue, px: fs + 1 });
          T('average miss ' + d.fm(ms), p.w - 10, 40, { align: 'right', color: pal.red, px: fs + 1 });

          /* handles: b at the left end, m at the right end */
          const hb = [X(0), Y(clamp(st.b, 0, d.ymax))], hm = [X(d.xmax), Y(clamp(ys(d.xmax), 0, d.ymax))];
          [hb, hm].forEach(([hx, hy]) => { c.beginPath(); c.arc(hx, hy, 9.5, 0, Math.PI * 2); c.fillStyle = pal.stage; c.fill(); c.strokeStyle = pal.brass; c.lineWidth = 3.2; c.stroke(); });
          T('b', hb[0] + 20, hb[1] + (hb[1] - 18 < g.mt + 6 ? 18 : -16), { it: true, color: pal.text, px: fs });
          T('m', hm[0] - 20, hm[1] + (hm[1] - 18 < g.mt + 6 ? 18 : -16), { it: true, color: pal.text, px: fs });

          /* prediction guide */
          if (st.pred) {
            const gx = X(st.x), yv = ys(st.x), gy = clamp(Y(yv), g.mt, Y(0));
            seg(gx, Y(0), gx, gy, pal.yellow, 2.4, [6, 5]); seg(g.ml, gy, gx, gy, pal.yellow, 2.4, [6, 5]);
            c.beginPath(); c.moveTo(gx, Y(0) - 14); c.lineTo(gx - 8, Y(0) - 1); c.lineTo(gx + 8, Y(0) - 1); c.closePath();
            c.fillStyle = pal.yellow; c.fill(); c.strokeStyle = pal.stage; c.lineWidth = 1.5; c.stroke();
            c.beginPath(); c.arc(gx, gy, 7.5, 0, Math.PI * 2); c.fillStyle = pal.yellow; c.fill(); c.strokeStyle = pal.stage; c.lineWidth = 2.5; c.stroke();
            const txt = d.fx(st.x) + ' \u2192 ' + d.fy(yv), px = fs + 1;
            c.font = `500 ${px}px "Hanken Grotesk","Helvetica Neue",Arial,sans-serif`;
            const tw = c.measureText(txt).width + 16, room = Y(0) - gy > 96;
            const ty = room ? (Y(0) + gy) / 2 : gy - 24 > g.mt + 8 ? gy - 24 : gy + 24;   /* on the dashed guide, halfway down, where no dots are */
            const bx = clamp(gx - tw / 2, g.ml + 2, p.w - tw - 6);
            c.beginPath(); c.moveTo(bx + 12, ty - 12); c.arcTo(bx + tw, ty - 12, bx + tw, ty, 12); c.arcTo(bx + tw, ty + 12, bx + tw - 12, ty + 12, 12); c.arcTo(bx, ty + 12, bx, ty, 12); c.arcTo(bx, ty - 12, bx + 12, ty - 12, 12); c.closePath(); c.fillStyle = alpha(pal.stage, .94); c.fill(); c.strokeStyle = pal.yellow; c.lineWidth = 1.5; c.stroke();
            T(txt, bx + tw / 2, ty, { color: pal.text, px });
          }
        }
      };

      /* ---- controls ---- */
      const sel = C.select({ label: 'Dataset', value: st.ds, options: Object.entries(DS).map(([value, o]) => ({ value, label: o.label })),
        onChange: v => { cancel(); setDataset(v); sync(); } });
      const host = sel.parentElement.parentElement;
      C.title('Your line');
      let sl = {};
      const mk = (cfg, old) => { const s = C.slider(cfg), el = host.lastElementChild; if (old) host.replaceChild(el, old.el); return { s, el }; };
      const touch = key => { if (key === 'x') { if (!st.pred) setFlag('pred', true); } else if (!st.line) setFlag('line', true); };
      const edit = key => v => { cancel(); touch(key); st[key] = rnd(v); sync(); };
      const buildSliders = () => {
        const d = D();
        sl.m = mk({ label: `Slope m (${d.su})`, min: -d.mMax, max: d.mMax, step: d.mStep, value: st.m, format: v => num(v), onInput: edit('m') }, sl.m);
        sl.b = mk({ label: `Intercept b (${d.yu})`, min: 0, max: d.ymax, step: d.bStep, value: st.b, format: v => num(v), onInput: edit('b') }, sl.b);
        if (sl.x) sl.x = mk({ label: `Predict at x (${d.xu})`, min: 0, max: d.xmax, step: d.xStep, value: st.x, format: v => num(v), onInput: edit('x') }, sl.x);
      };
      buildSliders();
      C.buttons([
        { label: 'Show a good line', primary: true, onClick: () => { cancel(); setFlag('line', true); const f = lsq(incl()); cancel = animateTo(st, f, 900, sync); } },
        { label: 'Start over', onClick: () => { cancel(); setFlag('line', true); Object.assign(st, { m: 0, b: startB(D()) }); sync(); } }
      ]);
      const roA = C.readout();
      C.title('Show');
      const tg = {};
      const tog = (key, label) => { tg[key] = C.toggle({ label, value: st[key], onChange: v => { st[key] = v; sync(); } }); };
      tog('line', 'Line of fit and its handles'); tog('res', 'Misses (vertical gaps)'); tog('name', 'Name the pattern'); tog('drop', 'Leave out the outlier');
      const dropRow = tg.drop.parentElement;
      C.title('Predict');
      tog('pred', 'Prediction guide');
      sl.x = mk({ label: `Predict at x (${D().xu})`, min: 0, max: D().xmax, step: D().xStep, value: st.x, format: v => num(v), onInput: edit('x') });
      const setFlag = (k, v) => { st[k] = v; tg[k].checked = v; };
      const roB = C.readout();
      C.hint('Drag the two ringed handles, or use the sliders. The yellow guide reads a prediction off the line.');

      const setDataset = key => {
        st.ds = key; const d = D();
        setFlag('drop', false); dropRow.style.display = d.out == null ? 'none' : '';
        Object.assign(st, { m: 0, b: startB(d), x: d.x0 });
        sel.value = key; buildSliders();
      };
      dropRow.style.display = D().out == null ? 'none' : '';

      const upd = () => {
        const d = D(), sub = incl(), { m, b, x } = st, f = lsq(sub), base = baseOf(sub);
        const ms = missOf(sub, m, b), bs = missOf(sub, f.m, f.b), r = base > 0 ? ms / base : 0, rb = base > 0 ? bs / base : 0;
        const A = [], B = [];
        if (st.name) A.push(`<span class="k">Pattern</span> <b>${d.pattern}.</b> ${d.note}`);
        if (st.line) {
          A.push(`<span class="k">Your line</span> ${linEq(m, b)}`);
          A.push(`<span class="k">Average miss</span> ${d.fm(ms)} <span class="k">(a flat line at the average: ${d.fm(base)})</span>`);
          A.push(`<span class="k">Fit</span> ${verdict(r)}`);
          A.push(`<span class="k">Good line</span> ${linEq(f.m, f.b)}, average miss ${d.fm(bs)}.` + (rb >= .8 ? ' Even the good line is poor here, so a line is not a good model.' : ''));
          A.push(`<span class="k">Slope m = ${num(m)}.</span> ${d.slope(m)}`);
          A.push(`<span class="k">Intercept b = ${num(b)}.</span> ${d.inter(b)}`);
          if (st.pred) {
            const y = m * x + b, xs = d.pts.map(p => p[0]), notes = [];
            const eq = `${num(m)} × ${num(x)} ${b < 0 ? '−' : '+'} ${num(Math.abs(b))} = ${num(y)}`;
            if (x < Math.min(...xs) - 1e-9 || x > Math.max(...xs) + 1e-9) notes.push(`This is outside the data (${num(Math.min(...xs))} to ${num(Math.max(...xs))}), so it is extrapolation. Treat it with care.`);
            else if (d.gap && x > d.gap[0] && x < d.gap[1]) notes.push(`No dots lie between ${num(d.gap[0])} and ${num(d.gap[1])}, so this is a guess.`);
            if (d.cap && y > d.cap + 1e-9) notes.push(`The highest possible score is ${d.cap}, so the line fails here.`);
            if (d.floorText && y < -1e-9) notes.push(d.floorText + ', so the line fails here.');
            if (r >= .8) notes.push('This line fits poorly, so trust the prediction very little.');
            B.push(`<span class="k">At ${d.fx(x)}:</span> ${eq}, so about ${d.fy(y)}.` + (notes.length ? '<br>' + notes.join(' ') : ''));
          }
        }
        roA.innerHTML = A.join('<br>'); roA.style.display = A.length ? '' : 'none';
        roB.innerHTML = B.join('<br>'); roB.style.display = B.length ? '' : 'none';
      };
      const sync = () => { sl.m.s.set(st.m); sl.b.s.set(st.b); sl.x.s.set(st.x); P.draw(); upd(); };
      sync();

      draggable(P, {
        hit: (px, py) => {
          if (!st.line) return null;
          const d = D(), g = geo(P), ys = x => st.m * x + st.b;
          const hmx = g.X(d.xmax), hmy = g.Y(clamp(ys(d.xmax), 0, d.ymax));
          let gy = 0, onGuide = false;
          if (st.pred) { gy = clamp(g.Y(ys(st.x)), g.mt, g.Y(0)); onGuide = Math.abs(px - g.X(st.x)) < 16 && py > gy - 14 && py < g.Y(0) + 4; }
          if (onGuide && Math.hypot(g.X(st.x) - hmx, gy - hmy) < 6) return 'x';   /* guide and handle on top of each other: the guide wins */
          if (Math.hypot(px - hmx, py - hmy) < 20) return 'm';
          if (Math.hypot(px - g.X(0), py - g.Y(clamp(st.b, 0, d.ymax))) < 20) return 'b';
          return onGuide ? 'x' : null;
        },
        move: (hd, mx, my) => {
          cancel(); const d = D(), g = geo(P), px = P.X(mx), py = P.Y(my);
          if (hd === 'b') st.b = clamp(rnd(snap(g.iy(py), d.bStep)), 0, d.ymax);
          else if (hd === 'm') st.m = clamp(rnd(snap((clamp(g.iy(py), 0, d.ymax) - st.b) / d.xmax, d.mStep)), -d.mMax, d.mMax);
          else st.x = clamp(rnd(snap(g.ix(px), d.xStep)), 0, d.xmax);
          sync();
        }
      });

      /* the plane's math-unit pointer readout would be wrong for these axes (and sits on the tick numbers), so hide it */
      if (P.coordEl) P.coordEl.style.display = 'none';

      const apply = (patch, immediate) => {
        cancel();

  const brk = (n, z) => { const N = n * pow10(2 * z), k = isqrt(N); return { k, exact: k * k === N }; };

        text: String.raw`<p>A square garden has area \(50\) square meters. If its side is \(x\) meters, then \(x^2=50\). Taking the square root undoes the squaring: \(x=\sqrt{50}\) or \(x=-\sqrt{50}\). A length cannot be negative, so the side is \(\sqrt{50}\).</p><p>Since \(7^2=49\) and \(8^2=64\), the side is between \(7\) and \(8\) meters, about \(7.07\) m. Check by squaring: \(7.07^2=49.9849\), close to \(50\).</p>`,

    formal: String.raw`
      <p><b>Definition.</b> The <em>square root</em> of a number \(a\ge0\) is the non-negative number \(\sqrt a\) whose square is \(a\):
      \[ (\sqrt a)^2 = a. \]
      It is the side length of a square with area \(a\). A <em>perfect square</em> is the square of a whole number: \(1, 4, 9, 16, 25, 36, 49,\ldots\)</p>
      <h3>Squares and square roots undo each other</h3>
      <p>Squaring then taking the root returns the number you started with, as long as it is not negative:
      \(\sqrt{7^2}=7\). If the number is negative, the result is its absolute value: \(\sqrt{(-7)^2}=\sqrt{49}=7\). In general \(\sqrt{b^2}=|b|\).</p>
      <p>To solve \(x^2=n\) with \(n>0\), both \(\sqrt n\) and \(-\sqrt n\) work, because \((-\sqrt n)^2=n\) too:
      \[ x^2=n \iff x=\sqrt n \ \text{ or } \ x=-\sqrt n, \qquad\text{written } x=\pm\sqrt n. \]
      The symbol \(\sqrt{\ }\) means only the non-negative root; the \(\pm\) comes from solving the equation. If \(n=0\) the only solution is \(0\). If \(n<0\) there is no real solution, since a square is never negative. When \(x\) is a length, keep only the positive solution.</p>
      <h3>Rational and irrational numbers</h3>
      <p>A <em>rational number</em> can be written as a fraction \(\tfrac pq\) of integers with \(q\ne0\). Integers, fractions, and decimals that end or repeat are rational: \(3=\tfrac31\), \(0.36=\tfrac{9}{25}\), \(0.\overline{3}=\tfrac13\). An <em>irrational number</em> is a real number that is not rational. Its decimal never ends and never repeats. Every real number is exactly one of the two.</p>
      <h3>Which square roots are irrational?</h3>
      <p><b>Fact.</b> Let \(n\) be a positive integer. If \(n\) is a perfect square, \(\sqrt n\) is an integer, so it is rational. If \(n\) is not a perfect square, \(\sqrt n\) is irrational. So the square root of a whole number is either a whole number or irrational, never a fraction like \(\tfrac74\).</p>
      <p><em>Why.</em> Suppose \(\sqrt n=\tfrac pq\) in lowest terms. Then \(p^2=nq^2\), so \(q^2\) divides \(p^2\). But \(p\) and \(q\) share no prime factor, so \(p^2\) and \(q^2\) share none either, which forces \(q^2=1\). Then \(\sqrt n=p\) is a whole number. So when \(\sqrt n\) is not a whole number, it is not rational. For example \(1<\sqrt2<2\), so \(\sqrt2\) is not a whole number, so it is irrational.</p>
      <p>Digits alone cannot show this. No list of digits proves that a decimal never repeats, so the argument above is what we rely on.</p>
      <h3>Rational approximations</h3>
      <p>For positive numbers, \(a&lt;b\) exactly when \(a^2&lt;b^2\). So squaring decimals tells us where an irrational square root sits. Since \(2.2^2=4.84<5<5.29=2.3^2\), we know \(2.2<\sqrt5<2.3\). Each extra decimal place shrinks the bracket by a factor of \(10\):
      \[ 2.2<\sqrt5<2.3,\qquad 2.23<\sqrt5<2.24,\qquad 2.236<\sqrt5<2.237. \]
      The squares of these decimals get closer to \(5\) but never equal it. For instance \(2.236^2=4.999696<5<5.004169=2.237^2\).</p>
      <h3>Locate, compare, and estimate</h3>
      <p><b>Locate.</b> \(\sqrt{70}\) lies between \(8\) and \(9\), because \(8^2=64<70<81=9^2\).</p>
      <p><b>Compare.</b> Since \(7<8\), we have \(\sqrt7<\sqrt8\). To compare \(\sqrt7\) with \(2.6\), square the decimal: \(2.6^2=6.76<7\), so \(2.6<\sqrt7\).</p>
      <p><b>Estimate.</b> Replace each irrational number by a decimal just below it and a decimal just above it, then do the arithmetic. From \(2.2<\sqrt5<2.3\), the sum \(3+\sqrt5\) is between \(5.2\) and \(5.3\). When you subtract, the roles swap: \(5-\sqrt5\) is between \(5-2.3=2.7\) and \(5-2.2=2.8\).</p>

          } else {
            const left = x < PAD, ex0 = left ? 20 : W - 20, dir = left ? 1 : -1;
            c.strokeStyle = col; c.globalAlpha = alp * .55; c.lineWidth = 1.5; c.setLineDash([4, 5]); c.beginPath(); c.moveTo(ex0 + dir * 5, ya + 8); c.lineTo(ex0 + dir * 5, ya + row - 12); c.stroke(); c.setLineDash([]);
            c.globalAlpha = alp; c.fillStyle = col; c.beginPath(); c.moveTo(ex0, ya); c.lineTo(ex0 + dir * 11, ya - 7); c.lineTo(ex0 + dir * 11, ya + 7); c.closePath(); c.fill();
          }

        };

          const Bm = brk(st.m, z), sm = Math.sqrt(st.m);
          mark(cam.q, cam.qa, Bm.exact ? `√${st.m} = ${isqrt(st.m)}` : `√${st.m} ≈ ${sm.toFixed(z + 2)}`, 62, pal.violet, false);

        T(c, p, `Number line: ticks every ${TICKS[z]}`, 14, 18, { size: 12.5, color: pal.muted });
      };

      /* ---------- readout ---------- */
      const LT = '&lt;';
      const cmpLines = () => {
        const { n, zoom: z, cmp, m, d } = st, A = brk(n, z), out = [];
        if (cmp === 'root') {

          const Bm = brk(m, z), sm = n < m, S = sm ? A : Bm, G = sm ? Bm : A, a = sm ? n : m, b = sm ? m : n;
          const hiS = S.exact ? S.k : S.k + 1, loG = G.k;

          out.push(`Areas: ${a} ${LT} ${b}, so √${a} ${LT} √${b}`);
        } else if (cmp === 'dec') {
          const dk = Math.round(d * 10), dd = dk * dk, N = 100 * n, ds = dec(dk, 1), d2 = trim(dec(dd, 2));
          out.push(`<span class="k">Compare</span> √${n} with ${ds}`);
          out.push(`${ds}² = ${d2}, which is ${dd < N ? 'less than' : dd > N ? 'greater than' : 'equal to'} ${n}`);
          out.push(dd < N ? `so ${ds} ${LT} √${n}` : dd > N ? `so ${ds} &gt; √${n}` : `so ${ds} = √${n}`);
        }

      };
      const upd = () => {
        const { n, zoom: z, a } = st, s = Math.sqrt(n), B = brk(n, z), f = pow10(z), ex = B.exact, L = [];
        L.push(`<span class="k">Area</span> n = ${n} &nbsp; <span class="k">Side</span> ${ex ? `√${n} = ${isqrt(n)}` : `√${n} ≈ ${s.toFixed(5)}`}`);
        L.push(ex ? `<b>perfect square:</b> rational (an integer)` : `<b>not a perfect square:</b> irrational (its decimal never ends and never repeats)`);
        L.push(`<span class="k">Zoom: ${NAMES[z]}</span> (ticks every ${TICKS[z]})<br>` + (ex ? `√${n} = ${dec(B.k, z)} exactly` : `${dec(B.k, z)} ${LT} √${n} ${LT} ${dec(B.k + 1, z)}`));
        const col = (name, t) => `<span style="color:var(--${name})">${t}</span>`;
        L.push(ex ? `${dec(B.k, z)}² = ${n}` : `${col('green', `${dec(B.k, z)}² = ${trim(dec(B.k * B.k, 2 * z))}`)} ${LT} ${n} ${LT} ${col('red', `${trim(dec((B.k + 1) * (B.k + 1), 2 * z))} = ${dec(B.k + 1, z)}²`)}`);

      const probe = C.readout(), host = probe.parentElement; probe.remove();
      const show = (el, on) => { if (el) el.style.display = on ? '' : 'none'; };

        nS.set(st.n); zS.set(st.zoom); mS.set(st.m); dS.set(st.d); aS.set(st.a); cmpSel.value = st.cmp;
        show(mEl, st.cmp === 'root'); show(dEl, st.cmp === 'dec');
        zoomOut.disabled = st.zoom <= 0; zoomIn.disabled = st.zoom >= 3;
      };
      const change = ms => { aim(ms); upd(); };
      const setN = v => { v = clamp(Math.round(v), 1, MAXN); if (v === st.n) return; st.n = v; nS.set(v); change(260); };
      const setZoom = v => { v = clamp(Math.round(v), 0, 3); if (v === st.zoom) return; st.zoom = v; sync(); change(750); };

      C.title('Square');
      const nS = C.slider({ label: 'Area n (square units)', min: 1, max: MAXN, step: 1, value: st.n, format: v => String(Math.round(v)), onInput: v => { cancel(); setN(v); } });
      C.title('Number line');
      const zS = C.slider({ label: 'Zoom: ticks every', min: 0, max: 3, step: 1, value: st.zoom, format: v => TICKS[Math.round(v)], onInput: v => { cancel(); setZoom(v); } });
      const [zoomOut, zoomIn] = C.buttons([{ label: 'Zoom out', onClick: () => setZoom(st.zoom - 1) }, { label: 'Zoom in', primary: true, onClick: () => setZoom(st.zoom + 1) }]);
      C.title('Compare and estimate');
      const cmpSel = C.select({ label: 'Compare √n with', value: st.cmp, options: [
        { value: 'none', label: 'Nothing' }, { value: 'root', label: 'Another square root, √m' }, { value: 'dec', label: 'A decimal, d' }],

      const mEl = host && host.lastElementChild;
      const dS = C.slider({ label: 'Decimal d', min: 1, max: 8, step: .1, value: st.d, format: v => v.toFixed(1), onInput: v => { cancel(); st.d = Math.round(v * 10) / 10; change(300); } });
      const dEl = host && host.lastElementChild;
      const aS = C.slider({ label: 'Add a whole number: a + √n', min: 0, max: 5, step: 1, value: st.a, format: v => v ? 'a = ' + Math.round(v) : 'off', onInput: v => { cancel(); st.a = Math.round(v); change(500); } });
      const ro = C.readout();
      C.hint('Drag in the top picture to move the square’s corner, or use the sliders. Zoom in to squeeze √n between decimals.');

      draggable(P1, {
        hit: () => 'corner',
        move: (_, x, y) => { cancel(); const sd = Math.max(x, y, 0); setN(sd * sd); }
      });

      const apply = (patch, immediate) => {
        cancel();
        Object.assign(st, patch);   /* every field is discrete (integers, one-decimal d, the cmp flag) and applied instantly; the drawing eases toward it */
        sync(); aim(immediate ? 0 : 800); upd();
      };
      return { destroy: () => { cancel(); P1.destroy(); P2.destroy(); }, apply };
    }
  });
}

/* =====================================================================

{
  const FONT = '"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif';
  const MONO = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace';
  const MINUS = '−', TIMES = '×';

  /* ---------- number and text helpers ---------- */
  const sg = v => String(v).replace('-', MINUS);                                   /* -3 -> −3 */
  const signed = v => (v < 0 ? MINUS : '+') + Math.abs(v);                         /* +3, −2 */
  const par = v => (v < 0 ? '(' + sg(v) + ')' : String(v));                        /* 5 or (−3) */
  const rnd = (v, d = 6) => +v.toFixed(d);
  const commas = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const bigStr = n => commas('1' + '0'.repeat(n));                                 /* 10^n, n >= 0 */
  const smallStr = n => '0.' + '0'.repeat(n - 1) + '1';                            /* 10^-n, n >= 1 */
  const valTxt = e => (e >= 0 ? bigStr(e) : '1/' + bigStr(-e) + ' = ' + smallStr(-e));
  const cs1 = v => String(+clamp(v, 1, 9.9).toFixed(1));                           /* builder coefficient */
  const csN = v => String(+v.toFixed(2));                                          /* coefficient while it animates */
  const pw = n => `10<sup>${sg(n)}</sup>`;                                         /* HTML power of ten */
  const sciH = (ms, n) => `${ms} ${TIMES} ${pw(n)}`;
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  /* Sizes in meters, written as coefficient x 10^n. All are rounded approximations. */
  const OBJ = [
    { name: 'virus', short: 'virus', what: 'diameter', m: 1, n: -7 },
    { name: 'red blood cell', short: 'blood cell', what: 'diameter', m: 8, n: -6 },
    { name: 'human hair', short: 'hair', what: 'width', m: 1, n: -4 },
    { name: 'ant', short: 'ant', what: 'length', m: 3, n: -3 },
    { name: 'person', short: 'person', what: 'height', m: 1.7, n: 0 },
    { name: 'football field', short: 'football field', what: 'length', m: 1, n: 2 },
    { name: 'Mount Everest', short: 'Everest', what: 'height', m: 8.8, n: 3 },
    { name: 'Moon', short: 'Moon', what: 'diameter', m: 3.5, n: 6 },
    { name: 'Earth', short: 'Earth', what: 'diameter', m: 1.3, n: 7 },
    { name: 'Sun', short: 'Sun', what: 'diameter', m: 1.4, n: 9 }
  ];
  const UNITS = { '-9': 'nm', '-6': 'µm', '-3': 'mm', '-2': 'cm', '0': 'm', '3': 'km' };
  const RULES = ['mul', 'div', 'pow', 'pat'], OPS = ['mul', 'div', 'cmp'];
  const FLAGS = ['view', 'rule', 'op'], INTS = ['a', 'b', 'pa', 'pb', 'pn', 'n', 'n1', 'n2'];

  /* ---------- canvas text with raised exponents ----------
     items are strings or { s, col, up }; up draws a small raised exponent. Shrinks to fit maxW. */
  const T = (s, col) => ({ s, col });
  const U = (s, col) => ({ s, col, up: true });
  const sci = (ms, n, cm, cn, ct) => [T(ms, cm), T(' ' + TIMES + ' ', ct), T('10', ct), U(sg(n), cn)];
  const rich = (c, items, x, y, size, o = {}) => {
    const { align = 'center', color = '#888', weight = 600, maxW = 1e9, halo, fam = FONT } = o;
    const its = items.map(it => (typeof it === 'string' ? { s: it } : { ...it }));
    const fnt = (it, z) => `${weight} ${(it.up ? z * .64 : z).toFixed(1)}px ${fam}`;
    let z = size, tw = 0;
    const measure = () => { tw = 0; for (const it of its) { c.font = fnt(it, z); it.w = c.measureText(it.s).width + (it.up ? z * .04 : 0); tw += it.w; } };
    measure();
    if (tw > maxW) { z = Math.max(9, z * maxW / tw); measure(); }
    const left = align === 'left' ? x : align === 'right' ? x - tw : x - tw / 2;
    let px = left;

    for (const it of its) {
      c.font = fnt(it, z);

      { title: 'Multiply, divide, compare',
        text: String.raw`<p>To multiply, multiply the coefficients and add the exponents. For \((4\times10^3)(5\times10^2)\): \(4\times5=20\) and \(3+2=5\), giving \(20\times10^5\).</p><p>That is not scientific notation, because 20 is not below 10. Write \(20=2\times10^1\), so the answer is \(2\times10^6\).</p><p>Press <b>Divide</b>: \(4\div5=0.8\) and \(3-2=1\), so \(0.8\times10^1=8\times10^0\). Press <b>Compare</b>: the exponents decide first. \(10^3\) beats \(10^2\), so \(4\times10^3>5\times10^2\), even though \(4<5\).</p>`,
        set: { view: 'ops', op: 'mul', m1: 4, n1: 3, m2: 5, n2: 2 } }
    ],
    formal: String.raw`
      <p>These rules hold for every nonzero base \(b\) and all integers \(m\) and \(n\).<br>
      <b>Product.</b> \(b^m\cdot b^n=b^{m+n}\)<br>
      <b>Quotient.</b> \(\dfrac{b^m}{b^n}=b^{m-n}\)<br>
      <b>Power of a power.</b> \((b^m)^n=b^{mn}\)<br>
      <b>Zero exponent.</b> \(b^0=1\)<br>
      <b>Negative exponent.</b> \(b^{-n}=\dfrac1{b^n}\)</p>
      <h3>Why the product and quotient rules work</h3>
      <p>For a positive integer \(m\), \(b^m\) means \(m\) factors of \(b\). Multiplying \(m\) factors by \(n\) more factors gives \(m+n\) factors. In a quotient, each factor above the bar cancels one below it, because \(b\div b=1\). That leaves \(m-n\) factors. The power rule counts \(n\) groups of \(m\) factors, which is \(mn\) factors.</p>
      <h3>Zero and negative exponents</h3>
      <p>Counting down one exponent divides by the base: \(10^3=1000\), \(10^2=100\), \(10^1=10\). The pattern continues with \(10^0=1\), \(10^{-1}=\tfrac1{10}\), \(10^{-2}=\tfrac1{100}\).</p>
      <p>It is also the only choice that keeps the quotient rule true. Since \(\dfrac{b^3}{b^3}=b^{3-3}=b^0\) and any nonzero number divided by itself is \(1\), we need \(b^0=1\). Since \(\dfrac{b^2}{b^5}=b^{-3}\) and also \(\dfrac{b^2}{b^5}=\dfrac1{b^3}\), we need \(b^{-3}=\dfrac1{b^3}\).</p>
      <h3>Using the rules</h3>
      <p>\(2^5\cdot2^{-3}=2^{5+(-3)}=2^2=4\). Counting agrees: five factors of 2 above the bar and three below, so three pairs cancel and two factors of 2 remain. Also \((10^{-2})^3=10^{-6}=\tfrac1{1{,}000{,}000}\).</p>
      <p>A few slips to avoid. Add exponents only when you multiply powers of the <em>same</em> base: \(10^3+10^4\ne10^7\) and \(2^3\cdot3^2\ne6^5\). A negative exponent does not make the number negative: \(10^{-2}=0.01\).</p>
      <h3>Scientific notation</h3>
      <p>A number is in <em>scientific notation</em> when it is written
      \[ a\times10^{n}, \quad 1\le a<10, \quad n \text{ an integer}. \]
      The coefficient \(a\) holds the digits and the power of ten holds the size.</p>
      <p>To write \(a\times10^n\) in standard form, move the decimal point \(n\) places right if \(n>0\) and \(|n|\) places left if \(n<0\). To go the other way, move the point until exactly one nonzero digit is on its left, and count the places. A large number needs \(n>0\). A number between 0 and 1 needs \(n<0\). For example, \(320{,}000=3.2\times10^{5}\) and \(0.00032=3.2\times10^{-4}\).</p>
      <p>Real measurements are rounded, so scientific notation is a natural way to write an approximation. The Sun's diameter is about \(1.4\times10^9\) meters. The coefficient keeps only the digits worth keeping.</p>
      <h3>Comparing</h3>
      <p>When both coefficients are between 1 and 10, compare the exponents first. The number with the larger exponent is larger. If the exponents are equal, the larger coefficient wins.<br>
      \(4\times10^{3}>5\times10^{2}\), because \(3>2\).<br>
      \(6.1\times10^{5}<6.3\times10^{5}\), because the exponents match and \(6.1<6.3\).<br>
      \(2\times10^{-3}>9\times10^{-4}\), because \(-3>-4\).</p>
      <p>The symbols are \(<\), \(>\), \(=\), \(\le\) and \(\ge\). The statement \(x\le y\) is true when \(x&lt;y\) or \(x=y\). The statement \(x\ge y\) is true when \(x>y\) or \(x=y\).</p>
      <h3>Multiplying and dividing</h3>
      <p>Group the coefficients and the powers of ten, then use the exponent rules:
      \[ (a\times10^{m})(c\times10^{n}) = (ac)\times10^{m+n}, \]
      \[ \frac{a\times10^{m}}{c\times10^{n}} = \frac ac\times10^{m-n}. \]</p>
      <p>The product \(ac\) can be 10 or more, and the quotient \(a/c\) can be below 1. Then finish by writing the coefficient between 1 and 10:
      \[ 20\times10^{5} = 2\times10^{1}\times10^{5} = 2\times10^{6}, \]
      \[ 0.8\times10^{1} = 8\times10^{-1}\times10^{1} = 8\times10^{0}. \]
      Because \(1\le a,c<10\), the product is below 100 and the quotient is between 0.1 and 10. So the exponent changes by at most 1.</p>
      <p>Light travels about \(3\times10^{8}\) meters per second and a year is about \(3.2\times10^{7}\) seconds. In a year light covers about \((3\times10^{8})(3.2\times10^{7})=9.6\times10^{15}\) meters.</p>
      <h3>How calculators and spreadsheets show it</h3>
      <p>A screen cannot raise digits, so it writes the power of ten after an E (or e). \(3.2\times10^5\) appears as <b>3.2E5</b>, and \(3.2\times10^{-4}\) as <b>3.2E-4</b>. Some screens add a plus sign, as in <b>3.2E+5</b>. The E means "times ten to the power". It is not Euler's number \(e\approx2.718\). A result too large or too small for the screen switches to this form automatically.</p>`,
    check: [
      { q: String.raw`Which expression is equivalent to \(2^{5}\cdot2^{-3}\)?`,
        choices: [String.raw`\(2^{-15}\)`, String.raw`\(2^{2}\)`, String.raw`\(2^{8}\)`, String.raw`\(2^{-2}\)`], answer: 1,
        why: String.raw`The base is the same, so add the exponents: \(5+(-3)=2\). The answer is \(2^2=4\). Counting factors agrees: five factors of 2 above the bar and three below, so three pairs cancel and two factors remain.`,

        hint: String.raw`Multiply the coefficients, add the exponents, then check that the coefficient is at least 1 and less than 10.` }
    ],

      const sciBottom = (c, p) => {
        const pal = p.pal, W = p.w, H = p.h, u = clamp(H / 260, .78, 1.4), m = clamp(st.m, 1, 9.9), n = st.n, D = decim(m, n), sel = selObj();

      const K = s => `<span class="k">${s}</span>`;

          const M = opsModel(), { m1, n1, m2, n2, op } = st, A = sciH(csN(m1), n1), B = sciH(csN(m2), n2);
          if (op === 'cmp') {
            s = `${K('Compare')} ${A} ? ${B}<br>${K('Exponents')} ${sg(n1)} ${relOf(Math.sign(n1 - n2))} ${sg(n2)}`;
            if (M.sameExp) s += `<br>${K('Coefficients')} ${csN(m1)} ${relOf(Math.sign(rnd(m1 - m2)))} ${csN(m2)}`;
            s += `<br>${K('So')} ${A} ${relOf(M.cmp)} ${B}<br>${K('True symbols')} ` + (M.cmp < 0 ? '&lt; and ≤' : M.cmp > 0 ? '&gt; and ≥' : '=, ≤ and ≥');
          } else {
            const eq = M.exact ? '=' : '≈';
            s = `${K('Problem')} (${A}) ${op === 'mul' ? TIMES : '÷'} (${B})<br>${K('Coefficients')} ${csN(m1)} ${op === 'mul' ? TIMES : '÷'} ${csN(m2)} ${eq} ${M.rt}<br>` +
              `${K('Exponents')} ${sg(n1)} ${op === 'mul' ? '+' : '−'} ${par(n2)} = ${sg(M.n)}<br>`;
            s += M.k === 0 ? `${K('Check')} ${M.rt} is between 1 and 10<br>` : `${K('Before fixing')} ${sciH(M.rt, M.n)}<br>${K('Rewrite')} ${M.rt} ${eq} ${csN(M.m)} ${TIMES} ${pw(M.k)}<br>`;
            s += `${K('Answer')} ${sciH(csN(M.m), M.nn)}`;
          }
        }
        ro.innerHTML = s; roMid.innerHTML = s;
      }

      /* ---------- dragging the ruler ---------- */
      const hitObj = (px, py) => {
        let best = -1, bd = 1e9;
        for (const q of hits) {
          const d = q.dot ? (Math.hypot(px - q.x, py - q.y) <= 15 ? Math.hypot(px - q.x, py - q.y) : 1e9)
            : (px >= q.l && px <= q.r && py >= q.t && py <= q.b ? 0 : 1e9);
          if (d < bd) { bd = d; best = q.i; }
        }
        return best;
      };
      draggable(P1, {
        hit: (px, py) => {
          if (st.view !== 'sci') return null;
          drag = null;
          const o = hitObj(px, py);
          return o >= 0 ? o : 'pan';
        },
        move: (hd, x) => {
          if (!drag) drag = { x0: x, c0: st.c, moved: false, obj: typeof hd === 'number' ? hd : -1 };
          if (!drag.moved && Math.abs(x - drag.x0) < 6) return;
          drag.moved = true; cancel();
          const pxd = (P1.w - 36) / st.w;
          st.c = clamp(drag.c0 - (x - drag.x0) / pxd, -9, 10);
          cenS.set(st.c); P1.requestDraw();
        }
      });

      P1.canvas.addEventListener('pointerup', () => {          /* a tap on an object loads its size; a drag slides the ruler */
        if (drag && drag.obj >= 0 && !drag.moved) loadObj(drag.obj);
        drag = null;
      });
      P1.canvas.addEventListener('pointercancel', () => { drag = null; });

      /* ---------- scene ---------- */
      P1.onDraw = (c, p) => {
        p.span = Math.min(p.w, p.h) / 2; p.cx = p.w / 2; p.cy = p.h / 2;     /* math coordinates = pixels (y flipped) */
        if (st.view === 'props') propsTop(c, p); else if (st.view === 'sci') sciTop(c, p); else opsTop(c, p);
      };
      P2.onDraw = (c, p) => {
        if (st.view === 'props') propsBottom(c, p); else if (st.view === 'sci') sciBottom(c, p); else opsBottom(c, p);
      };

      const apply = (patch, immediate) => {
        cancel();
        const anim = {};
        for (const [k, v] of Object.entries(patch)) { if (FLAGS.includes(k) || INTS.includes(k)) st[k] = v; else anim[k] = v; }
        if (st.view === 'ops') fitOps({ ...st, ...anim }, immediate);
        if (immediate || !Object.keys(anim).length) { Object.assign(st, anim); sync(); return; }
        sync();
        cancel = animateTo(st, anim, 1000, sync);
      };
      fitOps(st, true); sync();
      return { destroy: () => { cancel(); cancelOw(); P1.destroy(); P2.destroy(); }, apply };
    }
  });
}

/* =====================================================================
   SCHOOL — Forms of a linear equation
   ===================================================================== */
{
  const LIM = 9;   /* handles sit on the whole-number grid, at most 9 from the axes */

  /* ---------- exact fractions [n, d] (d > 0, lowest terms) and their text ---------- */
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; };
  const Q = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return [n / g + 0, d / g]; };
  const qadd = (a, b) => Q(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
  const qmul = (a, b) => Q(a[0] * b[0], a[1] * b[1]);
  const qneg = a => [-a[0] + 0, a[1]];
  const qeq = (a, b) => a[0] === b[0] && a[1] === b[1];
  const qlt = (a, b) => a[0] * b[1] < b[0] * a[1];
  const zero = a => a[0] === 0;
  const iv = v => (v < 0 ? '−' : '') + Math.abs(v);                                   /* integer with a true minus */
  const qs = a => iv(a[0]) + (a[1] === 1 ? '' : '/' + a[1]);                           /* "−3/2" */
  const plus = a => zero(a) ? '' : (a[0] < 0 ? ' − ' : ' + ') + qs([Math.abs(a[0]), a[1]]);   /* " + 3/2", " − 2", "" */
  const minus = (v, a) => v + plus(qneg(a));                                            /* "x − 3", "x + 3", "y" */
  const cf = m => m[1] === 1 ? (Math.abs(m[0]) === 1 ? (m[0] < 0 ? '−' : '') : iv(m[0])) : (m[0] < 0 ? '−' : '') + '(' + Math.abs(m[0]) + '/' + m[1] + ')';
  const par = a => (a[0] < 0 || a[1] !== 1) ? '(' + qs(a) + ')' : qs(a);                /* a number as a factor: (2/3), (−3), 4 */
  const pt = (x, y) => '(' + qs(x) + ', ' + qs(y) + ')';
  const linStr = (ax, ay, k = 0) => {                                                   /* "−2x + 3y + 3" */
    let s = '';
    const add = (c, v) => { if (!c) return; const a = Math.abs(c), body = (v && a === 1 ? '' : a) + v; s += s ? (c < 0 ? ' − ' : ' + ') + body : (c < 0 ? '−' : '') + body; };
    add(ax, 'x'); add(ay, 'y'); add(k, '');
    return s || '0';
  };
  const joinTerms = (x, ks) => { let s = x; ks.forEach(k => { if (!zero(k)) s += s ? plus(k) : qs(k); }); return s || '0'; };

  /* ---------- a line as integers Ax + By = C: gcd 1, A not negative ---------- */
  const canon = (A, B, C) => {
    A = Math.round(A); B = Math.round(B); C = Math.round(C);
    if (!A && !B) return null;
    const g = gcd(gcd(A, B), C);
    A /= g; B /= g; C /= g;
    if (A < 0 || (A === 0 && B < 0)) { A = -A; B = -B; C = -C; }
    return { A: A + 0, B: B + 0, C: C + 0 };
  };
  const info = L => {
    const { A, B, C } = L, vert = B === 0;
    return { vert, m: vert ? null : Q(-A, B), b: vert ? null : Q(C, B), xi: A ? Q(C, A) : null, yi: B ? Q(C, B) : null };
  };
  const siText = (L, I) => I.vert ? 'x = ' + qs(I.xi) : 'y = ' + (zero(I.m) ? qs(I.b) : cf(I.m) + 'x' + plus(I.b));
  const stdText = L => linStr(L.A, L.B) + ' = ' + iv(L.C);
  const psRHS = (m, x1) => {
    if (zero(m)) return '0';
    const xe = minus('x', x1);
    if (m[0] === 1 && m[1] === 1) return xe;
    if (zero(x1)) return cf(m) + 'x';
    return cf(m) + '(' + xe + ')';
  };
  const psText = (x1, y1, m) => minus('y', y1) + ' = ' + psRHS(m, x1);
  const inBox = (x, y, s = LIM) => Math.abs(x) <= s && Math.abs(y) <= s;

  /* whole-number points of the line inside the box */
  const lattice = L => {
    const { A, B, C } = L, out = [];
    if (B === 0) { if (C % A === 0) { const x = C / A; if (Math.abs(x) <= LIM) for (let y = -LIM; y <= LIM; y++) out.push([x, y]); } }
    else for (let x = -LIM; x <= LIM; x++) { const n = C - A * x; if (n % B === 0 && Math.abs(n / B) <= LIM) out.push([x + 0, n / B + 0]); }
    return out;
  };
  const nearest = lat => lat.slice().sort((a, b) => (Math.abs(a[0]) + Math.abs(a[1])) - (Math.abs(b[0]) + Math.abs(b[1])) || Math.abs(a[0]) - Math.abs(b[0]));
  /* two neighbouring whole-number points of the line, one reduced step apart, both in the box */
  const pickPair = (L, fwdOnly) => {
    const d = L.B === 0 ? [0, 1] : (m => [m[1], m[0]])(Q(-L.A, L.B));
    for (const a of nearest(lattice(L))) {
      const f = [a[0] + d[0], a[1] + d[1]], r = [a[0] - d[0], a[1] - d[1]];
      if (inBox(f[0], f[1])) return [a, f];
      if (!fwdOnly && inBox(r[0], r[1])) return [r, a];
    }
    return null;
  };

  /* ---------- the Convert walkthrough: every step is a choice among three moves ---------- */
  const routeSI = (x1, y1, m) => {
    const [p, q] = m, X1 = Q(x1), Y1 = Q(y1), c1 = qmul(m, Q(-x1)), ms = qs(m);
    const needD = x1 !== 0 && p !== 0 && !(p === 1 && q === 1), needA = y1 !== 0, hasC = !zero(c1), needC = hasC && needA;
    const eq = (dist, add, comb) => {
      const left = add ? 'y' : minus('y', Y1);
      let rhs;
      if (needD && !dist) rhs = psRHS(m, X1) + (add ? plus(Y1) : '');
      else {
        let ks = []; if (hasC) ks.push(c1); if (add && needA) ks.push(Y1);
        if (comb && ks.length > 1) ks = [qadd(ks[0], ks[1])];
        rhs = joinTerms(p ? cf(m) + 'x' : '', ks);
      }
      return left + ' = ' + rhs;
    };
    const steps = [];
    if (needD) steps.push({
      label: 'Distribute ' + ms + ' over the parentheses', eq: eq(true, false, false),
      why: 'Distribute: ' + par(m) + ' × x = ' + cf(m) + 'x and ' + par(m) + ' × ' + par(Q(-x1)) + ' = ' + qs(c1) + '.',
      bad: [{ label: 'Multiply only the x by ' + ms, why: ms + ' multiplies everything inside the parentheses, the number as well as the x. ' + ms + ' × ' + iv(-x1) + ' is ' + qs(c1) + ', not ' + iv(-x1) + '.' },
            { label: 'Add ' + ms + ' to each term inside the parentheses', why: 'The slope multiplies the whole group. Adding it gives a different expression, so a different line.' }] });
    if (needA) {
      const pos = y1 > 0, Y = Math.abs(y1);
      steps.push({
        label: pos ? 'Add ' + Y + ' to both sides' : 'Subtract ' + Y + ' from both sides', eq: eq(true, true, false),
        why: pos ? 'The left side is y − ' + Y + '. Adding ' + Y + ' to both sides cancels the − ' + Y + ' and leaves y alone. The same move on both sides keeps the equation true.'
                 : 'The left side is y + ' + Y + '. Subtracting ' + Y + ' from both sides cancels the + ' + Y + ' and leaves y alone. The same move on both sides keeps the equation true.',
        bad: [{ label: pos ? 'Subtract ' + Y + ' from both sides' : 'Add ' + Y + ' to both sides',
                why: pos ? 'The left side is y − ' + Y + '. Subtracting ' + Y + ' again gives y − ' + 2 * Y + ', and y is still not alone. To undo "− ' + Y + '" you add ' + Y + '.'
                         : 'The left side is y + ' + Y + '. Adding ' + Y + ' gives y + ' + 2 * Y + ', and y is still not alone. To undo "+ ' + Y + '" you subtract ' + Y + '.' },
              { label: (pos ? 'Add ' : 'Subtract ') + Y + (pos ? ' to' : ' from') + ' the right side only', why: 'A move must be made on both sides. Changing only one side changes the equation, so the line would move.' }] });
    }
    if (needC) {
      const sum = qadd(c1, Y1), same = (c1[0] < 0) === (Y1[0] < 0);
      steps.push({
        label: 'Combine the two numbers, keeping their signs', eq: eq(true, true, true),
        why: 'Combine: ' + qs(c1) + plus(Y1) + ' = ' + qs(sum) + '. This single number is b, the y-intercept.',
        bad: [same ? { label: 'Subtract the second number from the first', why: 'The two numbers have the same sign, so they add: ' + qs(c1) + plus(Y1) + ' = ' + qs(sum) + '.' }
                   : { label: 'Add the two numbers without their signs', why: 'Each number keeps its sign: ' + qs(c1) + plus(Y1) + ' = ' + qs(sum) + ', not ' + qs([Math.abs(c1[0]) * Y1[1] + Math.abs(Y1[0]) * c1[1], c1[1] * Y1[1]]) + '.' },
              { label: 'Stop here: the numbers can stay separate', why: 'That is true but unfinished. Slope-intercept form is y = mx + b with a single number b.' }] });
    }
    return { start: psText(X1, Y1, m), steps, kind: 'si' };
  };

  const routeStd = (x1, y1, m) => {
    const [p, q] = m, X1 = Q(x1), Y1 = Q(y1), ye = minus('y', Y1), xe = minus('x', X1), P = Math.abs(p);
    const cfI = v => v === 1 ? '' : v === -1 ? '−' : iv(v);
    const needClear = q > 1;
    const leftPar = q > 1 && y1 !== 0, rightPar = x1 !== 0 && p !== 0 && p !== 1, needD = leftPar || rightPar;
    const needMX = p !== 0, kc = -q * y1, needMC = kc !== 0, needSign = p > 0;
    const unexp = (q > 1 ? (y1 ? q + '(' + ye + ')' : q + 'y') : ye) + ' = ' + (p === 0 ? '0' : p === 1 ? xe : x1 === 0 ? cfI(p) + 'x' : cfI(p) + '(' + xe + ')');
    const L = { ax: 0, ay: q, k: -q * y1 }, R = { ax: p, k: -p * x1 };
    const fm = () => linStr(L.ax, L.ay, L.k) + ' = ' + linStr(R.ax, 0, R.k);
    const sameSide = 'Do the same to both sides.';
    const steps = [];
    if (needClear) steps.push({
      label: 'Multiply both sides by ' + q, eq: needD ? unexp : fm(),
      why: 'Multiplying both sides by ' + q + ', the denominator, clears the fraction: ' + q + ' × ' + par(m) + ' = ' + iv(p) + '.',
      bad: [{ label: 'Multiply the right side by ' + q + ' only', why: 'Both sides must be multiplied by the same number. Changing one side changes the equation.' },
            { label: 'Multiply both sides by ' + P, why: 'To clear a fraction you multiply by its denominator, ' + q + '. Multiplying by ' + P + ' leaves a fraction in the equation.' }] });
    if (needD) steps.push({
      label: 'Distribute on each side', eq: fm(),
      why: 'Multiply each term in each pair of parentheses by the number in front of it.',
      bad: [{ label: 'Multiply only the variables, not the numbers', why: 'Every term inside the parentheses gets multiplied, the plain numbers as well as the variables.' },

        bad: [{ label: (pos ? 'Add ' : 'Subtract ') + t + (pos ? ' to' : ' from') + ' both sides', why: 'The right side has ' + (pos ? '+ ' : '− ') + t + '. ' + (pos ? 'Adding' : 'Subtracting') + ' ' + t + ' more does not remove it. You need the opposite move.' },
              { label: (pos ? 'Subtract ' : 'Add ') + t + (pos ? ' from' : ' to') + ' the right side only', why: 'A move must be made on both sides. Changing only one side changes the equation.' }] });
    }
    if (needMC) {
      const K = Math.abs(kc), pos = kc < 0;

        why: 'The left side has ' + (pos ? '− ' : '+ ') + K + '. ' + (pos ? 'Adding ' : 'Subtracting ') + K + ' on both sides removes it from the left and gathers the numbers on the right. ' + sameSide,
        bad: [{ label: (pos ? 'Subtract ' : 'Add ') + K + (pos ? ' from' : ' to') + ' both sides', why: 'The left side has ' + (pos ? '− ' : '+ ') + K + '. ' + (pos ? 'Subtracting' : 'Adding') + ' ' + K + ' more makes it twice as big. You need the opposite move.' },
              { label: (pos ? 'Add ' : 'Subtract ') + K + (pos ? ' to' : ' from') + ' the left side only', why: 'A move must be made on both sides. Changing only one side changes the equation.' }] });
    }
    if (needSign) {
      const cur = fm();
      L.ax = -L.ax; L.ay = -L.ay; R.k = -R.k;
      steps.push({
        label: 'Multiply both sides by −1', eq: fm(),
        why: 'Standard form asks for A not negative. Multiplying both sides by −1 flips every sign and keeps the equation true.',
        bad: [{ label: 'Multiply only the x term by −1', why: 'Every term on both sides must be multiplied. Changing one term changes the equation.' },
              { label: 'Stop here: ' + cur + ' is already standard form', why: 'It is the same line, but standard form asks for A not negative. Multiply both sides by −1.' }] });
    }
    return { start: psText(X1, Y1, m), steps, kind: 'std' };
  };

  /* lines to match in the challenge: two marked whole-number points each (and no equation shown) */
  const TG = [
    { A: 1, B: -2, C: -4, pts: [[-4, 0], [2, 3]] },
    { A: 3, B: 2, C: 6, pts: [[-2, 6], [2, 0]] },
    { A: 2, B: -3, C: 6, pts: [[0, -2], [6, 2]] },
    { A: 1, B: 1, C: 4, pts: [[-2, 6], [5, -1]] },
    { A: 2, B: -1, C: 3, pts: [[0, -3], [3, 3]] },
    { A: 0, B: 1, C: -2, pts: [[-5, -2], [4, -2]] },

  register({
    id: 'forms-of-a-linear-equation', level: 'school',
    title: 'Forms of a linear equation',
    blurb: 'Move one line and watch its point-slope, slope-intercept and standard forms change together, then see which lines are proportional.',
    thumb(c, p) {
      const pal = p.pal; p.cx = 0; p.cy = 0; p.span = 4.2;
      p.grid(1);
      p.path([[-4.4, -1.93], [4.4, 3.93]], { stroke: pal.blue, width: 2.6 });
      p.path([[-4.4, -2.93], [4.4, 2.93]], { stroke: pal.violet, width: 2, dash: [6, 5] });
      p.path([[-3, -1], [3, 3], [3, -1]], { fill: alpha(pal.yellow, .2), close: true });
      p.path([[-3, -1], [3, -1]], { stroke: pal.green, width: 2.4 });
      p.path([[3, -1], [3, 3]], { stroke: pal.red, width: 2.4 });
      p.dot(0, 1, 5, pal.yellow, pal.stage, 1.5);
    },
    hook: String.raw`The equations \(y+1=\tfrac23(x+3)\), \(y=\tfrac23x+1\) and \(2x-3y=-3\) look different. Why are they the same line, and why do we keep all three?`,
    steps: [
      { title: 'Two points give the slope',
        text: String.raw`<p>A is \((-3,-1)\) and B is \((3,3)\). From A to B the <b>run</b> (green) is \(6\) and the <b>rise</b> (red) is \(4\), so the slope is \(\tfrac46=\tfrac23\).</p><p>Call A the known point. Any point \((x,y)\) on the line has the same slope to A, so \(y-(-1)=\tfrac23\big(x-(-3)\big)\), which tidies to \(y+1=\tfrac23(x+3)\). This is <b>point-slope form</b>. Drag A or B and watch every form in the panel change together.</p>`,
        set: { mode: 'pts', view: 'ps', tgt: -1, conv: '', x1: -3, y1: -1, dx: 6, dy: 4 } },
      { title: 'Point-slope to slope-intercept',
        text: String.raw`<p>The yellow point is where the line crosses the y-axis: \((0,1)\), so \(b=1\). Slope-intercept form shows \(m\) and \(b\) at once: \(y=\tfrac23x+1\).</p><p>Now do the algebra yourself in the <b>Convert</b> box. Start from \(y+1=\tfrac23(x+3)\) and pick each move. A wrong move tells you why it fails. The right moves are distribute, subtract \(1\) from both sides, then combine \(2-1\).</p>`,
        set: { mode: 'pts', view: 'si', tgt: -1, conv: 'si', x1: -3, y1: -1, dx: 6, dy: 4 } },
      { title: 'Standard form and intercepts',
        text: String.raw`<p>Standard form is \(Ax+By=C\). Here it is \(3x+2y=12\), so \(A=3\), \(B=2\), \(C=12\).</p><p>Put \(y=0\): \(3x=12\), so \(x=\tfrac CA=4\). Put \(x=0\): \(2y=12\), so \(y=\tfrac CB=6\). The yellow points are the intercepts \((4,0)\) and \((0,6)\). Two points make a line, so this form is quick to graph. The slope is \(-\tfrac AB=-\tfrac32\). Drag an intercept to slide the line (only \(C\) changes) or use the sliders.</p>`,
        set: { mode: 'std', view: 'std', tgt: -1, conv: '', A: 3, B: 2, C: 12 } },
      { title: 'Proportional or not?',
        text: String.raw`<p>The blue line is \(y=2x+2\): slope \(2\), crossing the y-axis at \((0,2)\). The dashed violet line has the same slope but passes through the origin: \(y=2x\).</p><p>Compare \(y\div x\) at \(x=1,2,3,4\). On the dashed line it is \(2\) every time. On the blue line it is \(4,\ 3,\ \tfrac83,\ \tfrac52\). Now drag the blue y-intercept down to \(0\) and watch the ratios all become \(2\). The line is then proportional: \(y=kx\) with \(k=2\).</p>`,
        set: { mode: 'si', view: 'ratio', tgt: -1, conv: '', x1: 0, y1: 2, dx: 1, dy: 2 } }
    ],
    formal: String.raw`
      <p>One line can be written in several ways. Each form is built from different givens and shows different facts at a glance, so it helps to move between them.</p>
      <h3>Slope from two points</h3>
      <p>For two points \((x_1,y_1)\) and \((x_2,y_2)\) with \(x_1\neq x_2\),
      \[ m=\frac{y_2-y_1}{x_2-x_1}=\frac{\text{rise}}{\text{run}}. \]
      Swapping the points changes the sign of the top and the bottom, so \(m\) does not change. If \(x_1=x_2\) the run is \(0\): the line is vertical and its slope is undefined.</p>
      <h3>Point-slope form</h3>
      <p>Take a known point \((x_1,y_1)\) and any other point \((x,y)\) on the line. The slope between them is \(m\), so
      \[ \frac{y-y_1}{x-x_1}=m \quad\Longrightarrow\quad y-y_1=m(x-x_1). \]
      This form shows the slope and one point. Through \((-3,-1)\) and \((3,3)\) the slope is \(\frac{3-(-1)}{3-(-3)}=\frac46=\frac23\), so \(y+1=\frac23(x+3)\). Any point on the line can play the known point: using \((3,3)\) gives \(y-3=\frac23(x-3)\), which looks different but is the same line.</p>
      <h3>Slope-intercept form</h3>
      <p>\[ y=mx+b \]
      shows the slope \(m\) and the y-intercept \(b\), the height at \(x=0\). It is the form for graphing from \((0,b)\) by rise over run, and for reading a rate (\(m\)) and a starting value (\(b\)).</p>
      <h3>Standard form</h3>
      <p>\[ Ax+By=C \]
      with \(A\), \(B\), \(C\) whole numbers with no common factor, and \(A\ge0\). The intercepts come quickly. Put \(y=0\) to get the x-intercept \(x=C/A\). Put \(x=0\) to get the y-intercept \(y=C/B\). When \(B\neq0\) the slope is \(-A/B\). If \(B=0\) the equation is \(x=C/A\), a vertical line. If \(A=0\) it is \(y=C/B\), a horizontal line. Standard form suits totals of two quantities, such as \(3x+2y=12\) for pens at $3 and notebooks at $2 with $12 to spend.</p>
      <h3>Converting between forms</h3>
      <p><b>Point-slope to slope-intercept.</b> Start with \(y+1=\frac23(x+3)\). Distribute: \(y+1=\frac23x+2\). Subtract \(1\) from both sides: \(y=\frac23x+1\). In general \(y-y_1=m(x-x_1)\) becomes \(y=mx+(y_1-mx_1)\), so \(b=y_1-mx_1\).</p>
      <p><b>Point-slope to standard form.</b> From \(y+1=\frac23(x+3)\), multiply both sides by \(3\) to clear the fraction: \(3(y+1)=2(x+3)\). Distribute: \(3y+3=2x+6\). Subtract \(2x\) and subtract \(3\): \(-2x+3y=3\). Multiply by \(-1\) so that \(A\) is not negative: \(2x-3y=-3\).</p>
      <p><b>Standard form to slope-intercept.</b> Solve for \(y\). From \(2x-3y=-3\): \(-3y=-2x-3\), so \(y=\frac23x+1\). In general \(Ax+By=C\) gives \(y=-\frac ABx+\frac CB\).</p>
      <p><b>Slope-intercept to standard form.</b> Multiply \(y=\frac23x+1\) by \(3\): \(3y=2x+3\). Subtract \(3y\) and \(3\) from both sides: \(-3=2x-3y\), which is \(2x-3y=-3\).</p>
      <p><b>Two points to every form.</b> Through \((1,2)\) and \((3,8)\): \(m=\frac{8-2}{3-1}=3\). Point-slope: \(y-2=3(x-1)\). Slope-intercept: \(y=3x-1\). Standard: \(3x-y=1\).</p>
      <h3>What each number means on the graph</h3>
      <p>The slope \(m\) is how much the line rises for each step right. It is positive if the line climbs, negative if it falls, and \(0\) if it is flat. The y-intercept \(b\) is the point \((0,b)\) where the line meets the y-axis. The x-intercept is the point where it meets the x-axis, found by setting \(y=0\): it is \((C/A,0)\) in standard form and \((-b/m,0)\) in slope-intercept form when \(m\neq0\).</p>
      <h3>How the forms relate</h3>
      <p>The forms use different variables as their givens, a point, a slope or an intercept, but they carry the same information:
      \[ m=\frac{y_2-y_1}{x_2-x_1}=-\frac AB,\qquad b=y_1-mx_1=\frac CB,\qquad x\text{-intercept}=\frac CA=-\frac bm. \]
      Two equations \(Ax+By=C\) and \(A'x+B'y=C'\) describe the same line exactly when \((A',B',C')\) is a nonzero multiple of \((A,B,C)\). For example \(4x-6y=-6\) and \(2x-3y=-3\) are the same line. They describe parallel lines when \((A',B')\) is a multiple of \((A,B)\) but \(C'\) does not follow, because then the slopes \(-A/B\) and \(-A'/B'\) agree and the intercepts differ.</p>
      <p>Which form to use depends on what you know. Two points: find the slope first. A point and a slope (a rate): point-slope. To graph or to read a rate and a start: slope-intercept. For intercepts, integer coefficients or a total of two quantities: standard.</p>
      <h3>Proportional and non-proportional lines</h3>
      <p>A relationship is <em>proportional</em> when \(y/x\) is the same number \(k\) for every \(x\neq0\), that is \(y=kx\). Its graph is a line through the origin, and its slope is \(k\), the constant of proportionality. In standard form \(Ax+By=C\) with \(B\neq0\) this happens exactly when \(C=0\).</p>
      <p>A line \(y=mx+b\) with \(b\neq0\) is linear but <em>not</em> proportional. It has a slope, so \(y\) still changes by the same amount for each step in \(x\). But
      \[ \frac yx=\frac{mx+b}{x}=m+\frac bx \]

      <h3>Comparing the graphs</h3>
      <p>The line \(y=mx\) and the line \(y=mx+b\) have the same slope, so they are parallel. The second is the first shifted up by \(b\) (down if \(b\) is negative). Only the first passes through \((0,0)\), so only the first is proportional. A steeper proportional line has a larger \(|k|\). Having a constant rate of change is not enough for proportionality: the line must also start at zero.</p>`,
