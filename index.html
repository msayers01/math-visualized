  };
  const sans = (c, s, x, y, size, color, o = {}) => {
    c.font = `${o.weight || 500} ${size}px ${SANS}`; c.textAlign = o.align || 'center'; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(s, x, y);
  };
  const wrapLines = (c, text, maxW, size) => {
    c.font = `500 ${size}px ${SANS}`;
    const words = text.split(' '), lines = []; let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (cur && c.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  };

  /* A pan holds "items": x bags and unit blocks (positive), balloons (negative), and compact stand-ins for big counts.
     item = { key, kind: 'x' | 'u' | 'X' | 'U', sg: 1 | -1, f: fraction of a whole piece, text, box: [group, copy] | null } */
  const CAPS = [{ x: 6, u: 16 }, { x: 3, u: 8 }, { x: 1, u: 2 }];
  const pieceTxt = (c, isX, val) => {            /* label for a bag or a compact stand-in */
    const a = Q(Math.abs(c[0]), c[1]);
    if (val) return qtxt(qmul(a, val));
    return isX ? (q1(a) ? 'x' : pr([{ c: a, m: { x: 1 } }])) : qtxt(a);
  };
  const build = (E, cap, val) => {
    const items = [], ctr = {}, groups = [];
    const key = (k, sg) => { const kk = k + (sg > 0 ? '+' : '-'); ctr[kk] = (ctr[kk] || 0) + 1; return kk + (ctr[kk] - 1); };
    const lab = (isX, sg, c) => (sg < 0 ? MINUS : '') + pieceTxt(c, isX, val);
    const monos = (terms, box) => {
      for (const t of terms) {
        const isX = !!t.m.x, sg = t.c[0] < 0 ? -1 : 1, n = Math.abs(t.c[0]), d = t.c[1], whole = Math.floor(n / d), rem = n - whole * d;
        const lim = isX ? cap.x : cap.u, kind = isX ? 'x' : 'u', big = kind.toUpperCase();
        if (whole > lim) { items.push({ key: key(big, sg), kind: big, sg, f: 1, text: lab(isX, sg, Q(n, d)), box }); continue; }
        for (let i = 0; i < whole; i++) items.push({ key: key(kind, sg), kind, sg, f: 1, text: isX || sg < 0 ? lab(isX, sg, Q(1)) : undefined, box });
        if (rem > 0) items.push({ key: key(kind, sg), kind, sg, f: rem / d, text: lab(isX, sg, Q(rem, d)), box });
      }
    };
    const xFirst = ts => [...ts.filter(t => t.m.x), ...ts.filter(t => !t.m.x)];
    let g = 0;
    for (const t of E) {
      if (t.e && qval(t.c) >= 2 && t.c[1] === 1 && qval(t.c) <= 6 && isConst(t.m) && t.e.every(u => !u.e)) {
        for (let j = 0; j < t.c[0]; j++) monos(xFirst(t.e), [g, j]);
        groups.push({ g, k: t.c[0] }); g++;
      } else if (t.e) monos(xFirst(distRaw([t])), null);
      else monos([t], null);
    }
    return { items, groups };
  };
  const sizeOf = (it, s) => {
    const f = it.f, k = f < 1 ? .55 + .45 * f : 1;
    if (it.sg < 0) return it.kind === 'U' || it.kind === 'X' ? { w: 1.9 * s, h: 1.75 * s } : { w: s * k, h: 1.25 * s * k };
    if (it.kind === 'u') return { w: Math.max(.34 * s, s * f), h: s };
    if (it.kind === 'x') return { w: 1.3 * s * k, h: 1.3 * s * k };
    return it.kind === 'U' ? { w: 2.4 * s, h: s } : { w: 1.9 * s, h: 1.6 * s };
  };
  const packRows = (list, avail, s) => {
    const gap = .12 * s, rows = []; let cur = null;
    for (const it of list) {
      const z = sizeOf(it, s);
      if (z.w > avail + .01) return null;
      if (!cur || cur.w + gap + z.w > avail) { cur = { its: [], w: 0, h: 0 }; rows.push(cur); }
      cur.w += (cur.its.length ? gap : 0) + z.w; cur.h = Math.max(cur.h, z.h); cur.its.push({ it, z });
    }
    return rows;
  };
  /* place everything for one pan at unit size s; x runs from the pan's middle, y is the height above the pan floor */
  const layoutPan = (built, wp, capH, s) => {
    const { items, groups } = built, recs = [], avail = wp - 14, gap = .12 * s, bp = .28 * s;
    const order = a => (a.kind === 'x' || a.kind === 'X' ? 0 : 1);
    let y = .15 * s;
    const putRows = (rows, x0, y0) => {            /* centres rows horizontally about x0, bottom at y0; returns the top */
      let yy = y0;
      for (const r of rows) {
        let xx = x0 - r.w / 2;
        for (const { it, z } of r.its) { recs.push({ key: it.key, it, x: xx + z.w / 2, y: yy + z.h / 2, w: z.w, h: z.h }); xx += z.w + gap; }
        yy += r.h + gap;
      }
      return yy - (rows.length ? gap : 0);
    };
    for (const grp of groups) {
      for (let j = 0; j < grp.k; j++) {
        const list = items.filter(it => it.box && it.box[0] === grp.g && it.box[1] === j).sort((a, b) => order(a) - order(b) || b.sg - a.sg);
        const rows = packRows(list, avail - 2 * bp, s); if (!rows) return null;
        const bw = Math.max(...rows.map(r => r.w), s) + 2 * bp, top = putRows(rows, 0, y + bp), bh = top - y + bp;
        recs.push({ key: 'box' + grp.g + '_' + j, box: true, x: 0, y: y + bh / 2, w: bw, h: bh });
        y += bh + gap;
      }
    }
    const loose = items.filter(it => !it.box);
    const pos = loose.filter(it => it.sg > 0).sort((a, b) => order(a) - order(b)), neg = loose.filter(it => it.sg < 0);
    if (pos.length) { const rows = packRows(pos, avail, s); if (!rows) return null; y = putRows(rows, 0, y) + gap; }
    if (neg.length) {
      const rows = packRows(neg, avail, s); if (!rows) return null;
      y += (pos.length || groups.length ? .5 : .35) * s;
      y = putRows(rows, 0, y);
    }
    return y <= capH ? { recs, h: y } : null;
  };
  const fitPan = (E, val, wp, capH, sMax) => {
    for (const cap of CAPS) {
      const b = build(E, cap, val);
      for (let s = sMax; s >= 12; s--) { const r = layoutPan(b, wp, capH, s); if (r) return { ...r, s }; }
    }
    const b = build(E, CAPS[2], val), r = layoutPan(b, wp, capH, 8);
    return r ? { ...r, s: 8 } : { recs: [], h: 0, s: 8 };
  };
  const mixRecs = (A, B, t) => {
    const out = [], mb = new Map(B.recs.map(r => [r.key, r]));
    const mix = (a, b) => ({ ...b, x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), w: lerp(a.w, b.w, t), h: lerp(a.h, b.h, t), a: 1 });
    for (const ra of A.recs) {
      const rb = mb.get(ra.key);
      if (rb) { out.push(mix(ra, rb)); mb.delete(ra.key); } else out.push({ ...ra, a: 1 - t });
    }
    for (const rb of mb.values()) out.push({ ...rb, a: t, y: rb.y + (1 - t) * rb.h * .7 });
    return out;
  };
  const tiltOf = eq => {
    if (status(eq, 'x') !== 'none') return 0;
    return clamp((qval(constOf(eq.L)) - qval(constOf(eq.R))) * .05, -.2, .2);
  };

  /* drawing one piece; (x, y) is its centre on the canvas */
  const drawPiece = (c, pal, r, x, y) => {
    const it = r.it, w = r.w, hh = r.h, a = r.a;
    c.save(); c.globalAlpha = clamp(a, 0, 1); c.setLineDash([]);
    if (r.box) {
      rr(c, x - w / 2, y - hh / 2, w, hh, 6); c.fillStyle = alpha(pal.muted, .07); c.fill();
      c.strokeStyle = alpha(pal.muted, .9); c.lineWidth = 1.4; c.setLineDash([5, 4]); c.stroke(); c.restore(); return;
    }
    const big = it.kind === 'X' || it.kind === 'U';
    if (it.sg < 0) {                                           /* balloon: red, hatched, tied down */
      const rx = w / 2, ry = hh * (big ? .42 : .4), cy = y - hh * .1;
      c.beginPath(); c.ellipse(x, cy, rx, ry, 0, 0, TAU);
      c.fillStyle = pal.stage; c.fill(); c.fillStyle = alpha(pal.red, .22); c.fill();
      c.save(); c.clip(); c.strokeStyle = alpha(pal.red, .5); c.lineWidth = 1.2; c.beginPath();
      for (let k = -hh; k < w + hh; k += 6) { c.moveTo(x - rx + k, cy + ry); c.lineTo(x - rx + k + ry * 2, cy - ry); }
      c.stroke(); c.restore();
      c.beginPath(); c.ellipse(x, cy, rx, ry, 0, 0, TAU); c.strokeStyle = pal.red; c.lineWidth = 1.8; c.stroke();
      c.beginPath(); c.moveTo(x, cy + ry); c.lineTo(x - 3, cy + ry + 5); c.lineTo(x + 3, cy + ry + 5); c.closePath(); c.fillStyle = pal.red; c.fill();
      const fs = clamp(Math.min(w * .5, ry * 1.1), 8, 22);
      if (it.kind === 'x' || it.kind === 'X') mtext(c, pal, it.text, x, cy + 1, { size: fs * 1.1, color: pal.text, maxW: w * .9 });
      else if (ry > 8) sans(c, it.text, x, cy + 1, fs * .8, pal.text, { weight: 600 });
    } else if (it.kind === 'u' || it.kind === 'U') {            /* unit block */
      rr(c, x - w / 2, y - hh / 2, w, hh, Math.min(4, hh * .16)); c.fillStyle = pal.stage; c.fill(); c.fillStyle = alpha(pal.blue, .32); c.fill();
      c.strokeStyle = pal.blue; c.lineWidth = 1.7; c.stroke();
      if (it.kind === 'U') sans(c, it.text, x, y + 1, clamp(hh * .55, 9, 20), pal.text, { weight: 700 });
      else if (hh >= 21 && it.f >= 1) sans(c, '1', x, y + 1, hh * .42, alpha(pal.text, .55), { weight: 600 });
    } else {                                                    /* bag with the unknown */
      const bw = w, bh = hh;
      c.beginPath(); c.moveTo(x - bw * .17, y - bh * .5); c.lineTo(x + bw * .17, y - bh * .5);
      c.quadraticCurveTo(x + bw * .2, y - bh * .26, x + bw * .46, y - bh * .06);
      c.quadraticCurveTo(x + bw * .62, y + bh * .52, x, y + bh * .5);
      c.quadraticCurveTo(x - bw * .62, y + bh * .52, x - bw * .46, y - bh * .06);
      c.quadraticCurveTo(x - bw * .2, y - bh * .26, x - bw * .17, y - bh * .5); c.closePath();
      c.fillStyle = pal.stage; c.fill(); c.fillStyle = alpha(pal.violet, .3); c.fill(); c.strokeStyle = pal.violet; c.lineWidth = 1.9; c.stroke();
      c.beginPath(); c.moveTo(x - bw * .2, y - bh * .36); c.lineTo(x + bw * .2, y - bh * .36); c.stroke();
      mtext(c, pal, it.text, x, y + bh * .1, { size: clamp(bh * (it.text.length > 2 ? .38 : .5), 9, 26), color: pal.text, maxW: bw * .8 });
    }
    c.restore();
  };

  /* ---------- the literal-equation picture: what the formula does to the unknown, and how to undo it ---------- */
  const SYM = { add: '+', sub: MINUS, mul: '×', div: '÷' };
  const opSym = o => SYM[o.kind] + opAbs(o);
  const histWOf = W => clamp(W * .36, 250, 330);
  const arrowH = (c, x0, x1, y, col) => {
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 2; c.setLineDash([]); c.lineCap = 'round';
    c.beginPath(); c.moveTo(x0, y); c.lineTo(x1 - 5, y); c.stroke();
    c.beginPath(); c.moveTo(x1, y); c.lineTo(x1 - 8, y - 4.5); c.lineTo(x1 - 8, y + 4.5); c.closePath(); c.fill();
  };

  const pointsLine = vals => Object.keys(vals).map(k => k + ' = ' + vals[k]).join(', ');

    formal: String.raw`
      <h3>Equation or expression?</h3>
      <p>An <em>expression</em> such as \(3x+2\) is a calculation with a variable. It has no equal sign, so it is neither true nor false. An <em>equation</em> such as \(3x+2=14\) says that two expressions have the same value. A <em>solution</em> is a number that makes the equation true: \(x=4\) works because \(3(4)+2=14\).</p>
      <h3>Properties of equality</h3>
      <p>An equation says that two sides weigh the same. If you change both sides in exactly the same way, they still weigh the same. For any numbers \(a\), \(b\) and \(c\), if \(a=b\), then:</p>
      <p><b>Addition property:</b> \(a+c=b+c\).<br>
      <b>Subtraction property:</b> \(a-c=b-c\).<br>
      <b>Multiplication property:</b> \(ac=bc\).<br>
      <b>Division property:</b> \(\dfrac{a}{c}=\dfrac{b}{c}\), as long as \(c\neq 0\).<br>
      <b>Substitution property:</b> \(a\) can replace \(b\) in any expression or equation. This is what a check does.<br>
      <b>Symmetric property:</b> \(b=a\), so the two sides can be swapped.</p>
      <p>Change one side only and the balance tips. That is why \(x+4=9\) and \(x+4-4=9\) are different equations, but \(x+4-4=9-4\) is the same equation in a simpler form.</p>
      <h3>Properties that rewrite an expression</h3>
      <p>These do not change the value of an expression, so they work on one side at a time.</p>
      <p><b>Commutative:</b> \(a+b=b+a\) and \(ab=ba\). Example: \(3+x=x+3\).<br>
      <b>Associative:</b> \((a+b)+c=a+(b+c)\). Example: \((x+2)+3=x+(2+3)=x+5\).<br>
      <b>Distributive:</b> \(a(b+c)=ab+ac\). Example: \(2(x+3)=2x+6\). Read backwards it combines like terms: \(5x-2x=(5-2)x=3x\).<br>
      <b>Identity:</b> \(a+0=a\) and \(1\cdot a=a\). Example: \(x+0=x\).<br>
      <b>Inverse:</b> \(a+(-a)=0\), and \(a\cdot\frac1a=1\) when \(a\neq 0\). Examples: \(4-4=0\) and \(3\cdot\frac13=1\).</p>
      <h3>A strategy for multi-step equations</h3>
      <p>1. Open parentheses with the distributive property.<br>
      2. Combine like terms on each side.<br>
      3. Add or subtract so that the variable terms are on one side and the plain numbers are on the other.<br>
      4. Undo what was done to the variable, in reverse order: undo adding and subtracting first, then multiplying and dividing.<br>
      5. Check the answer in the original equation.</p>
      <p>Here is \(3x+2=x+10\), with the reason for each line.</p>
      <p>\(3x+2=x+10\) (given)<br>
      \(3x+2-x=x+10-x\) (subtraction property of equality)<br>
      \(2x+2=10\) (combine like terms; \(x-x=0\) by the inverse property)<br>
      \(2x+2-2=10-2\) (subtraction property of equality)<br>
      \(2x=8\) (inverse property \(2-2=0\), then identity property)<br>
      \(\dfrac{2x}{2}=\dfrac{8}{2}\) (division property of equality)<br>
      \(x=4\) (\(2\div2=1\) by the inverse property, and \(1x=x\) by the identity property)</p>
      <h3>Solving for a variable in a formula</h3>
      <p>A formula is an equation with several letters. To solve for one letter, treat the others as numbers and make the same moves. For \(y=mx+b\), subtract \(b\) from both sides to get \(y-b=mx\). Then divide both sides by \(m\), with \(m\neq 0\):
      \[ x=\frac{y-b}{m}. \]
      The same steps work for \(P=2l+2w\), which gives \(w=\dfrac{P-2l}{2}\), and for \(A=\tfrac12bh\), which gives \(h=\dfrac{2A}{b}\). Undo in reverse order again: whatever the formula did to the letter last, undo first.</p>
      <h3>Checking a solution</h3>
      <p>Put the answer in place of the variable in the <em>original</em> equation and evaluate each side with the order of operations: parentheses first, then multiplication and division, then addition and subtraction. For \(3x+2=x+10\) and \(x=4\): the left side is \(3(4)+2=12+2=14\) and the right side is \(4+10=14\). Both sides are \(14\), so \(4\) is a solution. Check the original equation, not your last line, so a slip anywhere along the way is caught.</p>
      <h3>No solution, or every number</h3>
      <p>Sometimes the variable disappears. For \(3x+2=3x+5\), subtracting \(3x\) leaves \(2=5\), which is false for every \(x\). There is <b>no solution</b>, and on the balance the beam never levels. For \(2(x+3)=2x+6\), distributing and subtracting \(2x\) leaves \(6=6\), which is always true. <b>Every number</b> is a solution, because the two sides are equivalent expressions.</p>`,
    check: [
      { q: String.raw`In solving \(3x+5=2x+9\), a student writes \(3x+5-2x=2x+9-2x\). Which property justifies this step?`,
        choices: [String.raw`The inverse property: \(2x-2x=0\)`, String.raw`The distributive property: \(3x-2x=(3-2)x\)`, 'The subtraction property of equality', 'The commutative property of addition'], answer: 2,
        why: String.raw`The step subtracts the same amount, \(2x\), from both sides, so the equation stays true. That is the subtraction property of equality. The inverse property \(2x-2x=0\) and the distributive property \(3x-2x=(3-2)x\) are used on the next line, when each side is simplified.`,

      <p>A ratio can compare one part with another part, like concentrate to water (\(2:3\)). It can also compare a part with the whole, like concentrate to the whole drink (\(2:5\), because \(2+3=5\)). Say which one you mean.</p>
      <h3>Equivalent ratios</h3>
      <p>One batch is \(2:3\). Two batches use 4 cups of concentrate and 6 cups of water, so the ratio is \(4:6\). Three batches give \(6:9\). These ratios are <em>equivalent</em>: the drink tastes exactly the same, because every batch is a copy of the recipe. Multiplying <b>both</b> quantities by the same number \(n\) gives an equivalent ratio:
      \[ 2:3 \;=\; (2\times n):(3\times n). \]
      Dividing both quantities by the same number also works. Dividing \(6:9\) by 3 gives \(2:3\). Multiplying only one of the two quantities changes the drink.</p>
      <h3>Four ways to show the same ratio</h3>
      <p>A <b>tape diagram</b> draws one block for each cup. A <b>table of equivalent ratios</b> lists the pairs:
      \[ \begin{array}{c|cccc} \text{batches} & 1 & 2 & 3 & 4 \\ \hline \text{concentrate} & 2 & 4 & 6 & 8 \\ \text{water} & 3 & 6 & 9 & 12 \end{array} \]
      A <b>double number line</b> puts the concentrate on one line and the water on another, so that matching points line up. An <b>equation</b> says the same thing with \(n\) batches: concentrate \(c=2\times n\) and water \(w=3\times n\).</p>
      <p>To use them, find the multiplier. To make 12 cups of water, solve \(3\times n=12\). Then \(n=4\), and the concentrate is \(2\times 4=8\) cups. The new mix is \(8:12\). To make 20 cups in all, note that one batch is \(2+3=5\) cups, so \(n=20\div 5=4\) again.</p>
      <h3>Comparing ratios is not subtracting</h3>
      <p>Mix A has 2 cups of concentrate and 3 cups of water. Mix B has 4 cups and 5 cups. Both have a gap of 1: \(3-2=1\) and \(5-4=1\). Do they taste the same? Scale mix A up to the same concentrate as mix B. Doubling A gives \(4:6\). Now both have 4 cups of concentrate, and A needs 6 cups of water but B needs only 5. B has less water, so B is stronger.</p>
      <p>Subtraction fails because a gap depends on the size of the mix. Doubling a mix does not change its taste, but it doubles its gap: \(2:3\) has gap 1 and \(4:6\) has gap 2. If a gap measured taste, doubling the batch would change the taste. It does not. Subtraction also fails the other way. The mixes \(2:4\) and \(3:6\) have gaps 2 and 3, yet both are equivalent to \(1:2\), so they taste the same.</p>
      <h3>How to compare two ratios</h3>
      <ol>
        <li>Choose a quantity, for example the concentrate. Find a number both amounts of it divide into, such as the least common multiple.</li>
        <li>Multiply both parts of each ratio by the right number, so that the concentrate is equal in the two ratios.</li>
        <li>Compare the other quantity. For the same concentrate, less water means a stronger drink. More water means a weaker one. Equal water means the ratios are equivalent.</li>
      </ol>
      <p>For \(3:5\) and \(5:7\), use 15 cups of concentrate. Multiply the first by 5 to get \(15:25\). Multiply the second by 3 to get \(15:21\). The second needs less water, so it is stronger.</p>
      <h3>Mixtures and concentration</h3>
      <p>The <em>concentration</em> of a mix tells how much of it is concentrate compared with the rest. More concentrate for the same water, or less water for the same concentrate, makes it stronger. Here is what happens to \(2:3\) when you add to it:</p>
      <ul>
        <li>Add 2 cups of water, giving \(2:5\): weaker.</li>
        <li>Add 2 cups of concentrate, giving \(4:3\): stronger.</li>
        <li>Add 1 cup of each, giving \(3:4\): stronger. The gap stays 1, but the taste changes.</li>
        <li>Add 2 cups of concentrate and 3 cups of water, one whole batch, giving \(4:6\): the same taste. Adding in the ratio \(2:3\) is the same as multiplying by 2.</li>
      </ul>
      <p>When you add a little of a mix to another mix, the result lands between the two. Adding something weaker than the old mix makes it weaker. Adding something stronger makes it stronger.</p>`,
    check: [
      { q: String.raw`Mix P uses 3 cups of lemon juice and 5 cups of water. Mix Q uses 5 cups of lemon juice and 7 cups of water. Each mix has exactly 2 more cups of water than lemon juice. Which statement is true?`,
        choices: [
          'They taste the same, because each mix has 2 more cups of water than lemon juice.',
          'Mix Q is stronger. With 15 cups of lemon juice in each, P needs 25 cups of water but Q needs only 21.',
          'Mix P is stronger, because 3 : 5 is made of smaller numbers.',
          'Mix Q is weaker, because it uses 7 cups of water and P uses only 5.'
        ], answer: 1,
        why: String.raw`Give both mixes the same amount of lemon juice. Both 3 and 5 divide into 15. Multiply P by 5 to get \(15:25\). Multiply Q by 3 to get \(15:21\). With the same 15 cups of lemon juice, Q needs less water (21 against 25), so Q is stronger. The first answer uses subtraction: both gaps are 2, but a gap does not measure taste, because doubling a mix keeps its taste and doubles its gap.`,
        hint: String.raw`Do not subtract. Make the amount of lemon juice the same in both mixes, then compare the water.` },
      { q: String.raw`A fruit punch recipe uses 3 cups of juice and 4 cups of sparkling water. Maria wants a bigger batch that tastes exactly the same. She has 15 cups of juice. How many cups of sparkling water does she need?`,
        choices: ['5', '16', '20', '60'], answer: 2,
        why: String.raw`15 cups is \(15\div 3=5\) times as much juice, so she needs 5 batches. Multiply the water by the same 5: \(4\times 5=20\) cups. The new ratio \(15:20\) is equivalent to \(3:4\). The answer 16 adds the same 12 cups to both amounts (\(3+12=15\) and \(4+12=16\)), which changes the taste. The answer 5 is the number of batches, not the cups of water. The answer 60 multiplies \(15\times 4\).`,
        hint: String.raw`How many times as much juice is 15 cups as 3 cups? Multiply the water by the same number.` }
    ],
    links: { next: ['unit-rates-and-best-buys', 'percents-on-tape-and-number-lines'], related: ['proportional-relationships', 'similarity-and-scaling'] },

    mount({ stage, controls: C }) {
      const MODES = ['compare', 'scale', 'change'];
      const st = { mode: 'scale', pr: 1, sc: 2, ch: 0, n: 1, kA: 1, kB: 1, gap: false, ans: null };
      let cancelPop = () => {};
      const pop = { t: 1, prev: {} }, shown = {};
      const lay = {};
      const P = new Plane(stage, { span: 5 });
      if (P.coordEl) P.coordEl.style.display = 'none';

      /* new blocks fade in; blocks that were already there stay put */
      const kick = all => {
        cancelPop();
        pop.prev = all ? {} : JSON.parse(JSON.stringify(shown));
        pop.t = 0;
        cancelPop = tween(340, v => { pop.t = v; P.draw(); });
      };
      const prevN = (key, ri) => (pop.prev[key] && pop.prev[key][ri]) || 0;

      const mixes = () => {
        if (st.mode === 'compare') { const q = PAIRS[st.pr]; return { A: q.A, B: q.B, cn: q.cn, add: null, S: null }; }
        const S = SCEN[st.sc];
        return { A: S.A, B: { c: S.A.c + S.x, w: S.A.w + S.y }, cn: S.cn, add: { c: S.x, w: S.y }, S };
      };

      /* ---------- tape diagram: concentrate row over water row, one block per cup ---------- */
      const drawTape = (c, p, o) => {
        const pal = p.pal, { x0, y, unit, rh, m, k, key, fs } = o, rg = 4;
        const rows = [
          { n: m.c * k, per: o.batch ? o.batch.c : 0, col: pal.yellow, y, add: o.add ? o.add.c : 0, name: 'Concentrate' },
          { n: m.w * k, per: o.batch ? o.batch.w : 0, col: pal.blue, y: y + rh + rg, add: o.add ? o.add.w : 0, name: 'Water' }
        ];
        shown[key] = [rows[0].n, rows[1].n];
        rows.forEach((r, ri) => {
          const pv = prevN(key, ri);
          for (let i = 0; i < r.n; i++) {
            const isAdd = r.add > 0 && i >= r.n - r.add, b = r.per ? Math.floor(i / r.per) : 0, bx = x0 + i * unit;
            c.save(); c.globalAlpha = i < pv ? 1 : pop.t;
            rr(c, bx, r.y, unit - 1.8, rh, 3);
            if (isAdd) { c.fillStyle = alpha(r.col, .22); c.fill(); c.setLineDash([4, 3]); c.strokeStyle = r.col; c.lineWidth = 1.8; c.stroke(); c.setLineDash([]); }
            else { c.fillStyle = alpha(r.col, b % 2 ? .62 : .92); c.fill(); }
            c.restore();
          }
          if (r.per) for (let b = 1; b * r.per < r.n; b++) seg(c, x0 + b * r.per * unit - .9, r.y - 1, x0 + b * r.per * unit - .9, r.y + rh + 1, pal.stage, 3.4);
          c.save(); c.globalAlpha = pop.t < 1 ? Math.max(.35, pop.t) : 1;
          T(c, p, String(r.n), x0 + r.n * unit + 7, r.y + rh / 2, { size: fs + 1, color: r.col, align: 'left', weight: 700 });
          c.restore();
          Tfit(c, p, r.name, x0 - 9, r.y + rh / 2, x0 - 12, { size: fs - .5, color: r.col, align: 'right', halo: false });
        });
        /* the gap: how far the shorter row falls short of the longer one */
        if (o.gapOn) {
          const g = m.w - m.c, lo = Math.min(m.c, m.w) * k, hi = Math.max(m.c, m.w) * k;
          if (g !== 0) {
            const xa = x0 + lo * unit - .9, xb = x0 + hi * unit - .9, yb = y + 2 * rh + rg + 7;
            const top = g > 0 ? yb - 9 : y + rh;
            seg(c, xa, top, xa, yb, pal.red, 1.5, [3, 3]); seg(c, xb, top, xb, yb, pal.red, 1.5, [3, 3]);
            seg(c, xa, yb, xb, yb, pal.red, 2.6);
            T(c, p, 'gap ' + Math.abs(g) * k, (xa + xb) / 2, yb + 13, { size: fs, color: pal.red });
          }
        }
      };

      /* ---------- table of equivalent ratios (columns line up with the double number line) ---------- */
      const drawTable = (c, p, o) => {
        const pal = p.pal, { x0, dx, y, rh, m, k, fs } = o;
        const names = [['Batches', pal.muted], ['Concentrate', pal.yellow], ['Water', pal.blue]];
        if (o.total) names.push(['In all', pal.muted]);
        const nr = names.length, hl = o.hl || pal.text, cx = x0 + k * dx;
        rr(c, cx - dx / 2 + 1, y - 1, dx - 2, nr * rh + 2, 5);
        c.fillStyle = alpha(hl, .13); c.fill(); c.strokeStyle = alpha(hl, .85); c.lineWidth = 1.8; c.stroke();
        for (let r = 0; r <= nr; r++) seg(c, 6, y + r * rh, x0 + (KMAX + .5) * dx, y + r * rh, pal.grid, 1);
        names.forEach(([nm, col], r) => Tfit(c, p, nm, x0 + dx * .5 - 7, y + (r + .5) * rh, x0 + dx * .5 - 10, { size: fs - .5, color: col, align: 'right', halo: false, weight: 600 }));
        for (let n = 1; n <= KMAX; n++) {
          const x = x0 + n * dx, on = n === k, w = on ? 800 : 500;
          const vals = [[String(n), pal.muted], [String(m.c * n), pal.yellow], [String(m.w * n), pal.blue]];
          if (o.total) vals.push([String(m.c * n + m.w * n), pal.muted]);
          vals.forEach(([s, col], r) => T(c, p, s, x, y + (r + .5) * rh, { size: fs + (on ? 1 : 0), color: on && r > 0 ? col : r === 0 && on ? pal.text : col, weight: w, halo: false, a: on ? 1 : .88 }));
        }
        if (o.recipe) T(c, p, 'recipe', x0 + o.recipe * dx, y - 8, { size: fs - 2, color: pal.violet, weight: 700, halo: false });
      };

      /* ---------- scale mode: one recipe, tape + double number line + table ---------- */
      const sceneScale = (c, p) => {
        const pal = p.pal, W = p.w, H = p.h, ch = CHS[st.ch], { u, g } = ch, n = st.n, cc = u.c * n, ww = u.w * n;
        const fs = clamp(Math.min(W, H) * .03 + 3, 11.5, 15.5), padL = clamp(W * .2, 84, 120), padR = 30, x0 = padL;
        const dx = (W - padL - padR) / (KMAX + .4), unit = Math.min((W - padL - padR) / (KMAX * Math.max(u.c, u.w)), 38);
        let rh = clamp(unit * 1.05, 16, 34), rowT = clamp(dx * .5, 19, 27), arcZ = 56, between = clamp(H * .09, 40, 66);
        const sp = 12, head = 2 * (fs + 7) + 4;
        const need = () => head + 2 * rh + 4 + 24 + 2 * arcZ + 34 + between + 4 * rowT + 16 + 3 * sp;
        let total = need();
        if (total > H - 16) {
          const f = clamp((H - 16 - 3 * sp - head - 24 - 34 - 16) / (total - 3 * sp - head - 24 - 34 - 16), .6, 1);
          rh *= f; rowT *= f; arcZ *= f; between *= f; total = need();
        }
        const extra = Math.max(0, H - 16 - total);
        let y = 8 + extra * .22;
        /* header */
        const rec = `${u.c * g} : ${u.w * g}`;
        runs(c, p, 10, y + fs * .6 + 2, [['Recipe  ', pal.muted, 600], [rec, pal.text, 700]].concat(g > 1 ? [[`   =  ${g} batches of ${u.c} : ${u.w}`, pal.muted, 600]] : []), fs + 1);
        const hit = ch.ask && n === chN(ch);
        const line2 = !ch.ask ? 'Drag the marker to change the number of batches.'
          : hit ? 'Goal reached.'
          : ch.ask === 't' ? `Goal: ${ch.goal} cups of drink in all.` : ch.ask === 'c' ? `Goal: exactly ${ch.goal} cups of ${ch.cn}.` : `Goal: exactly ${ch.goal} cups of water.`;
        Tfit(c, p, line2, 10, y + fs * 1.6 + 9, W - 20, { size: fs, color: hit ? pal.green : ch.ask ? pal.violet : pal.muted, align: 'left', weight: 600 });
        y += head + extra * .15;
        /* tape */
        drawTape(c, p, { x0, y, unit, rh, m: u, k: n, key: 'S', batch: u, fs });
        const tyEnd = y + 2 * rh + 4;
        T(c, p, `${cc} + ${ww} = ${cc + ww} cups in all`, x0, tyEnd + 14, { size: fs, color: pal.muted, align: 'left' });
        y = tyEnd + 24 + sp + extra * .2;
        /* double number line */
        const zTop = y, yT = zTop + arcZ + 17, yB = yT + between, zBot = yB + 20 + arcZ;
        lay.dnl = [zTop, zBot];
        const xs = i => x0 + i * dx;
        for (let i = 0; i <= KMAX; i++) seg(c, xs(i), yT, xs(i), yB, alpha(pal.text, .14), 1);
        for (const [yy, col] of [[yT, pal.yellow], [yB, pal.blue]]) {
          seg(c, xs(0) - 8, yy, xs(KMAX) + dx * .4, yy, col, 3);
          const ex = xs(KMAX) + dx * .4;
          c.beginPath(); c.moveTo(ex + 7, yy); c.lineTo(ex - 2, yy - 5); c.lineTo(ex - 2, yy + 5); c.closePath(); c.fillStyle = col; c.fill();
        }
        Tfit(c, p, 'Concentrate', x0 - 12, yT, x0 - 14, { size: fs, color: pal.yellow, align: 'right', halo: false });
        Tfit(c, p, 'Water', x0 - 12, yB, x0 - 14, { size: fs, color: pal.blue, align: 'right', halo: false });
        for (let i = 0; i <= KMAX; i++) {
          const on = i === n;
          seg(c, xs(i), yT - 5, xs(i), yT + 5, pal.yellow, 2); seg(c, xs(i), yB - 5, xs(i), yB + 5, pal.blue, 2);
          T(c, p, String(u.c * i), xs(i), yT - 15, { size: fs + (on ? 1.5 : 0), color: pal.yellow, weight: on ? 800 : 500, halo: false, a: on ? 1 : .85 });
          T(c, p, String(u.w * i), xs(i), yB + 16, { size: fs + (on ? 1.5 : 0), color: pal.blue, weight: on ? 800 : 500, halo: false, a: on ? 1 : .85 });
        }
        /* the multiplier arrows, from the recipe's batch to the marker */
        if (n !== g) {
          const lbl = n > g && n % g === 0 ? '× ' + n / g : n < g && g % n === 0 ? '÷ ' + g / n : '÷ ' + g + ', × ' + n;
          const sz = fs + 1;
          arcArrow(c, p, xs(g), xs(n), yT - 28, arcZ * .3, pal.green, lbl, true, sz);
          arcArrow(c, p, xs(g), xs(n), yB + 30, arcZ * .3, pal.green, lbl, false, sz);
        }
        seg(c, xs(n), yT, xs(n), yB, alpha(pal.text, .6), 2.2);
        const ringCol = hit ? pal.green : pal.brass;
        for (const yy of [yT, yB]) { c.beginPath(); c.arc(xs(n), yy, 9, 0, TAU); c.fillStyle = pal.stage; c.fill(); c.strokeStyle = ringCol; c.lineWidth = 3.5; c.stroke(); }
        y = zBot + sp + extra * .2;
        /* table */
        lay.x0 = x0; lay.dx = dx;

        lay.tab = [y - 8, y + 6 + 4 * rowT + 4];
      };

      /* ---------- compare / change mode: two tapes, two tables ---------- */
      const scenePair = (c, p) => {
        const pal = p.pal, W = p.w, H = p.h, m = mixes(), { A, B } = m, nm = NAMES[st.mode], r = compare(A, B), add = m.add;
        const fs = clamp(Math.min(W, H) * .03 + 3, 11.5, 15.5), padL = clamp(W * .2, 84, 120), padR = 36, x0 = padL, dx = (W - padL - padR) / (KMAX + .4);
        const rowsMax = Math.max(10, Math.max(A.c, A.w) * st.kA, Math.max(B.c, B.w) * st.kB, Math.max(A.c, A.w) * r.kA, Math.max(B.c, B.w) * r.kB);
        const unit = Math.min((W - padL - padR) / rowsMax, 46);
        let rh = clamp(unit * 1.05, 16, 40), rowT = clamp(dx * .5, 18, 27), gapH = 29, sp = 8;
        const labH = fs + 11, tabT = fs + 8;
        const need = () => 2 * (labH + 2 * rh + 4 + gapH) + 2 * (tabT + 3 * rowT + 4) + 3 * sp;
        let total = need();
        if (total > H - 12) { const f = clamp((H - 12 - 3 * sp - 2 * (labH + gapH + 4 + tabT + 4)) / (total - 3 * sp - 2 * (labH + gapH + 4 + tabT + 4)), .6, 1); rh *= f; rowT *= f; total = need(); }
        const extra = Math.max(0, H - 12 - total);
        let y = 6 + extra * .2;
        const eqC = A.c * st.kA === B.c * st.kB, eqW = A.w * st.kA === B.w * st.kB;
        const lab = (L, mix, k) => {
          const l = [[L, pal.text, 700], [`   ${mix.c} : ${mix.w}`, pal.muted, 600]];
          if (k > 1) l.push([`   × ${k}`, pal.green, 700], [`  =  ${mix.c * k} : ${mix.w * k}`, pal.text, 700]);

        };
        const yA = y + labH, yB = yA + 2 * rh + 4 + gapH + labH + sp + extra * .15;
        /* B's batches: when the new mix is whole batches of the old one, show those batches */
        const multiple = st.mode === 'change' && B.c % A.c === 0 && B.w % A.w === 0 && B.c / A.c === B.w / A.w;
        const batchB = st.kB > 1 ? B : multiple ? A : null;
        runs(c, p, 10, y + labH * .45, lab(nm.LA, A, st.kA), fs + 1);
        runs(c, p, 10, yB - labH * .55, lab(nm.LB, B, st.kB), fs + 1);
        if (add && st.kB === 1) T(c, p, 'dashed blocks are added', W - 10, yB - labH * .55, { size: fs - 1, color: pal.muted, align: 'right', weight: 500 });
        drawTape(c, p, { x0, y: yA, unit, rh, m: A, k: st.kA, key: 'A', batch: A, fs, gapOn: st.gap });
        drawTape(c, p, { x0, y: yB, unit, rh, m: B, k: st.kB, key: 'B', batch: batchB, add: st.kB === 1 ? add : null, fs, gapOn: st.gap });
        /* guides when the two tapes line up */
        const gl = (cnt, ra, rb, col) => {
          const xg = x0 + cnt * unit - .9;
          seg(c, xg, ra - 3, xg, rb + 3, col, 1.8, [5, 4]);
        };
        if (eqC) gl(A.c * st.kA, yA, yB + rh, pal.green);
        if (eqW) gl(A.w * st.kA, yA + rh + 4, yB + 2 * rh + 4, pal.green);
        /* tables */
        const tA = yB + 2 * rh + 4 + gapH + sp + extra * .15, tB = tA + tabT + 3 * rowT + 4 + sp + extra * .15;
        const hl = eqC || eqW ? pal.green : null;
        T(c, p, `${nm.LA}: equivalent ratios`, 10, tA + tabT * .45, { size: fs - .5, color: pal.muted, align: 'left', weight: 600 });
        T(c, p, `${nm.LB}: equivalent ratios`, 10, tB + tabT * .45, { size: fs - .5, color: pal.muted, align: 'left', weight: 600 });
        drawTable(c, p, { x0, dx, y: tA + tabT, rh: rowT, m: A, k: st.kA, fs, hl });
        drawTable(c, p, { x0, dx, y: tB + tabT, rh: rowT, m: B, k: st.kB, fs, hl });
        lay.tA = [tA + tabT - 6, tA + tabT + 3 * rowT + 4]; lay.tB = [tB + tabT - 6, tB + tabT + 3 * rowT + 4]; lay.x0 = x0; lay.dx = dx;
      };

      P.onDraw = (c, p) => { if (st.mode === 'scale') sceneScale(c, p); else scenePair(c, p); };

      /* ---------- readout ---------- */
      const gapLine = (m) => {
        const ca = m.A.c * st.kA, wa = m.A.w * st.kA, cb = m.B.c * st.kB, wb = m.B.w * st.kB, nm = NAMES[st.mode];
        const s = (w, c0) => `${w} − ${c0} = ${num(w - c0)}`;
        return `${kk('Gap')} ${cap(nm.A)}: ${s(wa, ca)}. ${cap(nm.B)}: ${s(wb, cb)}. The red brackets show these gaps.`;
      };
      const pairHTML = () => {
        const m = mixes(), { A, B } = m, nm = NAMES[st.mode], r = compare(A, B), out = [];
        if (st.mode === 'compare') {
          out.push(`${kk('Mix A')} ${cup(A.c)} of ${m.cn} and ${cup(A.w)} of water (${A.c} : ${A.w})`);
          out.push(`${kk('Mix B')} ${cup(B.c)} of ${m.cn} and ${cup(B.w)} of water (${B.c} : ${B.w})`);
          out.push(`${kk('Question')} Which mix tastes stronger, or do they taste the same?`);
        } else {
          out.push(`${kk('Start')} ${cup(A.c)} of ${m.cn} and ${cup(A.w)} of water (${A.c} : ${A.w})`);
          out.push(`${kk('Change')} Add ${addWords(m.S.x, m.S.y, m.cn)}`);
          out.push(`${kk('Now')} ${cup(B.c)} of ${m.cn} and ${cup(B.w)} of water (${B.c} : ${B.w})`);
          out.push(`${kk('Question')} Is the new mix stronger, weaker, or the same?`);
        }
        if (st.ans === null && (st.kA > 1 || st.kB > 1)) out.push(`${kk('Showing')} ${nm.LA} × ${st.kA} = ${A.c * st.kA} : ${A.w * st.kA}, ${nm.LB} × ${st.kB} = ${B.c * st.kB} : ${B.w * st.kB}`);
        if (st.gap && st.ans === null) out.push(gapLine(m));
        if (st.ans === null) {
          const ca = A.c * st.kA, cb = B.c * st.kB, wa = A.w * st.kA, wb = B.w * st.kB;
          if (ca === cb) out.push(`${kk('Look')} Both now have ${cup(ca)} of concentrate. Compare the water: ${wa} cups and ${wb} cups.`);
          else if (wa === wb) out.push(`${kk('Look')} Both now have ${cup(wa)} of water. Compare the concentrate: ${ca} cups and ${cb} cups.`);
          else out.push(`${kk('Tip')} Use the batch sliders (or tap a table column) to give both mixes the same amount of concentrate. Then compare the water.`);
        } else {
          const good = st.ans === r.rel;
          out.push(`${good ? ok('Right.') : no('Not quite.')} ${verdictText(r.rel, st.mode)}`);
          if (st.mode === 'change') out.push(changeNote(m.S));
          out.push(`<b>Using blocks.</b> ${whyMatch(m, r, nm)}`);
          out.push(whySub(m, r, nm));
        }
        return out.join('<br>');
      };

      const scaleHTML = () => {
        const ch = CHS[st.ch], { u, g } = ch, n = st.n, c = u.c * n, w = u.w * n, out = [];
        out.push(`${kk('Recipe')} ${cup(u.c * g)} of ${ch.cn} and ${cup(u.w * g)} of water (${u.c * g} : ${u.w * g})` + (g > 1 ? `, which is ${g} batches of ${u.c} : ${u.w}` : ''));
        out.push(`${kk('Batches')} n = ${n} (batches of ${u.c} : ${u.w})`);
        out.push(`${kk('Concentrate')} ${u.c} × ${n} = ${c} cups`);
        out.push(`${kk('Water')} ${u.w} × ${n} = ${w} cups`);
        out.push(`${kk('In all')} ${c} + ${w} = ${c + w} cups`);
        out.push(n === 1 ? `${kk('Ratio')} ${c} : ${w}, one batch` : `${kk('Ratio')} ${c} : ${w} = ${u.c} : ${u.w}, the same taste`);
        if (!ch.ask) {
          out.push('Every column of the table is an equivalent ratio. Each batch is a copy of the recipe, so the taste never changes.');
        } else {
          const goal = ch.goal, v = chVal(ch, n), want = chN(ch), hit = n === want;
          const what = ch.ask === 't' ? 'of drink in all' : ch.ask === 'c' ? `of ${ch.cn}` : 'of water';
          out.push(`${kk('Goal')} ${ch.ask === 't' ? `Make ${goal} cups in all.` : ch.ask === 'c' ? `Use exactly ${goal} cups of ${ch.cn}. How much water do you need?` : `Use exactly ${goal} cups of water. How much ${ch.cn} do you need?`}`);
          if (hit) {
            let s = g === 1
              ? `${n} batches means both amounts are multiplied by ${n}: ${u.c} × ${n} = ${c} and ${u.w} × ${n} = ${w}. `
              : g % n === 0
                ? `The recipe is ${g} batches. Divide both amounts by ${g / n}: ${u.c * g} ÷ ${g / n} = ${c} and ${u.w * g} ÷ ${g / n} = ${w}. `
                : `The recipe is ${g} batches. Divide both amounts by ${g} to get one batch, ${u.c} : ${u.w}. Then multiply both by ${n}: ${c} : ${w}. `;
            const per = ch.ask === 't' ? u.c + u.w : ch.ask === 'c' ? u.c : u.w;
            if (ch.ask === 't') s += `One batch is ${u.c} + ${u.w} = ${per} cups. `;
            s += `As an equation, ${per} × n = ${goal}, so n = ${goal} ÷ ${per} = ${n}. `;
            s += ch.ask === 't' ? `So ${c} cups of ${ch.cn} and ${w} cups of water make ${goal} cups.`
              : ch.ask === 'c' ? `So ${c} cups of ${ch.cn} goes with ${w} cups of water.`
              : `So ${w} cups of water goes with ${c} cups of ${ch.cn}.`;
            out.push(`${ok('Yes.')} ${s}`);
          } else {
            out.push(`${no('Not yet.')} You have ${cup(v)} ${what}, and the goal is ${goal}. ${v < goal ? 'That is too little, so use more batches.' : 'That is too much, so use fewer batches.'}`);
          }
        }
        return out.join('<br>');
      };
      const upd = () => { ro.innerHTML = st.mode === 'scale' ? scaleHTML() : pairHTML(); };

      /* ---------- controls ---------- */
      const probe = C.readout(), host = probe.parentElement; probe.remove();
      const group = build => {
        const before = new Set(host.children); build();
        const g = h('div', { style: 'display:flex;flex-direction:column;gap:16px;flex:none' });
        [...host.children].filter(e => !before.has(e)).forEach(e => g.append(e));
        host.append(g); return g;
      };
      const small = bs => bs.forEach(b => Object.assign(b.style, { padding: '6px 14px', minHeight: '36px', fontSize: '.88rem' }));
      let modeBtns, pairSel, scenSel, chSel, cmpBtns, chgBtns, nextCmp, retryCmp, nextChg, retryChg, nextCh, kAS, kBS, nS, gapT, ro;
      const gTop = {}, gBot = {};

      const sync = () => {
        modeBtns.forEach((b, i) => { b.className = MODES[i] === st.mode ? 'btn primary' : 'btn'; b.setAttribute('aria-pressed', MODES[i] === st.mode); });
        const pairMode = st.mode !== 'scale';
        gTop.compare.style.display = st.mode === 'compare' ? 'flex' : 'none';
        gTop.change.style.display = st.mode === 'change' ? 'flex' : 'none';
        gTop.scale.style.display = st.mode === 'scale' ? 'flex' : 'none';
        gBot.pair.style.display = pairMode ? 'flex' : 'none';
        gBot.scale.style.display = pairMode ? 'none' : 'flex';
        pairSel.value = String(st.pr); scenSel.value = String(st.sc); chSel.value = String(st.ch);
        const codes = st.mode === 'compare' ? ['A', 'B', 'same'] : ['B', 'A', 'same'];
        [[cmpBtns, 'compare'], [chgBtns, 'change']].forEach(([bs, md]) => bs.forEach((b, i) => {
          const on = st.mode === md && st.ans === codes[i];
          b.className = on ? 'btn primary' : 'btn'; b.disabled = st.ans !== null; b.setAttribute('aria-pressed', on);
        }));
        for (const b of [retryCmp, retryChg]) b.style.display = st.ans === null ? 'none' : '';
        kAS.set(st.kA); kBS.set(st.kB); nS.set(st.n); gapT.checked = st.gap;
        P.draw(); upd();
      };

      const fresh = () => { st.kA = st.kB = 1; st.ans = null; st.gap = false; };
      const setMode = md => { st.mode = md; fresh(); if (md === 'scale') st.n = CHS[st.ch].g; kick(true); sync(); };
      const loadPair = i => { st.pr = i; fresh(); kick(true); sync(); };
      const loadScen = i => { st.sc = i; fresh(); kick(true); sync(); };
      const loadCh = i => { st.ch = i; st.n = CHS[i].g; kick(true); sync(); };
      const setK = (which, v) => {
        const m = mixes(), k = clamp(Math.round(v), 1, capK(which === 'A' ? m.A : m.B)), key = which === 'A' ? 'kA' : 'kB';
        if (k !== st[key]) { st[key] = k; kick(); }
        sync();
      };
      const setN = v => { const n = clamp(Math.round(v), 1, KMAX); if (n !== st.n) { st.n = n; kick(); } sync(); };
      const answer = code => {
        const m = mixes(), r = compare(m.A, m.B);
        st.ans = code; st.gap = true; st.kA = r.kA; st.kB = r.kB; kick(); sync();
      };

      C.title('Explore');
      modeBtns = C.buttons([
        { label: 'Compare', onClick: () => setMode('compare') },
        { label: 'Scale', onClick: () => setMode('scale') },
        { label: 'Change', onClick: () => setMode('change') }
      ]);

      gTop.compare = group(() => {
        pairSel = C.select({ label: 'Pair of mixes', value: String(st.pr), options: PAIRS.map((q, i) => ({ value: String(i), label: `Pair ${i + 1}: ${q.A.c} : ${q.A.w} and ${q.B.c} : ${q.B.w}` })), onChange: v => loadPair(+v) });
        cmpBtns = C.buttons([
          { label: 'A is stronger', primary: true, onClick: () => answer('A') },
          { label: 'B is stronger', primary: true, onClick: () => answer('B') },
          { label: 'Same strength', primary: true, onClick: () => answer('same') }
        ]);
        [nextCmp, retryCmp] = C.buttons([
          { label: 'Next pair', onClick: () => loadPair((st.pr + 1) % PAIRS.length) },
          { label: 'Try again', onClick: () => { fresh(); kick(true); sync(); } }
        ]);
        small(cmpBtns); small([nextCmp, retryCmp]);
        C.hint('Which drink tastes more strongly of the concentrate? Pick one, then read why.');
      });
      gTop.change = group(() => {
        scenSel = C.select({ label: 'Scenario', value: String(st.sc), options: SCEN.map((q, i) => ({ value: String(i), label: `${i + 1}. ${q.A.c} : ${q.A.w}, add ${addWords(q.x, q.y, q.cn, true)}` })), onChange: v => loadScen(+v) });
        chgBtns = C.buttons([
          { label: 'Stronger', primary: true, onClick: () => answer('B') },
          { label: 'Weaker', primary: true, onClick: () => answer('A') },
          { label: 'The same', primary: true, onClick: () => answer('same') }
        ]);
        [nextChg, retryChg] = C.buttons([
          { label: 'Next scenario', onClick: () => loadScen((st.sc + 1) % SCEN.length) },
          { label: 'Try again', onClick: () => { fresh(); kick(true); sync(); } }
        ]);
        small(chgBtns); small([nextChg, retryChg]);
        C.hint('After the change, does the drink taste stronger, weaker, or the same as before?');
      });
      gTop.scale = group(() => {
        chSel = C.select({ label: 'Challenge', value: String(st.ch), options: CHS.map((q, i) => ({ value: String(i), label: q.name })), onChange: v => loadCh(+v) });
        [nextCh] = C.buttons([{ label: 'Next challenge', onClick: () => loadCh((st.ch + 1) % CHS.length) }]);
        small([nextCh]);
        C.hint('Drag the marker along the double number line, tap a table column, or use the slider.');
      });

      ro = C.readout();

      gBot.pair = group(() => {
        C.title('Batches');
        C.hint('The sliders stop when the blocks would no longer fit on the screen.');
        kAS = C.slider({ label: 'Batches of the top mix', min: 1, max: KMAX, step: 1, value: 1, format: v => String(Math.round(v)), onInput: v => setK('A', v) });
        kBS = C.slider({ label: 'Batches of the bottom mix', min: 1, max: KMAX, step: 1, value: 1, format: v => String(Math.round(v)), onInput: v => setK('B', v) });
        gapT = C.toggle({ label: 'Show the gap (subtraction)', value: false, onChange: v => { st.gap = v; sync(); } });
      });
      gBot.scale = group(() => {
        C.title('Batches');
        nS = C.slider({ label: 'Batches (the multiplier)', min: 1, max: KMAX, step: 1, value: 1, format: v => String(Math.round(v)), onInput: v => setN(v) });
      });

      /* tables and the double number line can be dragged too */
      draggable(P, {
        hit: (px, py) => {
          if (st.mode === 'scale') return (py >= lay.dnl[0] && py <= lay.dnl[1]) || (py >= lay.tab[0] && py <= lay.tab[1]) ? 'n' : null;
          return py >= lay.tA[0] && py <= lay.tA[1] ? 'A' : py >= lay.tB[0] && py <= lay.tB[1] ? 'B' : null;
        },
        move: (hd, x) => {
          const col = (P.X(x) - lay.x0) / lay.dx;
          if (hd === 'n') setN(col); else setK(hd, col);
        }
      });

      sync();

      /* ---------- guided steps ---------- */
      const apply = (patch, immediate) => {
        cancelPop(); pop.t = 1;
        const { mode, gap, pr, sc, ch, n, kA, kB } = patch;
        if (mode !== undefined) st.mode = mode;
        fresh();
        if (pr !== undefined) st.pr = pr;
        if (sc !== undefined) st.sc = sc;
        if (ch !== undefined) { st.ch = ch; st.n = CHS[ch].g; }
        if (n !== undefined) st.n = n;
        if (kA !== undefined) st.kA = kA;
        if (kB !== undefined) st.kB = kB;
        if (gap !== undefined) st.gap = gap;
        if (!immediate) kick(true);
        sync();
      };
      return { destroy: () => { cancelPop(); P.destroy(); }, apply };
    }
  });
}

/* =====================================================================
   SCHOOL — Unit rates and best buys
   ===================================================================== */
{
  /* ---------- words and numbers ---------- */
  const MON = v => { const r = Math.round(v * 100) / 100; return '$' + (Number.isInteger(r) ? String(r) : r.toFixed(2)); };
  const PR = c => '$' + (c / 100).toFixed(2);                              /* price in cents -> "$3.00" */
  const UP = u => u >= 100 ? '$' + (u / 100).toFixed(2) : num(u) + '¢';   /* unit price in cents -> "22.5¢" or "$2.75" */
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const ok = t => `<b style="color:var(--green)">${t}</b>`;
  const no = t => `<b style="color:var(--red)">${t}</b>`;
  const QD = {
    usd: { one: 'dollar', nm: 'dollars', money: true },
    lb: { one: 'pound', nm: 'pounds' },
    L: { one: 'liter', nm: 'liters' },
    min: { one: 'minute', nm: 'minutes' },
    orange: { one: 'orange', nm: 'oranges' },
    km: { one: 'km', nm: 'km' },
    hr: { one: 'hour', nm: 'hours' }
  };
  const val = (q, v) => q.money ? MON(v) : `${num(v)} ${v === 1 ? q.one : q.nm}`;
  const per = (qz, k, qw) => `${val(qz, k)} per ${qw.one}`;
  const tf0 = q => v => q.money ? MON(v) : num(v);
  const clean = v => Math.round(v * 1e6) / 1e6;
  const divisors = n => { const d = []; for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i); return d; };

  /* ---------- the questions on the double number line ---------- */
  /* Divide the total of Z by the number of W. Right: n ÷ d. Wrong: d ÷ n, which is the OTHER unit rate; the multiplication check shows why it fails. */
  const divOps = ({ n, d, Z, W, okFirst }) => {
    const k = n / d, w = d / n;
    const right = { t: `${n} ÷ ${d}`, ok: true,
      say: `Split ${val(Z, n)} into ${d} equal parts, one for each ${W.one}: ${n} ÷ ${d} = ${num(k)}. That is ${per(Z, k, W)}. Check: ${d} × ${num(k)} = ${num(d * k)}, the amount you started with.` };
    const wrong = { t: `${d} ÷ ${n}`, ok: false,
      say: `${d} ÷ ${n} = ${num(w)}. That is a real unit rate, but it is ${per(W, w, Z)}, the other one. This question asks for ${Z.nm} per ${W.one}. Check: if 1 ${W.one} gave ${val(Z, w)}, then ${d} ${W.nm} would give ${d} × ${num(w)} = ${val(Z, d * w)}, not ${val(Z, n)}.` };
    return okFirst ? [right, wrong] : [wrong, right];
  };
  const readDef = K => t => `${val(K.top.q, t)} = ${K.rows.map(r => val(r.q, r.k * t)).join(', ')}`;

  /* A ratio "a Y for b X" drawn with X on the top line and Y below. perX: the marker sits on X at 1 (find Y per 1 X); otherwise on Y at 1. */
  const rateTask = (id, o) => {
    const qx = QD[o.X], qy = QD[o.Y], { a, b, perX } = o;
    const W = perX ? qx : qy, Z = perX ? qy : qx, wT = perX ? b : a, zT = perX ? a : b;
    const K = {
      id, kind: 'rate', demo: !!o.demo, menu: o.menu,

      top: { q: qx, max: b, cap: qx.nm },
      rows: [{ q: qy, k: a / b, cap: qy.nm }],
      pins: [{ t: b, rows: [0] }],
      mark: { on: perX ? 'top' : 0, step: 1, start: perX ? b : a, target: 1 },
      targetTxt: `1 ${W.one}`,
      q: o.q, ops: o.demo ? null : divOps({ n: zT, d: wT, Z, W, okFirst: o.okFirst }),
      cards: lvl => [
        { head: `${qy.nm} per ${qx.one}`, col: 'red', ask: perX, big: lvl >= (perX ? 1 : 2) ? `${a} ÷ ${b} = ${num(a / b)}` : null, sub: per(qy, a / b, qx) },
        { head: `${qx.nm} per ${qy.one}`, col: 'green', ask: !perX, big: lvl >= (perX ? 2 : 1) ? `${b} ÷ ${a} = ${num(b / a)}` : null, sub: per(qx, b / a, qy) }
      ]

  const TASKS = {};

  [

    rateTask('grapes-usd', { X: 'lb', Y: 'usd', a: 5, b: 4, perX: false, okFirst: false, menu: 'Grapes: pounds per dollar',

    rateTask('water-min', { X: 'min', Y: 'L', a: 15, b: 6, perX: true, okFirst: false, menu: 'Tap: liters per minute',

    rateTask('juice-L', { X: 'L', Y: 'orange', a: 20, b: 5, perX: true, okFirst: true, menu: 'Juice: oranges per liter',
      head: 'Juice: 20 oranges make 5 liters', q: '20 oranges make 5 liters of juice. How many oranges go into each liter?' }),
    rateTask('water-L', { X: 'min', Y: 'L', a: 15, b: 6, perX: false, okFirst: true, menu: 'Tap: minutes per liter',
      head: 'Tap: 15 liters in 6 minutes', q: 'A tap fills a tank with 15 liters in 6 minutes. How many minutes does each liter take?' }),
    rateTask('juice-orange', { X: 'L', Y: 'orange', a: 20, b: 5, perX: false, okFirst: false, menu: 'Juice: liters per orange',
      head: 'Juice: 20 oranges make 5 liters', q: '20 oranges make 5 liters of juice. How many liters of juice come from each orange?' }),
    speedDiv('cyc-1', { n: 25, d: 2, Z: QD.km, W: QD.hr, max: 4, step: .5, okFirst: true, menu: 'Cyclist: km in 1 hour',
      head: 'Mia cycles 25 km in 2 hours', q: 'Mia cycles 25 km in 2 hours at a constant speed. How many km does she cycle in 1 hour?' }),
    speedDiv('run-1', { n: 2, d: 8, Z: QD.km, W: QD.min, max: 12, step: 1, okFirst: false, menu: 'Jogger: km in 1 minute',
      head: 'Maya jogs 2 km in 8 minutes', q: 'Maya jogs 2 km in 8 minutes at a steady pace. How many km does she jog in 1 minute?' })

  /* predict a distance from a speed: multiply */
  TASKS['cyc-2'] = {

    pins: [{ t: 1, rows: [0] }], mark: { on: 'top', step: 1, start: 1, target: 5 }, targetTxt: '5 hours',
    q: 'Ben cycles at a constant speed of 12 km per hour. How many km does he cycle in 5 hours?',
    ops: [

    cards: lvl => [

  /* predict a time from a speed: divide */
  TASKS['cyc-3'] = {
    id: 'cyc-3', kind: 'speed', hide: true, menu: 'Time for 30 km',
    heads: [{ t: 'Ben cycles 12 km each hour' }], note: 'constant speed: 12 km per hour',
    top: { q: QD.hr, max: 4, cap: 'time (hours)' }, rows: [{ q: QD.km, k: 12, cap: 'distance (km)' }],
    pins: [{ t: 1, rows: [0] }], mark: { on: 0, step: 6, start: 12, target: 30 }, targetTxt: '30 km',
    q: 'Ben cycles at a constant speed of 12 km per hour. How many hours does he need to cycle 30 km?',
    ops: [
      { t: '30 × 12', ok: false, say: '30 × 12 = 360 hours. That is 15 days of non-stop cycling for a 30 km ride. Multiplying km by km per hour does not give hours. Ask instead: how many 12 km pieces fit into 30 km?' },
      { t: '30 ÷ 12', ok: true, say: 'Ask how many 12 km pieces fit into 30 km: 30 ÷ 12 = 2.5. So it takes 2.5 hours, which is 2 hours 30 minutes. The marker at 30 km reads 2.5 hours. Check: 12 × 2.5 = 30.' },
      { t: '12 ÷ 30', ok: false, say: '12 ÷ 30 = 0.4 hours, which is 24 minutes. In 0.4 hours Ben rides only 12 × 0.4 = 4.8 km, not 30 km.' }
    ],
    cards: lvl => [
      { head: 'speed (given)', col: 'red', ask: false, big: '12 km per hour', sub: '12 km in 1 hour' },
      { head: 'hours for 30 km', col: 'green', ask: true, big: lvl >= 2 ? '30 ÷ 12 = 2.5' : null, sub: '2.5 hours for 30 km' }

    hook: String.raw`Pack A has 6 bottles of juice for $9. Pack B has 10 bottles for $14. The packs are different sizes, so which is the better deal, and how can you tell?`,

      { title: 'Constant speed is a unit rate',
        text: String.raw`<p>Speed is a unit rate: distance <em>per</em> 1 hour. Mia cycles 25 km in 2 hours at a constant speed, so the marker starts at <b>2 hours</b>, where the km line reads <b>25</b>.</p><p>Drag the marker to <b>1 hour</b>, then choose the calculation that gives km per hour. A wrong choice shows you why with numbers.</p><p>The Question menu has more: two speeds in different units of time, and predicting a distance or a time.</p>`,
        set: { mode: 'speed', task: 'cyc-1', m: 2 } }
    ],
    formal: String.raw`
      <p><b>Goal.</b> Compare amounts of different sizes, and predict new amounts, by finding out what happens for exactly <em>one</em> of something.</p>
      <h3>Unit rates from a ratio</h3>
      <p>A ratio \(a:b\) compares two amounts. For example, $5 for 4 pounds is the ratio \(5:4\). Here \(b\) cannot be \(0\), because you cannot share an amount into zero equal parts.</p>
      <p>A <em>unit rate</em> says how much of one quantity goes with <em>1</em> of the other. One ratio gives two unit rates:
      \[ \text{first per 1 of the second}=\frac{a}{b}, \qquad \text{second per 1 of the first}=\frac{b}{a}. \]
      (The second one also needs \(a\neq 0\).) For $5 for 4 pounds, \(5\div 4=1.25\) dollars per pound, and \(4\div 5=0.8\) pounds per dollar. Both are true. The word <b>per</b> tells you which one a question wants: it points at the quantity you divide by. "Dollars per pound" means dollars \(\div\) pounds.</p>
      <h3>Why dividing works</h3>
      <p>On a double number line, a constant ratio means that each step of 1 on the top line matches the same step on the bottom line. Four equal steps of \(1.25\) make \(5\), so \(4\times 1.25=5\). Dividing finds the size of one step.</p>
      <h3>Check with multiplication</h3>
      <p>A unit rate times the number of units gives the total back: \(4\times 1.25=5\). A wrong rate fails the check: \(4\times 0.8=3.2\), not \(5\). If the check does not give the total you started with, you divided the wrong way around.</p>
      <h3>Unit price and the best buy</h3>
      <p>A <em>unit price</em> is the price of one unit: price divided by amount.
      \[ \text{unit price}=\frac{\text{price}}{\text{amount}} \]
      Items in different sizes cannot be compared by their prices alone. Compare the price of 1 ounce, 1 pound or 1 item. A lower unit price is a better buy. A 12 oz box for $3.00 costs \(300\div 12=25\) cents per ounce. An 18 oz box for $4.14 costs \(414\div 18=23\) cents per ounce, so it is the better buy even though it costs more in total.</p>
      <p>You can also compare the other unit rate, ounces per dollar. Then the <em>bigger</em> number is the better buy. Use the same way for every item. Unit prices are often not whole cents: 20 pencils for $4.50 cost \(450\div 20=22.5\) cents each.</p>
      <h3>When the lowest unit price is not the best choice</h3>
      <p>A unit price helps only if you will use what you buy. A 5 lb tray of strawberries at $2.50 per pound has a lower unit price than a 2 lb tray at $2.75 per pound. But if you need 2 lb and the berries spoil, the 5 lb tray costs $12.50 for the 2 lb you use. That is \(12.50\div 2=6.25\) dollars for each pound you use. The 2 lb tray costs $5.50. Compare the cost of what you will really use, and think about spoiling, storage and your budget.</p>
      <h3>Constant speed</h3>
      <p>Speed is a unit rate: distance per 1 unit of time. A <em>constant</em> speed means the same distance in every equal stretch of time, so the ratio of distance to time never changes. With distance \(d\), time \(t\) and speed \(s\),
      \[ s=\frac{d}{t}, \qquad d=s\times t, \qquad t=\frac{d}{s}. \]
      Mia cycles 25 km in 2 hours, so \(s=25\div 2=12.5\) km per hour. In 4 hours she cycles \(12.5\times 4=50\) km. Ben cycles at 12 km per hour, so 30 km takes \(30\div 12=2.5\) hours.</p>
      <h3>Choosing the operation</h3>
      <p>To find a unit rate, divide the total by the number of units. To find a total from a unit rate, multiply by the number of units. To find how many units fit into a total, divide the total by the unit rate. Then ask if the answer makes sense: more time must give more distance, so an answer that gets smaller as time grows is wrong.</p>
      <h3>Rates in different units of time</h3>
      <p>Cyclist A rides 36 km in 3 hours, which is \(36\div 3=12\) km per hour. Cyclist B rides 5 km in 20 minutes. An hour has 60 minutes, which is 3 groups of 20 minutes, so B rides \(3\times 5=15\) km in an hour. To compare rates, write them with the same unit of time. B is faster, 15 km per hour against 12 km per hour. Per minute gives the same winner: A rides \(0.2\) km and B rides \(0.25\) km each minute.</p>`,
    check: [
      { q: String.raw`A cyclist rides 36 km in 3 hours at a constant speed. At that speed, how long does it take to ride 60 km?`,
        choices: ['20 hours', '5 hours', 'About 1.7 hours', '720 hours'], answer: 1,
        why: String.raw`The speed is \(36\div 3=12\) km per hour. Then \(60\div 12=5\) hours. Check: \(12\times 5=60\). The answer 20 hours is \(60\div 3\), which ignores the speed. The answer about 1.7 hours is \(60\div 36\): it compares the two distances but forgets that 36 km took 3 hours. The answer 720 hours multiplies 60 by 12.`,
        hint: String.raw`First find how far the cyclist rides in 1 hour. Then ask how many of those hours make 60 km.` },

      { title: 'Find the unit rate',
