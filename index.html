      const MODES = [['pts', 'Two points'], ['ps', 'A point and a slope'], ['si', 'Slope and y-intercept'], ['std', 'Standard form, Ax + By = C']];
      const VIEWS = [['ps', 'A point and the slope triangle'], ['si', 'The y-intercept b'], ['std', 'Both intercepts'], ['ratio', 'y ÷ x, and a line through (0, 0)']];
      const stop = () => {
        if (cancel) { cancel(); cancel = null; }
        if (target) { Object.assign(st, target); target = null; }
        busy = false;
        if (pendingConv !== undefined) { const k = pendingConv; pendingConv = undefined; startConv(k); }
      };

      C.title('Define the line');
      const modeSel = C.select({ label: 'The line is given by', value: st.mode, options: MODES.map(([value, label]) => ({ value, label })),
        onChange: v => { stop(); convertTo(v); st.view = { pts: 'ps', ps: 'ps', si: 'si', std: 'std' }[v]; sync(); } });
      const host = modeSel.parentElement.parentElement;
      const noteEl = h('p', { class: 'hint', style: 'display:none;margin:0' }); host.append(noteEl);
      const sl = [], grid = h('div', { style: 'display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 18px' }); host.append(grid);
      const mk = (modes, label, min, max, get, put, wide) => {
        const s = C.slider({ label, min, max, step: 1, value: get(), format: iv, onInput: v => { stop(); note = ''; put(Math.round(v)); sync(); } });
        const el = host.lastElementChild; grid.append(el); if (wide) el.style.gridColumn = '1 / -1';
        sl.push({ s, el, modes, get, min, max, out: el.querySelector('output') });
      };
      const fitP = () => {
        if (st.mode === 'si') st.x1 = 0;
        st.x1 = clamp(st.x1, -LIM, LIM - st.dx);
        st.y1 = clamp(st.y1, -LIM - Math.min(0, st.dy), LIM - Math.max(0, st.dy));
      };
      const setP = (x, y) => { st.x1 = x; st.y1 = y; fitP(); };
      const setPts = (ax, ay, bx, by) => { if (ax === bx && ay === by) return; st.x1 = ax; st.y1 = ay; st.dx = bx - ax; st.dy = by - ay; };
      mk(['pts'], 'A: x', -LIM, LIM, () => st.x1, v => setPts(v, st.y1, st.x1 + st.dx, st.y1 + st.dy));
      mk(['pts'], 'A: y', -LIM, LIM, () => st.y1, v => setPts(st.x1, v, st.x1 + st.dx, st.y1 + st.dy));
      mk(['pts'], 'B: x', -LIM, LIM, () => st.x1 + st.dx, v => setPts(st.x1, st.y1, v, st.y1 + st.dy));
      mk(['pts'], 'B: y', -LIM, LIM, () => st.y1 + st.dy, v => setPts(st.x1, st.y1, st.x1 + st.dx, v));
      mk(['ps'], 'Point x', -LIM, LIM, () => st.x1, v => setP(v, st.y1));
      mk(['ps'], 'Point y', -LIM, LIM, () => st.y1, v => setP(st.x1, v));
      mk(['si'], 'y-intercept b', -LIM, LIM, () => st.y1, v => { st.y1 = v; fitP(); }, true);
      mk(['ps', 'si'], 'Rise', -12, 12, () => st.dy, v => { st.dy = v; fitP(); });
      mk(['ps', 'si'], 'Run', 1, LIM, () => st.dx, v => { st.dx = v; fitP(); });
      mk(['std'], 'A', -LIM, LIM, () => st.A, v => { if (v || st.B) st.A = v; });
      mk(['std'], 'B', -LIM, LIM, () => st.B, v => { if (v || st.A) st.B = v; });
      mk(['std'], 'C', -60, 60, () => st.C, v => { st.C = v; }, true);

      C.title('All the forms');
      const ro = C.readout(), roR = C.readout();

      C.title('Convert');
      C.buttons([
        { label: 'To slope-intercept', onClick: () => { stop(); startConv('si'); } },
        { label: 'To standard form', onClick: () => { stop(); startConv('std'); } }
      ]);
      const cvBox = C.readout(); cvBox.setAttribute('data-conv', '');
      C.title('Look at');
      const viewSel = C.select({ label: 'Show on the graph', value: st.view, options: VIEWS.map(([value, label]) => ({ value, label })),
        onChange: v => { stop(); st.view = v; sync(); } });

      C.title('Match a line');
      C.buttons([
        { label: 'Show a dashed line', primary: true, onClick: () => { stop(); st.tgt = (st.tgt + 1) % TG.length; sync(); } },
        { label: 'Hide it', onClick: () => { stop(); st.tgt = -1; sync(); } }
      ]);
      const roT = C.readout(); roT.style.display = 'none';

      C.hint('Drag the ringed handles, or use the sliders. The Convert box starts from the point-slope form of the line on the graph.');

      /* ---------- readouts ---------- */
      const ratioHTML = (L, I) => {
        if (I.vert) return '<span class="k">A vertical line gives no single y for an x, so there is no y ÷ x to compare.</span>';
        const xs = [1, 2, 3, 4], rs = xs.map(x => qs(Q(L.C - L.A * x, L.B * x))), ms = qs(I.m);
        const td = 'padding:2px 8px 2px 0;border-bottom:1px solid var(--line);';
        const rows = xs.map((x, i) => `<tr><td style="${td}">${x}</td><td style="${td}">${rs[i]}</td><td style="${td}">${ms}</td></tr>`).join('');
        const head = 'text-align:left;font-weight:500;color:var(--muted);padding:0 8px 4px 0;font-size:.82rem;';
        const status = L.C === 0
          ? `<b>Proportional.</b> y ÷ x is ${ms} every time, so the constant of proportionality is k = ${ms} and the line is ${siText(L, I)}. It passes through (0, 0).`
          : `<b>Not proportional.</b> y ÷ x changes (${rs.join(', ')}). The slope is ${ms}, but the line crosses the y-axis at (0, ${qs(I.b)}), not at (0, 0).`;
        return `<table style="border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin-bottom:8px"><tr><th style="${head}">x</th><th style="${head}">y ÷ x on your line</th><th style="${head}">y ÷ x on the line through (0, 0) with the same slope</th></tr>${rows}</table>` +
          status + `<br><span class="k">Both lines have slope ${ms}. The dashed segments run from (0, 0) to the points, and the slope of each one is y ÷ x.</span>`;
      };
      const upd = () => {
        const L = cur(); if (!L) return;
        const I = info(L), an = anchorOf(L, I), k = s => `<span class="k">${s}</span>`;
        let slopeRow;
        if (st.mode === 'std') slopeRow = st.B === 0 ? `−A ÷ B = ${iv(-st.A)} ÷ 0, undefined (vertical line)` : `−A ÷ B = ${iv(-st.A)} ÷ ${iv(st.B)} = ${qs(Q(-st.A, st.B))}`;
        else slopeRow = st.dx === 0 ? `rise ÷ run = ${iv(st.dy)} ÷ 0, undefined (vertical line)` : `rise ÷ run = ${iv(st.dy)} ÷ ${iv(st.dx)} = ${qs(Q(st.dy, st.dx))}`;
        const rows = [`${k('Slope')} ${slopeRow}`];
        if (I.vert) {
          rows.push(`${k('Point-slope')} none: a vertical line has no slope`, `${k('Slope-intercept')} none, for the same reason`);
        } else {
          rows.push(`${k('Point-slope')} <b>${psText(an[0], an[1], I.m)}</b><br>${k('y − y₁ = m(x − x₁), using the point ' + pt(an[0], an[1]))}`,
            `${k('Slope-intercept')} <b>${siText(L, I)}</b><br>${k('y = mx + b, with m = ' + qs(I.m) + ' and b = ' + qs(I.b))}`);
        }
        let sx = '';
        if (st.mode === 'std') {
          const raw = canon(st.A, st.B, st.C), same = raw && raw.A === st.A && raw.B === st.B && raw.C === st.C;
          if (!same) {
            const g = gcd(gcd(st.A, st.B), st.C), parts = [];
            if (g > 1) parts.push('divide by ' + g);
            if (st.A < 0 || (st.A === 0 && st.B < 0)) parts.push('multiply by −1 so A is not negative');
            sx = ` ${k('(your ' + linStr(st.A, st.B) + ' = ' + iv(st.C) + ': ' + parts.join(', ') + ')')}`;
          }
        }
        rows.push(`${k('Standard')} <b>${stdText(L)}</b>${sx}<br>${k('Ax + By = C, with A = ' + L.A + ', B = ' + iv(L.B) + ', C = ' + iv(L.C))}`);
        rows.push(`${k('x-intercept')} ${I.xi ? pt(I.xi, Q(0)) : 'none (horizontal line)'}<br>${k('y-intercept')} ${I.yi ? pt(Q(0), I.yi) : 'none (vertical line)'}`);
        ro.innerHTML = rows.join('<br>');
        roR.innerHTML = st.view === 'ratio' ? ratioHTML(L, I) : ''; roR.style.display = st.view === 'ratio' ? '' : 'none';
        challenge(L, I); convCheck(L, I, an);
      };

      /* ---------- the match-a-line challenge ---------- */
      const challenge = (L, I) => {
        if (st.tgt < 0) { roT.style.display = 'none'; return; }
        const t = TG[st.tgt], T = canon(t.A, t.B, t.C), IT = info(T), hits = t.pts.filter(([x, y]) => L.A * x + L.B * y === L.C).length;
        let msg;
        if (L.A === T.A && L.B === T.B && L.C === T.C) msg = `<b>Matched.</b> You made the dashed line. It is ${siText(T, IT)}${siText(T, IT) === stdText(T) ? '' : ', or ' + stdText(T)}. Whichever form you used, it is the same line.`;
        else {
          let hint;
          if (IT.vert && (st.mode === 'ps' || st.mode === 'si')) hint = 'The dashed line is vertical. Point-slope and slope-intercept forms need a slope, so switch to Two points or Standard form.';
          else if (I.vert !== IT.vert) hint = I.vert ? 'Your line is vertical. The dashed line has a slope.' : 'The dashed line is vertical, so it has no slope. Its equation is x = a number.';
          else if (I.vert) hint = 'Both lines are vertical. Move yours left or right.';
          else if (qeq(I.m, IT.m)) hint = `The slopes agree, so the lines are parallel. Slide yours ${qlt(I.b, IT.b) ? 'up' : 'down'}.`;
          else if (qeq(I.b, IT.b)) hint = 'Both lines cross the y-axis at the same point, but the slopes differ.';
          else hint = 'Read the two marked points, find rise ÷ run between them, then place the line.';
          msg = `Your line passes through ${hits} of the 2 marked points. ${hint}`;
        }
        roT.innerHTML = msg; roT.style.display = '';
      };

      /* ---------- the Convert walkthrough ---------- */
      const cv = { kind: '', sig: '', route: null, problem: '', done: 0, fb: '', msg: '', check: '' };
      const buildConv = (L, I, an) => {
        const sig = [L.A, L.B, L.C, an ? an[0].join('/') + ',' + an[1].join('/') : ''].join(',');
        if (cv.route || cv.problem) { if (sig === cv.sig) return; if (cv.sig) cv.msg = 'The line changed, so the box started over.'; }
        cv.sig = sig; cv.done = 0; cv.fb = ''; cv.route = null; cv.problem = '';
        if (I.vert) cv.problem = 'A vertical line has no slope, so it has no point-slope or slope-intercept form. Its equation, ' + stdText(L) + ', is already in standard form.';
        else if (!an || an[0][1] !== 1 || an[1][1] !== 1) cv.problem = 'No whole-number point lies on this line, so there is no point-slope form with whole numbers to start from. Choose a line through a grid point.';
        else cv.route = (cv.kind === 'si' ? routeSI : routeStd)(an[0][0], an[1][0], I.m);
        cv.final = cv.kind === 'si' ? siText(L, I) : stdText(L);
        /* a second point on the line, to check the answer */
        if (cv.route) {
          const x2 = an[0][0] + I.m[1], y2 = an[1][0] + I.m[0];
          if (cv.kind === 'si') cv.check = `Check with the point (${iv(x2)}, ${iv(y2)}): ${par(I.m)} × ${par(Q(x2))}${plus(I.b)} = ${qs(qadd(qmul(I.m, Q(x2)), I.b))}, and y is ${iv(y2)}.`;
          else cv.check = `Check with the point (${iv(x2)}, ${iv(y2)}): ${iv(L.A)}(${iv(x2)}) ${L.B < 0 ? '−' : '+'} ${Math.abs(L.B)}(${iv(y2)}) = ${iv(L.A * x2 + L.B * y2)}, and C is ${iv(L.C)}.`;
        }
      };
      const reveal = () => {
        const pn = cvBox.closest('.panel');
        if (pn && pn.scrollHeight > pn.clientHeight + 4) { const top = cvBox.offsetTop + cvBox.offsetHeight - pn.clientHeight + 18; if (top > pn.scrollTop) pn.scrollTop = top; }
      };
      const startConv = kind => {
        cv.kind = kind || ''; cv.sig = ''; cv.route = null; cv.problem = ''; cv.done = 0; cv.fb = ''; cv.msg = '';
        if (cv.kind) { const L = cur(); if (L) { const I = info(L); buildConv(L, I, anchorOf(L, I)); } }
        renderConv();
      };
      const convCheck = (L, I, an) => { if (cv.kind) { buildConv(L, I, an); } renderConv(); };
      const renderConv = () => {
        cvBox.textContent = '';
        const muted = 'margin:0 0 8px;color:var(--muted)';
        if (!cv.kind) { cvBox.append(h('p', { style: muted }, 'Choose a target form. You pick each algebra move. The box says why a move works or why it does not.')); return; }
        if (cv.msg) cvBox.append(h('p', { style: muted }, cv.msg));
        if (cv.problem) { cvBox.append(h('p', { style: 'margin:0' }, cv.problem)); return; }
        const R = cv.route; if (!R) return;
        const line = (eq, why) => h('div', { style: 'display:grid;gap:1px;margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line-strong)' }, h('b', {}, eq), why ? h('span', { class: 'k', style: 'font-size:.84rem;line-height:1.4' }, why) : null);
        cvBox.append(line(R.start, 'Start: the point-slope form of the line.'));
        R.steps.slice(0, cv.done).forEach(s => cvBox.append(line(s.eq, s.why)));
        if (cv.done >= R.steps.length) {
          const nm = R.kind === 'si' ? 'slope-intercept' : 'standard';
          cvBox.append(h('p', { style: 'margin:8px 0 6px' }, R.steps.length ? [h('b', {}, 'Done. '), 'In ' + nm + ' form the line is ', h('b', {}, cv.final), '. It matches the panel.']
            : [h('b', {}, 'Nothing to do. '), 'The point-slope form ', h('b', {}, R.start), ' is already in ' + nm + ' form. It matches the panel.']));
          cvBox.append(h('p', { class: 'k', style: 'margin:0;font-size:.84rem;line-height:1.4' }, cv.check));
          return;
        }
        const s = R.steps[cv.done], opts = [{ label: s.label, ok: true }, ...s.bad.map(b => ({ label: b.label, why: b.why }))];
        const rot = cv.done % 3, order = opts.map((_, i) => opts[(i + rot) % opts.length]);
        cvBox.append(h('p', { style: 'margin:8px 0 6px;font-weight:500' }, 'Choose the next move (' + (cv.done + 1) + ' of ' + R.steps.length + ').'));
        const bs = order.map(o => h('button', { type: 'button', class: 'btn',
          style: 'justify-content:flex-start;text-align:left;border-radius:10px;width:100%;margin:0 0 6px;padding:8px 14px;line-height:1.35',
          onclick: () => {
            if (o.ok) { cv.done++; cv.fb = ''; if (cv.done >= R.steps.length) { st.view = cv.kind === 'si' ? 'si' : 'std'; sync(); return; } }
            else cv.fb = o.why;
            renderConv(); const nb = cvBox.querySelector('button'); if (nb) nb.focus({ preventScroll: true });
          } }, o.label));
        cvBox.append(...bs);
        if (cv.fb) cvBox.append(h('p', { style: 'margin:4px 0 0;padding-left:10px;border-left:3px solid var(--red)' }, h('b', {}, 'Not that move. '), cv.fb));
      };

      /* ---------- keeping everything in step ---------- */
      const sync = () => {
        modeSel.value = st.mode; viewSel.value = st.view;
        sl.forEach(o => {
          const v = o.get(); o.s.set(v);
          if (v < o.min || v > o.max) o.out.textContent = iv(v);
          o.el.style.display = o.modes.includes(st.mode) ? '' : 'none';
        });
        noteEl.textContent = note; noteEl.style.display = note ? '' : 'none';
        P.draw(); if (!busy) upd();
      };

      /* ---------- dragging ---------- */
      const handles = () => {
        if (st.mode === 'pts') return [['a', st.x1, st.y1], ['b', st.x1 + st.dx, st.y1 + st.dy]];
        if (st.mode === 'ps') return [['s', st.x1 + st.dx, st.y1 + st.dy], ['p', st.x1, st.y1]];
        if (st.mode === 'si') return [['s', st.dx, st.y1 + st.dy], ['y', 0, st.y1]];
        const out = [];
        if (st.B && inBox(0, st.C / st.B, LIM + .6)) out.push(['yi', 0, st.C / st.B]);
        if (st.A && inBox(st.C / st.A, 0, LIM + .6) && !(st.C === 0 && st.B)) out.push(['xi', st.C / st.A, 0]);
        return out;
      };
      draggable(P, {
        hit: (px, py) => {
          let best = null, bd = clamp(P.scale * .8, 18, 26);
          for (const [id, x, y] of handles()) { const d = Math.hypot(P.X(x) - px, P.Y(y) - py); if (d < bd) { bd = d; best = id; } }
          return best;
        },
        move: (hd, x, y) => {
          stop(); note = '';
          const nx = Math.round(x), ny = Math.round(y), cl = v => clamp(v, -LIM, LIM);
          if (hd === 'a') setPts(cl(nx), cl(ny), st.x1 + st.dx, st.y1 + st.dy);
          else if (hd === 'b') setPts(st.x1, st.y1, cl(nx), cl(ny));
          else if (hd === 'p') setP(cl(nx), cl(ny));
          else if (hd === 's') { st.dx = clamp(nx - st.x1, 1, Math.min(LIM, LIM - st.x1)); st.dy = clamp(cl(ny) - st.y1, -12, 12); }
          else if (hd === 'y') { st.y1 = cl(ny); fitP(); }
          else if (hd === 'xi') st.C = clamp(st.A * nx, -60, 60);
          else if (hd === 'yi') st.C = clamp(st.B * ny, -60, 60);
          sync();
        }
      });

      /* ---------- guided steps ---------- */
      const apply = (patch, immediate) => {
        stop();
        const { mode, view, tgt, conv, ...rest } = patch;
        if (mode !== undefined && mode !== st.mode) convertTo(mode); else note = '';
        if (view !== undefined) st.view = view;
        if (tgt !== undefined) st.tgt = tgt;
        const still = Object.keys(rest).every(k => Math.abs(st[k] - rest[k]) < 1e-9);
        if (immediate || still) {
          Object.assign(st, rest); sync();
          if (conv !== undefined) { startConv(conv); if (conv && !immediate) reveal(); }
        } else {
          busy = true; target = rest; pendingConv = conv;
          sync();
          cancel = animateTo(st, rest, 900, sync, () => { cancel = null; target = null; busy = false; const k = pendingConv; pendingConv = undefined; sync(); if (k !== undefined) { startConv(k); if (k) reveal(); } });
        }
      };
      sync(); renderConv();
      return { destroy: () => { stop(); P.destroy(); }, apply };
    }
  });
}

/* =====================================================================
   SCHOOL — Parallel and perpendicular lines
   ===================================================================== */
{
  /* Every slope here is a ratio of whole numbers (rise over run), so slopes are kept and shown as fractions. */
  const zero = v => Math.abs(v) < 1e-6;
  const whole = v => Math.abs(v - Math.round(v)) < 1e-6;
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
  /* n/d as text: "2/3", "−3/2", "4", "0" (a decimal only while a step is still animating) */
  const frac = (n, d) => {
    if (!whole(n) || !whole(d)) return num(n / d);
    n = Math.round(n); d = Math.round(d);
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d); n /= g; d /= g;
    return (n < 0 ? '−' : '') + Math.abs(n) + (d === 1 ? '' : '/' + d);
  };
  /* slope text for a line with this run and rise */
  const sl = (run, rise) => zero(run) ? 'undefined' : frac(rise, run);
  const wrap = s => /[/−]/.test(s) ? '(' + s + ')' : s;
  /* the number in front of x: "", "−", "2", "(2/3)", "−(3/2)" */
  const coef = s => s === '1' ? '' : s === '−1' ? '−' : s.includes('/') ? (s[0] === '−' ? '−(' + s.slice(1) + ')' : '(' + s + ')') : s;
  /* point-slope form of the line through (x, y) with this run and rise */
  const pointSlope = (run, rise, x, y) => {
    if (zero(run)) return 'x = ' + num(x);
    if (zero(rise)) return 'y = ' + num(y);
    const c = coef(sl(run, rise)), lhs = zero(y) ? 'y' : y > 0 ? 'y − ' + num(y) : 'y + ' + num(-y);
    const f = zero(x) ? 'x' : x > 0 ? 'x − ' + num(x) : 'x + ' + num(-x);
    return lhs + ' = ' + (zero(x) ? c + 'x' : c === '' ? f : c === '−' ? '−(' + f + ')' : c + '(' + f + ')');
  };
  /* slope-intercept form of the same line */
  const slopeInt = (run, rise, x, y) => {
    if (zero(run)) return 'x = ' + num(x);
    if (zero(rise)) return 'y = ' + num(y);
    const b = frac(y * run - rise * x, run);
    return 'y = ' + coef(sl(run, rise)) + 'x' + (b === '0' ? '' : b[0] === '−' ? ' − ' + b.slice(1) : ' + ' + b);
  };

  /* Ready-made lines and points: a = a point on the blue line, d = its (run, rise), p = the point P. */
  const PUZ = [
    { a: [-3, -1], d: [3, 2],  p: [3, -1] },
    { a: [-4, 3],  d: [2, -1], p: [-1, -2] },
    { a: [-2, -3], d: [1, 1],  p: [2, 4] },
    { a: [-2, 0],  d: [2, 3],  p: [4, -2] },
    { a: [0, 5],   d: [1, -3], p: [-3, -1] },
    { a: [-4, 2],  d: [3, 0],  p: [3, -1] },
    { a: [-2, -3], d: [0, 3],  p: [2, 1] }
  ];

  register({
    id: 'parallel-and-perpendicular-lines', level: 'school',
    title: 'Parallel and perpendicular lines',
    blurb: 'Build the parallel and the perpendicular through a point, and see why slopes match or multiply to −1.',
    thumb(c, p) {
      const pal = p.pal; p.cx = 0.5; p.cy = 0.8; p.span = 5.2;
      p.grid(1);
      const ext = (m, b) => [[-8, -8 * m + b], [8, 8 * m + b]];
      p.path(ext(2 / 3, 1), { stroke: pal.blue, width: 2.6 });
      p.path(ext(2 / 3, -3), { stroke: pal.green, width: 2.6 });
      p.path(ext(-3 / 2, 3.5), { stroke: pal.red, width: 2.6 });
      const fx = 15 / 13, fy = 2 / 3 * fx + 1, s = .62, u1 = [.5547, -.832], u2 = [.832, .5547];
      p.path([[fx, fy], [fx + s * u1[0], fy + s * u1[1]], [fx + s * (u1[0] + u2[0]), fy + s * (u1[1] + u2[1])], [fx + s * u2[0], fy + s * u2[1]]],

    hook: String.raw`You stand beside a straight road. Which straight line through you never meets the road, and which one crosses it in a perfect square corner?`,
    steps: [
      { title: 'Parallel: same slope',
        text: String.raw`<p>The <b>blue</b> line rises \(2\) for every \(3\) it runs, so its slope is \(\tfrac{2}{3}\). The <b>green</b> triangle is a copy of the blue one, moved so that its corner sits on <b>P</b>.</p><p>Your line goes through P too. Drag its ring to the top corner of the green triangle, at \((6,1)\). When the slopes are equal the line turns green: it is <b>parallel</b>, so it never meets the blue line.</p>`,

    formal: String.raw`
      <p>Two different lines in a plane either cross at exactly one point or never meet. Lines that never meet are <em>parallel</em>. Lines that cross at a right angle (\(90^\circ\)) are <em>perpendicular</em>. Both ideas are about slope, so write a non-vertical line as \(y=mx+b\).</p>
      <h3>Parallel lines have equal slopes</h3>
      <p>The lines \(y=m_1x+b_1\) and \(y=m_2x+b_2\) are parallel exactly when \(m_1=m_2\) and \(b_1\neq b_2\). Then the vertical gap between them is \(b_1-b_2\) at every \(x\). It never changes, so it is never \(0\). If the slopes differ, the gap \((m_1-m_2)x+(b_1-b_2)\) changes steadily and is \(0\) at one value of \(x\), where the lines cross.</p>
      <h3>Perpendicular lines have negative reciprocal slopes</h3>
      <p>Two lines that are neither horizontal nor vertical are perpendicular exactly when
      \[ m_1m_2=-1, \qquad\text{that is,}\qquad m_2=-\frac{1}{m_1}. \]
      To get the new slope, flip the fraction (swap rise and run) and change the sign. The slope \(\tfrac{2}{3}\) becomes \(-\tfrac{3}{2}\).</p>
      <p><b>Why.</b> Draw a slope triangle on a line, with run \(a\) and rise \(b\), so the slope is \(m=\tfrac{b}{a}\). Turn the whole picture, triangle and line, a quarter turn counterclockwise about a point on the line. The step "\(a\) right, \(b\) up" becomes "\(b\) left, \(a\) up": a run of \(-b\) and a rise of \(a\). A quarter turn rotates every direction by exactly \(90^\circ\), so the turned line makes a \(90^\circ\) angle with the original. Its slope is
      \[ \frac{a}{-b}=-\frac{a}{b}=-\frac{1}{m}, \qquad\text{and}\qquad \frac{b}{a}\cdot\left(-\frac{a}{b}\right)=-1. \]
      Any line with slope \(-\tfrac{a}{b}\) is parallel to the turned line, so it is perpendicular to the original as well.</p>
      <h3>The line through a given point</h3>
      <p>To build the line through \(P=(x_1,y_1)\) with slope \(m\), use <em>point-slope form</em>:
      \[ y-y_1=m\,(x-x_1). \]
      It says that from \(P\) the change in \(y\) is \(m\) times the change in \(x\). Multiply out and move \(y_1\) to the right side to get slope-intercept form \(y=mx+b\), where \(b=y_1-mx_1\).</p>
      <p>The recipe: read the slope \(m\) of the given line. Use \(m\) for the parallel or \(-\tfrac{1}{m}\) for the perpendicular. Put \(P\) into point-slope form.</p>
      <h3>Worked example</h3>
      <p>Find the lines through \(P=(-1,-2)\) that are parallel and perpendicular to \(y=-\tfrac{1}{2}x+1\).</p>
      <p><b>Parallel.</b> The slope stays \(-\tfrac{1}{2}\). Then \(y+2=-\tfrac{1}{2}(x+1)\), so \(y=-\tfrac{1}{2}x-\tfrac{1}{2}-2=-\tfrac{1}{2}x-\tfrac{5}{2}\).</p>
      <p><b>Perpendicular.</b> Flip \(-\tfrac{1}{2}\) to get \(-2\), then change the sign to get \(2\). Check: \(-\tfrac{1}{2}\cdot 2=-1\). Then \(y+2=2(x+1)\), so \(y=2x+2-2=2x\).</p>
      <h3>Horizontal and vertical lines</h3>
      <p>A horizontal line \(y=c\) has slope \(0\). A vertical line \(x=c\) has no slope, because its run is \(0\) and you cannot divide by \(0\). The rule \(m_1m_2=-1\) does not cover these two cases, so use the picture.<br>
      Given a horizontal line: the parallel through \(P\) is \(y=y_1\), and the perpendicular is the vertical line \(x=x_1\).<br>
      Given a vertical line: the parallel through \(P\) is \(x=x_1\), and the perpendicular is the horizontal line \(y=y_1\).</p>
      <h3>Checking an answer on a graph</h3>
      <p>1. Does the line go through \(P\)? Put the coordinates of \(P\) into your equation.<br>
      2. From \(P\), count the slope. For a parallel, use the same run and rise as the given line. For a perpendicular, the run and rise swap and one sign changes.<br>
      3. Read where your line crosses the y-axis and compare it with \(b\) in your equation.<br>
      4. Look at the corner where the perpendicular meets the given line. It should be a square corner. On a graphing tool, give both axes the same scale, or right angles will not look right.</p>`,

    mount({ stage, controls: C }) {
      /* L: the blue line, through A with direction (dx, dy). P: the point. Q = P + (qx, qy): the ring on your line. rot: quarter turn of the copied triangle, 0 to 1. */
      const st = { ax: -3, ay: -1, dx: 3, dy: 2, px: 3, py: -1, qx: -2, qy: -1, rot: 0 };
      const fl = { scaf: true, par: false, perp: false, chk: false, goal: 'par', eqp: false };
      let cancel = () => {}, target = null, msg = '', warn = '', pi = 0, eqPick = -1, eqKey = '', eqOpts = [];
      /* A running animation always ends on its target, so the state stays on whole grid points when the student acts mid-way. */
      const finish = () => { cancel(); if (target) { Object.assign(st, target); target = null; } };
      const run = (patch, ms) => { finish(); target = patch; cancel = animateTo(st, patch, ms, sync, () => { target = null; }); };
      const P = new Plane(stage, { cx: 0, cy: 0, span: 8.6 });
      /* the view always shows x from -6.7 to 6.7 and y from -8.5 to 8.5 at least, with equal scales on both axes */
      const fitView = p => { const sc = Math.min(p.w / 13.4, p.h / 17); p.span = Math.min(p.w, p.h) / (2 * sc); p.cx = 0; p.cy = 0; };
      /* how far the ring on your line may go: the grid points that are on screen */
      const room = () => ({ x: Math.max(4, Math.floor(P.w / (2 * P.scale) - .4)), y: Math.max(4, Math.floor(P.h / (2 * P.scale) - .4)) });

      const kind = () => {
        const cr = st.dx * st.qy - st.dy * st.qx, dt = st.dx * st.qx + st.dy * st.qy;
        return zero(cr) ? 'par' : zero(dt) ? 'perp' : 'none';
      };
      const unit = (x, y) => { const n = Math.hypot(x, y) || 1; return [x / n, y / n]; };
      const foot = () => {
        const { ax, ay, dx, dy, px, py } = st, t = ((px - ax) * dx + (py - ay) * dy) / ((dx * dx + dy * dy) || 1);
        return [ax + t * dx, ay + t * dy];
      };
      /* the part of a line that is on screen */
      const ext = (x, y, ux, uy, bd) => {
        if (Math.hypot(ux, uy) < 1e-9) return null;
        let t0 = -1e9, t1 = 1e9;
        const lim = (p, u, lo, hi) => {
          if (Math.abs(u) < 1e-9) return;
          let a = (lo - p) / u, b = (hi - p) / u; if (a > b) [a, b] = [b, a];
          t0 = Math.max(t0, a); t1 = Math.min(t1, b);
        };
        lim(x, ux, bd.x0, bd.x1); lim(y, uy, bd.y0, bd.y1);
        return t1 > t0 ? [[x + t0 * ux, y + t0 * uy], [x + t1 * ux, y + t1 * uy]] : null;
      };

      /* ---------- drawing helpers ---------- */
      const tri = (p, c0, c1, c2, col, t1, t2, fs, o = {}) => {
        const a = o.a ?? 1, la = o.la ?? 1, pts = [c0, c1, c2];
        p.path(pts, { fill: alpha(col, .13 * a), close: true });
        p.path(pts, { stroke: alpha(col, .95 * a), width: 2.6, dash: [7, 6] });
        const area = Math.abs((c1[0] - c0[0]) * (c2[1] - c1[1]) - (c1[1] - c0[1]) * (c2[0] - c1[0])) / 2;
        const g = [(c0[0] + c1[0] + c2[0]) / 3, (c0[1] + c1[1] + c2[1]) / 3];
        [[c0, c1, t1], [c1, c2, t2]].forEach(([u, v, t]) => {
          if (!t || Math.hypot(v[0] - u[0], v[1] - u[1]) < 1e-6) return;
          const mx = (u[0] + v[0]) / 2, my = (u[1] + v[1]) / 2;
          let n;
          if (area < 1e-6) {   /* flat triangle: put the label beside the leg */
            n = unit(-(p.Y(v[1]) - p.Y(u[1])), p.X(v[0]) - p.X(u[0]));
            if (n[1] > 1e-9 || (Math.abs(n[1]) < 1e-9 && n[0] < 0)) n = [-n[0], -n[1]];
          } else n = unit(p.X(mx) - p.X(g[0]), p.Y(my) - p.Y(g[1]));
          p.label(t, mx, my, { size: fs, italic: false, alpha: la * Math.min(1, a + .3), dx: n[0] * 20, dy: n[1] * 16 });
          if (o.taken && la > .5) o.taken.push([p.X(mx) + n[0] * 20, p.Y(my) + n[1] * 16, t.length * 3.8]);
        });
      };
      const square = (p, x, y, u1, u2, col) => {
        const s = Math.max(.5, 19 / p.scale);
        p.path([[x, y], [x + s * u1[0], y + s * u1[1]], [x + s * (u1[0] + u2[0]), y + s * (u1[1] + u2[1])], [x + s * u2[0], y + s * u2[1]]],
          { fill: alpha(col, .24), stroke: col, width: 2, close: true });
      };
      let taken = [];   /* pixel positions of labels drawn so far in this frame: [x, y, half width] */
      /* slope tag beside a line, near its right-hand end (above it, unless that sits on the tick numbers or on a ring) */
      const tag = (p, e, ux, uy, text, col, fs, avoid) => {
        if (!e) return;
        let [[x0, y0], [x1, y1]] = e;
        if (x0 > x1 + 1e-9 || (Math.abs(x0 - x1) < 1e-9 && y0 > y1)) [[x0, y0], [x1, y1]] = [[x1, y1], [x0, y0]];
        if (ux < -1e-9 || (Math.abs(ux) < 1e-9 && uy < 0)) { ux = -ux; uy = -uy; }
        const L = Math.hypot(ux, uy) || 1, nx = -uy / L, ny = ux / L, vert = Math.abs(nx) > .7;
        const at = (t, side) => [clamp(p.X(x0 + (x1 - x0) * t) + side * nx * 13, 46, p.w - 46), clamp(p.Y(y0 + (y1 - y0) * t) - side * ny * 19, 16, p.h - 16), side];
        const free = ([sx, sy]) => Math.abs(sy - (p.Y(0) + 15)) >= 13 && avoid.every(([rx, ry]) => Math.abs(sx - rx) > 56 || Math.abs(sy - ry) > 20);
        let pos = null;
        for (const t of [.87, .76, .65, .54, .43]) { for (const side of [1, -1]) { const c = at(t, side); if (free(c)) { pos = c; break; } } if (pos) break; }
        if (!pos) pos = at(.87, 1);
        const [mx, my] = p.toMath(pos[0], pos[1]);
        p.label(text, mx, my, { size: fs, italic: false, color: col, align: vert ? (pos[2] * nx < 0 ? 'right' : 'left') : 'center' });
        taken.push([pos[0] + (vert ? (pos[2] * nx < 0 ? -1 : 1) * text.length * 3.8 : 0), pos[1], text.length * 3.8]);
      };
      const dirAng = (ux, uy) => Math.atan2(-uy, ux);
      const mTag = (run, rise) => zero(run) ? 'm undefined' : 'm = ' + frac(rise, run);

      /* a small caption drawn on the canvas, so feedback is next to the drag */
      const banner = (p, rows, x, y, edge, anchor = 'tl') => {
        const c = p.ctx, bf = clamp(p.w / 30, 12.5, 15.5), lh = bf * 1.5, fnt = r => `${r.b ? 600 : 500} ${bf}px "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif`;
        let w = 0; rows.forEach(r => { c.font = fnt(r); w = Math.max(w, c.measureText(r.t).width); });
        w = Math.min(w + 22, p.w - 2 * x); const hh = rows.length * lh + 12, bx = anchor === 'bc' ? (p.w - w) / 2 : x, by = anchor === 'bc' ? p.h - y - hh : y;
        c.save();
        c.beginPath(); if (c.roundRect) c.roundRect(bx, by, w, hh, 8); else c.rect(bx, by, w, hh);
        c.fillStyle = alpha(p.pal.stage, .93); c.fill(); c.strokeStyle = edge; c.lineWidth = 1.6; c.stroke();
        c.textAlign = 'left'; c.textBaseline = 'middle';
        rows.forEach((r, i) => { c.font = fnt(r); c.fillStyle = r.c || p.pal.text; c.fillText(r.t, bx + 11, by + 6 + lh * (i + .5), w - 16); });
        c.restore();
      };
      const shortWhy = k => {
        const { dx, dy, qx, qy } = st, a = sl(dx, dy), b = sl(qx, qy), aV = zero(dx), bV = zero(qx);
        if (k === 'par') return aV ? 'both lines are vertical' : `both slopes are ${a}`;
        if (k === 'perp') return aV || bV ? 'horizontal meets vertical' : `${wrap(a)} × ${wrap(b)} = −1`;
        return aV || bV ? 'one vertical, one slanted' : `slopes ${a} and ${b}: not equal, product ${frac(dy * qy, dx * qx)}`;
      };

      P.onDraw = (c, p) => {
        fitView(p); taken = [];
        const pal = p.pal, bd = p.bounds(), fs = clamp(p.scale * .5, 16.5, 20), k = kind();
        const { ax, ay, dx, dy, px, py, qx, qy, rot } = st;
        p.grid(1); p.ticks(1);

        /* slope triangles: on the blue line, copied to P, and the copy turned a quarter turn */
        if (fl.scaf) {
          tri(p, [ax, ay], [ax + dx, ay], [ax + dx, ay + dy], pal.blue, 'run ' + num(dx), 'rise ' + num(dy), fs, { taken });
          tri(p, [px, py], [px + dx, py], [px + dx, py + dy], pal.green, 'run ' + num(dx), 'rise ' + num(dy), fs, { a: rot > .001 ? .45 : 1, la: rot > .001 ? 0 : 1, taken });
          if (rot > .001) {
            const th = rot * Math.PI / 2, cs = Math.cos(th), sn = Math.sin(th), R = (u, v) => [px + u * cs - v * sn, py + u * sn + v * cs];
            tri(p, [px, py], R(dx, 0), R(dx, dy), pal.red, 'rise ' + num(dx), 'run ' + num(-dy), fs, { la: clamp((rot - .85) / .15, 0, 1), taken });
            if (rot < .98) {
              const a0 = Math.atan2(dy, dx);
              c.beginPath(); c.arc(p.X(px), p.Y(py), 1.1 * p.scale, -a0, -(a0 + th), true);
              c.strokeStyle = pal.violet; c.lineWidth = 2.5; c.stroke();
            } else square(p, px, py, unit(dx, dy), unit(-dy, dx), pal.violet);
          }
        }

        /* the lines */
        const line = (x, y, ux, uy, col, w, dash) => { const e = ext(x, y, ux, uy, bd); if (e) p.path(e, { stroke: col, width: w, dash }); return e; };
        const eL = line(ax, ay, dx, dy, pal.blue, 3.6);
        const eP = fl.par ? line(px, py, dx, dy, pal.green, 3.2) : null;
        const eN = fl.perp ? line(px, py, -dy, dx, pal.red, 3.2) : null;
        const col = k === 'par' ? pal.green : k === 'perp' ? pal.red : pal.text;
        const eQ = line(px, py, qx, qy, col, 3.4);
        if (fl.eqp && eqPick >= 0 && eqOpts[eqPick]) { const o = eqOpts[eqPick]; line(o.x, o.y, o.run, o.rise, pal.violet, 3.4, [11, 8]); }

        /* square corner where the perpendicular meets the blue line */
        if (fl.perp || k === 'perp') { const f = foot(); square(p, f[0], f[1], unit(px - f[0], py - f[1]), unit(dx, dy), pal.violet); }

        /* where your line crosses the y-axis */
        if (fl.chk && !zero(qx)) {
          const b = py - qy / qx * px;
          if (Math.abs(b) < bd.y1 - .3) {
            p.dot(0, b, 7, pal.yellow, pal.stage, 2.5);
            p.label('b = ' + frac(py * qx - qy * px, qx), 0, b, { size: fs, italic: false, align: 'left', dx: 13, dy: -15 });
            taken.push([p.X(0) + 13 + 22, p.Y(b) - 15, 24]);
          }
        }

        /* slope tags */
        const avoid = [[ax, ay], [ax + dx, ay + dy], [px + qx, py + qy], [px, py]].map(([x, y]) => [p.X(x), p.Y(y)]);
        tag(p, eL, dx, dy, mTag(dx, dy), pal.blue, fs, avoid);
        if (eP && k !== 'par') tag(p, eP, dx, dy, mTag(dx, dy), pal.green, fs, avoid);
        if (eN && k !== 'perp') tag(p, eN, -dy, dx, mTag(-dy, dx), pal.red, fs, avoid);
        tag(p, eQ, qx, qy, mTag(qx, qy), k === 'none' ? pal.text : col, fs, avoid);

        /* handles */
        const ring = (x, y, dot) => { p.dot(x, y, 8.5, pal.stage, pal.brass, 3); if (dot) p.dot(x, y, 3.4, dot); };
        ring(ax, ay, pal.blue); ring(ax + dx, ay + dy, pal.blue);
        if (!fl.scaf) {
          p.label('slide', ax, ay, { size: 14, italic: false, color: pal.muted, dy: -19 });
          p.label('tilt', ax + dx, ay + dy, { size: 14, italic: false, color: pal.muted, dy: -19 });
          taken.push([p.X(ax), p.Y(ay) - 19, 16], [p.X(ax + dx), p.Y(ay + dy) - 19, 12]);
        }
        ring(px + qx, py + qy, col);
        p.dot(px, py, 9.5, pal.yellow, pal.brass, 3);

        /* label for P: in the direction farthest from the lines through P (and from the right-hand edge) */
        const angs = [dirAng(qx, qy)]; if (fl.par) angs.push(dirAng(dx, dy)); if (fl.perp) angs.push(dirAng(-dy, dx));
        let best = [-1, -1], bs = -9;
        for (const cd of [[-1, -1], [1, -1], [0, -1], [1, 1], [-1, 1], [0, 1], [-1, 0], [1, 0]]) {
          const ca = Math.atan2(cd[1], cd[0]);
          let m = Math.PI;
          for (const a of angs) { let d = (((ca - a) % Math.PI) + Math.PI) % Math.PI; d = Math.min(d, Math.PI - d); m = Math.min(m, d); }
          m += cd[1] < 0 ? .45 : cd[1] === 0 ? -.2 : 0;
          const lx = p.X(px) + cd[0] * 22, ly = p.Y(py) + cd[1] * (cd[0] === 0 ? 22 : 17);

      q: 'From the library you walk 3 blocks east and 4 blocks north to the school, then 6 blocks east and 8 blocks north to the park. A drone flies straight from the library to the park. How many blocks shorter is its trip than the walk?',
      stages: [
        { kind: 'calc', say: 'In total the park is 3 + 6 = 9 blocks east and 4 + 8 = 12 blocks north of the library.' },
        { kind: 'tri', unk: 'hyp', known: [9, 12], what: 'straight flight', hyp: 'the flight', unit: 'blocks', ask: 'How long is the straight flight from the library to the park?' },
        { kind: 'calc', say: 'The walk is 3 + 4 + 6 + 8 = 21 blocks. The drone saves 21 − 15 = 6 blocks.' }
      ],
      done: 'The drone saves 6 blocks. The walk adds the two legs (21). The flight is the hypotenuse (15).'
    },
    screen: {
      name: 'Diagonal of a screen',
      q: 'A TV is sold as "40 inch", the length of the screen\'s diagonal. The screen is 32 in wide. How tall is it, and what is its area?',
      stages: [
        { kind: 'tri', unk: 'leg', known: [32, 40], what: 'height', hyp: 'the diagonal', unit: 'in', ask: 'How tall is the screen?' },
        { kind: 'calc', say: 'The screen is 32 in by 24 in, so its area is 32 × 24 = 768 square inches.' }
      ],
      done: 'The screen is 24 in tall and has an area of 768 square inches.'
    }
  };
  const triRes = g => Math.round(Math.sqrt(g.unk === 'hyp' ? sq(g.known[0]) + sq(g.known[1]) : sq(g.known[1]) - sq(g.known[0])));
  const triWork = g => {
    const [a, b] = g.known, r = triRes(g), w = cap(g.what);
    return g.unk === 'hyp'
      ? `${w}: c² = ${a}² + ${b}² = ${sq(a)} + ${sq(b)} = ${sq(a) + sq(b)}, so c = ${r} ${g.unit}.`
      : `${w}: x² + ${a}² = ${b}², so x² = ${sq(b)} − ${sq(a)} = ${sq(b) - sq(a)} and x = ${r} ${g.unit}. Check: ${a}² + ${r}² = ${sq(a)} + ${sq(r)} = ${sq(b)} = ${b}².`;
  };
  /* feedback for the wrong operation, with the numbers that show why it fails */
  const triWrong = g => {
    const [a, b] = g.known;
    if (g.unk === 'leg') {   /* the student added */
      const n = sq(a) + sq(b);
      return `${no('Not quite.')} Adding gives √(${a}² + ${b}²) = √${n} ≈ ${Math.sqrt(n).toFixed(1)} ${g.unit}, which is longer than ${g.hyp} itself (${b} ${g.unit}). A leg is always shorter than the hypotenuse, so adding cannot be right. ${cap(g.hyp)} is the hypotenuse, so the highlighted side is a leg: <b>subtract</b> the squares.`;
    }
    const hi = Math.max(a, b), lo = Math.min(a, b), n = sq(hi) - sq(lo);   /* the student subtracted */
    return `${no('Not quite.')} Subtracting gives √(${hi}² − ${lo}²) = √${n} ≈ ${Math.sqrt(n).toFixed(1)} ${g.unit}, which is shorter than a leg (${hi} ${g.unit}). The side opposite the right angle is the longest side, so subtracting cannot be right. The highlighted side is the hypotenuse: <b>add</b> the squares of the legs.`;
  };

  /* ---------- canvas helpers (pixel space) ---------- */
  const font = (size, weight = 600) => `${weight} ${size}px "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif`;
  const T = (c, p, str, x, y, { size = 14, color, align = 'center', weight = 600, a = 1, halo = true } = {}) => {
    if (a <= .01) return;
    c.save(); c.globalAlpha *= a; c.font = font(size, weight); c.textAlign = align; c.textBaseline = 'middle';
    if (halo) { c.lineWidth = 4; c.strokeStyle = p.pal.stage; c.lineJoin = 'round'; c.strokeText(str, x, y); }
    c.fillStyle = color || p.pal.text; c.fillText(str, x, y); c.restore();
  };
  const poly = (c, pts, { stroke, width = 2, fill, close = false, dash } = {}) => {
    c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); if (close) c.closePath();
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = width; c.setLineDash(dash || []); c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); c.setLineDash([]); }
  };
  const band = (c, p, pts, w = 13) => poly(c, pts, { stroke: alpha(p.pal.yellow, .6), width: w });
  const unitv = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  /* right-angle mark at v between the directions toward a and toward b */
  const rmark = (c, p, v, a, b, size, color) => {
    const ua = unitv(v, a), ub = unitv(v, b);
    const p1 = [v[0] + ua[0] * size, v[1] + ua[1] * size], p2 = [v[0] + ub[0] * size, v[1] + ub[1] * size];
    poly(c, [p1, [p1[0] + ub[0] * size, p1[1] + ub[1] * size], p2], { stroke: color, width: 1.8 });
  };
  /* dimension line from a to b with end ticks (the ticks cross the line, so say whether it runs vertically) */
  const dimLine = (c, a, b, color, vertical) => {
    poly(c, [a, b], { stroke: color, width: 2 });
    const t = vertical ? [[-5, 0], [5, 0]] : [[0, -5], [0, 5]];
    for (const q of [a, b]) poly(c, [[q[0] + t[0][0], q[1] + t[0][1]], [q[0] + t[1][0], q[1] + t[1][1]]], { stroke: color, width: 2 });
  };

  /* A right triangle drawn true to proportion in the rectangle r = [x, y, w, h]:
     horizontal leg a, vertical leg b, right angle at the bottom right.
     o: { a, b, la, lb, lh (labels), ca, cb, ch (colors), ua, ub, uh (this side is the unknown), title, work, dim } */
  const flatTri = (c, p, r, o) => {
    const pal = p.pal, [rx, ry, rw, rh] = r;
    const padL = 18, padR = 76, padT = 56, padB = 36;
    const aw = Math.max(20, rw - padL - padR), ah = Math.max(20, rh - padT - padB);
    const s = Math.min(aw / o.a, ah / o.b);
    const x0 = rx + padL + (aw - o.a * s) / 2, yb = ry + padT + (ah + o.b * s) / 2;
    const O = [x0, yb], Q = [x0 + o.a * s, yb], Tp = [Q[0], yb - o.b * s];
    T(c, p, o.title, rx + 12, ry + 17, { size: 12, color: pal.muted, align: 'left', weight: 600 });
    if (o.work) T(c, p, o.work, rx + 12, ry + 37, { size: 13, align: 'left' });
    c.save(); c.globalAlpha = o.dim ? .4 : 1;
    poly(c, [O, Q, Tp], { fill: alpha(pal.yellow, .18), close: true });
    if (o.ua) band(c, p, [O, Q]);
    if (o.ub) band(c, p, [Q, Tp]);
    if (o.uh) band(c, p, [O, Tp]);
    poly(c, [O, Q], { stroke: o.ca, width: 4 });
    poly(c, [Q, Tp], { stroke: o.cb, width: 4 });
    poly(c, [O, Tp], { stroke: o.ch, width: 5 });
    rmark(c, p, Q, O, Tp, Math.min(14, o.a * s / 3, o.b * s / 3), pal.text);
    const fs = 13, M = mid(O, Tp), L = Math.hypot(Tp[0] - O[0], Tp[1] - O[1]), nx = (Tp[1] - O[1]) / L, ny = -(Tp[0] - O[0]) / L;
    T(c, p, o.la, (O[0] + Q[0]) / 2, yb + 18, { size: fs, color: o.ca });
    T(c, p, o.lb, Q[0] + 12, (yb + Tp[1]) / 2, { size: fs, color: o.cb, align: 'left' });
    T(c, p, o.lh, M[0] + nx * 12, M[1] + ny * 12, { size: fs, color: o.ch, align: nx < -.3 ? 'right' : nx > .3 ? 'left' : 'center' });
    c.restore();
  };

  /* A box in oblique projection with the base-diagonal triangle and the space-diagonal triangle,
     plus the same two triangles drawn flat and true to proportion.
     g = { l, w, h } geometry; o = { lab: {l, w, h, f, d}, unk: {l, w, h, f, d}, dim1, dim2, work1, work2, cap } */
  const boxScene = (c, p, g, o) => {
    const pal = p.pal, W = p.w, Hh = p.h, land = W >= Hh * 1.1, unk = o.unk || {};
    const rb = land ? [0, 0, W * .55, Hh] : [0, 0, W, Hh * .5];
    const r1 = land ? [W * .55, 0, W * .45, Hh / 2] : [0, Hh * .5, W / 2, Hh / 2];
    const r2 = land ? [W * .55, Hh / 2, W * .45, Hh / 2] : [W / 2, Hh * .5, W / 2, Hh / 2];
    c.lineWidth = 1.5; c.strokeStyle = pal.grid; c.setLineDash([]);
    c.beginPath();
    if (land) { c.moveTo(W * .55, 0); c.lineTo(W * .55, Hh); c.moveTo(W * .55, Hh / 2); c.lineTo(W, Hh / 2); }
    else { c.moveTo(0, Hh / 2); c.lineTo(W, Hh / 2); c.moveTo(W / 2, Hh / 2); c.lineTo(W / 2, Hh); }
    c.stroke();

    /* the box */
    const kx = .46, ky = .30;
    const padX = land ? 40 : 30, padT = 44, padB = 34;
    const ewU = g.l + g.w * kx, ehU = g.h + g.w * ky;
    const sw = rb[2] - 2 * padX, sh = rb[3] - padT - padB, s0 = Math.min(sw / (12 + 12 * kx), sh / (12 + 12 * ky));
    const s = clamp(Math.min(sw / ewU, sh / ehU), s0, 2.2 * s0);   /* the biggest box fits; small boxes grow a little so they stay readable */
    const ew = ewU * s, eh = ehU * s;
    const ox = rb[0] + (rb[2] - ew) / 2, oy = rb[1] + padT + ((rb[3] - padT - padB) + eh) / 2;
    const P3 = (x, y, z) => [ox + (x + z * kx) * s, oy - (y + z * ky) * s];
    const f0 = P3(0, 0, 0), f1 = P3(g.l, 0, 0), f2 = P3(g.l, g.h, 0), f3 = P3(0, g.h, 0);
    const b0 = P3(0, 0, g.w), b1 = P3(g.l, 0, g.w), b2 = P3(g.l, g.h, g.w), b3 = P3(0, g.h, g.w);
    poly(c, [f0, f1, f2, f3], { fill: alpha(pal.blue, .07), close: true });
    poly(c, [f3, f2, b2, b3], { fill: alpha(pal.blue, .13), close: true });
    poly(c, [f1, b1, b2, f2], { fill: alpha(pal.blue, .10), close: true });
    for (const e of [[f0, b0], [b0, b1], [b0, b3]]) poly(c, e, { stroke: alpha(pal.text, .45), width: 1.6, dash: [5, 5] });
    /* the two right triangles inside the box */
    c.save(); c.globalAlpha = o.dim1 ? .4 : 1;
    poly(c, [f0, f1, b1], { fill: alpha(pal.yellow, .26), close: true });
    c.restore();
    c.save(); c.globalAlpha = o.dim2 ? .4 : 1;
    poly(c, [f0, b1, b2], { fill: alpha(pal.yellow, .18), close: true });
    c.restore();
    for (const e of [[f0, f1], [f1, f2], [f2, f3], [f3, f0], [f1, b1], [f2, b2], [f3, b3], [b1, b2], [b2, b3]]) poly(c, e, { stroke: pal.text, width: 2 });
    if (unk.f) band(c, p, [f0, b1]);
    if (unk.h) band(c, p, [b1, b2]);
    if (unk.d) band(c, p, [f0, b2]);
    if (unk.l) band(c, p, [f0, f1]);
    if (unk.w) band(c, p, [f1, b1]);
    c.save(); c.globalAlpha = o.dim1 ? .5 : 1;
    poly(c, [f0, f1], { stroke: pal.green, width: 4.5 });
    poly(c, [f1, b1], { stroke: pal.red, width: 4.5 });
    poly(c, [f0, b1], { stroke: pal.blue, width: 3.5, dash: [8, 6] });
    c.restore();
    c.save(); c.globalAlpha = o.dim2 ? .5 : 1;
    poly(c, [b1, b2], { stroke: pal.violet, width: 4.5 });
    poly(c, [f0, b2], { stroke: pal.blue, width: 5 });
    c.restore();
    rmark(c, p, f1, f0, b1, 13, pal.text);
    rmark(c, p, b1, f0, b2, 13, pal.text);
    const fs = 15, sym = (t, pt, dx, dy, col, al = 'center') => T(c, p, t, pt[0] + dx, pt[1] + dy, { size: fs, color: col, align: al });
    sym('l', mid(f0, f1), 0, 17, pal.green);
    sym('w', mid(f1, b1), 12, 6, pal.red, 'left');
    sym('h', mid(b1, b2), 12, 0, pal.violet, 'left');
    const uf = unitv(f0, b1);
    sym('f', mid(f0, b1), uf[1] * 14, -uf[0] * 14, pal.blue);
    const md = mid(f0, b2), ud = unitv(f0, b2);
    sym('d', md, ud[1] * 15 - 4, -ud[0] * 15 - 2, pal.blue);
    if (o.cap) T(c, p, o.cap, rb[0] + 28, rb[1] + 28, { size: 12, color: pal.muted, align: 'left' });

    /* the same triangles, flat */
    const lab = o.lab, f = Math.hypot(g.l, g.w);
    flatTri(c, p, r1, { a: g.l, b: g.w, la: `l = ${lab.l}`, lb: `w = ${lab.w}`, lh: `f = ${lab.f}`, ca: pal.green, cb: pal.red, ch: pal.blue,
      ua: unk.l, ub: unk.w, uh: unk.f, title: '1  Triangle on the base', work: o.work1, dim: o.dim1 });
    flatTri(c, p, r2, { a: f, b: g.h, la: `f = ${lab.f}`, lb: `h = ${lab.h}`, lh: `d = ${lab.d}`, ca: pal.blue, cb: pal.violet, ch: pal.blue,
      ua: unk.f2, ub: unk.h, uh: unk.d, title: '2  Upright triangle', work: o.work2, dim: o.dim2 });
  };

  /* ---------- story pictures ---------- */
  const ladderScene = (c, p, stage) => {
    const pal = p.pal, W = p.w, Hh = p.h, wallW = 14, gy = Hh - 98;
    const s = Math.min((W - 150) / 15.5, (gy - 50) / 25.5);
    const wx = clamp(W / 2 + 7.5 * s + 10, 15.5 * s + 30, W - 78);
    const F = ft => [wx - ft * s, gy], Tp = ht => [wx, gy - ht * s], second = stage >= 2, final = stage >= 4;
    c.fillStyle = alpha(pal['grid-strong'], .35); c.fillRect(0, gy, W, Hh - gy); c.fillRect(wx, 18, wallW, gy - 18);
    poly(c, [[0, gy], [W, gy]], { stroke: pal.text, width: 3 });
    poly(c, [[wx, gy], [wx, 18]], { stroke: pal.text, width: 3 });
    if (!second) band(c, p, [Tp(0), Tp(24)]);
    else if (stage < 3) band(c, p, [F(15), Tp(0)]);
    const lad = (ft, ht, al, dash) => {
      const A0 = F(ft), B0 = Tp(ht), u = unitv(A0, B0), n = [-u[1] * 5.5, u[0] * 5.5];
      c.save(); c.globalAlpha = al;
      for (const sg of [-1, 1]) poly(c, [[A0[0] + sg * n[0], A0[1] + sg * n[1]], [B0[0] + sg * n[0], B0[1] + sg * n[1]]], { stroke: pal.blue, width: 3.5, dash });
      for (let i = 1; i < 10; i++) { const m = [A0[0] + (B0[0] - A0[0]) * i / 10, A0[1] + (B0[1] - A0[1]) * i / 10]; poly(c, [[m[0] - n[0], m[1] - n[1]], [m[0] + n[0], m[1] + n[1]]], { stroke: pal.blue, width: 2 }); }
      c.restore();
    };
    if (second) lad(7, 24, .35, [6, 6]); else lad(7, 24, 1);
    if (second) lad(15, 20, 1);
    rmark(c, p, [wx, gy], [wx - 30, gy], [wx, gy - 30], 14, pal.text);
    const A0 = second ? F(15) : F(7), B0 = second ? Tp(20) : Tp(24), u = unitv(A0, B0), m0 = mid(A0, B0);
    T(c, p, '25 ft', m0[0] + u[1] * 24, m0[1] - u[0] * 24, { size: 14, color: pal.blue });
    /* vertical dimension line on the right of the wall */
    const vx = wx + wallW + 10;
    if (!second) {
      dimLine(c, [vx, gy], [vx, Tp(24)[1]], pal.yellow, true);
      T(c, p, '? ft', vx + 9, (gy + Tp(24)[1]) / 2, { size: 14, color: pal.yellow, align: 'left', weight: 700 });
    } else {
      dimLine(c, [vx, gy], [vx, Tp(24)[1]], pal.muted, true);
      dimLine(c, [vx, gy], [vx, Tp(20)[1]], pal.muted, true);
      T(c, p, '20 ft', vx + 9, (gy + Tp(20)[1]) / 2, { size: 14, align: 'left' });
      T(c, p, '4 ft', vx + 9, (Tp(20)[1] + Tp(24)[1]) / 2, { size: 13, color: pal.violet, align: 'left' });
    }
    /* horizontal dimension lines under the ground */
    const hd = (ft0, ft1, y, txt, col, bold) => {
      dimLine(c, [F(ft0)[0], y], [F(ft1)[0], y], col, false);
      T(c, p, txt, (F(ft0)[0] + F(ft1)[0]) / 2, y + 15, { size: 14, color: col === pal.muted ? pal.text : col, weight: bold ? 700 : 600 });
    };
    hd(7, 0, gy + 14, '7 ft', pal.muted);
    if (second) hd(15, 0, gy + 44, stage >= 3 ? '15 ft' : '? ft', stage >= 3 ? pal.muted : pal.yellow, stage < 3);
    if (final) hd(15, 7, gy + 74, 'foot moves 8 ft', pal.violet);
  };

  const blocksScene = (c, p, stage) => {
    const pal = p.pal, W = p.w, Hh = p.h, EW = 9, NH = 12, hypKnown = stage >= 2;
    const u = Math.min((W - 136) / EW, (Hh - 110) / NH);
    const ox = 70 + (W - 136 - EW * u) / 2, oy = Math.min(Hh - 50, Hh / 2 + NH * u / 2 + 8);
    const X = x => ox + x * u, Y = y => oy - y * u;
    c.lineWidth = 1; c.strokeStyle = pal.grid; c.beginPath();
    for (let i = 0; i <= EW; i++) { c.moveTo(X(i), Y(0)); c.lineTo(X(i), Y(NH)); }
    for (let j = 0; j <= NH; j++) { c.moveTo(X(0), Y(j)); c.lineTo(X(EW), Y(j)); }
    c.stroke();
    poly(c, [[X(0), Y(0)], [X(3), Y(0)], [X(3), Y(4)], [X(9), Y(4)], [X(9), Y(12)]], { stroke: pal.muted, width: 3 });
    const O = [X(0), Y(0)], Pk = [X(9), Y(12)];
    poly(c, [O, [X(9), Y(0)], Pk], { fill: alpha(pal.yellow, .14), close: true });
    if (!hypKnown) band(c, p, [O, Pk]);
    poly(c, [O, Pk], { stroke: pal.blue, width: 4, dash: [9, 7] });
    /* totals as dimension lines */
    dimLine(c, [X(0), Y(0) + 18], [X(9), Y(0) + 18], pal.green, false);
    T(c, p, '9 blocks east', X(4.5), Y(0) + 34, { size: 14, color: pal.green });
    dimLine(c, [X(9) + 18, Y(0)], [X(9) + 18, Y(12)], pal.red, true);
    c.save(); c.translate(X(9) + 34, Y(6)); c.rotate(-Math.PI / 2);
    T(c, p, '12 blocks north', 0, 0, { size: 14, color: pal.red });
    c.restore();
    for (const [x, y, nm, al, dx, dy] of [[0, 0, 'Library', 'right', -12, 0], [3, 4, 'School', 'right', -12, 0], [9, 12, 'Park', 'right', -12, -2]]) {
      c.beginPath(); c.arc(X(x), Y(y), 6.5, 0, TAU); c.fillStyle = pal.stage; c.fill(); c.lineWidth = 3; c.strokeStyle = pal.text; c.stroke();
      T(c, p, nm, X(x) + dx, Y(y) + dy, { size: 14, align: al });
    }
    const mh = mid(O, Pk), uh = unitv(O, Pk);
    T(c, p, hypKnown ? '15 blocks' : '? blocks', mh[0] + uh[1] * 40 - 8, mh[1] - uh[0] * 40, { size: 15, color: hypKnown ? pal.blue : pal.yellow, weight: 700 });
    if (stage >= 3) T(c, p, 'walk: 21 blocks', X(6), Y(4) + 17, { size: 13, color: pal.muted });
  };

  const screenScene = (c, p, stage) => {
    const pal = p.pal, W = p.w, Hh = p.h, A = 32, B = 24, hKnown = stage >= 1;
    const s = Math.min((W - 96) / A, (Hh - 150) / B);
    const x0 = 24 + (W - 24 - 64 - A * s) / 2, y1 = (Hh - B * s) / 2 - 8, xr = x0 + A * s, yb = y1 + B * s;
    if (stage >= 2) poly(c, [[x0, y1], [xr, y1], [xr, yb], [x0, yb]], { fill: alpha(pal.yellow, .12), close: true });
    poly(c, [[x0, yb], [xr, yb], [xr, y1]], { fill: alpha(pal.yellow, .2), close: true });
    if (!hKnown) band(c, p, [[xr, yb], [xr, y1]]);
    poly(c, [[x0, y1], [xr, y1], [xr, yb], [x0, yb]], { stroke: pal.text, width: 5, close: true });
    poly(c, [[x0, yb], [xr, yb]], { stroke: pal.green, width: 4 });
    poly(c, [[xr, yb], [xr, y1]], { stroke: pal.red, width: 4 });
    poly(c, [[x0, yb], [xr, y1]], { stroke: pal.blue, width: 5 });
    rmark(c, p, [xr, yb], [x0, yb], [xr, y1], 15, pal.text);
    const mdp = mid([x0, yb], [xr, y1]), ud = unitv([x0, yb], [xr, y1]);
    T(c, p, '40 in', mdp[0] + ud[1] * 22, mdp[1] - ud[0] * 22, { size: 15, color: pal.blue });
    T(c, p, '32 in', (x0 + xr) / 2, yb + 24, { size: 15, color: pal.green });
    T(c, p, hKnown ? '24 in' : '? in', xr + 16, (yb + y1) / 2, { size: 15, color: hKnown ? pal.red : pal.yellow, align: 'left', weight: hKnown ? 600 : 700 });
    if (stage >= 2) T(c, p, '32 × 24 = 768 in²', x0 + A * s * .36, y1 + B * s * .2, { size: 14 });
  };

  register({
    id: 'distance-and-the-pythagorean-theorem', level: 'school',
    title: 'Distance and the Pythagorean theorem',
    blurb: 'Drag two points, then step into a box and a story, and find every distance with the Pythagorean theorem.',
    thumb(c, p) {
      const pal = p.pal; p.cx = -.5; p.cy = 1; p.span = 6.6;
      p.grid(1);
      const sqr = (pts, col) => p.path(pts, { fill: alpha(pal.yellow, .2), stroke: col, width: 1.8, close: true });

    formal: String.raw`
      <p><b>Goal.</b> Find a length that is not given: the distance between two points, the diagonal of a box, an unknown side in a story. The tool is the Pythagorean theorem for a right triangle with legs \(a,b\) and hypotenuse \(c\):
      \[ a^2+b^2=c^2. \]</p>
      <h3>Distance on a line</h3>
      <p>Points with the same y-coordinate lie on a horizontal line, and their distance is the difference of their x-coordinates. Points with the same x-coordinate lie on a vertical line, so subtract the y-coordinates. A distance is never negative and does not depend on which point you name first, so use the absolute value:
      \[ d=|x_2-x_1| \quad\text{or}\quad d=|y_2-y_1|. \]
      For \((-4,2)\) and \((3,2)\): \(d=|3-(-4)|=7\).</p>
      <h3>The distance formula</h3>
      <p>Let \(A=(x_1,y_1)\) and \(B=(x_2,y_2)\) be in different rows and columns. The point \(C=(x_2,y_1)\) is in A's row and B's column. So \(AC\) is horizontal, \(CB\) is vertical, and the angle at \(C\) is a right angle. By the previous section \(AC=|x_2-x_1|\) and \(CB=|y_2-y_1|\). The Pythagorean theorem for triangle \(ACB\) gives
      \[ d^2=|x_2-x_1|^2+|y_2-y_1|^2=(x_2-x_1)^2+(y_2-y_1)^2, \qquad d=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}. \]
      Squaring removes the sign, so the order of the points does not matter. If the points share a row or a column, one leg is \(0\) and the formula agrees with plain subtraction.
      For \((-2,-1)\) and \((1,3)\): \(d=\sqrt{3^2+4^2}=\sqrt{25}=5\).</p>
      <h3>Answers that are not whole numbers</h3>
      <p>When \(d^2\) is not a perfect square, \(d\) is irrational. Give the exact value with a radical, and a decimal if you need one. To simplify a radical, pull out the largest perfect-square factor:
      \[ \sqrt{50}=\sqrt{25\cdot 2}=\sqrt{25}\,\sqrt{2}=5\sqrt{2}\approx 7.07. \]
      For \((1,1)\) and \((6,6)\) both legs are \(5\), so \(d=\sqrt{25+25}=\sqrt{50}=5\sqrt2\). Some radicals do not simplify: \(41\) has no square factor, so \(\sqrt{41}\approx 6.40\) is as simple as it gets. Keep the radical until the last step so that rounding does not pile up.</p>
      <h3>Finding a leg</h3>
      <p>If you know the hypotenuse \(c\) and one leg \(a\), the other leg satisfies \(b^2=c^2-a^2\). Subtract the squares, then take the root:
      \[ b=\sqrt{c^2-a^2}. \]
      A 13 ft ladder with its foot 5 ft from a wall reaches \(\sqrt{169-25}=\sqrt{144}=12\) ft up the wall. Adding by mistake gives \(\sqrt{169+25}=\sqrt{194}\approx 13.9\), a leg longer than the whole ladder, which cannot happen.</p>
      <h3>Distance in space: the box</h3>
      <p>A box has length \(l\), width \(w\) and height \(h\). The longest straight rod inside runs from one corner to the opposite corner, and two right triangles find it. The diagonal \(f\) of the base is the hypotenuse of a triangle with legs \(l\) and \(w\):
      \[ f^2=l^2+w^2. \]
      The vertical edge of length \(h\) is perpendicular to the base, so it is perpendicular to \(f\). Then \(f\) and \(h\) are the legs of a second right triangle, and its hypotenuse is the space diagonal \(d\):
      \[ d^2=f^2+h^2=l^2+w^2+h^2, \qquad d=\sqrt{l^2+w^2+h^2}. \]
      The number \(f^2\) is a whole number even when \(f\) is irrational, so you can use \(f^2\) directly in the second step. Whole-number boxes: \(1,2,2\) gives \(3\); \(2,3,6\) gives \(7\); \(3,4,12\) gives \(13\). For \(2,3,4\): \(d=\sqrt{4+9+16}=\sqrt{29}\approx 5.39\).</p>
      <h3>A multi-step story</h3>
      <p>A 25 ft ladder has its foot 7 ft from a wall. Its top slides down 4 ft. How far does the foot move? Draw each position as its own right triangle.</p>
      <ol>
        <li>Height at first: \(\sqrt{25^2-7^2}=\sqrt{576}=24\) ft.</li>
        <li>Height after the slide: \(24-4=20\) ft.</li>
        <li>Foot's distance now: \(\sqrt{25^2-20^2}=\sqrt{225}=15\) ft.</li>
        <li>Movement of the foot: \(15-7=8\) ft.</li>
      </ol>
      <p>The foot moves 8 ft, not 4 ft. Check each triangle by putting the answer back into \(a^2+b^2=c^2\): \(7^2+24^2=625=25^2\) and \(15^2+20^2=625=25^2\).</p>
      <h3>Is it a right triangle? The converse</h3>
      <p>If the sides of a triangle satisfy \(a^2+b^2=c^2\), with \(c\) the longest side, then the angle opposite \(c\) is a right angle. For \(7,24,25\): \(49+576=625=25^2\), so it is a right triangle. For \(5,6,8\): \(25+36=61\), but \(8^2=64\), so it is not.</p>
      <h3>Does the answer make sense?</h3>
      <p>The hypotenuse is longer than each leg but shorter than the two legs added, because a straight path beats a detour:
      \[ \max(a,b) &lt; c &lt; a+b. \]
      For the drone, 5 blocks east and 12 north is a 17-block walk and a 13-block flight, and \(12 &lt; 13 &lt; 17\). For a box, \(d\) is longer than every edge and shorter than \(l+w+h\). A leg that comes out longer than the hypotenuse means you added when you should have subtracted.</p>`,

    mount({ stage, controls: C }) {
      const MODES = ['plane', 'box', 'story'];

      const P = new Plane(stage, { span: 8 });

      /* ---------- drawing ---------- */
      const clampPts = () => {
        let ch = false;

        }

      };

      const planeScene = (c, p) => {
        const pal = p.pal, land = p.w >= p.h * 1.15, fx = land ? (p.w >= p.h * 1.5 ? 10 : 8) : 6, fy = land ? 6 : 9;
        fld.fx = fx; fld.fy = fy;
        const sc0 = Math.min(p.w / (2 * fx + 3.2), p.h / (2 * fy + 3.2));
        p.span = Math.min(p.w, p.h) / (2 * sc0); p.cx = 0; p.cy = 0;
        const sc = p.scale;
        if (clampPts()) upd();
        const x0 = -fx - .5, x1 = fx + .5, y0 = -fy - .5, y1 = fy + .5;

        for (let x = -fx; x <= fx; x++) { c.moveTo(p.X(x), p.Y(y0)); c.lineTo(p.X(x), p.Y(y1)); }
        for (let y = -fy; y <= fy; y++) { c.moveTo(p.X(x0), p.Y(y)); c.lineTo(p.X(x1), p.Y(y)); }
        c.stroke();
        p.path([[x0, 0], [x1, 0]], { stroke: pal['grid-strong'], width: 2 });
        p.path([[0, y0], [0, y1]], { stroke: pal['grid-strong'], width: 2 });
        p.path([[x0, y0], [x1, y0], [x1, y1], [x0, y1]], { stroke: pal['grid-strong'], width: 1.5, close: true });
        const stepT = sc >= 22 ? 1 : 2, tf = clamp(sc * .3, 11, 14);
        for (let x = -fx; x <= fx; x += stepT) T(c, p, num(x), p.X(x), p.Y(y0) + 13, { size: tf, color: pal.muted, halo: false, weight: 500 });
        for (let y = -fy; y <= fy; y += stepT) T(c, p, num(y), p.X(x0) - 8, p.Y(y), { size: tf, color: pal.muted, align: 'right', halo: false, weight: 500 });

        const A = [vis.ax, vis.ay], B = [vis.bx, vis.by], Cc = [vis.bx, vis.ay];
        const dxs = B[0] - A[0], dys = B[1] - A[1], adx = Math.abs(dxs), ady = Math.abs(dys);
        const same = st.ax === st.bx && st.ay === st.by, lineCase = st.ax === st.bx || st.ay === st.by;
        const sxs = Math.sign(dxs) || 1, sys = Math.sign(dys) || 1;
        const dxi = Math.abs(st.bx - st.ax), dyi = Math.abs(st.by - st.ay), d2 = dxi * dxi + dyi * dyi;
        const fs = clamp(sc * .34, 12, 16), px = pt => [p.X(pt[0]), p.Y(pt[1])];
        /* labels register their boxes so the point names can pick a free spot */
        const boxes = [], tw = (str, size) => { c.save(); c.font = font(size); const w = c.measureText(str).width; c.restore(); return w; };
        const rectOf = (str, x, y, size, align) => { const w = tw(str, size); return [(align === 'left' ? x : align === 'right' ? x - w : x - w / 2) - 2, y - size * .6, w + 4, size * 1.2]; };
        const overlap = (a, b) => Math.max(0, Math.min(a[0] + a[2], b[0] + b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[1] + a[3], b[1] + b[3]) - Math.max(a[1], b[1]));
        const put = (str, x, y, o) => { boxes.push(rectOf(str, x, y, o.size || 14, o.align || 'center')); T(c, p, str, x, y, o); };
        const segBoxes = (P0, Q0) => {
          const a = px(P0), b = px(Q0), n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 8));

            return { x, y, align, r, score: out + boxes.reduce((a, b) => a + overlap(r, b), 0) + i * 12 };

        if (st.sq && !lineCase) {

          let nx = -dys, ny = dxs;
          if (nx * (Cc[0] - A[0]) + ny * (Cc[1] - A[1]) > 0) { nx = -nx; ny = -ny; }
          const sqs = [

            { pts: [A, B, [B[0] + nx, B[1] + ny], [A[0] + nx, A[1] + ny]], col: pal.blue, txt: `d² = ${d2}`, short: String(d2), side: Math.sqrt(d2) }
          ];
          for (const q of sqs) p.path(q.pts, { fill: alpha(pal.yellow, .14), stroke: alpha(q.col, .9), width: 2.2, close: true });

          p.path([Cc, B], { stroke: pal.red, width: 4.5 });
          p.path([A, B], { stroke: pal.blue, width: 4.5 });

          /* with the squares on, the leg lengths sit inside the triangle, away from the squares */

  const opAbs = op => { const a = Math.abs(op.n); return op.v ? (a === 1 ? op.v : a + op.v) : String(a); };
  const opText = (op, paren) => { const s = opAbs(op); return op.n < 0 ? (paren ? '(' + MINUS + s + ')' : MINUS + s) : s; };
  const opLabel = op => ({ add: 'Add ', sub: 'Subtract ', mul: 'Multiply by ', div: 'Divide by ' }[op.kind]) + opText(op);
  const opPhrase = op => ({ add: 'add ' + opText(op) + ' to both sides', sub: 'subtract ' + opText(op) + ' from both sides',
    mul: 'multiply both sides by ' + opText(op), div: 'divide both sides by ' + opText(op) }[op.kind]);
  /* spread: multiplying or dividing a sum acts on every term (the balance), instead of keeping a bracket (formulas) */
  const wholeGroup = u => u.e && u.c[1] === 1 && u.c[0] >= 2 && u.c[0] <= 6 && isConst(u.m);
  const applyOp = (E, op, spread) => {
    const t = opTerm(op);

    if (op.kind === 'sub') return norm([...E, { c: qneg(t.c), m: t.m }]);
    const k = op.kind === 'mul' ? t : { c: qinv(t.c), m: minv(t.m) };
    if (!spread) return norm(mulE(E, k.c, k.m));

  /* true when a written expression needs parentheses before it can be divided: a sum, a quotient or a negative */
  const loose = s => {
    if (s[0] === MINUS) return true;
    let d = 0;

    return false;
  };
  /* the side written out with the operation attached, before anything is simplified */
  const sideTxt = (E, op) => {
    const k = opText(op, true), s = pr(E), wrapped = loose(s) ? '(' + s + ')' : s;
    if (op.kind === 'add') return s + ' + ' + k;
    if (op.kind === 'sub') return s + ' ' + MINUS + ' ' + k;
    if (op.kind === 'mul') return /^[A-Za-z]$/.test(s) ? k + s : k + '(' + s + ')';
    return wrapped + '/' + k;
  };

  /* words that justify the tidy-up after a step: like terms that merge or cancel */
  const merges = raw => {
    const by = new Map();
    for (const t of raw) if (!t.e) { const k = mkey(t.m); if (!by.has(k)) by.set(k, []); by.get(k).push(t); }
    const out = [];
    for (const ts of by.values()) {
      if (ts.length < 2) continue;
      const sum = ts.reduce((s, t) => qadd(s, t.c), Q(0));
      const lhs = ts.map((t, i) => (i ? (t.c[0] < 0 ? ' ' + MINUS + ' ' : ' + ') : (t.c[0] < 0 ? MINUS : '')) + tabs({ ...t, c: Q(Math.abs(t.c[0]), t.c[1]) })).join('');
      const m = ts[0].m;
      if (q0(sum)) out.push({ kind: 'inverse', txt: lhs + ' = 0' });
      else out.push({ kind: isConst(m) ? 'arith' : 'combine', txt: lhs + ' = ' + pr([{ c: sum, m }]) });
    }

  };
  const mergeWords = (raw, after) => {
    const ms = merges(raw);
    if (!ms.length) return '';
    const parts = ms.map(x => (x.kind === 'inverse' ? x.txt + ' (inverse property)' : x.kind === 'combine' ? 'combine like terms, ' + x.txt + ' (distributive property)' : x.txt));
    let s = parts.join('; ');
    if (ms.some(x => x.kind === 'inverse') && after.length) s += ', so ' + pr(after) + ' + 0 = ' + pr(after) + ' (identity property)';
    return s;
  };
  /* what happened to one side when it was multiplied or divided */
  const timesWords = (op, S, S2, spread) => {
    if (S.length > 1 && spread) {
      const mul = op.kind === 'mul', nTxt = op.n < 0 ? '(' + qtxt(Q(op.n)) + ')' : opText(op);
      return (mul ? 'multiply' : 'divide') + ' every term by ' + opText(op, true) + ' (distributive property), ' + S.map(u => pr([u]) + (mul ? ' \u00d7 ' : ' \u00f7 ') + nTxt + ' = ' + pr(applyOp([u], op, true))).join(' and ');
    }
    if (S.length !== 1) return '';
    const t = S[0], mul = op.kind === 'mul', sym = mul ? '×' : '÷';
    const kc = mul ? Q(op.n) : qinv(Q(op.n)), km = mul ? opTerm(op).m : minv(opTerm(op).m);
    const c1 = qmul(t.c, kc), nTxt = op.n < 0 ? '(' + qtxt(Q(op.n)) + ')' : qtxt(Q(op.n)), pieces = []; let inv = false;
    if (op.n !== 1 && !q1(t.c)) { pieces.push(qtxt(t.c) + ' ' + sym + ' ' + nTxt + ' = ' + qtxt(c1)); if (q1(c1)) inv = true; }
    for (const v in km) if (t.m[v] && t.m[v] + km[v] === 0) { pieces.push(v + ' ÷ ' + v + ' = 1'); inv = true; }
    if (!pieces.length) return '';
    if (t.e) return inv && q1(c1) && isConst(mmul(t.m, km)) ? pieces.join(', ') + ' (inverse property), so 1(' + pr(t.e) + ') = ' + pr(t.e) + ' (identity property)' : '';
    let s = pieces.join(', ');
    if (inv) {
      s += ' (inverse property)';
      if (S2.length === 1 && !isConst(S2[0].m)) { const r = pr(S2); s += ', so 1' + (/^[A-Za-z]/.test(r) ? '' : '·') + r + ' = ' + r + ' (identity property)'; }
    }
    return s;
  };

  /* One history record is { eq, why }. doOp returns the two records for a step and the new equation. */
  const doOp = (eq, op, spread) => {
    const L2 = applyOp(eq.L, op, spread), R2 = applyOp(eq.R, op, spread), next = { L: L2, R: R2 };
    const rec1 = { eq: sideTxt(eq.L, op) + ' = ' + sideTxt(eq.R, op), why: PROP[op.kind] + ': ' + opPhrase(op) + '.' };
    let words = '';
    if (op.kind === 'add' || op.kind === 'sub') {
      const t = opTerm(op), sg = op.kind === 'sub' ? qneg(t.c) : t.c;
      const wl = mergeWords([...eq.L, { c: sg, m: t.m }], L2), wr = mergeWords([...eq.R, { c: sg, m: t.m }], R2);
      words = (wl ? 'Left: ' + wl + '.' : '') + (wl && wr ? ' ' : '') + (wr ? 'Right: ' + wr + '.' : '');
    } else {
      const wl = timesWords(op, eq.L, L2, spread), wr = timesWords(op, eq.R, R2, spread);
      words = (wl ? 'Left: ' + wl + '.' : '') + (wl && wr ? ' ' : '') + (wr ? 'Right: ' + wr + '.' : '');
    }
    const e2 = prEq(next), rec2 = e2 !== rec1.eq && words !== '' ? { eq: e2, why: words } : (e2 !== rec1.eq ? { eq: e2, why: 'Simplify.' } : null);
    return { eq: next, recs: rec2 ? [rec1, rec2] : [rec1] };
  };
  const doDist = eq => {
    const rl = distRaw(eq.L), rr = distRaw(eq.R), next = { L: norm(rl), R: norm(rr) };
    const parts = [...eq.L, ...eq.R].filter(t => t.e).map(t => tabs(t) + ' = ' + pr(distRaw([t])));
    const rec1 = { eq: pr(rl) + ' = ' + pr(rr), why: 'Distributive property: ' + parts.join('; ') + '.' };
    const e2 = prEq(next), wl = mergeWords(rl, next.L), wr = mergeWords(rr, next.R);
    const words = (wl ? 'Left: ' + wl + '.' : '') + (wl && wr ? ' ' : '') + (wr ? 'Right: ' + wr + '.' : '');
    return { eq: next, recs: e2 !== rec1.eq ? [rec1, { eq: e2, why: words || 'Simplify.' }] : [rec1] };
  };
  const doSwap = eq => ({ eq: { L: eq.R, R: eq.L }, recs: [{ eq: pr(eq.R) + ' = ' + pr(eq.L), why: 'Symmetric property of equality: if a = b, then b = a.' }] });

  /* ---------- where is the equation going? ---------- */
  const single = (E, v) => E.length === 1 && !E[0].e && q1(E[0].c) && Object.keys(E[0].m).length === 1 && E[0].m[v] === 1;
  const constOf = E => evalE(E, {});
  const numeric = E => E.every(t => isConst(t.m) && (!t.e || numeric(t.e)));
  /* 'solved', 'none' (a false statement is left), 'all' (a true statement is left) or 'open' */
  const status = (eq, v) => {
    const hl = hasV(eq.L, v), hr = hasV(eq.R, v);
    if (single(eq.L, v) && !hr) return 'solved';
    if (single(eq.R, v) && !hl) return 'solved';
    if (!hl && !hr && numeric(eq.L) && numeric(eq.R)) return qeq(constOf(eq.L), constOf(eq.R)) ? 'all' : 'none';
    return 'open';
  };
  const answerOf = (eq, v) => (single(eq.L, v) ? eq.R : eq.L);
  /* a group with the unknown inside it still has to be opened */
  const openGroups = (E, v) => E.filter(t => t.e && hasV(t.e, v)).length;
  /* obstacles between here and "v alone": the lower the number, the closer we are */
  const dist = (eq, v) => {
    if (status(eq, v) !== 'open') return 0;

    const T = hl ? L : R;
    d += T.filter(t => !t.e && !t.m[v]).length;
    const tt = T.find(t => !t.e && t.m[v]);
    if (tt) {
      if (tt.c[1] > 1) d += 1;

  const suggest = (eq, v, where) => {
    if (status(eq, v) !== 'open') return null;
    const { L, R } = eq, hl = hasV(L, v), hr = hasV(R, v), side = s => (where === 'pan' ? (s === 'L' ? 'left' : 'right') + ' pan' : (s === 'L' ? 'left' : 'right') + ' side');

    }
    if (hl && hr) {
      const keepL = qval(coefOf(L, v)) >= qval(coefOf(R, v)), O = keepL ? R : L, t = O.find(u => !u.e && u.m[v]), neg = t.c[0] < 0;
      const op = { kind: neg ? 'add' : 'sub', n: Math.abs(t.c[0]), v, ok: t.c[1] === 1 };
      return { ...op, text: v + ' is on both ' + (where === 'pan' ? 'pans' : 'sides') + '. Gather it on the ' + side(keepL ? 'L' : 'R') + ': ' + (neg ? 'add ' : 'subtract ') + opText({ ...op, v }) + ' on both ' + (where === 'pan' ? 'pans' : 'sides') + ', so the ' + pr([t]) + ' on the ' + side(keepL ? 'R' : 'L') + ' cancels.' };
    }
    const T = hl ? L : R, ts = hl ? 'L' : 'R', extra = T.find(t => !t.e && !t.m[v]);
    if (extra) {
      const neg = extra.c[0] < 0, vars = Object.keys(extra.m), ok = extra.c[1] === 1 && (vars.length === 0 || (vars.length === 1 && extra.m[vars[0]] === 1));
      const op = { kind: neg ? 'add' : 'sub', n: Math.abs(extra.c[0]), v: vars[0] || '', ok };
      const sgn = (extra.c[0] < 0 ? MINUS : '+') + pr([{ ...extra, c: Q(Math.abs(extra.c[0]), extra.c[1]) }]);
      return { ...op, text: v + ' is not alone: the ' + side(ts) + ' also has ' + sgn + '. Undo it with the opposite operation: ' + (neg ? 'add ' : 'subtract ') + (ok ? opText(op) : qtxt(Q(Math.abs(extra.c[0]), extra.c[1])) + vars.join('')) + ' on both ' + (where === 'pan' ? 'pans' : 'sides') + '. It was the last thing done to ' + v + ', so it is the first to undo.' };
    }
    const tt = T[0], c = tt.c, others = Object.keys(tt.m).filter(k => k !== v);

  };

  /* what to say after a move: why it helped, or why it did not */
  const feedback = (before, after, op, v, where) => {
    const pan = where === 'pan', both = pan ? 'pans' : 'sides', one = s => (s === 'L' ? 'left' : 'right') + (pan ? ' pan' : ' side');
    const sa = status(after, v), d0 = dist(before, v), d1 = dist(after, v);
    if (sa === 'solved') return { good: true, text: v + ' is alone: ' + (single(after.L, v) ? v + ' = ' + pr(after.R) : pr(after.L) + ' = ' + v) + '. Press ' + (where === 'pan' ? 'Check the answer' : 'Check with numbers') + ' to test it.' };
    if (sa === 'none') return { good: true, text: 'Every ' + v + ' cancelled, and what is left, ' + prEq(after) + ', is false. No number can make it true, so there is no solution.' };
    if (sa === 'all') return { good: true, text: 'Every ' + v + ' cancelled, and what is left, ' + prEq(after) + ', is always true. Any number works: there are infinitely many solutions.' };

      if (d1 < d0 && cancels.length) {

        return { good: true, text: isV ? 'The ' + pr([{ ...c.like, c: Q(Math.abs(c.like.c[0]), c.like.c[1]) }]) + ' on the ' + one(c.s) + ' cancelled (' + pr([c.like]) + ' ' + (op.kind === 'sub' ? MINUS : '+') + ' ' + opText(op, true) + ' = 0), so all the ' + v + '’s are now on one ' + (pan ? 'pan' : 'side') + '.'
          : pr([c.like]) + ' on the ' + one(c.s) + ' cancelled, because ' + pr([c.like]) + ' ' + (op.kind === 'sub' ? MINUS : '+') + ' ' + opText(op, true) + ' = 0. ' + (d1 === 0 ? '' : 'Closer to ' + v + ' alone.') };
      }

      if (hit.length) {
        const c = hit[0], left = qadd(c.like.c, tc), abs = pr([{ ...c.like, c: Q(Math.abs(c.like.c[0]), c.like.c[1]) }]);
        return { good: false, text: 'It is still true, but nothing cancelled: ' + pr([c.like]) + ' ' + (op.kind === 'sub' ? MINUS : '+') + ' ' + opText(op, true) + ' leaves ' + pr([{ c: left, m: c.like.m }]) + '. To cancel ' + pr([c.like]) + ', ' + (c.like.c[0] < 0 ? 'add ' : 'subtract ') + abs + '.' };
      }
      return { good: false, text: 'It is still true, but there is no ' + opAbs(op) + ' on either ' + (pan ? 'pan' : 'side') + ' to cancel, so this only adds more. To cancel a term, use its opposite.' };
    }

    const frac = E => E.some(u => u.c[1] > 1 || (u.e && frac(u.e)));
    const T = hasV(before.L, v) ? before.L : before.R, extra = T.some(u => !u.e && !u.m[v]), tt = T.find(u => !u.e && u.m[v]);
    const T2 = hasV(after.L, v) ? after.L : after.R, tt2 = T2.find(u => !u.e && u.m[v]);
    if (op.kind === 'div' && (frac(after.L) || frac(after.R)) && !(frac(before.L) || frac(before.R)))
      return { good: false, text: 'That is still true, but fractions appeared, because ' + opText(op) + ' does not divide every term evenly. ' + (extra ? 'The last thing done to ' + v + ' was adding or subtracting a number. Undo that first and the numbers stay whole.' : '') };

  /* ---------- the equations and formulas on offer ---------- */
  const LVNAMES = ['One step', 'Two steps', 'x on both sides', 'Parentheses', 'Negatives, fractions', 'Special cases'];
  const EQS = [
    { lv: 0, s: 'x + 4 = 9' }, { lv: 0, s: 'x − 3 = 6' }, { lv: 0, s: '3x = 12' },
    { lv: 1, s: '3x + 2 = 14' }, { lv: 1, s: '2x − 5 = 7' }, { lv: 1, s: '11 = 4x − 1' },
    { lv: 2, s: '3x + 2 = x + 10' }, { lv: 2, s: '5x − 4 = 2x + 8' }, { lv: 2, s: '2x + 9 = 5x' },
    { lv: 3, s: '2(x + 3) = 14' }, { lv: 3, s: '3(x − 1) = 12' }, { lv: 3, s: '4(x + 2) = 2x + 14' },
    { lv: 4, s: '5x + 3 = 2x − 6' }, { lv: 4, s: '3x + 1 = x + 2' }, { lv: 4, s: 'x/2 + 1 = 4' }, { lv: 4, s: '10 − 2x = 4' },

  const solveX = eq => {

  /* formulas: `vals` is one set of numbers that fits the formula (for the check), `fwd` is what the formula does to the
     unknown (so the student can see the steps to undo, in reverse), and `nodes` labels the pictures along the way */
  const O = (kind, n, v = '') => ({ kind, n, v });
  const FORMS = [
    { s: 'd = rt', v: 't', vals: { d: 12, r: 4, t: 3 }, nodes: ['t', 'd'], fwd: [O('mul', 1, 'r')] },
    { s: 'P = 2l + 2w', v: 'w', vals: { P: 16, l: 5, w: 3 }, nodes: ['w', '2w', 'P'], fwd: [O('mul', 2), O('add', 2, 'l')] },
    { s: 'y = mx + b', v: 'x', vals: { y: 11, m: 2, x: 4, b: 3 }, nodes: ['x', 'mx', 'y'], fwd: [O('mul', 1, 'm'), O('add', 1, 'b')] },
    { s: 'A = bh/2', v: 'h', vals: { A: 12, b: 6, h: 4 }, nodes: ['h', 'bh', 'A'], fwd: [O('mul', 1, 'b'), O('div', 2)] },
    { s: 'P = 2(l + w)', v: 'w', vals: { P: 16, l: 5, w: 3 }, nodes: ['w', 'l + w', 'P'], fwd: [O('add', 1, 'l'), O('mul', 2)] },
    { s: 'F = 9C/5 + 32', v: 'C', vals: { F: 68, C: 20 }, nodes: ['C', '9C', '9C/5', 'F'], fwd: [O('mul', 9), O('div', 5), O('add', 32)] }
  ];
  const INVK = { add: 'sub', sub: 'add', mul: 'div', div: 'mul' };
  for (const f of FORMS) {
    f.eq = parseEq(f.s);
    f.inv = f.fwd.slice().reverse().map(o => ({ ...o, kind: INVK[o.kind] }));

  /* ---------- the picture: pans, bags and blocks ---------- */
  const SERIF = '"STIX Two Text", "Cambria Math", "Times New Roman", serif';
  const SANS = '"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif';
  const rr = (c, x, y, w, hh, r) => {
    r = Math.min(r, w / 2, hh / 2);
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + hh, r); c.arcTo(x + w, y + hh, x, y + hh, r);
    c.arcTo(x, y + hh, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  };
  const isLetter = ch => /[A-Za-z]/.test(ch);
  /* math text: letters in italic serif, everything else upright sans. The letter o.hot is drawn in o.hotCol. */
  const mtext = (c, pal, s, x, y, o = {}) => {
    let size = o.size || 24;
    const font = (it, sz) => (it ? `italic ${sz}px ${SERIF}` : `500 ${sz * .9}px ${SANS}`);

    let w = measure(size);

    let px = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
