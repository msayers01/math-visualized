        set: { mode: 'set', sit: 'tickets', k: 1, ratio: 0, ev: 0, tri: 0 } },
      { title: 'Use the unit rate to fill a table',
        text: String.raw`<p>Once you know k, you can fill in any missing entry. Read k from the y ÷ x row, then choose the answer.</p><p>To get y from x, multiply by k. To get x from y, divide by k. Every choice shows where its point lands on the graph.</p>`,
        set: { mode: 'fill', qi: 0, k: 3, ratio: 1, ev: 0, tri: 0 } },
      { title: 'Proportional or not?',
        text: String.raw`<p>Two tests. <b>Table:</b> y ÷ x is the same number in every column. <b>Graph:</b> the dots lie on a straight line through the origin (0, 0).</p><p>Each question shows only a table, a graph or words. Decide, then read why. The switches let you test it yourself.</p>`,
        set: { mode: 'decide', qi: 0, k: 3, ratio: 0, ev: 0, tri: 0 } },
      { title: 'One relationship, four forms',
        text: String.raw`<p>Words, a table, a graph and an equation can describe the same proportional relationship. Each question shows one form. Choose the form that matches.</p><p>Watch the graph when it appears: 1 step right goes up k. That unit rate k is the steepness of a line through the origin. In Grade 8 you will call it the <b>slope</b>.</p>`,
        set: { mode: 'trans', qi: 0, k: 3, ratio: 0, ev: 0, tri: 0 } }
    ],
    formal: String.raw`
      <p><b>Definition.</b> Two quantities \(x\) and \(y\) are in a <em>proportional relationship</em> if the ratio \(y \div x\) is the same number for every pair (with \(x \neq 0\)). Call that number \(k\):
      \[ \frac{y}{x} = k \qquad\text{or, the same thing,}\qquad y = kx. \]
      The number \(k\) is the <em>constant of proportionality</em>. It is also the <em>unit rate</em>: how much \(y\) there is for each 1 of \(x\). Here \(x\) is the independent variable (the one you choose) and \(y\) is the dependent variable (it depends on \(x\)).</p>
      <h3>Four ways to show one relationship</h3>
      <p>Take "a movie ticket costs $3". <b>Words:</b> 3 dollars for each ticket. <b>Table:</b> \(x = 1, 2, 3, 4\) gives \(y = 3, 6, 9, 12\). <b>Graph:</b> the points \((1,3)\), \((2,6)\), \((3,9)\), \((4,12)\) lie on a straight line through \((0,0)\). <b>Equation:</b> \(y = 3x\). You can start from any one of these and find the other three.</p>
      <h3>Finding the unit rate</h3>
      <p><b>From words:</b> it is the amount "for each 1". <b>From a table:</b> divide any \(y\) by its \(x\). If the pair is \((6, 9)\), then \(k = 9 \div 6 = 1.5\). <b>From a graph:</b> read the height at \(x = 1\), or divide \(y\) by \(x\) at any point on the line. <b>From an equation:</b> it is the number that multiplies \(x\) in \(y = kx\).</p>
      <p>The unit rate can be a decimal or a fraction, and it can be less than 1. A recipe that uses 0.5 cup of sugar for each batch has \(y = 0.5x\) and \(k = 0.5\).</p>
      <h3>Testing for a proportional relationship</h3>
      <p><b>Table test.</b> Work out \(y \div x\) in every column. If the answers are all equal, the relationship is proportional. Test every column, not only the first two.</p>
      <p><b>Graph test.</b> Plot the pairs. The relationship is proportional when the points lie on a straight line that goes through \((0,0)\). Both parts are needed. A straight line that misses the origin fails, and so does a curve that passes through the origin.</p>
      <h3>When it is not proportional</h3>
      <p>A taxi charges $3 to start and $2 for each kilometer, so \(y = 2x + 3\). The pairs \((1,5)\), \((2,7)\), \((3,9)\), \((6,15)\) give \(y \div x = 5,\ 3.5,\ 3,\ 2.5\). The ratios change, and the line crosses the y-axis at 3, not at 0. In general, for \(y = mx + b\) with \(b \neq 0\),
      \[ \frac{y}{x} = m + \frac{b}{x}, \]
      which changes as \(x\) changes. A quick check: a proportional relationship always has \(y = 0\) when \(x = 0\). The taxi, a plant that is already 10 cm tall, and a membership with a joining fee all start above 0, so none of them is proportional.</p>
      <p>Going up by the same amount each time is not enough, because the taxi does that. A bulk discount fails in a different way: the pairs \((1,4)\), \((2,8)\), \((4,12)\), \((8,16)\) give \(y \div x = 4,\ 4,\ 3,\ 2\), and the points do not lie on a line at all.</p>
      <h3>The unit rate and the line</h3>
      <p>If \(y = kx\), then \((0,0)\) and \((1,k)\) are both on the line. So for every 1 step to the right, the line goes up \(k\). A bigger \(k\) gives a steeper line, and \(k = 0\) gives a flat one. When you move the unit-rate point on a graph, the line turns about the origin. This steepness has a name: in Grade 8 you will see that the unit rate of a proportional relationship is the <em>slope</em> of a line through the origin.</p>`,
    check: [
      { q: String.raw`A table shows these pairs \((x, y)\): \((1, 5)\), \((2, 7)\), \((3, 9)\), \((4, 11)\). Is \(y\) proportional to \(x\)?`,
        choices: ['Yes, because y goes up by 2 each time.', 'Yes, because the points lie on a straight line.',
                  String.raw`No, because \(y \div x\) is 5, 3.5, 3 and 2.75. The ratios are not all equal.`, 'No, because y is always bigger than x.'], answer: 2,
        why: String.raw`\(y \div x\) is \(5, 3.5, 3, 2.75\), not the same each time. The points do lie on a straight line (\(y\) goes up by 2 each time), but the line crosses the y-axis at 3, not at \((0,0)\). A proportional relationship needs equal ratios.`,
        hint: String.raw`Divide each \(y\) by its \(x\). Are all four answers the same?` },
      { q: String.raw`Let \(x\) be the number of hours worked and \(y\) the pay in dollars. The graph of the pay is a straight line through \((0, 0)\) and \((4, 10)\). Which equation matches?`,
        choices: [String.raw`\(y = 4x\)`, String.raw`\(y = 0.4x\)`, String.raw`\(y = x + 6\)`, String.raw`\(y = 2.5x\)`], answer: 3,
        why: String.raw`The unit rate is the pay for 1 hour: \(y \div x = 10 \div 4 = 2.5\). So \(y = 2.5x\). Check with \((4, 10)\): \(2.5 \times 4 = 10\). The value \(0.4\) is \(4 \div 10\), which is hours per dollar, the unit rate upside down.`,
        hint: String.raw`The unit rate is \(y \div x\) at any point on the line. Which number goes on top?` }
    ],
    links: { prereq: ['unit-rates-and-best-buys'], next: ['slope-and-linear-functions'], related: ['forms-of-a-linear-equation', 'what-is-a-function', 'scatter-plots-and-lines-of-fit', 'ratios-and-equivalent-ratios'] },

    mount({ stage, controls: C }) {
      stage.classList.add('split');
      stage.style.minHeight = '560px';
      const top = h('div', { class: 'pane', style: 'flex: 12 1 0' }), bot = h('div', { class: 'pane', style: 'flex: 19 1 0' });
      stage.append(top, bot);
      const PT = new Plane(top), PG = new Plane(bot);

      /* st: numbers the steps animate (the student's k, and fades for the extra rows and marks) */
      const st = { k: 1, ratio: 0, ev: 0, tri: 0 };
      const want = { ratio: 0, ev: 0, tri: 0 };   /* where each switch is heading, so a fade does not flip it back */
      let mode = 'set', sid = 'tickets', qi = 0, cancel = () => {};
      const tk = { solved: false, cand: null, msg: '', first: null, btns: [] };   /* the current question */
      const score = [];
      const cur = () => SIT[sid];
      const QS = () => mode === 'fill' ? FILL : mode === 'decide' ? DEC : mode === 'trans' ? TRN : null;
      const qNow = () => { const b = QS(); return b ? b[qi] : null; };
      const win = () => (mode === 'fill' && FILL[qi].win) || cur().win;
      const matched = () => { const S = cur(); return S.prop && S.xs.every((x, i) => same(st.k * x, S.ys[i])); };

      /* what is visible in each activity */
      const V = () => {
        const q = qNow(), d = tk.solved;
        if (mode === 'set') return { words: 1, table: 1, graph: 1, eq: 'you', line: 'you', lineRow: 1, ratio: st.ratio, ev: 0, tri: st.tri, handle: 1 };
        if (mode === 'fill') return { words: 1, table: 1, graph: 1, eq: d ? 'true' : null, line: 'true', lineRow: 0, ratio: 1, ev: 0, tri: d ? 1 : 0 };
        if (mode === 'decide') {
          const g = q.view;
          return { words: d || g !== 'graph', table: d || g === 'all' || g === 'table', graph: d || g === 'all' || g === 'graph',
            eq: d ? 'true' : null, line: null, lineRow: 0, ratio: st.ratio, ev: st.ev, tri: 0, verdict: d };
        }
        const g = q.given, gr = d || g === 'graph';
        return { words: d || g === 'words', table: d || g === 'table', graph: gr, eq: d || g === 'eq' ? 'true' : null,
          line: gr ? 'true' : null, lineRow: 0, ratio: d ? 1 : 0, ev: 0, tri: gr ? 1 : 0 };
      };

      /* the columns of the table (and the dots on the graph) */
      const colsFor = () => {
        const S = cur(), q = qNow();
        if (mode === 'fill') {
          const base = S.xs.slice(0, 4).map((x, i) => ({ x, y: S.ys[i] }));
          const ask = q.find === 'y' ? { x: q.x, y: null, ask: 'y' } : { x: null, y: q.y, ask: 'x' };
          ask.val = tk.solved ? q.ans : tk.cand;
          return base.concat(ask);
        }
        const n = mode === 'trans' && q.n ? q.n : S.xs.length;
        return S.xs.slice(0, n).map((x, i) => ({ x, y: S.ys[i] }));
      };

      /* ---------- graph geometry: a window with its own scale on each axis ---------- */
      const geo = p => {
        const w = win(), L = clamp(p.w * .105, 34, 50), R = 18, T = 34, B = 42;
        return { w, L, R, T, B, pw: Math.max(10, p.w - L - R), ph: Math.max(10, p.h - T - B) };
      };
      PG.X = x => { const g = geo(PG); return g.L + x / g.w.x * g.pw; };
      PG.Y = y => { const g = geo(PG); return g.T + g.ph - y / g.w.y * g.ph; };
      PG.toMath = (px, py) => { const g = geo(PG); return [(px - g.L) / g.pw * g.w.x, (g.T + g.ph - py) / g.ph * g.w.y]; };

      /* ---------- top pane: words, table, equation ---------- */
      PT.onDraw = (c, p) => {
        const pal = p.pal, W = p.w, H = p.h, S = cur(), v = V(), pad = clamp(W * .04, 16, 20);
        const f = clamp(Math.min(W / 27, H / 11.5), 12, 17), lh = f * 1.32;
        const hid = (x, y, w, hh, label) => {
          c.save(); c.strokeStyle = pal['grid-strong']; c.lineWidth = 1.5; c.setLineDash([5, 5]); rrect(c, x, y, w, hh, 8); c.stroke(); c.restore();
          tx(c, pal, label, x + w / 2, y + hh / 2, { size: f * .9, color: pal.muted, align: 'center' });
        };
        let y = pad + 2;
        c.font = `500 ${f}px ${SANS}`;
        if (v.words) {
          const lines = wrap(c, S.words, W - 2 * pad);
          lines.forEach((s, i) => tx(c, pal, s, pad, y + lh * (i + .5), { size: f }));
          y += lines.length * lh;
          tx(c, pal, 'x = ' + S.xName + ',  y = ' + S.yName, pad, y + lh * .45, { size: f * .86, color: pal.muted });
          y += lh * .95;
        } else { y += 6; hid(pad + 8, y, W - 2 * pad - 16, lh + 4, 'The description is hidden for now'); y += lh + 4 + lh * .5; }

        const eqH = lh * 1.35, eqY = H - pad - eqH / 2;
        const cols = colsFor(), n = cols.length;
        const xv = cols.map(q => q.ask === 'x' ? q.val : q.x), yv = cols.map(q => q.ask === 'y' ? q.val : q.y);
        const rows = [{ lab: 'x', col: pal.green, f: i => xv[i] }, { lab: 'y', col: pal.red, f: i => yv[i] }];
        if (v.table && v.ratio > .01) rows.push({ lab: 'y ÷ x', col: pal.violet, ratio: true, a: v.ratio,
          f: i => xv[i] == null || yv[i] == null ? null : xv[i] === 0 ? NaN : yv[i] / xv[i] });
        if (v.table && v.lineRow) rows.push({ lab: 'k × x', col: pal.blue, line: true, f: i => xv[i] == null ? null : st.k * xv[i] });
        const yT = y + 2, yB = H - pad - eqH - 4, area = yB - yT;
        const rowH = clamp(area / rows.length, 18, 38), tH = rowH * rows.length, ty = yT + (area - tH) / 2;
        const lw = Math.max(48, f * 3.7), cw = clamp((W - 2 * pad - lw) / n, 34, 92), tw = lw + cw * n, x0 = (W - tw) / 2;

        if (!v.table) hid(pad, ty, W - 2 * pad, tH, 'The table is hidden for now');
        else {
          cols.forEach((q, i) => { if (q.ask) { c.fillStyle = alpha(pal.yellow, tk.solved ? .14 : .22); c.fillRect(x0 + lw + i * cw + 2, ty, cw - 4, tH); } });
          rows.forEach((r, ri) => {
            const cy = ty + (ri + .5) * rowH, a = r.a == null ? 1 : r.a;
            c.globalAlpha = a;
            if (r.ratio) { c.fillStyle = alpha(pal.violet, .1); c.fillRect(x0, ty + ri * rowH, tw, rowH); }
            if (ri) { c.strokeStyle = pal.grid; c.lineWidth = 1; c.beginPath(); c.moveTo(x0, ty + ri * rowH); c.lineTo(x0 + tw, ty + ri * rowH); c.stroke(); }
            tx(c, pal, r.lab, x0 + lw - 10, cy, { size: f, color: r.col, weight: 700, align: 'right' });
            cols.forEach((q, i) => {
              const val = r.f(i), cx = x0 + lw + (i + .5) * cw;
              if (r.line && val != null && yv[i] != null) { c.fillStyle = alpha(same(val, yv[i]) ? pal.green : pal.red, .2); c.fillRect(x0 + lw + i * cw + 2, ty + ri * rowH + 2, cw - 4, rowH - 4); }
              const unknown = val === null, cand = q.ask && !tk.solved && val != null && ((r.lab === 'y' && q.ask === 'y') || (r.lab === 'x' && q.ask === 'x'));
              if (cand) { c.save(); c.strokeStyle = pal.muted; c.lineWidth = 1.5; c.setLineDash([4, 4]); rrect(c, x0 + lw + i * cw + 5, ty + ri * rowH + 3, cw - 10, rowH - 6, 6); c.stroke(); c.restore(); }
              const s = unknown ? '?' : Number.isNaN(val) ? '–' : num(val);
              tx(c, pal, s, cx, cy, { size: f * 1.05, weight: unknown || (q.ask && r.lab !== 'x' && r.lab !== 'y') ? 700 : 600, align: 'center', color: unknown ? pal.text : Number.isNaN(val) ? pal.muted : r.line ? pal.blue : r.col });
            });
            c.globalAlpha = 1;
          });
          c.strokeStyle = pal['grid-strong']; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0 + lw, ty); c.lineTo(x0 + lw, ty + tH); c.stroke();
        }

        /* the equation */
        if (v.eq === 'you') {
          tx(c, pal, 'Your line:', pad, eqY, { size: f * .9, color: pal.muted });
          c.font = `500 ${f * .9}px ${SANS}`;
          const w1 = c.measureText('Your line:').width + 10, w2 = mt(c, pal, linEq(st.k, 0), pad + w1, eqY, { size: f * 1.1, color: pal.blue, weight: 600 });
          const D = S.xs.map((x, i) => [x, S.ys[i]]), hit = D.filter(([x, y2]) => same(st.k * x, y2)).length;
          const msg = matched() ? ['matches every dot', pal.green] : S.prop ? [(D.some(([x, y2]) => st.k * x > y2) ? 'above' : 'below') + ' the dots', pal.red] : ['reaches ' + hit + ' of ' + D.length + ' dots', pal.red];
          tx(c, pal, msg[0], pad + w1 + w2 + 14, eqY, { size: f * .9, color: msg[1], weight: 700 });
        } else if (v.eq === 'true') {
          tx(c, pal, 'Equation:', pad, eqY, { size: f * .9, color: pal.muted });
          c.font = `500 ${f * .9}px ${SANS}`;
          const w1 = c.measureText('Equation:').width + 10, w2 = mt(c, pal, S.eq, pad + w1, eqY, { size: f * 1.1, color: pal.blue, weight: 600 });
          const note = S.prop ? 'unit rate k = ' + num(S.k) : S.lin ? 'not of the form y = kx' : '';
          if (note) tx(c, pal, note, pad + w1 + w2 + 14, eqY, { size: f * .9, color: pal.muted });
        } else hid(pad, eqY - eqH / 2 + 2, Math.min(W - 2 * pad, 260), eqH - 4, 'The equation is hidden for now');
      };

      /* ---------- bottom pane: the graph ---------- */
      PG.onDraw = (c, p) => {
        const pal = p.pal, g = geo(p), w = g.w, S = cur(), v = V(), q = qNow();
        const fs = clamp(Math.min(p.w, p.h) / 24, 11.5, 14.5), dr = clamp(fs * .5, 5.5, 7.5);
        const X = x => p.X(x), Y = y => p.Y(y), bx = g.L + g.pw, by = g.T + g.ph;
        let xs = w.xs, ys = w.ys;
        while (g.pw / (w.x / xs) < 30) xs *= 2;
        while (g.ph / (w.y / ys) < 22) ys *= 2;

        c.lineWidth = 1; c.strokeStyle = pal.grid; c.beginPath();
        for (let x = xs; x <= w.x + 1e-9; x += xs) { c.moveTo(X(x), g.T); c.lineTo(X(x), by); }
        for (let y = ys; y <= w.y + 1e-9; y += ys) { c.moveTo(g.L, Y(y)); c.lineTo(bx, Y(y)); }
        c.stroke();
        c.strokeStyle = pal['grid-strong']; c.lineWidth = 2; c.beginPath(); c.moveTo(g.L, g.T - 4); c.lineTo(g.L, by); c.lineTo(bx + 4, by); c.stroke();
        for (let x = xs; x <= w.x + 1e-9; x += xs) {
          const one = same(x, 1) && v.tri > .3 && v.graph;
          tx(c, pal, num(x), X(x), by + 14, { size: fs, color: one ? pal.green : pal.muted, align: 'center', weight: one ? 700 : 500 });
        }
        for (let y = ys; y <= w.y + 1e-9; y += ys) tx(c, pal, num(y), g.L - 8, Y(y), { size: fs, color: pal.muted, align: 'right' });
        tx(c, pal, '0', g.L - 8, by + 14, { size: fs, color: pal.muted, align: 'right' });
        const named = v.words;
        tx(c, pal, named ? 'x = ' + S.xName : 'x', bx - 14, p.h - 9, { size: fs, color: pal.green, align: 'right', weight: 600 });
        tx(c, pal, named ? 'y = ' + S.yName : 'y', 8, 13, { size: fs, color: pal.red, weight: 600 });

        if (!v.graph) {
          const label = 'The graph is hidden for now';
          c.font = `500 ${fs * 1.1}px ${SANS}`;
          const lw = c.measureText(label).width + 28;
          c.save(); c.fillStyle = alpha(pal.stage, .92); rrect(c, g.L + g.pw / 2 - lw / 2, g.T + g.ph / 2 - 16, lw, 32, 8); c.fill();
          c.strokeStyle = pal['grid-strong']; c.lineWidth = 1.5; c.setLineDash([5, 5]); c.stroke(); c.restore();
          tx(c, pal, label, g.L + g.pw / 2, g.T + g.ph / 2, { size: fs * 1.1, color: pal.muted, align: 'center' });
          return;
        }

        const cols = colsFor(), pts = cols.filter(q2 => !q2.ask);
        c.save(); c.beginPath(); c.rect(g.L - 2, g.T - 2, g.pw + 4, g.ph + 4); c.clip();

        /* evidence for the proportional test: the dots joined, extended back to x = 0 */
        if (v.ev > .01) {
          c.globalAlpha = v.ev;
          if (S.lin) p.path([[0, S.b], [w.x, S.b + S.k * w.x]], { stroke: pal.blue, width: 3, dash: [9, 6] });
          else p.path(S.xs.map((x, i) => [x, S.ys[i]]), { stroke: pal.blue, width: 3, dash: [9, 6] });
          c.globalAlpha = 1;
        }
        /* the line: the student's, or the true one */
        if (v.line === 'you') p.path([[0, 0], [w.x, st.k * w.x]], { stroke: pal.blue, width: 3.5 });
        else if (v.line === 'true' && S.lin) p.path([[0, S.b], [w.x, S.b + S.k * w.x]], { stroke: pal.blue, width: 3.5 });
        /* the step: 1 across, k up */
        if (v.tri > .01) {
          const k = v.line === 'you' ? st.k : S.k;
          c.globalAlpha = v.tri;
          p.path([[0, 0], [1, 0]], { stroke: pal.green, width: 4.5 });
          p.path([[1, 0], [1, k]], { stroke: pal.red, width: 4.5 });
          c.globalAlpha = 1;
        }
        c.restore();

        if (v.tri > .01 && !v.handle) {
          const k = S.k;
          p.label(num(k), 1, k / 2, { size: fs * 1.15, italic: false, color: pal.red, align: 'left', dx: 10, alpha: v.tri });
        }
        /* origin and intercept marks */
        if (v.ev > .01) {
          c.globalAlpha = v.ev;
          p.dot(0, 0, 9, null, pal.violet, 3);
          if (S.lin && S.b) {
            p.dot(0, S.b, 6.5, pal.yellow, pal.stage, 2);
            p.label('(0, ' + num(S.b) + ')', 0, S.b, { size: fs * 1.1, italic: false, align: 'left', dx: 13, dy: 17 });
          }
          c.globalAlpha = 1;
        }
        if (v.verdict) tx(c, pal, S.verdict || 'A straight line through (0, 0)', g.L + 12, g.T + 16, { size: fs * 1.1, color: S.prop ? pal.green : pal.red, weight: 700, halo: true });

        /* the dots (a ring marks the ones the student's line reaches) */
        if (v.handle) pts.forEach(q2 => { if (same(st.k * q2.x, q2.y)) p.dot(q2.x, q2.y, dr + 5, null, pal.green, 3); });
        pts.forEach(q2 => p.dot(q2.x, q2.y, dr, pal.yellow, pal.stage, 2));

        /* the question point in the fill activity */
        if (mode === 'fill') {
          const val = tk.solved ? q.ans : tk.cand, ax = q.find === 'y' ? q.x : val, ay = q.find === 'y' ? val : q.y;
          if (val == null) {
            c.save(); c.setLineDash([6, 6]); c.strokeStyle = pal.muted; c.lineWidth = 1.5; c.beginPath();
            if (q.find === 'y') { c.moveTo(X(q.x), by); c.lineTo(X(q.x), g.T); } else { c.moveTo(g.L, Y(q.y)); c.lineTo(bx, Y(q.y)); }
            c.stroke(); c.restore();
            if (q.find === 'y') tx(c, pal, 'x = ' + num(q.x), X(q.x), g.T + 10, { size: fs, color: pal.muted, align: 'center', halo: true });
            else tx(c, pal, 'y = ' + num(q.y), bx - 6, Y(q.y) - 11, { size: fs, color: pal.muted, align: 'right', halo: true });
          } else if (ax <= w.x && ay <= w.y) {

            if (tk.solved) p.dot(ax, ay, dr + 2, pal.yellow, pal.green, 3);
            else { p.dot(ax, ay, dr + 1, alpha(pal.stage, .9), pal.muted, 2.5); }
            const lab = '(' + num(ax) + ', ' + num(ay) + ')', left = ax > w.x * .6;
            p.label(lab, ax, ay, { size: fs * 1.1, italic: false, align: left ? 'right' : 'left', dx: left ? -12 : 12, dy: -15 });
          } else {
            const right = ax > w.x, px = right ? bx - 8 : clamp(X(ax), g.L + 10, bx - 10), py = right ? clamp(Y(ay), g.T + 10, by - 10) : g.T + 8;
            c.fillStyle = pal.muted; c.beginPath();
            if (right) { c.moveTo(px + 6, py); c.lineTo(px - 6, py - 7); c.lineTo(px - 6, py + 7); } else { c.moveTo(px, py - 6); c.lineTo(px - 7, py + 6); c.lineTo(px + 7, py + 6); }
            c.closePath(); c.fill();
            tx(c, pal, '(' + num(ax) + ', ' + num(ay) + ') is off the graph', clamp(px, 150, p.w - 16), right ? py + 16 : py + 20, { size: fs, color: pal.muted, align: 'right', halo: true });
          }
        }

        /* the unit-rate handle */
        if (v.handle) {
          p.dot(1, st.k, 11.5, alpha(pal.stage, .9), pal.brass, 3.2); p.dot(1, st.k, 4.5, pal.blue);
          /* put the label where it hits the fewest of: the axes, the line and the dots */

            const x0 = hx + dx - (al === 'center' ? lw / 2 : al === 'right' ? lw : 0), x1 = x0 + lw, y0 = hy + dy - lhh / 2, y1 = hy + dy + lhh / 2;
            let pen = ci * .1;
            if (x0 < g.L + 3 || x1 > bx || y0 < g.T || y1 > by - 3) pen += 10;
            for (let t = 0; t <= 8; t++) { const px = x0 + (x1 - x0) * t / 8, ly = Y(st.k * ((px - g.L) / g.pw * w.x)); if (ly > y0 - 4 && ly < y1 + 4) pen += 4; }
            pts.forEach(q2 => { if (X(q2.x) > x0 - 7 && X(q2.x) < x1 + 7 && Y(q2.y) > y0 - 7 && Y(q2.y) < y1 + 7) pen += 6; });
            if (!best || pen < best.pen) best = { pen, dx, dy, al };
          });

      /* ---------- the panel ---------- */
      const probe = C.readout(), host = probe.parentElement; probe.remove();
      const grp = () => h('div', { style: 'display:flex;flex-direction:column;gap:16px' });

      const hintEl = h('p', { class: 'hint' });

      const selSit = C.select({ label: 'Situation', value: sid, options: ORDER.map(id => ({ value: id, label: SIT[id].name })),
        onChange: v => { cancel(); sid = v; st.ratio = 0; want.ratio = 0; sync(); } });
      gSet.append(selSit.parentElement);
      const kS = C.slider({ label: 'Unit rate k (the height at x = 1)', min: 0, max: KMAX, step: KSTEP, value: st.k, format: v => num(v), onInput: v => editK(v) });
      gSet.append(host.lastElementChild);
      const fade = key => on => { cancel(); want[key] = on ? 1 : 0; cancel = animateTo(st, { [key]: on ? 1 : 0 }, 300, sync); };
      const tgRatio = C.toggle({ label: 'Show the y ÷ x row', value: false, onChange: fade('ratio') });
      const tgEv = C.toggle({ label: 'Connect the dots and extend to x = 0', value: false, onChange: fade('ev') });
      const tgTri = C.toggle({ label: 'Show 1 across and k up', value: false, onChange: fade('tri') });

      const reveal = () => { try { (tk.solved ? gNext : fb).scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' }); } catch (e) {} };
      const say = (okk, html) => { tk.msg = (okk ? good('Right. ') : bad('Not quite. ')) + html; };

      /* the feedback while the student sets k */
      const fbSet = () => {
        const S = cur(), k = st.k, kk = num(k), D = S.xs.map((x, i) => [x, S.ys[i]]), n = D.length;
        const hit = D.filter(([x, y]) => same(k * x, y)).length;
        if (S.prop) {
          if (hit === n) return good('The line goes through every dot.') + ` The ringed point is at (1, ${kk}), so k = ${kk}: ${kk} ${S.yU} for 1 ${S.xOne}.` +
            `<br><span class="k">Table</span> y ÷ x is ${kk} in every column.<br><span class="k">Graph</span> the line is ${kk} high at x = 1 and goes through (0, 0).` +
            `<br><span class="k">Equation</span> ${linEq(k, 0)}. Turn on "Show 1 across and k up" to see k on the graph.`;
          const [x, y] = D.find(([x2, y2]) => !same(k * x2, y2)), up = k * x > y;
          return bad(`Your line is ${up ? 'above' : 'below'} the dots.`) + ` At x = ${num(x)} it says y = ${num(k * x)}, but the dot says y = ${num(y)}. ${up ? 'Lower' : 'Raise'} the ringed point.` +
            `<br><span class="k">It goes through ${hit} of ${n} dots. ${want.ratio ? 'Tip: the y ÷ x row shows k.' : 'Tip: switch on "Show the y ÷ x row" to read k from the table.'}</span>`;
        }

      const renderFb = () => { fb.innerHTML = mode === 'set' ? fbSet() : (tk.msg || `<span class="k">${IDLE[mode]}</span>`); };

      const hints = () => {

      };
      const tools = () => {
        const dv = mode === 'decide' ? (tk.solved ? 'all' : DEC[qi].view) : null;

        rowEv.style.display = dv === 'all' || dv === 'graph' ? '' : 'none';

      };

      const sync = () => {

      };
      const editK = v => {
        cancel(); st.k = clamp(v, 0, KMAX);

      };

      /* ---------- the questions ---------- */
      const mkBtn = (inner, onclick, style = '') => {
        const b = h('button', { type: 'button', class: 'btn', style: 'justify-content:flex-start;text-align:left;border-radius:10px;width:100%;padding:8px 14px;line-height:1.35;' + style, onclick });

        if (!okk) b.disabled = true;
      };
      const lock = () => tk.btns.forEach(b => { if (!b.dataset.right) b.disabled = true; });
      const resetTk = () => { tk.solved = false; tk.cand = null; tk.msg = ''; tk.first = null; tk.btns = []; };
      const finished = () => { nextBtn.textContent = qi === QS().length - 1 ? 'Start again' : 'Next question'; gNext.style.display = 'flex'; };

      const done = () => {  /* a question was solved: lock the other choices, offer the next one */
        tk.solved = true; lock();
        const S = cur(), last = qi === QS().length - 1;
        if (mode === 'fill' && last) tk.msg += '<br><br>That was the last question. When you know the unit rate, y = kx gives any entry: multiply to go from x to y, and divide to go from y to x.';
        if (mode === 'decide') {
          if (last) tk.msg += `<br><br>You chose correctly on the first try ${score.filter(Boolean).length} of ${DEC.length} times. Remember the two tests: y ÷ x equal in every column, or a straight line through (0, 0).`;
        }
        if (mode === 'trans') {
          tk.msg += `<br><br>Now the other forms appear. They agree: y ÷ x is ${num(S.k)} in every column, the graph is a straight line through (0, 0), and the equation is ${S.eq}.`;

          let inner, style = '';

          else if (q.kind === 'table') { inner = h('span', { style: 'display:block;width:100%;text-align:center' }); inner.innerHTML = `<span style="display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px">${ch.name}</span>` + miniTable(ch.xs, ch.ys, ch.name); style = 'flex:1;padding:8px 4px'; }
          else inner = ch.html;

      const pickChoice = (i, b) => {
        if (tk.solved) return;

      };
      const pickDecide = (val, b) => {
        if (tk.solved) return;
        const q = DEC[qi], okk = val === q.prop;
        if (tk.first === null) { tk.first = okk; score[qi] = okk; }
        mark(b, okk); say(okk, okk ? q.exp : q.trap + '<br><span class="k">' + q.exp + '</span>');
        if (okk) b.dataset.right = '1';
        cancel(); want.ratio = 1; want.ev = 1; cancel = animateTo(st, { ratio: 1, ev: 1 }, 500, sync);
        if (okk) done();
        tools(); sync(); reveal();
      };
      const nextQ = () => {
        cancel();
        const last = qi === QS().length - 1;
        if (last) score.length = 0;
        loadQ(last ? 0 : qi + 1);
      };
      const loadQ = i => {
        qi = i; resetTk(); const q = qNow(); if (q) sid = q.sit;

      };

        mode = m;
        gSet.style.display = m === 'set' ? 'flex' : 'none';

        hit: (px, py) => mode === 'set' && near(PG, 1, st.k, px, py, 24) ? 'k' : null,
        move: (hd, mx, my) => editK(clamp(snap(my, KSTEP), 0, KMAX))
      });

      /* guided steps */
      const apply = (patch, immediate) => {

        if (m !== undefined) {

      setMode('set'); sync();
      return { destroy: () => { cancel(); PT.destroy(); PG.destroy(); }, apply };
    }
  });

    formal: String.raw`
      <h3>Percent means "per 100"</h3>
      <p>The word <em>percent</em> means "for each hundred". So \(35\%\) is \(35\) out of every \(100\):
      \[ 35\% = \frac{35}{100} = 0.35. \]
      A percent is a fraction with denominator \(100\). It is also a decimal with two places.</p>
      <h3>Three quantities</h3>
      <p>Every percent problem has a <em>whole</em> (the amount that is \(100\%\)), a <em>part</em> (some of the whole) and a <em>percent</em> (how big the part is compared with the whole). If you know two of them, you can find the third. A discount, a markup, a tip and a commission are all parts: the whole is the original price, the cost, the bill or the sales.</p>
      <h3>The tape diagram and the double number line</h3>
      <p>Draw the whole as a bar. Put percents along the top line, from \(0\%\) to \(100\%\). Put real amounts (dollars, minutes, points) along the bottom line, from \(0\) to the whole. Each spot on the bar has one number on each line, and \(100\%\) always goes with the whole amount.</p>
      <p>Cut the bar into \(n\) equal pieces. Each piece is \(100\% \div n\) of the bar, and it is the whole \(\div\, n\) in amount. Doing the same thing to both lines keeps them matched. A <em>table of equivalent ratios</em> writes the same matches in rows:</p>
      <table style="border-collapse:collapse;margin:0 0 1em;font-variant-numeric:tabular-nums">
        <tr><th style="text-align:left;padding:4px 14px 4px 0;font-weight:500">percent</th><td style="padding:4px 14px;border-bottom:1px solid var(--line-strong)">100</td><td style="padding:4px 14px;border-bottom:1px solid var(--line-strong)">50</td><td style="padding:4px 14px;border-bottom:1px solid var(--line-strong)">25</td><td style="padding:4px 14px;border-bottom:1px solid var(--line-strong)">5</td><td style="padding:4px 14px;border-bottom:1px solid var(--line-strong)">1</td></tr>
        <tr><th style="text-align:left;padding:4px 14px 4px 0;font-weight:500">dollars</th><td style="padding:4px 14px">60</td><td style="padding:4px 14px">30</td><td style="padding:4px 14px">15</td><td style="padding:4px 14px">3</td><td style="padding:4px 14px">0.60</td></tr>
      </table>
      <p>Every column is the same ratio: divide both numbers in a column by the same number (here \(2\), then \(2\), then \(5\), then \(5\)) to get the next one. The third column says that \(25\%\) of \(\$60\) is \(\$15\).</p>
      <h3>Finding the part</h3>
      <p>Part \(=\) percent (as a decimal) \(\times\) whole. For \(25\%\) of \(\$60\): cut into \(4\) pieces to get \(60 \div 4 = 15\), or compute \(0.25 \times 60 = 15\).</p>
      <p>When the percent is not a whole number of big pieces, build it. For \(35\%\) of \(\$80\): \(10\%\) is \(80 \div 10 = 8\), so \(30\%\) is \(3 \times 8 = 24\). Half of \(10\%\) is \(5\%\), which is \(4\). Then \(35\% = 24 + 4 = \$28\). For \(12\%\) of \(\$200\), find \(1\%\) first: \(200 \div 100 = 2\), so \(12\% = 12 \times 2 = \$24\).</p>
      <h3>Finding the percent</h3>
      <p>Percent \(= \dfrac{\text{part}}{\text{whole}} \times 100\%\). For \(\$10\) out of \(\$50\): \(10 \div 50 = 0.2\), and \(0.2 \times 100 = 20\), so it is \(20\%\). On the tape, \(50 \div 5 = 10\) shows that \(\$10\) is one of \(5\) equal pieces, and \(100\% \div 5 = 20\%\). The part number is not the percent: the two match only when the whole is \(100\).</p>
      <h3>Finding the whole</h3>
      <p>Whole \(=\) part \(\div\) percent (as a decimal). If \(20\%\) of the bill is \(\$9\): \(9 \div 0.2 = 45\). On the tape, \(20\%\) is \(1\) of \(5\) equal pieces, so the whole is \(5 \times 9 = \$45\). Check by going forward: \(20\%\) of \(45\) is \(9\). Multiplying \(9 \times 20\) gives \(180\), which is too big, because \(20\%\) of \(180\) is \(36\), not \(9\).</p>
      <h3>Discounts, markups, tips and commission</h3>
      <p>A discount takes a part off the price, so you pay \((100 - p)\%\) of it. For \(35\%\) off \(\$80\), the discount is \(\$28\) and you pay \(65\%\) of \(80\), which is \(\$52\). A markup and a tip are added on, so the total is \((100 + p)\%\) of the whole. A \(15\%\) tip on \(\$40\) is \(\$6\), and the total is \(115\%\) of \(40\), which is \(\$46\). A commission is a percent of the sales: \(8\%\) of \(\$300\) is \(\$24\). A percent over \(100\%\) means more than the whole.</p>
      <h3>Fractions, decimals and percents</h3>
      <p>They are three names for one number.</p>
      <ul>
        <li>Percent to decimal: divide by \(100\), which moves the point two places left. \(125\% = 1.25\) and \(7\% = 0.07\).</li>
        <li>Decimal to percent: multiply by \(100\). \(0.6 = 60\%\).</li>
        <li>Fraction to decimal: divide the top by the bottom. \(\dfrac{3}{8} = 3 \div 8 = 0.375\), so \(\dfrac{3}{8} = 37.5\%\).</li>
        <li>Percent to fraction: write it over \(100\) and simplify. \(45\% = \dfrac{45}{100} = \dfrac{9}{20}\).</li>
        <li>More than a whole: \(\dfrac{7}{4} = 1.75 = 175\%\). A fraction such as \(\dfrac{1}{3}\) gives a decimal that never ends, \(0.333\ldots\), so its percent is about \(33.3\%\).</li>
      </ul>
      <h3>Does the answer make sense?</h3>
      <p>Use benchmarks. \(50\%\) is half, \(25\%\) is a quarter, \(10\%\) is a tenth and \(1\%\) is a hundredth. If the percent is less than \(100\%\), the part must be less than the whole. For \(35\%\) of \(\$80\), the percent is between \(25\%\) and \(50\%\), so the answer should be between \(\$20\) and \(\$40\). The answer \(\$28\) fits.</p>`,

      };

      const renderConv = () => {
        const tk = task(), info = cinfo(), out = [];
        liveEl = null; fbEl = null;
        if (!tk) {
          const pos = st.pos, same = info.src === 'frac';
          const L = [];
          if (info.src === 'frac') {
            L.push(kk('Fraction', `${info.num}/${info.den}${info.rd !== info.den ? ` = ${info.frac}` : ''}`));
            L.push(kk('Divide', `${info.num} ÷ ${info.den} = ${info.decT}${info.term ? '' : ' (the digits never stop)'}`));
            L.push(kk('Decimal', info.decT));
            L.push(kk('Percent', `${info.decT} × 100 = ${info.pctT}`));
          } else if (info.src === 'dec') {
            L.push(kk('Decimal', nfmt(pos / 100, 3)));
            L.push(kk('Percent', `${nfmt(pos / 100, 3)} × 100 = ${pcx(pos)}`));
            L.push(kk('Fraction', `${nfmt(pos / 100, 3)} = ${pos}/100${info.rd !== 100 ? ` = ${info.frac}` : ''}`));
          } else {
            L.push(kk('Percent', pcx(pos)));
            L.push(kk('Decimal', `${pos} ÷ 100 = ${nfmt(pos / 100, 3)}`));
            L.push(kk('Fraction', `${pos}/100${info.rd !== 100 ? ` = ${info.frac}` : ''}`));
          }
          if (pos > 100) L.push(`More than 1 whole.${info.rd !== 1 ? ` As a mixed number: ${info.mixed || info.frac}.` : ''}`);
          else if (same && !info.term) L.push(`Rounded, that is about ${nfmt(info.v, 3)} and ${nfmt(info.v * 100, 1)}%.`);
          out.push(h('p', { style: 'margin:0 0 8px;', html: L.join('<br>') }));
          out.push(h('p', { style: 'margin:0;color:var(--muted)', html: 'Set a fraction, a decimal or a percent, or drag the marker. Try the practice questions for a challenge.' }));
          return out;
        }
        out.push(h('p', { style: 'margin:0 0 8px;font-weight:600', html: tk.q }));
        out.push(h('p', { style: 'margin:0', html: `<span class="k">Pick the answer.</span> Each pick shows where it lands on the bar.` }));
        out.push(choiceList(tk.choices.map((ch, i) => ({ label: ch[0], state: st.picks['t' + i], onClick: () => pickTask(i) }))));
        fbEl = h('p', { style: 'margin:6px 0 10px;', html: st.fb }); out.push(fbEl);
        if (st.cvDone) out.push(smallBtn('Next question', () => { cancel(); const nx = (st.task + 1) % TASKS.length; taskSel.value = String(nx + 1); startConvTask(nx); }, true));
        return out;
      };
      const pickTask = i => {
        const tk = task(), ch = tk.choices[i], right = i === tk.right;
        st.picks['t' + i] = right ? 'right' : 'wrong';
        st.ghost = right ? null : { v: ch[1], s: ch[0], ok: false };
        st.fb = (right ? ok('Right.') : no('Not quite.')) + ' ' + ch[2];
        if (right) st.cvDone = true;
        render(); draw();
      };

      const updateRo = () => { if (st.mode === 'conv') render(); };
      const render = () => { ro.replaceChildren(...(st.mode === 'conv' ? renderConv() : renderTape())); };
      const sync = () => {
        modeBtns.forEach((b, i) => { b.className = MODES[i].id === st.mode ? 'btn primary' : 'btn'; b.setAttribute('aria-pressed', MODES[i].id === st.mode); });
        const conv = st.mode === 'conv';
        gTape.style.display = conv ? 'none' : 'flex'; gConv.style.display = conv ? 'flex' : 'none';
        if (conv) {
          fillSel(taskSel, ['Free play', ...TASKS.map(t => t.label)], st.task + 1);
          const free = st.task < 0;
          for (const el of freeCtl) el.style.display = free ? '' : 'none';
          if (free) cvSync();
        } else fillSel(probSel, PR[st.mode].map(q => q.label), st.pi);
        render(); draw();
      };

      /* ---------- guided steps ---------- */
      const apply = (patch, immediate) => {
        cancel();
        const { mode, pi, cut, show, src, n, d, task: tk, ...nums } = patch;
        if (mode === 'conv') {
          Object.assign(st, { mode: 'conv', pi: 0, stage: 0, cut: 0, ext: 0, ans: false, show: false, fb: '', picks: {}, task: tk === undefined ? -1 : tk, ghost: null, cvDone: false });
          if (src !== undefined) st.src = src;
          if (n !== undefined) st.n = n;
          if (d !== undefined) st.d = d;
        } else if (mode !== undefined) {
          Object.assign(st, { mode, pi: pi || 0, stage: show ? 5 : 0, cut: cut || 0, ans: !!show, show: !!show, fb: '', picks: {}, task: -1, ghost: null, cvDone: false });
        }
        const to = {};
        for (const k of ['pos', 'ext']) if (nums[k] !== undefined) to[k] = nums[k];
        if (immediate || !Object.keys(to).length) { Object.assign(st, to); sync(); }
        else { sync(); cancel = animateTo(st, to, 900, () => { if (st.mode === 'conv') cvSync(); draw(); if (st.stage === 5) updateLive(); }); }
      };
      sync();
      return { destroy: () => { cancel(); P.destroy(); }, apply };
    }
  });
}

register({
  id: 'linear-transformations', level: 'ugrad',
  title: 'Linear transformations and eigenvectors',
  blurb: 'See a 2×2 matrix as a motion of the whole plane, and find the directions it only stretches.',
  thumb(c, p) {
    const pal = p.pal, [a, b, cc, d] = [1, .7, .35, 1.1], ap = (x, y) => [a * x + b * y, cc * x + d * y];
    p.span = 2.4; p.grid(1);
    for (let k = -8; k <= 8; k++) {
      p.path([ap(k, -8), ap(k, 8)], { stroke: alpha(pal.blue, .7), width: 1 });
      p.path([ap(-8, k), ap(8, k)], { stroke: alpha(pal.blue, .7), width: 1 });
    }
    p.path([ap(0,0), ap(1,0), ap(1,1), ap(0,1)], { fill: alpha(pal.yellow, .3), stroke: pal.yellow, width: 1.5, close: true });
    p.arrow(0, 0, a, cc, pal.green, 2.5); p.arrow(0, 0, b, d, pal.red, 2.5);
  },
  explain: String.raw`
    <h2>A matrix is a motion of space</h2>
    <p>Every point of the plane is a combination of the two basis vectors \(\hat\imath = (1,0)\) and \(\hat\jmath = (0,1)\). A linear map only needs to decide where those two land. Their images are the columns of the matrix:</p>
    \[ \begin{bmatrix} a & b \\ c & d \end{bmatrix}\begin{bmatrix} x \\ y \end{bmatrix} = x\begin{bmatrix} a \\ c \end{bmatrix} + y\begin{bmatrix} b \\ d \end{bmatrix}. \]
    <p>That is why the grid lines stay straight, parallel, and evenly spaced, and why the origin never moves. Drag the <span class="swatch" style="background:var(--green)"></span> green and <span class="swatch" style="background:var(--red)"></span> red arrows to set the columns directly.</p>
    <h2>The determinant is an area</h2>
    <p>The shaded square starts with area 1. After the map its area is \(|ad-bc|\), and every other region is scaled by the same factor. When \(\det A < 0\) the plane has been flipped over, and when \(\det A = 0\) it has collapsed onto a line or a point.</p>
    <h2>Eigenvectors keep their direction</h2>
    <p>The <span class="swatch" style="background:var(--violet)"></span> violet lines mark directions that the map only stretches or flips: \(A\mathbf v = \lambda \mathbf v\). The eigenvalues solve \(\lambda^2 - (a+d)\lambda + (ad-bc) = 0\). A rotation moves every direction, so its eigenvalues are complex and no violet lines appear.</p>`,
  mount({ stage, controls: C }) {
    const st = { M: [1, 1, 0, 1], t: 0, eig: true };
    let cancel = () => {};
    const cur = () => { const [a, b, c, d] = st.M, t = st.t; return [lerp(1, a, t), lerp(0, b, t), lerp(0, c, t), lerp(1, d, t)]; };
    const P = new Plane(stage, { span: 4.2 });

    P.onDraw = (ctx, p) => {
      const pal = p.pal; p.grid(1);
      const [a, b, c, d] = cur(), ap = (x, y) => [a * x + b * y, c * x + d * y], N = 14;
      for (let k = -N; k <= N; k++) {
        if (k === 0) continue;
        p.path([ap(k, -N), ap(k, N)], { stroke: alpha(pal.blue, .7), width: 1.3 });
        p.path([ap(-N, k), ap(N, k)], { stroke: alpha(pal.blue, .7), width: 1.3 });
      }
      p.path([ap(0, -N), ap(0, N)], { stroke: pal.axis, width: 2 });
      p.path([ap(-N, 0), ap(N, 0)], { stroke: pal.axis, width: 2 });
      p.path([ap(0,0), ap(1,0), ap(1,1), ap(0,1)], { fill: alpha(pal.yellow, .3), stroke: pal.yellow, width: 2, close: true });
      if (st.eig) {
        const e = eig2(a, b, c, d);
        if (e.real) for (const { l, v } of e.list) {
          p.path([[-40 * v[0], -40 * v[1]], [40 * v[0], 40 * v[1]]], { stroke: pal.violet, width: 2.5, dash: [8, 6] });
          const r = p.span * .82;
          p.label('λ = ' + fmt(l), v[0] * r, v[1] * r, { color: pal.violet, size: 17, dy: -14 });
        }
      }
      const det = a * d - b * c, [mx, my] = ap(.5, .5);
      if (Math.abs(det) > .08) p.label('det = ' + fmt(det), mx, my, { size: 15, italic: false });
      p.arrow(0, 0, a, c, pal.green); p.arrow(0, 0, b, d, pal.red);
      p.dot(a, c, 7, pal.green); p.dot(b, d, 7, pal.red);
      p.label('î', a, c, { color: pal.green, size: 22, dx: 16, dy: -12 });
      p.label('ĵ', b, d, { color: pal.red, size: 22, dx: 16, dy: -12 });
      p.dot(0, 0, 3.5, pal.axis);
    };

    const upd = () => {
      const [a, b, c, d] = st.M, det = a * d - b * c, e = eig2(a, b, c, d);
      let eg;
      if (!e.real) eg = `${fmt(e.re)} ± ${e.im.toFixed(2)}i (complex, no real eigenvectors)`;
      else eg = [...new Set(e.list.map(x => fmt(x.l)))].join(', ');
      let note = '';
      if (Math.abs(det) < 1e-6) note = '<br>The plane collapses: the determinant is zero.';
      else if (det < 0) note = '<br>Negative determinant: orientation flips.';
      ro.innerHTML = `<span class="k">Matrix</span> [${fmt(a,1)}, ${fmt(b,1)}; ${fmt(c,1)}, ${fmt(d,1)}]<br>
        <span class="k">det</span> = ${fmt(det)}<br><span class="k">Eigenvalues</span> ${eg}${note}`;
    };
    const sync = () => { S.forEach((s, i) => s.set(st.M[i])); upd(); };
    const animateTo = M => {
      cancel(); st.M = M.slice(); st.t = 0; sync();
      cancel = tween(1600, q => { st.t = ease(q); P.draw(); });
    };

    C.title('Matrix entries');
    C.hint('Columns are where î and ĵ land. You can also drag the arrow tips.');
    const S = ['a (î, x)', 'c (î, y)', 'b (ĵ, x)', 'd (ĵ, y)'].map((label, j) => {
      const i = [0, 2, 1, 3][j];
      return { i, s: C.slider({ label, min: -3, max: 3, step: .1, value: st.M[i], format: v => fmt(v, 1),
        onInput: v => { cancel(); st.M[i] = v; st.t = 1; upd(); P.requestDraw(); } }) };
    }).sort((x, y) => x.i - y.i).map(x => x.s);
    C.title('Examples');
    C.buttons([
      { label: 'Shear', onClick: () => animateTo([1, 1, 0, 1]) },
      { label: 'Rotate 90°', onClick: () => animateTo([0, -1, 1, 0]) },
      { label: 'Stretch', onClick: () => animateTo([2, 1, 1, 2]) },
      { label: 'Reflect', onClick: () => animateTo([-1, 0, 0, 1]) },
      { label: 'Collapse', onClick: () => animateTo([1, 2, .5, 1]) }
    ]);
    C.buttons([{ label: 'Replay from identity', primary: true, onClick: () => animateTo(st.M) }]);
    C.toggle({ label: 'Show eigenvectors', value: true, onChange: v => { st.eig = v; P.requestDraw(); } });
    const ro = C.readout();

    draggable(P, {
      hit: (px, py) => {
        const [a, b, c, d] = cur();
        const di = Math.hypot(P.X(a) - px, P.Y(c) - py), dj = Math.hypot(P.X(b) - px, P.Y(d) - py);
        if (Math.min(di, dj) > 26) return null; return di <= dj ? 'i' : 'j';
      },
      move: (hd, x, y) => {
        cancel(); st.M = cur(); st.t = 1;
        const r = v => Math.round(clamp(v, -3, 3) * 10) / 10;
        if (hd === 'i') { st.M[0] = r(x); st.M[2] = r(y); } else { st.M[1] = r(x); st.M[3] = r(y); }
        sync(); P.requestDraw();
      }
    });
    sync();
    const startT = setTimeout(() => animateTo(st.M), 500);
    return () => { clearTimeout(startT); cancel(); P.destroy(); };
  }
});

/* =====================================================================
   VISUALIZATION 3 — Conformal maps (graduate)
   ===================================================================== */
const Cx = {
  add: ([a, b], [c, d]) => [a + c, b + d],
  sub: ([a, b], [c, d]) => [a - c, b - d],
  mul: ([a, b], [c, d]) => [a * c - b * d, a * d + b * c],
  div: ([a, b], [c, d]) => { const q = c * c + d * d; return [(a * c + b * d) / q, (b * c - a * d) / q]; }
};
const fmtC = ([x, y]) => `${fmt(x)} ${y < 0 ? '−' : '+'} ${Math.abs(y).toFixed(2)}i`;
const MAPS = {
  sq:   { label: 'f(z) = z²', f: z => Cx.mul(z, z), df: z => [2 * z[0], 2 * z[1]], span: 4.4 },
  exp:  { label: 'f(z) = eᶻ', f: ([x, y]) => { const e = Math.exp(x); return [e * Math.cos(y), e * Math.sin(y)]; },
          df: ([x, y]) => { const e = Math.exp(x); return [e * Math.cos(y), e * Math.sin(y)]; }, span: 4.8 },
  inv:  { label: 'f(z) = 1/z', f: z => Cx.div([1, 0], z), df: z => Cx.div([-1, 0], Cx.mul(z, z)), span: 3.2 },
  sin:  { label: 'f(z) = sin z', f: ([x, y]) => [Math.sin(x) * Math.cosh(y), Math.cos(x) * Math.sinh(y)],
          df: ([x, y]) => [Math.cos(x) * Math.cosh(y), -Math.sin(x) * Math.sinh(y)], span: 4.2 },
  jouk: { label: 'f(z) = z + 1/z (Joukowski)', f: z => Cx.add(z, Cx.div([1, 0], z)), df: z => Cx.sub([1, 0], Cx.div([1, 0], Cx.mul(z, z))), span: 3.4 },
  mob:  { label: 'f(z) = (z − i)/(z + i) (Cayley)', f: z => Cx.div([z[0], z[1] - 1], [z[0], z[1] + 1]),
          df: z => { const w = [z[0], z[1] + 1]; return Cx.div([0, 2], Cx.mul(w, w)); }, span: 2.6 }
};

register({
  id: 'conformal-maps', level: 'grad',
  title: 'Conformal maps of the complex plane',
  blurb: 'Watch holomorphic functions bend a grid while every tiny right angle stays a right angle.',
  thumb(c, p) {
    const pal = p.pal, f = MAPS.sq.f; p.span = 3.2;
    for (let k = -6; k <= 6; k++) {
      const v = k * .25 + 1e-4, A = [], B = [];
      for (let i = 0; i <= 80; i++) { const s = -1.5 + 3 * i / 80; A.push(f([v, s])); B.push(f([s, v])); }
      p.curve(A, { stroke: alpha(pal.blue, .85), width: 1 }); p.curve(B, { stroke: alpha(pal.yellow, .85), width: 1 });
    }
  },
  explain: String.raw`
    <h2>Bending without shearing</h2>
    <p>The grid lives in the \(z\)-plane. Moving the slider carries each point \(z\) along the straight path \((1-t)\,z + t\,f(z)\), so at the end you see the image of the grid under \(f\). The curves bend a lot, but wherever <span class="swatch" style="background:var(--blue)"></span> blue meets <span class="swatch" style="background:var(--yellow)"></span> yellow they still cross at right angles.</p>
    <h2>Why angles survive</h2>
    <p>Near a point \(z_0\), a holomorphic function looks like its first-order approximation:</p>
    \[ f(z_0 + h) \approx f(z_0) + f'(z_0)\,h. \]
    <p>Multiplying by the complex number \(f'(z_0) = r e^{i\theta}\) rotates by \(\theta\) and scales by \(r\). Rotations and uniform scalings preserve angles, so tiny squares map to tiny squares. The green and red cross at the probe point shows this directly. The argument fails only where \(f'(z_0) = 0\): try \(z^2\) with the probe at the origin and watch the right angle open to a straight line, because angles double there.</p>
    <h2>Things to look for</h2>
    <p>Under \(e^z\), horizontal lines become rays and vertical lines become circles, which is the logarithm read backwards. The Cayley map \(\frac{z-i}{z+i}\) sends the upper half-plane onto the unit disk, the classic bridge between two models of hyperbolic geometry. The Joukowski map sends circles near the unit circle to airfoil-like shapes, which is how early aerodynamics computed lift.</p>`,
  mount({ stage, controls: C }) {
    const st = { map: 'sq', grid: 'rect', t: 0, z0: [.8, .55] };
    let cancel = () => {};
    const R = 2;
    const P = new Plane(stage, { span: 2.5 });
    const W = z => { const w = MAPS[st.map].f(z), t = st.t; return [lerp(z[0], w[0], t), lerp(z[1], w[1], t)]; };

    const families = () => {
      const A = [], B = [], n = 260;
      if (st.grid === 'rect') {
        for (let k = -8; k <= 8; k++) {
          const v = k * .25 + 1e-4;
          const a = [], b = [];
          for (let i = 0; i <= n; i++) { const s = -R + 2 * R * i / n + 1e-4; a.push([v, s]); b.push([s, v]); }
          A.push(a); B.push(b);
        }
      } else {
        for (let k = 1; k <= 8; k++) {
          const r = k * .25, a = [];
          for (let i = 0; i <= n; i++) { const th = 2 * Math.PI * i / n; a.push([r * Math.cos(th), r * Math.sin(th)]); }
          A.push(a);
        }
        for (let k = 0; k < 24; k++) {
          const th = k * Math.PI / 12 + 1e-4, b = [];
          for (let i = 1; i <= n; i++) { const r = R * i / n; b.push([r * Math.cos(th), r * Math.sin(th)]); }
          B.push(b);
        }
      }
      return { A, B };
    };
    let fam = families();

    P.onDraw = (ctx, p) => {
      const pal = p.pal;
      p.span = lerp(2.5, MAPS[st.map].span, ease(st.t));
      p.grid(1, { color: alpha(pal.grid, .8) });
      const jump = Math.min(p.w, p.h) * .35;
      for (const l of fam.A) p.curve(l.map(W), { stroke: alpha(pal.blue, .85), width: 1.4, maxJump: jump });
      for (const l of fam.B) p.curve(l.map(W), { stroke: alpha(pal.yellow, .85), width: 1.4, maxJump: jump });

      const z0 = st.z0, w0 = W(z0), hh = .22, seg = dir => {
        const pts = []; for (let i = -10; i <= 10; i++) { const s = i / 10 * hh; pts.push(W([z0[0] + s * dir[0], z0[1] + s * dir[1]])); } return pts;
      };
      p.path([z0, w0], { stroke: pal.muted, width: 1.2, dash: [3, 5] });
      p.dot(z0[0], z0[1], 8, null, pal.text, 2);
      p.curve(seg([1, 0]), { stroke: pal.green, width: 4 });
      p.curve(seg([0, 1]), { stroke: pal.red, width: 4 });
      p.dot(w0[0], w0[1], 5, pal.text);
      p.label(MAPS[st.map].label, p.bounds().x0, p.bounds().y1, { size: 18, align: 'left', dx: 32, dy: 36 });
    };

    const upd = () => {
      const m = MAPS[st.map], z = st.z0, fz = m.f(z), d = m.df(z), r = Math.hypot(d[0], d[1]);
      const ang = Math.atan2(d[1], d[0]) * 180 / Math.PI;
      ro.innerHTML = `<span class="k">z₀</span> = ${fmtC(z)}<br><span class="k">f(z₀)</span> = ${isFinite(fz[0]) ? fmtC(fz) : '∞'}<br>` +
        (r < 1e-3 ? `f′(z₀) = 0, so angles are not preserved here.` :
          isFinite(r) ? `<span class="k">Near z₀, f scales by</span> ${r.toFixed(2)} <span class="k">and rotates by</span> ${fmt(ang, 0)}°` : 'f is undefined at z₀.');
    };
    const setBtn = () => { play.textContent = st.t > .5 ? 'Undo the map' : 'Apply the map'; };
    const run = to => {
      cancel(); const from = st.t;
      cancel = tween(2200 * Math.abs(to - from), q => { st.t = lerp(from, to, ease(q)); tS.set(st.t); P.draw(); }, setBtn);
    };

    C.select({ label: 'Function', value: st.map, options: Object.entries(MAPS).map(([value, m]) => ({ value, label: m.label })),
      onChange: v => { st.map = v; upd(); st.t = 0; tS.set(0); run(1); } });
    C.select({ label: 'Grid', value: st.grid, options: [{ value: 'rect', label: 'Rectangular' }, { value: 'polar', label: 'Polar' }],
      onChange: v => { st.grid = v; fam = families(); P.requestDraw(); } });
    const tS = C.slider({ label: 'Progress', min: 0, max: 1, step: .001, value: 0, format: v => Math.round(v * 100) + '%',
      onInput: v => { cancel(); st.t = v; setBtn(); P.requestDraw(); } });
    const [play] = C.buttons([{ label: 'Apply the map', primary: true, onClick: () => run(st.t < .5 ? 1 : 0) }]);
    C.hint('Tap or drag on the canvas to move the probe z₀ (hollow circle). The green and red cross is the image of a tiny plus sign at z₀.');
    const ro = C.readout();

    draggable(P, {
      hit: () => 'probe', hover: () => true,
      move: (_, x, y) => { st.z0 = [clamp(x, -R, R), clamp(y, -R, R)]; upd(); P.requestDraw(); }
    });
    upd();
    const startT = setTimeout(() => run(1), 500);
    return () => { clearTimeout(startT); cancel(); P.destroy(); };
  }
});

          h('a', { class: 'btn', href: '#/level/school' }, 'Browse all topics'))),
      h('div', { class: 'instrument', 'aria-hidden': 'true' },
        h('div', { class: 'inst-item inst-matrix' }, h('span', { class: 'k' }, 'Matrix on screen'), h('span', { class: 'matrix' }, cells)),
        h('div', { class: 'inst-item' }, h('span', { class: 'k' }, 'Determinant'), detEl),
        h('div', { class: 'inst-item' }, h('span', { class: 'k' }, 'Eigenvalues'), eigEl)))));

  /* Lesson finder, then one section per level with lessons grouped by course in curriculum order.
     Filtering only hides rows (thumbnails stay mounted), and the filter state lives in the URL hash. */
  const F = filterFromHash(location.hash), thumbs = [], rows = new Map(), sections = [];
  const levels = h('div', { class: 'wrap levels', id: 'lessons' });
  const empty = h('div', { class: 'finder-empty', hidden: true }, h('p', {}, 'No lessons match these filters.'),
    h('button', { type: 'button', class: 'btn', onclick: () => { Object.assign(F, emptyFilter()); finder.refresh(); apply(); } }, 'Clear filters'));
  for (const [key, L] of Object.entries(LEVELS)) {
    const live = VIZ.filter(v => v.level === key), todo = PLANNED[key].filter(t => !live.some(v => v.id === slug(t))), total = live.length + todo.length;
    const body = h('div', { class: 'level-body' }), groups = [];
    for (const c of COURSES.filter(c => c.level === key)) {
      const items = live.filter(v => v.course === c.id);
      if (!items.length) continue;
      const list = h('ul', { class: 'topics' }), n = h('span', { class: 'n' });
      for (const v of items) {
        const th = h('div', { class: 'thumb', 'aria-hidden': 'true' });
        if (v.thumb) thumbs.push([th, v.thumb]);
        const li = h('li', {}, h('a', { class: 'topic', href: '#/viz/' + v.id },
          th, h('div', { class: 'tt' }, h('span', { class: 't' }, v.title), h('span', { class: 'd' }, v.blurb), LessonTags(v, false, ProgressChip(v).el)),
          h('span', { class: 'go' }, 'Open')));
        rows.set(v.id, li); list.append(li);
      }
      const el = h('section', { class: 'course', 'aria-label': c.name }, h('h3', { class: 'course-head' }, c.name, n), list);
      groups.push({ el, items, n }); body.append(el);
    }
    let planned = null;
    if (todo.length) {
      planned = h('section', { class: 'course', 'aria-label': 'In development' }, h('h3', { class: 'course-head' }, 'In development'),
        h('ul', { class: 'topics' }, todo.map(t => h('li', { class: 'planned' }, h('div', { class: 'topic' },
          h('div', { class: 'thumb empty', 'aria-hidden': 'true' }),
          h('div', { class: 'tt' }, h('span', { class: 't' }, t), h('span', { class: 'd' }, 'In development')),
          h('span', { class: 'go' }, 'Soon'))))));
      body.append(planned);
    }
    const count = h('p', { class: 'count' });
    const el = h('section', { class: 'level lvl-' + key, id: 'level-' + key },
      h('div', { class: 'level-head' },
        h('span', { class: 'numeral', 'aria-hidden': 'true' }, NUMERALS[key]),
        h('div', {}, h('h2', { class: 'display' }, L.name), h('p', { class: 'desc' }, L.desc), count)),
      body);
    levels.append(el); sections.push({ el, live, total, groups, planned, count });
  }
  levels.append(empty);
  const apply = () => {
    const on = filterActive(F); let shown = 0;
    for (const S of sections) {
      let n = 0;
      for (const g of S.groups) {
        let k = 0;
        for (const v of g.items) { const ok = matches(v, F); rows.get(v.id).hidden = !ok; if (ok) k++; }
        g.el.hidden = !k; n += k;
        g.n.textContent = k === g.items.length ? `${k} ${k === 1 ? 'lesson' : 'lessons'}` : `${k} of ${g.items.length}`;
      }
      if (S.planned) S.planned.hidden = on;
      S.el.hidden = on && !n; shown += n;
      S.count.textContent = on ? `${n} of ${S.live.length} lessons shown` : `${S.live.length} of ${S.total} topics ready`;
    }
    empty.hidden = !on || shown > 0;
    const hash = on ? filterToken(F) : '#/';
    if (location.hash !== hash && (on || /^#(find|\/\?)/.test(location.hash))) { try { history.replaceState(null, '', hash); } catch (e) {} }   /* the URL is a convenience; a frame that refuses it must not break filtering */
  };
  const finder = Finder(F, apply);
  app.append(finder.el, levels);
  apply();
  const tPlanes = thumbs.map(([el, fn]) => { const P = new Plane(el, { span: 3 }); P.onDraw = fn; P.draw(); return P; });

  /* hero: a grid cycling through linear maps, with a live readout */
  const P = new Plane(heroCanvas, { span: 3.4, transparent: true });
  const Ms = [[1,0,0,1],[1,1,0,1],[0,-1,1,0],[1.6,.6,.4,1.2],[-1,.5,0,1],[.8,-.9,.9,.8]];
  const hold = 1200, move = 2400, seg = hold + move;
  const matAt = ms => {
    const i = Math.floor(ms / seg) % Ms.length, j = (i + 1) % Ms.length, q = ease(clamp((ms % seg - hold) / move, 0, 1));
    return Ms[i].map((v, k) => lerp(v, Ms[j][k], q));
  };
  const show = ([a, b, c, d]) => {
    [a, b, c, d].forEach((v, i) => { cells[i].textContent = fmt(v); });
    detEl.textContent = fmt(a * d - b * c);
    const e = eig2(a, b, c, d);
    eigEl.textContent = e.real ? [...new Set(e.list.map(x => fmt(x.l)))].join(', ') : `${fmt(e.re)} ± ${e.im.toFixed(2)}i`;
  };
  let M = reduceMotion ? Ms[1] : Ms[0], t0 = null, raf;
  P.onDraw = (ctx, p) => {
    p.cx = p.w > 900 ? -(p.w * .2) / p.scale : 0;
    const pal = p.pal, [a, b, c, d] = M, ap = (x, y) => [a * x + b * y, c * x + d * y], N = 18;
    p.grid(1);
    for (let k = -N; k <= N; k++) {
      p.path([ap(k, -N), ap(k, N)], { stroke: k ? alpha(pal.blue, .7) : pal.axis, width: k ? 1.2 : 2 });
      p.path([ap(-N, k), ap(N, k)], { stroke: k ? alpha(pal.blue, .7) : pal.axis, width: k ? 1.2 : 2 });
    }
    p.path([ap(0,0), ap(1,0), ap(1,1), ap(0,1)], { fill: alpha(pal.yellow, .3), stroke: pal.yellow, width: 2, close: true });
    p.arrow(0, 0, a, c, pal.green); p.arrow(0, 0, b, d, pal.red);
  };
  show(M); P.draw();
  if (!reduceMotion) {
    const loop = now => { if (t0 === null) t0 = now; M = matAt(now - t0); show(M); P.draw(); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
  }
  return () => { cancelAnimationFrame(raf); P.destroy(); tPlanes.forEach(t => t.destroy()); };
}

/* "Standards alignment" section of a lesson page: each tagged benchmark with its full wording. */
function Alignment(v) {
  if (!v.standards.length) return null;
  return h('section', { class: 'align', 'aria-label': 'Standards alignment' }, h('h2', {}, 'Standards alignment'),
    h('p', { class: 'align-note' }, 'Minnesota K\u201312 Academic Standards in Mathematics (2022). Select a code to see every lesson that addresses it.'),
    h('ul', { class: 'align-list' }, v.standards.map(c => {
      const s = strandOf(c), a = anchorOf(c);
      return h('li', { class: 'align-item', 'data-strand': s.id }, StdChip(c, true),
        h('div', {}, h('p', { class: 'bench' }, STANDARDS[c]), h('p', { class: 'anc' }, s.name + ' \u00b7 ' + a.name)));
    })));
}

/* Lesson page. A lesson may use the full format (hook, steps, formal, check, links) or the
   legacy `explain` prose; every part is optional. mount() may return a teardown function
   (legacy) or a scene { destroy, apply(patch, immediate) } that guided steps can drive. */
function renderViz(app, v, startStep = 0) {
  document.title = v.title + ' | Continuum';
  const sib = VIZ.filter(x => x.level === v.level), i = sib.indexOf(v), prev = sib[i - 1], next = sib[i + 1];
  const stage = h('div', { class: 'stage', 'data-coords': '', role: 'img', 'aria-label': 'Interactive visualization: ' + v.title },
    ['tl', 'tr', 'bl', 'br'].map(c => h('span', { class: 'tick ' + c })));
  const panel = h('aside', { class: 'panel', 'aria-label': 'Controls' });
  const body = v.formal != null ? h('div', { class: 'prose' }, h('h2', {}, 'The math'), h('div', { html: v.formal }))
                                : h('div', { class: 'prose', html: v.explain || '' });
  const lede = h('p', { class: v.hook ? 'lede hook' : 'lede', html: v.hook || v.blurb });
  Progress.open(v.id);
  const chip = ProgressChip(v);
  const check = v.check && v.check.length ? QuickCheck(v.check, (n, right) => { Progress.answer(v.id, n, right); chip.update(); }) : null;
  const tickets = v.check && v.check.length ? h('p', { class: 'ticket-links' }, 'Printable exit ticket: ', h('a', { href: ticketToken(v.id, false) }, 'student version'), ' · ', h('a', { href: ticketToken(v.id, true) }, 'with answer key')) : null;
  const conn = v.links ? Connections(v.links, v.id) : null;
  const align = Alignment(v);
  let scene = {};
  const stepper = v.steps && v.steps.length
    ? Stepper(v.steps, (s, k, first) => { if (s.set && scene.apply) scene.apply(s.set, first); }, {
        onStep: (i, first) => { Progress.step(v.id, i); chip.update(); if (!first) { try { history.replaceState(null, '', lessonToken(v.id, i)); } catch (e) {} } },
        tools: [CopyButton('Copy link to this step', () => shareUrl(lessonToken(v.id, stepper.index())), { title: embedded ? 'Copies the end of the link; add it after this page\'s address' : '' })]
      }) : null;
  if (stepper) panel.append(stepper.el);
  const pg = (x, cls, k) => h('a', { class: 'pg ' + cls, href: '#/viz/' + x.id }, h('span', { class: 'k' }, k), h('span', { class: 't' }, x.title));
  app.append(h('article', { class: 'wrap viz lvl-' + v.level },
    h('nav', { class: 'crumbs', 'aria-label': 'Breadcrumb' },
      h('a', { href: '#/' }, 'Continuum'), h('span', { 'aria-hidden': 'true' }, '/'),
      h('a', { class: 'lvl-tag', href: '#/level/' + v.level }, LEVELS[v.level].name)),
    h('header', { class: 'viz-head' }, h('h1', { class: 'display' }, v.title), lede,
      h('div', { class: 'viz-meta' }, h('a', { class: 'tag course', href: '#find~course_' + v.course, title: 'See every ' + COURSE[v.course].name + ' lesson' }, COURSE[v.course].name), LessonTags(v, true, chip.el))),
    h('div', { class: 'workbench' }, stage, panel),
    body, check, tickets, conn, align,
    h('nav', { class: 'pager', 'aria-label': 'More topics' },
      prev ? pg(prev, 'prev', 'Previous') : null, next ? pg(next, 'next', 'Next') : null)));
  typeset(body); if (v.hook) typeset(lede);
  const ret = v.mount({ stage, controls: Controls(panel) });
  scene = typeof ret === 'function' ? { destroy: ret } : (ret || {});
  if (stepper) stepper.start(clamp(startStep, 0, v.steps.length - 1));
  return () => scene.destroy && scene.destroy();
}

/* =====================================================================
   ROUTER
   ===================================================================== */
const app = $('#app'); let teardown = null;
function route() {
  if (teardown) teardown(); teardown = null;
  app.innerHTML = '';
  const r = parseRoute(location.hash), v = r.id && VIZ.find(x => x.id === r.id);
  teardown = r.page === 'viz' && v ? renderViz(app, v, r.step) : r.page === 'ticket' && v ? renderTicket(app, v, r.key)
           : r.page === 'progress' ? renderProgress(app) : renderHome(app);
  const home = !(r.page === 'viz' && v) && !(r.page === 'ticket' && v) && r.page !== 'progress';
  const target = home && r.level ? document.getElementById('level-' + r.level) : home && r.filters ? document.getElementById('finder') : null;
  if (target) requestAnimationFrame(() => target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' }));
  else window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
document.querySelectorAll('.nav a, .wordmark').forEach(a => a.addEventListener('click', e => {
  if (location.hash === a.getAttribute('href')) { e.preventDefault(); route(); }
}));
applyCurriculum();
$('#footStat').textContent = `${VIZ.length} topics live, ${Object.values(PLANNED).flat().filter(t => !VIZ.some(v => v.id === slug(t))).length} in development.`;
route();
</script>
</body>
