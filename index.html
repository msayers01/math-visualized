register({
  id: 'systems-of-equations', level: 'school',
  title: 'Systems of equations',
  blurb: 'Two lines, one crossing point: move them and see when they meet once, never, or always.',
  thumb(c, p) {
    const pal = p.pal; p.cx = 3; p.cy = 5; p.span = 5.4;
    p.grid(1);
    p.path([[-3, -1], [9, 11]], { stroke: pal.blue, width: 2.5 });
    p.path([[-3, 3.5], [9, 9.5]], { stroke: pal.red, width: 2.5 });
    p.dot(6, 8, 6, pal.violet, pal.stage, 2);
  },
  hook: String.raw`Plan A costs $2 to join plus $1 a day. Plan B costs $5 to join plus $0.50 a day. When do they cost the same?`,
  steps: [
    { title: 'Two plans, two lines',
      text: String.raw`<p>The <b>blue</b> line is plan A: \(y=x+2\). The <b>red</b> line is plan B: \(y=0.5x+5\). Here \(x\) is days and \(y\) is the total cost.</p><p>Each point on a line is a day and a cost that the plan allows.</p>`,
      set: { m1: 1, b1: 2, m2: .5, b2: 5 } },
    { title: 'Where they meet',
      text: String.raw`<p>The violet dot is the one point on both lines: day \(6\), cost $8. Both equations are true there at once.</p><p>That point is the <b>solution</b> of the system. Drag a line's handles and watch the solution move.</p>`,
      set: { m1: 1, b1: 2, m2: .5, b2: 5 } },
    { title: 'Parallel: no solution',
      text: String.raw`<p>Give plan A the same slope as plan B, \(0.5\). The lines now run side by side and never meet.</p><p>Same rate, different starting amount: the plans never cost the same.</p>`,
      set: { m1: .5, b1: 2, m2: .5, b2: 5 } },
    { title: 'Same line: infinitely many',
      text: String.raw`<p>Now give A the same start as well. The two equations describe one line, so every point on it is a solution.</p><p>Nudge either line off again to get back to a single solution.</p>`,
      set: { m1: .5, b1: 5, m2: .5, b2: 5 } }
  ],
  formal: String.raw`
    <p>A <em>system</em> of two linear equations asks for the points that satisfy both,
    \[ y = m_1x + b_1, \qquad y = m_2x + b_2. \]</p>
    <h3>Substitution</h3>
    <p>At a solution both right-hand sides give the same \(y\), so set them equal:
    \[ m_1x + b_1 = m_2x + b_2 \;\Longrightarrow\; x = \frac{b_2-b_1}{m_1-m_2}, \]
    then put this \(x\) back into either equation to get \(y\). For the plans: \(x+2 = 0.5x+5\) gives \(x=6\) and \(y=8\).</p>
    <h3>The three cases</h3>
    <p>
    <b>One solution</b> when \(m_1\neq m_2\): the lines have different slopes, so they cross exactly once.<br>
    <b>No solution</b> when \(m_1=m_2\) and \(b_1\neq b_2\): parallel lines.<br>
    <b>Infinitely many</b> when \(m_1=m_2\) and \(b_1=b_2\): the same line.</p>
    <h3>Elimination</h3>
    <p>Another way to solve is to add or subtract the equations so a variable cancels. Subtracting the second equation from the first removes \(y\) and leaves the same equation for \(x\). Graphically this is always the same question: where do the two lines meet?</p>`,
  check: [
    { q: String.raw`Where do \(y=2x+1\) and \(y=-x+7\) cross?`,
      choices: ['(1, 3)', '(2, 5)', '(3, 7)', '(6, 13)'], answer: 1,
      why: String.raw`Set \(2x+1=-x+7\) to get \(3x=6\), so \(x=2\) and \(y=2(2)+1=5\).`,
      hint: String.raw`Set the two expressions for \(y\) equal, solve for \(x\), then find \(y\).` },
    { q: String.raw`How many solutions does the system \(y=3x+1\), \(y=3x-4\) have?`,
      choices: ['One', 'Two', 'None', 'Infinitely many'], answer: 2,
      why: String.raw`Both lines have slope \(3\) but different intercepts, so they are parallel and never meet.`,
      hint: String.raw`Compare the slopes and the intercepts of the two lines.` }
  ],
  links: { prereq: ['slope-and-linear-functions', 'solving-equations-with-a-balance'], next: ['quadratics-and-the-parabola'], related: ['linear-transformations'] },

  mount({ stage, controls: C }) {
    const st = { m1: 1, b1: 2, m2: .5, b2: 5 };
    let cancel = () => {};
    const P = new Plane(stage, { cx: 2, cy: 3, span: 7.5 });
    const HX = 3;  /* the slope handle sits at x = 3 on each line */
    const solve = () => {
      const dm = st.m1 - st.m2, db = st.b2 - st.b1;
      if (Math.abs(dm) > .01) { const x = db / dm; return { kind: 'one', x, y: st.m1 * x + st.b1 }; }
      return { kind: Math.abs(db) < .01 ? 'same' : 'none' };
    };

    P.onDraw = (c, p) => {
      const pal = p.pal, bd = p.bounds(), sol = solve();
      p.grid(1); p.ticks(1);
      const L = (m, b, col, dash) => p.path([[bd.x0, m * bd.x0 + b], [bd.x1, m * bd.x1 + b]], { stroke: col, width: 3.5, dash });
      L(st.m1, st.b1, pal.blue);
      L(st.m2, st.b2, pal.red, sol.kind === 'same' ? [12, 10] : undefined);
      if (sol.kind === 'one') {
        p.dot(sol.x, sol.y, 9, pal.violet, pal.stage, 2.5);
        p.label(`(${num(sol.x)}, ${num(sol.y)})`, sol.x, sol.y, { size: 19, italic: false, color: pal.violet, dy: -22 });
      }
      for (const [m, b] of [[st.m1, st.b1], [st.m2, st.b2]]) {
        p.dot(0, b, 8, pal.stage, pal.brass, 3); p.dot(HX, m * HX + b, 8, pal.stage, pal.brass, 3);
      }
    };

    const upd = () => {
      const s = solve();
      ro.innerHTML = `<span class="k">A</span> ${linEq(st.m1, st.b1)}<br><span class="k">B</span> ${linEq(st.m2, st.b2)}<br>` +
        (s.kind === 'one' ? `<span class="k">Solution</span> (${num(s.x)}, ${num(s.y)})`
          : s.kind === 'none' ? '<span class="k">Same slope, different intercepts:</span> no solution'
          : '<span class="k">Same line:</span> infinitely many solutions');
    };
    const sync = () => { [m1S, b1S, m2S, b2S].forEach((s, i) => s.set(st[['m1', 'b1', 'm2', 'b2'][i]])); P.draw(); upd(); };
    const edit = k => v => { cancel(); st[k] = v; P.requestDraw(); upd(); };

    C.title('Line A (blue)');
    const m1S = C.slider({ label: 'Slope', min: -3, max: 3, step: .25, value: st.m1, onInput: edit('m1') });
    const b1S = C.slider({ label: 'Intercept', min: -4, max: 10, step: .5, value: st.b1, onInput: edit('b1') });
    C.title('Line B (red)');
    const m2S = C.slider({ label: 'Slope', min: -3, max: 3, step: .25, value: st.m2, onInput: edit('m2') });
    const b2S = C.slider({ label: 'Intercept', min: -4, max: 10, step: .5, value: st.b2, onInput: edit('b2') });
    const ro = C.readout(); upd();
    C.hint('Drag the ring at each line\'s y-intercept to slide it, and the ring at x = 3 to tilt it.');

    draggable(P, {
      hit: (px, py) => {
        let best = null, bd = 18;
        for (const [k, m, b] of [['1', st.m1, st.b1], ['2', st.m2, st.b2]])
          for (const [t, x, y] of [['b', 0, b], ['m', HX, m * HX + b]]) {
            const d = Math.hypot(P.X(x) - px, P.Y(y) - py);
            if (d < bd) { bd = d; best = t + k; }
          }
        return best;
      },
      move: (hd, x, y) => {
        cancel();
        const k = hd[1];
        if (hd[0] === 'b') st['b' + k] = clamp(snap(y, .5), -4, 10);
        else st['m' + k] = clamp(snap((y - st['b' + k]) / HX, .25), -3, 3);
        sync();
      }
    });

    const apply = (patch, immediate) => {
      cancel();
      if (immediate) { Object.assign(st, patch); sync(); } else cancel = animateTo(st, patch, 900, sync);
    };
    return { destroy: () => { cancel(); P.destroy(); }, apply };
  }
});

/* =====================================================================
   SCHOOL — Functions as transformations
   ===================================================================== */
{
  const FN = {
    abs:  { label: '|x|',   f: Math.abs,           wrap: v => `|${v}|` },
    sq:   { label: 'x²',    f: x => x * x,         wrap: v => v === 'x' ? 'x²' : `(${v})²` },
    cube: { label: 'x³',    f: x => x * x * x,     wrap: v => v === 'x' ? 'x³' : `(${v})³` },
    sqrt: { label: '√x',    f: Math.sqrt,          wrap: v => `√(${v})` },
    sin:  { label: 'sin x', f: Math.sin,           wrap: v => `sin(${v})` }
  };

  register({
    id: 'functions-as-transformations', level: 'school',
    title: 'Functions as transformations',
    blurb: 'Shift, stretch, squeeze and flip a graph, and follow one point as it moves.',
    thumb(c, p) {
      const pal = p.pal; p.cx = 0; p.cy = 1; p.span = 4;
      p.grid(1);
      const A = [], B = [];
      for (let x = -4.5; x <= 4.5; x += .1) { A.push([x, Math.abs(x)]); B.push([x, -Math.abs(x - 1) + 3]); }
      p.curve(A, { stroke: pal['grid-strong'], width: 2.4 });
      p.curve(B, { stroke: pal.blue, width: 2.8 });
      p.dot(0, 0, 4.5, pal.stage, pal.brass, 2); p.dot(1, 3, 4.5, pal.red, pal.stage, 1.5);
    },
    hook: String.raw`Every graph you will meet is a copy of a simpler one that has been moved, stretched or flipped. Can you tell which moves, just from the formula?`,
    steps: [
      { title: 'Two graphs, one tracked point',
        text: String.raw`<p>The grey curve is the base function \(f\). The blue curve is the transformed one, \(g\). Right now they are the same.</p><p>The ringed point \(P\) sits on \(f\). Its red twin \(P'\) shows where \(P\) lands on \(g\). Drag \(P\) along the curve.</p>`,
        set: { fn: 'abs', a: 1, b: 1, h: 0, k: 0, xp: 1 } },
      { title: 'Shift: h and k',
        text: String.raw`<p>Here \(g(x)=f(x-2)+1\). The \(+1\) outside lifts every point up by \(1\).</p><p>The \(-2\) inside moves the graph <em>right</em> by \(2\), the opposite of what the sign suggests. \(g\) needs \(x-2\) to equal the old \(x\), so it must go \(2\) further.</p>`,
        set: { fn: 'abs', a: 1, b: 1, h: 2, k: 1, xp: 1 } },
      { title: 'Stretch and flip: a',
        text: String.raw`<p>Now \(g(x)=-2f(x-2)+1\). Every height is multiplied by \(-2\): twice as tall, and the minus sign flips the graph over.</p><p>Watch \(P'\): its height is \(-2\) times the height of \(P\), then \(+1\).</p>`,
        set: { fn: 'abs', a: -2, b: 1, h: 2, k: 1, xp: 1 } },
      { title: 'Squeeze: b',
        text: String.raw`<p>The base is now \(\sin x\), with \(b=2\). So \(g(x)=\sin(2x)\): the wave repeats twice as fast.</p><p>A number inside <em>divides</em> every x-coordinate: \(P'\) sits at half the distance from the y-axis.</p>`,
        set: { fn: 'sin', a: 1, b: 2, h: 0, k: 0, xp: 1 } }
    ],
    formal: String.raw`
      <p>Start from any function \(f\). The transformed function is
      \[ g(x) = a\,f\big(b\,(x-h)\big) + k. \]</p>
      <h3>What each number does</h3>
      <p>
      <b>\(k\)</b> shifts the graph up (down if negative).<br>
      <b>\(h\)</b> shifts it right (left if negative).<br>
      <b>\(a\)</b> stretches it vertically by \(|a|\), and flips it over the x-axis if \(a<0\).<br>
      <b>\(b\)</b> squeezes it horizontally by \(1/|b|\), and flips it over the y-axis if \(b<0\).</p>
      <h3>Following one point</h3>
      <p>If \((x,y)\) is on the graph of \(f\), then \(g\) is at height \(a y + k\) when \(x\) is replaced by \(h + x/b\), because
      \[ g\!\left(h+\tfrac{x}{b}\right) = a\,f(x) + k = a y + k. \]
      So \((x,y)\mapsto\left(h+\tfrac{x}{b},\; a y+k\right)\). Changes to the output (\(a\), \(k\)) act the way they look. Changes to the input (\(b\), \(h\)) act in reverse.</p>
      <h3>You have seen this before</h3>
      <p>The vertex form \(y=a(x-h)^2+k\) is just \(f(x)=x^2\) moved to the vertex \((h,k)\) and stretched by \(a\).</p>`,
    check: [
      { q: String.raw`How does the graph of \(y=f(x+3)-2\) compare with the graph of \(y=f(x)\)?`,
        choices: ['Left 3, down 2', 'Right 3, down 2', 'Left 3, up 2', 'Right 3, up 2'], answer: 0,
        why: String.raw`The \(-2\) outside moves it down \(2\). The \(+3\) inside works in reverse: \(x+3\) reaches the old value \(3\) units sooner, so the graph moves left \(3\).`,
        hint: String.raw`Outside changes act as they look. Inside changes act in reverse.` },
      { q: 'Which function is the graph of f squeezed horizontally to half its width?',
        choices: ['y = f(x/2)', 'y = f(2x)', 'y = 2f(x)', 'y = f(x)/2'], answer: 1,
        why: String.raw`In \(f(2x)\) the input is doubled, so every feature of the graph happens at half the original \(x\). Compare \(P'\) in the last step.`,
        hint: 'A number multiplying x inside the brackets divides every x-coordinate.' }
    ],
    links: { prereq: ['slope-and-linear-functions'], next: ['quadratics-and-the-parabola'], related: ['the-unit-circle-and-trig-waves', 'exponential-growth'] },

    mount({ stage, controls: C }) {
      const st = { fn: 'abs', a: 1, b: 1, h: 0, k: 0, xp: 1 };
      let cancel = () => {};
      const P = new Plane(stage, { span: 6 });
      const F = () => FN[st.fn].f;
      const g = x => st.a * F()(st.b * (x - st.h)) + st.k;
      const z = v => Math.abs(v) < .005;

      const eqStr = () => {
        const { a, b, h, k } = st, hs = z(h) ? '' : ` ${h < 0 ? '+' : '−'} ${num(Math.abs(h))}`;
        const bs = z(b - 1) ? '' : z(b + 1) ? '−' : num(b);
        const inner = bs === '' ? (hs ? 'x' + hs : 'x') : hs ? `${bs}(x${hs})` : `${bs}x`;
        const pre = z(a - 1) ? '' : z(a + 1) ? '−' : num(a);
        return 'y = ' + pre + FN[st.fn].wrap(inner) + (z(k) ? '' : (k < 0 ? ' − ' : ' + ') + num(Math.abs(k)));
      };

      P.onDraw = (c, p) => {
        const pal = p.pal, bd = p.bounds(), f = F(), base = [], img = [], n = 320;
        p.grid(1); p.ticks(1);
        for (let i = 0; i <= n; i++) { const x = bd.x0 + (bd.x1 - bd.x0) * i / n; base.push([x, f(x)]); img.push([x, g(x)]); }
        p.curve(base, { stroke: pal['grid-strong'], width: 3 });
        p.curve(img, { stroke: pal.blue, width: 3.5 });
        const y = f(st.xp);
        if (isFinite(y) && Math.abs(st.b) > .01) {
          const qx = st.h + st.xp / st.b, qy = st.a * y + st.k;
          p.path([[st.xp, y], [qx, qy]], { stroke: alpha(pal.red, .8), width: 2, dash: [6, 6] });
          p.dot(qx, qy, 8, pal.red, pal.stage, 2.5);
          p.label('P′', qx, qy, { size: 20, color: pal.red, dx: 16, dy: -14 });
        }
        if (isFinite(y)) {
          p.dot(st.xp, y, 8, pal.stage, pal.brass, 3);
          p.label('P', st.xp, y, { size: 20, dx: -16, dy: -14 });
        }
      };

      const upd = () => {
        const y = F()(st.xp);
        let pt = '';
        if (isFinite(y) && Math.abs(st.b) > .01)
          pt = `<br><span class="k">P</span> (${num(st.xp)}, ${num(y)}) <span class="k">→ P′</span> (${num(st.h + st.xp / st.b)}, ${num(st.a * y + st.k)})`;
        ro.innerHTML = `<span class="k">g</span> ${eqStr()}${pt}`;
      };
      const sync = () => { [aS, bS, hS, kS].forEach((s, i) => s.set(st['abhk'[i]])); P.draw(); upd(); };
      const edit = key => v => { cancel(); st[key] = v; P.requestDraw(); upd(); };

      const sel = C.select({ label: 'Base function f', value: st.fn, options: Object.entries(FN).map(([value, o]) => ({ value, label: 'f(x) = ' + o.label })),
        onChange: v => { cancel(); st.fn = v; st.xp = 1; sync(); } });
      C.title('g(x) = a·f(b(x − h)) + k');
      const hS = C.slider({ label: 'h  (shift right)', min: -4, max: 4, step: .5, value: st.h, onInput: edit('h') });
      const kS = C.slider({ label: 'k  (shift up)', min: -4, max: 4, step: .5, value: st.k, onInput: edit('k') });
      const aS = C.slider({ label: 'a  (stretch, flip)', min: -3, max: 3, step: .25, value: st.a, onInput: edit('a') });
      const bS = C.slider({ label: 'b  (squeeze, flip)', min: -3, max: 3, step: .25, value: st.b, onInput: edit('b') });
      C.buttons([{ label: 'Reset transformation', onClick: () => { cancel(); Object.assign(st, { a: 1, b: 1, h: 0, k: 0 }); sync(); } }]);
      const ro = C.readout(); upd();
      C.hint('Drag P along the grey curve to see where it lands.');

      draggable(P, {
        hit: (px, py) => { const y = F()(st.xp); return isFinite(y) && near(P, st.xp, y, px, py) ? 'p' : null; },
        move: (_, x) => { cancel(); const v = clamp(snap(x, .25), -5, 5); if (isFinite(F()(v))) { st.xp = v; P.requestDraw(); upd(); } }
      });

      const apply = (patch, immediate) => {
        cancel();
        const { fn, ...rest } = patch;
        if (fn !== undefined) { st.fn = fn; sel.value = fn; }
        if (immediate) { Object.assign(st, rest); sync(); } else cancel = animateTo(st, rest, 900, sync);
      };
      return { destroy: () => { cancel(); P.destroy(); }, apply };
    }
  });
}

register({
  id: 'quadratics-and-the-parabola', level: 'school',
  title: 'Quadratics and the parabola',
  blurb: 'Move the vertex, stretch the curve, and find exactly where it crosses the x-axis.',
  thumb(c, p) {
    const pal = p.pal; p.cx = 0; p.cy = -1; p.span = 4.2;
    p.grid(1);
    const pts = []; for (let x = -4; x <= 4.001; x += .1) pts.push([x, .5 * x * x - 3]);
    p.curve(pts, { stroke: pal.blue, width: 2.6 });
    p.dot(-Math.sqrt(6), 0, 4.5, pal.green, pal.stage, 1.5); p.dot(Math.sqrt(6), 0, 4.5, pal.green, pal.stage, 1.5);

  },
  hook: String.raw`Throw a ball and its path bends into a curve. Why is it always the same kind of curve, and how do we find where it lands?`,
  steps: [
    { title: 'Start with y = x²',
      text: String.raw`<p>Plug in \(x=1,2,3\) and you get \(1,4,9\). Plug in \(-1,-2,-3\) and you get the same values.</p><p>So the curve is a mirror image of itself across the y-axis. It bottoms out at the <b>vertex</b>, the point \((0,0)\).</p>`,
      set: { a: 1, h: 0, k: 0 } },
    { title: 'Move the vertex',
      text: String.raw`<p>In \(y=a(x-h)^2+k\), the vertex is \((h,k)\). Here \(h=2\) and \(k=-4\).</p><p>Drag the vertex. Notice the dashed axis of symmetry always passes straight through it.</p>`,
      set: { a: 1, h: 2, k: -4 } },
    { title: 'Stretch and flip',
      text: String.raw`<p>Drag the ring one step right of the vertex, or use <b>a</b>. It sits exactly \(a\) above the vertex.</p><p>Bigger \(|a|\) makes a narrower curve. Negative \(a\) flips it to open downward, like a thrown ball. Here \(a=-1\).</p>`,
      set: { a: -1, h: 2, k: 4 } },
    { title: 'Where it crosses zero',
      text: String.raw`<p>The green dots are the <b>zeros</b>: where \(y=0\). With \(a=1,h=2,k=-4\) they are \(x=0\) and \(x=4\).</p><p>Drag the vertex up until the dots merge into one, then higher: the zeros disappear.</p>`,
      set: { a: 1, h: 2, k: -4 } }
  ],
  formal: String.raw`
    <p>A <em>quadratic function</em> has the form
    \[ y = ax^2 + bx + c \qquad (a\neq 0), \]
    and its graph is a <em>parabola</em>.</p>
    <h3>Vertex form</h3>
    <p>Every quadratic can be written
    \[ y = a(x-h)^2 + k. \]
    The vertex is \((h,k)\) and the axis of symmetry is \(x=h\). The graph opens up if \(a>0\) and down if \(a<0\).
    Completing the square turns \(ax^2+bx+c\) into this form with
    \[ h = -\frac{b}{2a}, \qquad k = c - \frac{b^2}{4a}. \]</p>
    <h3>Zeros</h3>
    <p>Setting \(a(x-h)^2+k=0\) gives \((x-h)^2 = -k/a\), so
    \[ x = h \pm \sqrt{-k/a}. \]
    In standard form this is the quadratic formula
    \[ x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}. \]
    The quantity \(b^2-4ac\) is the <em>discriminant</em>: positive gives two zeros, zero gives one (the vertex sits on the x-axis), negative gives none.</p>
    <h3>Why a ball follows a parabola</h3>
    <p>Gravity changes vertical speed at a steady rate, so height grows like \(-\tfrac12 g t^2\) plus a linear term. That is a quadratic in \(t\).</p>`,
  check: [
    { q: String.raw`What is the vertex of \(y=(x-3)^2+2\)?`,
      choices: ['(−3, 2)', '(3, 2)', '(3, −2)', '(−3, −2)'], answer: 1,
      why: String.raw`Compare with \(y=a(x-h)^2+k\): \(h=3\) and \(k=2\), so the vertex is \((3,2)\). The sign inside the bracket is opposite to \(h\).`,
      hint: String.raw`Write it as \((x-h)^2\) and read off \(h\). Then \(k\) is the number added outside.` },
    { q: String.raw`Where does \(y=x^2-6x+5\) cross the x-axis?`,
      choices: ['x = 1 and x = 5', 'x = −1 and x = −5', 'x = 2 and x = 3', 'x = 6 and x = 5'], answer: 0,
      why: String.raw`Factor: \(x^2-6x+5=(x-1)(x-5)\), which is zero at \(x=1\) and \(x=5\). The quadratic formula gives the same.`,
      hint: String.raw`Find two numbers that multiply to \(5\) and add to \(-6\).` }
  ],
  links: { prereq: ['slope-and-linear-functions', 'functions-as-transformations'], related: ['exponential-growth', 'derivatives-as-tangent-slopes'] },

  mount({ stage, controls: C }) {
    const st = { a: 1, h: 0, k: 0 };
    let cancel = () => {};
    const P = new Plane(stage, { cx: 0, cy: 1, span: 6.5 });
    const f = x => st.a * (x - st.h) * (x - st.h) + st.k;
    const zeros = () => {
      if (Math.abs(st.a) < .005) return [];  /* a passes through 0 while a step animates */
      if (Math.abs(st.k) < .005) return [st.h];
      const q = -st.k / st.a;
      return q < 0 ? [] : [st.h - Math.sqrt(q), st.h + Math.sqrt(q)];
    };
    const term = (v, pow, first) => {
      if (Math.abs(v) < .005) return '';
      const sgn = v < 0 ? (first ? '−' : ' − ') : (first ? '' : ' + '), mag = Math.abs(v);
      const coef = pow && Math.abs(mag - 1) < .005 ? '' : num(mag);
      return sgn + coef + (pow === 2 ? 'x²' : pow === 1 ? 'x' : '');
    };
    const vertexStr = () => {
      const { a, h, k } = st, inner = Math.abs(h) < .005 ? 'x' : 'x ' + (h < 0 ? '+ ' : '− ') + num(Math.abs(h));
      const co = Math.abs(a - 1) < .005 ? '' : Math.abs(a + 1) < .005 ? '−' : num(a);
      const sq = Math.abs(h) < .005 ? `${co}x²` : `${co}(${inner})²`;
      return 'y = ' + sq + (Math.abs(k) < .005 ? '' : (k < 0 ? ' − ' : ' + ') + num(Math.abs(k)));
    };
    const stdStr = () => {
      const { a, h, k } = st, b = -2 * a * h, c = a * h * h + k;
      const s = term(a, 2, true) + term(b, 1, false) + term(c, 0, false);
      return 'y = ' + s;
    };

    P.onDraw = (c, p) => {
      const pal = p.pal, bd = p.bounds(), { a, h, k } = st;
      p.grid(1); p.ticks(1);
      p.path([[h, bd.y0], [h, bd.y1]], { stroke: alpha(pal.violet, .8), width: 1.8, dash: [8, 7] });
      p.path([[h, k], [h + 1, k], [h + 1, k + a]], { stroke: pal['grid-strong'], width: 1.8, dash: [4, 5] });
      const pts = []; for (let i = 0; i <= 260; i++) { const x = bd.x0 + (bd.x1 - bd.x0) * i / 260; pts.push([x, f(x)]); }
      p.curve(pts, { stroke: pal.blue, width: 3.5 });
      for (const z of zeros()) p.dot(z, 0, 7, pal.green, pal.stage, 2.5);
      p.label(`(${num(h)}, ${num(k)})`, h, k, { size: 19, italic: false, dy: a > 0 ? 26 : -26 });
      p.dot(h, k, 8, pal.yellow, pal.brass, 3); p.dot(h + 1, k + a, 8, pal.stage, pal.brass, 3);
    };

    const upd = () => {
      const z = zeros();
      ro.innerHTML = `<span class="k">Vertex form</span> ${vertexStr()}<br><span class="k">Standard form</span> ${stdStr()}<br>` +
        `<span class="k">Vertex</span> (${num(st.h)}, ${num(st.k)}) &nbsp; <span class="k">axis</span> x = ${num(st.h)}<br>` +
        `<span class="k">Zeros</span> ` + (z.length === 2 ? `x = ${num(z[0])}, ${num(z[1])}` : z.length === 1 ? `x = ${num(z[0])} (one)` : 'none: the curve never reaches the x-axis');
    };
    const sync = () => { aS.set(st.a); hS.set(st.h); kS.set(st.k); P.draw(); upd(); };
    const edit = key => v => { cancel(); st[key] = key === 'a' && Math.abs(v) < .01 ? .25 : v; P.requestDraw(); upd(); };

    C.title('y = a(x − h)² + k');
    const aS = C.slider({ label: 'a (stretch, flip)', min: -3, max: 3, step: .25, value: st.a, onInput: edit('a') });
    const hS = C.slider({ label: 'h (vertex x)', min: -4, max: 4, step: .5, value: st.h, onInput: edit('h') });
    const kS = C.slider({ label: 'k (vertex y)', min: -5, max: 5, step: .5, value: st.k, onInput: edit('k') });
    const ro = C.readout(); upd();
    C.hint('Drag the yellow vertex, or the ring one step to its right.');

    draggable(P, {
      hit: (px, py) => near(P, st.h + 1, st.k + st.a, px, py) ? 'a' : near(P, st.h, st.k, px, py) ? 'v' : null,
      move: (hd, x, y) => {
        cancel();
        if (hd === 'v') { st.h = clamp(snap(x, .5), -4, 4); st.k = clamp(snap(y, .5), -5, 5); }
        else { const a = clamp(snap(y - st.k, .25), -3, 3); st.a = Math.abs(a) < .01 ? (y - st.k < 0 ? -.25 : .25) : a; }
        sync();
      }
    });

    const apply = (patch, immediate) => {
      cancel();
      if (immediate) { Object.assign(st, patch); sync(); } else cancel = animateTo(st, patch, 900, sync);
    };
    return { destroy: () => { cancel(); P.destroy(); }, apply };
  }
});

{
  const compact = v => new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: v < 10 ? 2 : 1 }).format(v);
  const niceStep = v => { const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; };
  const pct = v => (v < 0 ? '−' : '+') + Math.round(Math.abs(v) * 100) + '%';
  const amt = v => v >= 1e9 ? compact(v) : Number(v.toFixed(v < 100 ? 2 : 0)).toLocaleString('en');

  register({
    id: 'exponential-growth', level: 'school',
    title: 'Exponential growth',
    blurb: 'Compare adding with multiplying, and see why a small growth rate eventually wins.',
    thumb(c, p) {
      const pal = p.pal; p.cx = 5; p.cy = 3; p.span = 4.2;
      p.grid(1, { axes: false });
      p.path([[0, 0], [10, 0]], { stroke: pal['grid-strong'], width: 1.5 }); p.path([[0, 0], [0, 6.2]], { stroke: pal['grid-strong'], width: 1.5 });
      p.path([[0, .4], [10, 3.2]], { stroke: pal.red, width: 2.4 });
      const pts = []; for (let t = 0; t <= 10; t += .2) pts.push([t, .4 * Math.pow(1.36, t)]);
      p.curve(pts, { stroke: pal.blue, width: 2.8 });
    },
    hook: String.raw`One germ splits in two every hour. For the first few hours there is nothing to worry about, and then suddenly there is no room left. Why?`,
    steps: [
      { title: 'Adding versus multiplying',
        text: String.raw`<p>Start with \(1\). The <b>red</b> line <em>adds</em> \(1\) each period: \(1, 2, 3, 4\ldots\). The <b>blue</b> curve <em>doubles</em> each period: \(1, 2, 4, 8\ldots\).</p><p>After 6 periods: \(7\) against \(64\). Drag <b>Time</b> to read off values.</p>`,
        set: { p0: 1, r: 1, T: 6, t: 6, showLin: true } },
      { title: 'Let it run',
        text: String.raw`<p>Stretch the timeline to 20 periods. Doubling reaches \(1{,}048{,}576\). Adding \(1\) a period reaches \(21\).</p><p>The red line is now flat against the axis. Nothing about the rule changed, only how long we waited.</p>`,
        set: { p0: 1, r: 1, T: 20, t: 20, showLin: true } },
      { title: 'Even 10% wins',
        text: String.raw`<p>Start at \(100\) and grow \(10\%\) each period. The line adds \(10\) a period.</p><p>For a while the line keeps up. After 30 periods the curve is near \(1{,}745\) and the line is at \(400\). The doubling time here is about 7 periods.</p>`,
        set: { p0: 100, r: .1, T: 30, t: 30, showLin: true } },
      { title: 'Negative rates: decay',
        text: String.raw`<p>Now lose \(30\%\) each period. The amount keeps shrinking by the same <em>fraction</em>, so it falls fast at first, then slowly, and never reaches \(0\).</p><p>The line adds \(-30\) each period, so it hits \(0\) at period 3.3 and would go negative. Real quantities like this follow the curve.</p>`,
        set: { p0: 100, r: -.3, T: 15, t: 15, showLin: true } }
    ],
    formal: String.raw`
      <p>A quantity grows <em>linearly</em> if it gains the same <em>amount</em> each period, and <em>exponentially</em> if it gains the same <em>fraction</em> each period.
      With start value \(P_0\) and growth rate \(r\) per period:
      \[ \text{linear: } L(t)=P_0(1+rt), \qquad \text{exponential: } P(t)=P_0(1+r)^t. \]</p>
      <h3>The growth factor</h3>
      <p>Write \(b=1+r\). Each period multiplies the amount by \(b\), so \(P(t+1)/P(t)=b\) for every \(t\). Growth has \(b>1\). Decay has \(0&lt;b&lt;1\). A rate of \(-30\%\) means \(b=0.7\).</p>
      <h3>Doubling time and half-life</h3>
      <p>Solving \(P_0 b^t = 2P_0\) gives
      \[ t_{\text{double}} = \frac{\ln 2}{\ln(1+r)} \approx \frac{70}{100\,r}, \]
      the "rule of 70". At \(r=10\%\) that is about \(7\) periods. For decay the same idea gives the half-life \(\ln(1/2)/\ln b\).</p>
      <h3>Why exponentials always win</h3>
      <p>Any exponential with \(b>1\) eventually passes any straight line, however steep. A line adds a fixed amount, but the exponential adds an amount that is itself growing.</p>
      <h3>Compound interest</h3>
      <p>Money earning interest rate \(r\) per year is exactly this: after \(t\) years \(\$P_0\) becomes \(P_0(1+r)^t\).</p>`,
    check: [
      { q: String.raw`\(\$200\) earns \(5\%\) interest per year, compounded yearly. How much is it worth after 2 years?`,
        choices: ['$220.00', '$220.50', '$210.00', '$222.00'], answer: 1,
        why: String.raw`Each year multiplies by \(1.05\): \(200\times1.05^2 = 200\times1.1025 = 220.50\). Adding \(5\%\) of \(200\) twice would give only \(220\).`,
        hint: String.raw`The second year's interest is earned on the new, larger amount.` },
      { q: 'A quantity shrinks by 20% each period. Which formula gives its value after t periods?',
        choices: [String.raw`\(P_0(0.2)^t\)`, String.raw`\(P_0(0.8)^t\)`, String.raw`\(P_0-0.2t\)`, String.raw`\(P_0(1.2)^t\)`], answer: 1,
        why: String.raw`Losing \(20\%\) leaves \(80\%\), so each period multiplies by \(0.8\).`,
        hint: 'What fraction of the amount is left after one period?' }
    ],
    links: { prereq: ['slope-and-linear-functions'], next: ['probability-with-repeated-trials'], related: ['functions-as-transformations', 'derivatives-as-tangent-slopes'] },

    mount({ stage, controls: C }) {
      const st = { p0: 1, r: 1, T: 6, t: 6 };
      let cancel = () => {}, showLin = true;
      const P = new Plane(stage, { span: 5 });
      const E = t => st.p0 * Math.pow(1 + st.r, t), L = t => st.p0 * (1 + st.r * t);
      const W = 10, H = 6.2;

      P.onDraw = (c, p) => {
        const pal = p.pal, T = Math.max(st.T, 1), tm = Math.min(st.t, T);
        const ymax = Math.max(E(0), E(T), showLin ? Math.max(L(0), L(T)) : 0), top = ymax * 1.08;
        const ux = t => t / T * W, vy = v => v / top * H;
        const sc = Math.min(p.w / (W + 2.6), p.h / (H + 2.2));
        p.span = Math.min(p.w, p.h) / (2 * sc); p.cx = W / 2 - .5; p.cy = H / 2 - .05;
        const fs = clamp(sc * .3, 12, 15);

        const vs = niceStep(top / 5), ts = T <= 12 ? 1 : T <= 24 ? 2 : 5;
        for (let v = 0; v <= top + 1e-9; v += vs) {
          p.path([[0, vy(v)], [W, vy(v)]], { stroke: pal.grid, width: 1.5 });
          p.label(compact(v), 0, vy(v), { size: fs + 2, italic: false, color: pal.muted, align: 'right', dx: -10 });
        }
        for (let t = 0; t <= T + 1e-9; t += ts) {
          p.path([[ux(t), 0], [ux(t), H]], { stroke: pal.grid, width: 1.5 });
          p.label(String(Math.round(t)), ux(t), 0, { size: fs + 2, italic: false, color: pal.muted, dy: 16 });
        }
        p.path([[0, 0], [W, 0]], { stroke: pal['grid-strong'], width: 2 }); p.path([[0, 0], [0, H]], { stroke: pal['grid-strong'], width: 2 });
        p.label('time t', W, 0, { size: fs + 3, italic: false, color: pal.muted, align: 'right', dy: 36 });
        p.label('amount', 0, H, { size: fs + 3, italic: false, color: pal.muted, align: 'left', dy: -16 });

        const N = 240, ec = [], lc = [], tl = st.r < 0 ? Math.min(T, -1 / st.r) : T;
        for (let i = 0; i <= N; i++) { const t = T * i / N; ec.push([ux(t), vy(E(t))]); if (t <= tl) lc.push([ux(t), vy(Math.max(L(t), 0))]); }
        if (showLin) p.path(lc, { stroke: pal.red, width: 3.5 });
        p.path(ec, { stroke: pal.blue, width: 3.5 });

        const ey = vy(E(tm)), ly = vy(L(tm)), showL = showLin && tm <= tl;
        p.path([[ux(tm), 0], [ux(tm), Math.max(ey, showL ? ly : 0)]], { stroke: pal['grid-strong'], width: 1.5, dash: [5, 6] });
        if (showL) { p.dot(ux(tm), ly, 7, pal.red, pal.stage, 2); p.label(compact(L(tm)), ux(tm), ly, { size: fs + 3, italic: false, color: pal.red, align: 'right', dx: -12, dy: 14 }); }
        p.dot(ux(tm), ey, 7, pal.blue, pal.stage, 2); p.label(compact(E(tm)), ux(tm), ey, { size: fs + 3, italic: false, color: pal.blue, align: 'right', dx: -12, dy: -14 });
        p.label('exponential: multiply by ' + num(1 + st.r) + ' each period', .3, H - .1, { size: fs + 3, italic: false, color: pal.blue, align: 'left' });
        if (showLin) p.label('linear: add ' + amt(st.p0 * st.r) + ' each period', .3, H - .65, { size: fs + 3, italic: false, color: pal.red, align: 'left' });
      };

      const upd = () => {
        const tm = Math.min(st.t, st.T), r = st.r;
        let extra = '';
        const per = v => num(v) + (Math.abs(v - 1) < .005 ? ' period' : ' periods');
        if (r > 0) extra = `<br><span class="k">Doubling time</span> ${per(Math.log(2) / Math.log(1 + r))}`;
        else if (r < 0) extra = `<br><span class="k">Half-life</span> ${per(Math.log(.5) / Math.log(1 + r))}`;
        ro.innerHTML = `<span class="k">At t =</span> ${num(tm)}<br><span class="k">Exponential</span> ${amt(E(tm))}` +
          (showLin ? `<br><span class="k">Linear</span> ${amt(Math.max(L(tm), 0))}${L(tm) < 0 ? ' (would be negative)' : ''}` : '') + extra;
      };
      const sync = () => { [p0S, rS, TS, tS].forEach((s, i) => s.set(st[['p0', 'r', 'T', 't'][i]])); P.draw(); upd(); };
      const edit = key => v => {
        cancel(); st[key] = key === 'r' ? Math.round(v * 100) / 100 : v;
        if (st.t > st.T) { st.t = st.T; tS.set(st.t); }
        P.requestDraw(); upd();
      };

      C.title('Amount');
      const p0S = C.slider({ label: 'Start amount', min: 1, max: 500, step: 1, value: st.p0, format: v => String(Math.round(v)), onInput: edit('p0') });
      const rS = C.slider({ label: 'Growth per period', min: -.5, max: 1, step: .05, value: st.r, format: pct, onInput: edit('r') });
      C.title('Time');
      const TS = C.slider({ label: 'Periods shown', min: 5, max: 30, step: 1, value: st.T, format: v => String(Math.round(v)), onInput: edit('T') });
      const tS = C.slider({ label: 'Read at time t', min: 0, max: 30, step: .1, value: st.t, format: v => v.toFixed(1), onInput: edit('t') });
      const linT = C.toggle({ label: 'Compare with linear growth', value: true, onChange: v => { showLin = v; P.draw(); upd(); } });
      C.buttons([
        { label: 'Doubling', onClick: () => apply({ p0: 1, r: 1, T: 10, t: 10 }) },
        { label: '10% growth', onClick: () => apply({ p0: 100, r: .1, T: 30, t: 30 }) },
        { label: '30% decay', onClick: () => apply({ p0: 100, r: -.3, T: 15, t: 15 }) }
      ]);
      const ro = C.readout(); upd();

      function apply(patch, immediate) {
        cancel();
        const { showLin: sl, ...rest } = patch;
        if (sl !== undefined) { showLin = sl; linT.checked = sl; }
        if (immediate) { Object.assign(st, rest); sync(); } else cancel = animateTo(st, rest, 1100, sync);
      }
      return { destroy: () => { cancel(); P.destroy(); }, apply };
    }
  });
}

/* =====================================================================
   VISUALIZATION 1 — Pythagorean theorem (middle & high school)
   ===================================================================== */
register({
  id: 'pythagorean-theorem', level: 'school',
  title: 'The Pythagorean theorem',
  blurb: 'Slide four triangles inside a square and watch c² become a² + b².',
  thumb(c, p) {
    const a = 3, b = 4, s = 7, pal = p.pal; p.cx = 3.5; p.cy = 3.5; p.span = 4.3;
    p.path([[0,0],[s,0],[s,s],[0,s]], { fill: alpha(pal.yellow, .26) });
    for (const t of [[[0,0],[a,0],[0,b]], [[s,0],[s,a],[a,0]], [[s,s],[b,s],[s,a]], [[0,s],[b,s],[0,b]]])
      p.path(t, { fill: alpha(pal.blue, .45), stroke: pal.blue, width: 1.2, close: true });
    p.path([[a,0],[s,a],[b,s],[0,b]], { stroke: pal.yellow, width: 1.6, close: true });
    p.path([[0,0],[s,0],[s,s],[0,s]], { stroke: pal.text, width: 1.2, close: true });
  },
  hook: String.raw`A right triangle has legs 3 and 4. Why must its long side be exactly 5?`,
  steps: [
    { title: 'Meet the triangle',
      text: String.raw`<p>Four copies of a right triangle sit inside a big square of side \(a+b\). The shaded tilted square in the middle has side \(c\), the triangle's long side.</p><p>Notice that the four triangles and the tilted square fill the big square with no gaps.</p>`,
      set: { a: 3, b: 4, t: 0 } },
    { title: 'Slide three triangles',
      text: String.raw`<p>Press <b>Rearrange triangles</b>, or drag <b>Progress</b>. The triangles slide without turning or stretching.</p><p>The shaded region is now two squares, with areas \(a^2\) and \(b^2\). Same pieces, same big square, so the shaded area cannot have changed.</p>`,
      set: { a: 3, b: 4, t: 1 } },
    { title: 'Try your own triangle',
      text: String.raw`<p>Drag the leg sliders. With \(a=5\) and \(b=2\) the two squares are lopsided, yet the readout still says \(a^2+b^2\) equals \(c^2\).</p><p>Find a triangle where \(c\) comes out a whole number.</p>`,
      set: { a: 5, b: 2, t: 1 } },
    { title: 'Make the legs equal',
      text: String.raw`<p>With \(a=b=4\) the two squares are identical, so \(c^2 = 2a^2\) and \(c=a\sqrt2\).</p><p>That is the diagonal of a square: the triangle is half of a square cut corner to corner.</p>`,
      set: { a: 4, b: 4, t: 1 } }
  ],
  formal: String.raw`
    <p><b>Theorem.</b> In a right triangle with legs \(a\), \(b\) and hypotenuse \(c\),
    \[ a^2 + b^2 = c^2. \]</p>
    <h3>Proof by rearrangement</h3>
    <p>Take a square of side \(a+b\) and place four copies of the triangle inside it so that the leftover region is a square of side \(c\). Then
    \[ c^2 \;=\; (a+b)^2 - 4\cdot\tfrac12 ab \;=\; a^2 + 2ab + b^2 - 2ab \;=\; a^2 + b^2. \]
    Sliding three triangles shows the same leftover region as two squares, of areas \(a^2\) and \(b^2\). The area did not change, so the two counts agree.</p>
    <h3>The converse</h3>
    <p>If three positive numbers satisfy \(a^2+b^2=c^2\), then a triangle with those side lengths has a right angle opposite \(c\). This is how builders check a corner with a 3-4-5 rope.</p>
    <h3>Distance in the plane</h3>
    <p>Put the legs along the coordinate axes. The distance between \((x_1,y_1)\) and \((x_2,y_2)\) is the hypotenuse of a right triangle with legs \(|x_2-x_1|\) and \(|y_2-y_1|\), so
    \[ d = \sqrt{(x_2-x_1)^2 + (y_2-y_1)^2}. \]</p>`,
  check: [
    { q: String.raw`A right triangle has legs \(5\) and \(12\). How long is the hypotenuse?`,
      choices: ['7', '13', '17', '169'], answer: 1,
      why: String.raw`\(5^2+12^2 = 25+144 = 169 = 13^2\), so \(c = 13\).`,
      hint: String.raw`Add the squares of the legs first, then take a square root.` },
    { q: 'Why does the tilted square have the same area as the two smaller squares?',
      choices: ['The triangles are all the same shape', 'The same four triangles and the same big square are used, so the leftover area is unchanged',
                'Because c is the longest side', 'Because a and b are equal'], answer: 1,
      why: 'Only the positions of the triangles change. Total area minus the four triangles is the same in both arrangements.',
      hint: 'Think about what stays fixed while the triangles slide.' }
  ],
  links: { next: ['similarity-and-scaling', 'the-unit-circle-and-trig-waves'], related: ['area-of-a-circle'] },
  mount({ stage, controls: C }) {
    const st = { a: 3, b: 4, t: 0 };
    let cancel = () => {};
    const P = new Plane(stage);
    const fit = () => { const s = st.a + st.b; P.cx = s / 2; P.cy = s / 2; P.span = s * .64; };
    fit();

    P.onDraw = (c, p) => {
      const { a, b, t } = st, s = a + b, pal = p.pal;
      const sq = [[0,0],[s,0],[s,s],[0,s]];
      const tris = [
        { pts: [[0,0],[a,0],[0,b]], d: [0, a] },
        { pts: [[s,0],[s,a],[a,0]], d: [0, 0] },
        { pts: [[s,s],[b,s],[s,a]], d: [-b, 0] },
        { pts: [[0,s],[b,s],[0,b]], d: [a, a - s] }

      const order = { 0: 0, 2: 1, 3: 2 };
      p.path(sq, { fill: alpha(pal.yellow, .26) });
      tris.forEach((tr, i) => {
        const k = order[i], q = k == null ? 0 : ease(clamp((t - k * .25) / .5, 0, 1));
        const pts = tr.pts.map(([x, y]) => [x + tr.d[0] * q, y + tr.d[1] * q]);
        p.path(pts, { fill: alpha(pal.blue, .45), stroke: pal.blue, width: 2, close: true });
      });
      const f0 = 1 - clamp(t * 3, 0, 1), f1 = clamp((t - .66) * 3, 0, 1);
      if (f0 > 0) { c.globalAlpha = f0; p.path([[a,0],[s,a],[b,s],[0,b]], { stroke: pal.yellow, width: 3, close: true }); c.globalAlpha = 1; }
      if (f1 > 0) {
        c.globalAlpha = f1;
        p.path([[0,0],[a,0],[a,a],[0,a]], { stroke: pal.yellow, width: 3, close: true });
        p.path([[a,a],[s,a],[s,s],[a,s]], { stroke: pal.yellow, width: 3, close: true });
        c.globalAlpha = 1;
      }
      p.path(sq, { stroke: pal.text, width: 2, close: true });

      const fs = clamp(p.scale * .6, 16, 40);
      p.label('c²', s / 2, s / 2, { size: fs * 1.25, alpha: f0 });
      p.label('a²', a / 2, a / 2, { size: fs * 1.1, alpha: f1 });
      p.label('b²', a + b / 2, a + b / 2, { size: fs * 1.25, alpha: f1 });
      const off = 20 / p.scale, ls = clamp(p.scale * .38, 15, 22);
      p.label('a', a / 2, -off, { size: ls }); p.label('b', a + b / 2, -off, { size: ls });
      p.label('a', s + off, a / 2, { size: ls }); p.label('b', s + off, a + b / 2, { size: ls });
      const cl = Math.hypot(a, b);
      p.label('c', (s + a) / 2 - a / cl * off * .9, a / 2 + b / cl * off * .9, { size: ls, alpha: f0 });

    const upd = () => {
      const { a, b } = st;
      ro.innerHTML = `<span class="k">a² + b²</span> = ${(a*a).toFixed(2)} + ${(b*b).toFixed(2)} = ${(a*a + b*b).toFixed(2)}<br>
        <span class="k">c</span> = √(a² + b²) = ${Math.hypot(a, b).toFixed(3)}`;
    };
    const setBtn = () => { play.textContent = st.t > .5 ? 'Put them back' : 'Rearrange triangles'; };

    C.title('Triangle');
    const aS = C.slider({ label: 'Leg a', min: 1, max: 6, step: .1, value: st.a, format: v => v.toFixed(1), onInput: v => { cancel(); st.a = v; fit(); P.requestDraw(); upd(); } });
    const bS = C.slider({ label: 'Leg b', min: 1, max: 6, step: .1, value: st.b, format: v => v.toFixed(1), onInput: v => { cancel(); st.b = v; fit(); P.requestDraw(); upd(); } });
    C.title('Rearrangement');
    const tS = C.slider({ label: 'Progress', min: 0, max: 1, step: .001, value: 0, format: v => Math.round(v * 100) + '%',

    const [play] = C.buttons([{ label: 'Rearrange triangles', primary: true, onClick: () => {
      cancel(); const from = st.t, to = st.t < .5 ? 1 : 0;
      cancel = tween(2400 * Math.abs(to - from), p => { st.t = lerp(from, to, p); tS.set(st.t); P.draw(); }, setBtn);
    } }]);
    const ro = C.readout(); upd();
    /* guided steps: glide to a state patch {a, b, t}, keeping the controls in sync */
    const sync = () => { aS.set(st.a); bS.set(st.b); tS.set(st.t); fit(); P.draw(); upd(); setBtn(); };
    const apply = (patch, immediate) => {
      cancel();
      if (immediate) { Object.assign(st, patch); sync(); } else cancel = animateTo(st, patch, 900, sync);
    };
    return { destroy: () => { cancel(); P.destroy(); }, apply };
  }
});

register({
  id: 'area-of-a-circle', level: 'school',
  title: 'Area of a circle',
  blurb: 'Cut a circle into slices, interlock them, and watch a rectangle appear.',
  thumb(c, p) {

    for (let k = 0; k < n; k++) {

      p.path(pts, { fill: alpha(k % 2 ? pal.yellow : pal.blue, .5), stroke: pal.stage, width: 1.5, close: true });
    }
  },
  hook: String.raw`A circle has no straight edges. How can we measure the space inside it using nothing but a rectangle?`,
  steps: [
    { title: 'Cut it into slices',
      text: String.raw`<p>Cut the circle of radius \(r\) into \(8\) equal slices, like a pizza. Colors alternate so you can follow them.</p><p>Each slice has two straight sides of length \(r\) and a curved edge. Nothing has been removed.</p>`,
      set: { n: 8, t: 0, r: 2 } },
    { title: 'Interlock the slices',
      text: String.raw`<p>Turn every other slice upside down and fit them together. The result is a bumpy, lopsided rectangle, but it is made of exactly the same pieces.</p><p>So its area equals the circle's area.</p>`,
      set: { n: 8, t: 1, r: 2 } },

    { title: 'Read off the sides',
      text: String.raw`<p>The height is a slice's length: \(r\). The long side is made of half the slices' curved edges, so it is half the circumference: \(\tfrac12\cdot 2\pi r=\pi r\).</p><p>Area = width × height \(=\pi r\cdot r=\pi r^2\).</p>`,
      set: { n: 64, t: 1, r: 2 } }
  ],
  formal: String.raw`
    <p><b>Theorem.</b> A circle of radius \(r\) has area
    \[ A = \pi r^2. \]</p>
    <h3>Where \(\pi\) comes from</h3>

      const pal = p.pal, g = geo(), sc = p.scale, X0 = p.X(0), Y0 = p.Y(0), fs = clamp(sc * .15, 15, 22);
      p.grid(.5, { axes: false });
      const ring = []; for (let i = 0; i <= 180; i++) ring.push(pt(i * 2));
      p.path(ring, { stroke: pal.blue, width: 3 });
      c.beginPath(); c.arc(X0, Y0, sc, -g.start * D, -(g.start + g.len) * D, true);
      c.strokeStyle = pal.yellow; c.lineWidth = 7; c.lineCap = 'round'; c.stroke();
      p.path([g.A, [0, 0], g.B], { stroke: alpha(pal.red, .85), width: 2.5 });
      p.path([g.A, g.Q, g.B], { stroke: pal.green, width: 3.5 });
      c.beginPath(); c.arc(X0, Y0, .28 * sc, -g.start * D, -(g.start + g.len) * D, true);
      c.strokeStyle = pal.red; c.lineWidth = 3; c.stroke();
      const mid = (g.start + g.len / 2) * D;
      p.label(Math.round(g.len) + '°', .52 * Math.cos(mid), .52 * Math.sin(mid), { size: fs, italic: false, color: pal.red });
      if (g.ins != null) {
        const a1 = Math.atan2(g.ua[1], g.ua[0]), a2 = Math.atan2(g.ub[1], g.ub[0]), d = wrap(a2 - a1), s = d > 0 ? a1 : a2;
        c.beginPath(); c.arc(p.X(g.Q[0]), p.Y(g.Q[1]), .2 * sc, -s, -(s + Math.abs(d)), true);
        c.strokeStyle = pal.green; c.lineWidth = 3; c.stroke();
        const la = Math.hypot(...g.ua), lb = Math.hypot(...g.ub), bx = g.ua[0] / la + g.ub[0] / lb, by = g.ua[1] / la + g.ub[1] / lb, bm = Math.hypot(bx, by) || 1;
        p.label(Math.round(g.ins) + '°', g.Q[0] + bx / bm * .42, g.Q[1] + by / bm * .42, { size: fs, italic: false, color: pal.green });
      }
      p.dot(0, 0, 4, pal.text); p.label('O', 0, 0, { size: fs + 3, dx: 12, dy: 14 });
      [['A', g.A], ['B', g.B], ['P', g.Q]].forEach(([n, v]) => {
        p.dot(v[0], v[1], 9, pal.stage, pal.brass, 3.5);
        p.label(n, v[0] * 1.16, v[1] * 1.16, { size: fs + 4 });
      });
    };

    const upd = () => {
      const g = geo();
      ro.innerHTML = `<span class="k">Central angle</span> ${Math.round(g.len)}°<br>` +
        `<span class="k">Inscribed angle APB</span> ${g.ins == null ? '—' : g.ins.toFixed(1) + '°'}<br><span class="k">Central ÷ inscribed</span> ${g.ins ? (g.len / g.ins).toFixed(2) : '—'}`;
    };
    const sync = () => { aS.set(mod(st.a)); bS.set(mod(st.b)); pS.set(mod(st.p)); P.draw(); upd(); };
    const edit = key => v => { cancel(); st[key] = v; P.requestDraw(); upd(); };

    C.title('Positions on the circle');
    const aS = C.slider({ label: 'Point A', min: 0, max: 360, step: 1, value: mod(st.a), format: v => Math.round(v) + '°', onInput: edit('a') });
    const bS = C.slider({ label: 'Point B', min: 0, max: 360, step: 1, value: mod(st.b), format: v => Math.round(v) + '°', onInput: edit('b') });
    const pS = C.slider({ label: 'Point P', min: 0, max: 360, step: 1, value: mod(st.p), format: v => Math.round(v) + '°', onInput: edit('p') });
    const ro = C.readout(); upd();
    C.hint('Drag A, B or P around the circle.');

    draggable(P, {
      hit: (px, py) => {
        let best = null, bd = 20;
        for (const k of ['a', 'b', 'p']) { const v = pt(st[k]), d = Math.hypot(P.X(v[0]) - px, P.Y(v[1]) - py); if (d < bd) { bd = d; best = k; } }
        return best;
      },
      move: (k, x, y) => { cancel(); st[k] = mod(Math.round(Math.atan2(y, x) / D)); sync(); }
    });

    const apply = (patch, immediate) => {
      cancel();
      if (immediate) { Object.assign(st, patch); sync(); } else cancel = animateTo(st, patch, 900, sync);
    };
    return { destroy: () => { cancel(); P.destroy(); }, apply };
  }
});

/* angle as a multiple of pi when it is a simple one, e.g. "π/3", "2π/3"; otherwise null */
function piFrac(th) {
  const x = th / Math.PI;
  for (const q of [1, 2, 3, 4, 6, 8, 12]) {
    const p = Math.round(x * q);
    if (Math.abs(x * q - p) < .002) return p === 0 ? '0' : (p === 1 ? 'π' : p + 'π') + (q > 1 ? '/' + q : '');
  }
  return null;
}

/* =====================================================================
   SCHOOL — Mean, median, and spread

{

  };
  const MAXV = 20;
  const stats = v => {
    const n = v.length, s = [...v].sort((x, y) => x - y), mean = v.reduce((a, b) => a + b, 0) / n;
    const med = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
    return { n, mean, med, min: s[0], max: s[n - 1], sd: Math.sqrt(v.reduce((a, b) => a + (b - mean) * (b - mean), 0) / n) };
  };

  register({

        set: { data: SETS.sym } },
      { title: 'One outlier',
        text: String.raw`<p>The largest value jumps from \(12\) to \(20\). The mean is pulled right to about \(10.9\) because it uses every value's size. The median stays at \(10\) because it only cares about order.</p><p>That is why median income is quoted instead of mean income.</p>`,

    formal: String.raw`

      <p>
      The <b>mean</b> is \(\mu=\dfrac{x_1+\cdots+x_n}{n}\). It is the balance point: the signed distances \(x_i-\mu\) always add to \(0\).<br>
      The <b>median</b> is the middle value of the sorted list, or the average of the two middle values when \(n\) is even.</p>
      <h3>Spread</h3>
      <p>
      The <b>range</b> is largest minus smallest.<br>
      The <b>standard deviation</b> is
      \[ \sigma=\sqrt{\frac{(x_1-\mu)^2+\cdots+(x_n-\mu)^2}{n}}. \]

      <h3>Which one to use?</h3>

    mount({ stage, controls: C }) {

        for (let x = 0; x <= MAXV; x++) {
          p.path([[x, 0], [x, -.28]], { stroke: pal['grid-strong'], width: 1.5 });
          if (x % 2 === 0) p.label(String(x), x, -.28, { size: fs + 3, italic: false, color: pal.muted, dy: 14 });
        }
        p.path([[-.4, 0], [MAXV + .4, 0]], { stroke: pal['grid-strong'], width: 2 });
        if (showMed) {
          p.path([[S.med, 0], [S.med, 8]], { stroke: pal.violet, width: 2.5, dash: [8, 6] });
          p.label('median ' + num(S.med), S.med, 8, { size: fs + 3, italic: false, color: pal.violet, dy: -2 });
        }
        for (const d of lay(p)) p.dot(d.x, d.y, d.r, alpha(pal.blue, .85), pal.stage, 2);
        if (showMean) {
          const m = S.mean, w = .5;
          p.path([[m, -.9], [m - w, -1.7], [m + w, -1.7]], { fill: pal.yellow, stroke: pal.yellow, width: 1, close: true });
          p.label('mean ' + num(m), m, -1.7, { size: fs + 3, italic: false, color: pal.yellow, dy: 16 });
        }
        if (showSd) {
          const y = -2.7, a = S.mean - S.sd, b = S.mean + S.sd;
          p.path([[a, y], [b, y]], { stroke: pal.green, width: 3 });
          p.path([[a, y - .2], [a, y + .2]], { stroke: pal.green, width: 3 }); p.path([[b, y - .2], [b, y + .2]], { stroke: pal.green, width: 3 });
          p.label('σ = ' + num(S.sd), S.mean, y, { size: fs + 3, italic: false, color: pal.green, dy: 16 });
        }
      };

      const upd = () => {
        const S = stats(st.v);
        ro.innerHTML = `<span class="k">Values</span> n = ${S.n}<br><span class="k">Mean</span> ${num(S.mean)} &nbsp; <span class="k">Median</span> ${num(S.med)}<br>` +
          `<span class="k">Range</span> ${num(S.max - S.min)} (${num(S.min)} to ${num(S.max)})<br><span class="k">Std deviation σ</span> ${num(S.sd)}`;
      };
      const sync = () => { P.draw(); upd(); };
      const setData = (arr, immediate) => {
        cancel();
        if (immediate || reduceMotion || arr.length !== st.v.length) { st.v = [...arr]; sync(); return; }
        const from = [...st.v];
        cancel = tween(900, q => { const e = ease(q); st.v = from.map((x, i) => lerp(x, arr[i], e)); sync(); });
      };

      C.title('Data');
      C.buttons([
        { label: 'Add a point', onClick: () => { if (st.v.length < 15) { cancel(); st.v = [...st.v, Math.round(stats(st.v).med)]; sync(); } } },
        { label: 'Remove a point', onClick: () => { if (st.v.length > 3) { cancel(); st.v = st.v.slice(0, -1); sync(); } } }
      ]);
      C.buttons([
        { label: 'Symmetric', onClick: () => setData(SETS.sym) }, { label: 'Outlier', onClick: () => setData(SETS.out) },
        { label: 'Wide', onClick: () => setData(SETS.wide) }, { label: 'Skewed', onClick: () => setData(SETS.skewed) }
      ]);
      C.title('Show');
      C.toggle({ label: 'Mean (balance point)', value: true, onChange: v => { showMean = v; P.draw(); } });
      C.toggle({ label: 'Median', value: true, onChange: v => { showMed = v; P.draw(); } });
      C.toggle({ label: 'Standard deviation band', value: true, onChange: v => { showSd = v; P.draw(); } });
      const ro = C.readout(); upd();
      C.hint('Drag any dot left or right. Values snap to whole numbers from 0 to 20.');

      draggable(P, {
        hit: (px, py) => {
          let best = null, bd = 18;
          for (const d of lay(P)) { const dist = Math.hypot(P.X(d.x) - px, P.Y(d.y) - py); if (dist <= bd) { bd = dist; best = d.i; } }
          return best;
        },
        move: (i, x) => { cancel(); st.v = st.v.map((v, k) => k === i ? clamp(Math.round(x), 0, MAXV) : v); sync(); }
      });

      const apply = (patch, immediate) => { if (patch.data) setData(patch.data, immediate); };
      return { destroy: () => { cancel(); P.destroy(); }, apply };
    }
  });
}

{
  const pct = v => (v * 100).toFixed(v < .1 || v > .9 ? 1 : 0) + '%';
  const atLeast = (p, k) => 1 - Math.pow(1 - p, k);

  register({
    id: 'probability-with-repeated-trials', level: 'school',
    title: 'Probability with repeated trials',
    blurb: 'Repeat a chance experiment and watch the long-run frequency settle onto the probability.',
    thumb(c, p) {

      p.grid(1, { axes: false });
      p.path([[0, 0], [10, 0]], { stroke: pal['grid-strong'], width: 1.5 }); p.path([[0, 0], [0, 5.2]], { stroke: pal['grid-strong'], width: 1.5 });
      p.path([[0, 2.6], [10, 2.6]], { stroke: pal.muted, width: 1.5, dash: [4, 4] });
      let s = 0, seed = 7; const pts = [];
      for (let i = 1; i <= 120; i++) { seed = (seed * 16807) % 2147483647; s += seed / 2147483647 < .5 ? 1 : 0; pts.push([Math.log10(i) / Math.log10(120) * 10, s / i * 5.2]); }

    },
    hook: String.raw`A die has a 1 in 6 chance of showing a six. Roll it six times. Are you sure to see at least one six?`,
    steps: [
      { title: 'Flip a coin 30 times',
        text: String.raw`<p>Heads has probability \(0.5\). The top graph shows the fraction of heads so far after each flip. The dashed line is the true probability.</p><p>After only a few flips the blue line jumps around. After 30 it is still far from steady.</p>`,
        set: { p: .5, k: 1, reset: true, runTo: 30 } },
      { title: 'Keep going: 1,000 flips',
        text: String.raw`<p>The horizontal axis is logarithmic, so each tick is ten times more flips. As the number of flips grows, the fraction of heads settles near \(0.5\).</p><p>It never locks in exactly, but the wobble shrinks as the flips pile up.</p>`,
        set: { p: .5, k: 1, reset: true, runTo: 1000 } },
      { title: 'A loaded coin',
        text: String.raw`<p>Now the chance of success is \(0.2\). The same thing happens: the fraction of successes settles near \(0.2\).</p><p>That is what a probability means in practice: the fraction of the time something happens in the long run.</p>`,
        set: { p: .2, k: 1, reset: true, runTo: 600 } },
      { title: 'At least one success',
        text: String.raw`<p>Back to the die: \(p=1/6\). The lower graph shows the chance of at least one six in \(k\) rolls. For \(k=6\) it is \(1-(5/6)^6\approx 66\%\), not 100%.</p><p>The hollow dot is a simulation of 1,000 attempts of 6 rolls each. It lands close to the curve.</p>`,
        set: { p: 1 / 6, k: 6, reset: true, runTo: 300, sim: true } }
    ],
    formal: String.raw`
      <p>If an experiment can succeed with probability \(p\), then after many independent repeats the fraction of successes gets close to \(p\). This is the <em>law of large numbers</em>. The typical size of the wobble after \(n\) trials is about \(\sqrt{p(1-p)/n}\), so to cut it in half you need four times as many trials.</p>
      <h3>Independence</h3>
      <p>Trials are <em>independent</em> if the outcome of one does not change the chances of the next. For independent events,
      \[ P(A\text{ and }B)=P(A)\,P(B). \]
      A coin has no memory: after five heads in a row the next flip is still heads with probability \(\tfrac12\).</p>
      <h3>At least one success in \(k\) tries</h3>
      <p>The only way to get no success is to fail every time, which has probability \((1-p)^k\). So
      \[ P(\text{at least one success}) = 1-(1-p)^k. \]
      For a die and \(k=6\): \(1-(5/6)^6\approx 0.665\). It passes \(\tfrac12\) at \(k=4\) and approaches but never reaches \(1\).</p>
      <h3>Expected count</h3>
      <p>In \(n\) trials you expect about \(np\) successes, though the actual number varies.</p>`,
    check: [
      { q: 'A fair coin lands heads five times in a row. What is the probability the next flip is heads?',
        choices: ['Less than 1/2, tails is due', 'Exactly 1/2', 'More than 1/2, heads is hot', 'It cannot be known'], answer: 1,
        why: String.raw`Flips are independent. The coin does not remember the past, so the probability is still \(1/2\).`,
        hint: 'Does the coin know what it did before?' },
      { q: 'You roll a fair die 3 times. What is the chance of at least one six?',
        choices: ['50%', '42%', '17%', '58%'], answer: 1,
        why: String.raw`No six in three rolls has probability \((5/6)^3=125/216\approx 0.58\). So at least one six has probability \(1-0.58\approx 0.42\).`,
        hint: 'Find the chance of no six at all first, then subtract from 1.' }
    ],
    links: { prereq: ['exponential-growth', 'mean-median-and-spread'], next: ['pascals-triangle-and-the-galton-board'] },

    mount({ stage, controls: C }) {
      const st = { p: .5, k: 1 };
      let cum = [], sim = null, cancel = () => {};
      stage.classList.add('split');
      const top = h('div', { class: 'pane', style: 'flex: 1 1 0' }), bot = h('div', { class: 'pane', style: 'flex: 1 1 0' });
      stage.append(top, bot);
      const P1 = new Plane(top, { span: 4 }), P2 = new Plane(bot, { span: 4 });
      const addTrials = n => { for (let i = 0; i < n; i++) cum.push((cum.length ? cum[cum.length - 1] : 0) + (Math.random() < st.p ? 1 : 0)); };
      const clearAll = () => { cum = []; sim = null; };
      const runSim = () => {
        let hit = 0; const N = 1000;
        for (let i = 0; i < N; i++) { let ok = false; for (let j = 0; j < st.k && !ok; j++) ok = Math.random() < st.p; hit += ok ? 1 : 0; }
        sim = { p: st.p, k: st.k, frac: hit / N };
      };

      P1.onDraw = (c, p) => {
        const pal = p.pal, n = cum.length, W = 10, H = 5;
        p.fit(W, H, { l: 1.6, r: .8, t: .9, b: 1.7 });
        const Nmax = n <= 100 ? 100 : n <= 1000 ? 1000 : n <= 10000 ? 10000 : 100000, L = Math.log10(Nmax), ux = i => Math.log10(Math.max(i, 1)) / L * W;
        const fs = clamp(p.scale * .3, 12, 15);
        for (let v = 0; v <= 1.001; v += .25) {
          p.path([[0, v * H], [W, v * H]], { stroke: pal.grid, width: 1.5 });
          p.label(String(v), 0, v * H, { size: fs + 2, italic: false, color: pal.muted, align: 'right', dx: -10 });
        }
        for (let e = 0; e <= L + .001; e++) {
          p.path([[ux(Math.pow(10, e)), 0], [ux(Math.pow(10, e)), H]], { stroke: pal.grid, width: 1.5 });
          p.label(Math.pow(10, e).toLocaleString('en'), ux(Math.pow(10, e)), 0, { size: fs + 2, italic: false, color: pal.muted, dy: 16 });
        }
        p.path([[0, 0], [W, 0]], { stroke: pal['grid-strong'], width: 2 }); p.path([[0, 0], [0, H]], { stroke: pal['grid-strong'], width: 2 });
        p.path([[0, st.p * H], [W, st.p * H]], { stroke: pal.text, width: 2, dash: [8, 6] });
        p.label('p = ' + num(st.p), W, st.p * H, { size: fs + 3, italic: false, align: 'right', dy: st.p > .5 ? 16 : -16 });
        p.label('fraction of successes so far', 0, H, { size: fs + 2, italic: false, color: pal.muted, align: 'left', dy: -16 });
        p.label('number of trials (log scale)', W, 0, { size: fs + 2, italic: false, color: pal.muted, align: 'right', dy: 36 });
        if (n) {
          const stride = Math.max(1, Math.floor(n / 700)), pts = [];
          for (let i = 1; i <= n; i += stride) pts.push([ux(i), cum[i - 1] / i * H]);
          pts.push([ux(n), cum[n - 1] / n * H]);
          p.path(pts, { stroke: pal.blue, width: 3 });
          p.dot(ux(n), cum[n - 1] / n * H, 6, pal.blue, pal.stage, 2);
        }
      };

      P2.onDraw = (c, p) => {
        const pal = p.pal, W = 10, H = 5, K = 20, ux = k => k / K * W, vy = v => v * H;
        p.fit(W, H, { l: 1.6, r: .8, t: .9, b: 1.7 });
        const fs = clamp(p.scale * .3, 12, 15);
        for (let v = 0; v <= 1.001; v += .25) {
          p.path([[0, vy(v)], [W, vy(v)]], { stroke: pal.grid, width: 1.5 });
          p.label(String(v), 0, vy(v), { size: fs + 2, italic: false, color: pal.muted, align: 'right', dx: -10 });
        }
        for (let k = 0; k <= K; k += 2) {
          p.path([[ux(k), 0], [ux(k), H]], { stroke: pal.grid, width: 1.5 });
          p.label(String(k), ux(k), 0, { size: fs + 2, italic: false, color: pal.muted, dy: 16 });
        }
        p.path([[0, 0], [W, 0]], { stroke: pal['grid-strong'], width: 2 }); p.path([[0, 0], [0, H]], { stroke: pal['grid-strong'], width: 2 });
        p.label('chance of at least one success in k tries', 0, H, { size: fs + 2, italic: false, color: pal.muted, align: 'left', dy: -16 });
        p.label('tries k', W, 0, { size: fs + 2, italic: false, color: pal.muted, align: 'right', dy: 36 });
        const pts = []; for (let i = 0; i <= 200; i++) { const k = K * i / 200; pts.push([ux(k), vy(atLeast(st.p, k))]); }
        p.path(pts, { stroke: pal.blue, width: 3 });
        for (let k = 1; k <= K; k++) p.dot(ux(k), vy(atLeast(st.p, k)), 3.5, pal.blue);
        const y = vy(atLeast(st.p, st.k));
        p.path([[ux(st.k), 0], [ux(st.k), y], [0, y]], { stroke: pal['grid-strong'], width: 1.5, dash: [5, 6] });
        p.dot(ux(st.k), y, 8, pal.blue, pal.stage, 2.5);
        p.label(pct(atLeast(st.p, st.k)), ux(st.k), y, { size: fs + 4, italic: false, color: pal.blue, dx: 14, dy: y > H * .8 ? 18 : -16, align: 'left' });
        if (sim && sim.p === st.p && sim.k === st.k) {
          p.dot(ux(st.k), vy(sim.frac), 9, null, pal.red, 3);
          p.label('simulated ' + pct(sim.frac), ux(st.k), vy(sim.frac), { size: fs + 2, italic: false, color: pal.red, dx: 14, dy: y > H * .8 ? 36 : 18, align: 'left' });
        }
      };

      const upd = () => {
        const n = cum.length, s = n ? cum[n - 1] : 0;
        ro.innerHTML = `<span class="k">Trials</span> ${n.toLocaleString('en')} &nbsp; <span class="k">Successes</span> ${s.toLocaleString('en')}<br>` +
          `<span class="k">Fraction</span> ${n ? (s / n).toFixed(3) : '—'} <span class="k">(p = ${num(st.p)})</span><br>` +
          `<span class="k">At least one in ${st.k}</span> ${(atLeast(st.p, st.k) * 100).toFixed(1)}%` + (sim && sim.p === st.p && sim.k === st.k ? ` <span class="k">(sim ${(sim.frac * 100).toFixed(1)}%)</span>` : '');
      };
      const draw = () => { P1.draw(); P2.draw(); upd(); };
      const sync = () => { pS.set(st.p); kS.set(st.k); draw(); };
      const stop = () => { cancel(); cancel = () => {}; };

      C.title('Experiment');
      const pS = C.slider({ label: 'Probability of success p', min: .05, max: .95, step: .01, value: st.p, format: v => num(v),
        onInput: v => { stop(); st.p = v; clearAll(); draw(); } });
      C.buttons([
        { label: '+10 trials', primary: true, onClick: () => { stop(); addTrials(10); draw(); } },
        { label: '+100', onClick: () => { stop(); addTrials(100); draw(); } },
        { label: '+1,000', onClick: () => { stop(); addTrials(1000); draw(); } },
        { label: 'Reset', onClick: () => { stop(); clearAll(); draw(); } }
      ]);
      C.title('At least one success');
      const kS = C.slider({ label: 'Tries k', min: 1, max: 20, step: 1, value: st.k, format: v => String(Math.round(v)),
        onInput: v => { stop(); st.k = v; draw(); } });
      C.buttons([{ label: 'Simulate 1,000 attempts', onClick: () => { stop(); runSim(); draw(); } }]);
      const ro = C.readout(); upd();

      const apply = (patch, immediate) => {
        stop();
        if (patch.p !== undefined) st.p = patch.p;
        if (patch.k !== undefined) st.k = patch.k;
        if (patch.reset) clearAll();
        const to = patch.runTo || cum.length, from = cum.length;
        const finish = () => { if (patch.sim) runSim(); sync(); };
        if (immediate || reduceMotion || to <= from) { addTrials(Math.max(0, to - from)); finish(); return; }
        /* log-time ramp: the count grows by a constant factor per frame, matching the log axis */
        cancel = tween(1800, q => { const target = Math.floor(Math.pow(to, q)); if (target > cum.length) addTrials(target - cum.length); sync(); }, () => { if (cum.length < to) addTrials(to - cum.length); finish(); });
      };
      return { destroy: () => { stop(); P1.destroy(); P2.destroy(); }, apply };
    }
  });
}

/* =====================================================================
   SCHOOL — Pascal's triangle and the Galton board
   ===================================================================== */
{
  const binom = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); };
  const ROW_MS = 85, DY = .9;

  register({
    id: 'pascals-triangle-and-the-galton-board', level: 'school',
    title: "Pascal's triangle and the Galton board",
    blurb: 'Drop balls through a board of pegs and watch the paths of Pascal\'s triangle build a bell shape.',
    thumb(c, p) {
      const pal = p.pal, R = 6; p.cx = 0; p.cy = -3.4; p.span = 4.4;
      for (let r = 0; r < R; r++) for (let j = 0; j <= r; j++) p.dot(j - r / 2, -r * .9, 2.6, pal['grid-strong']);
      for (let j = 0; j <= R; j++) {
        const h = binom(R, j) / 20 * 3.2;
        p.path([[j - R / 2 - .35, -R * .9 - 1.1], [j - R / 2 + .35, -R * .9 - 1.1], [j - R / 2 + .35, -R * .9 - 1.1 + h], [j - R / 2 - .35, -R * .9 - 1.1 + h]], { fill: alpha(pal.blue, .7), close: true });
      }
    },
    hook: String.raw`Balls bounce left or right at random as they fall through a board of pegs. Why do they pile up in a smooth bell shape instead of spreading evenly?`,
    steps: [
      { title: 'Count the paths',
        text: String.raw`<p>At every peg a ball goes left or right. The number on each peg counts the different paths that lead there. Each is the sum of the two numbers above it.</p><p>The bottom row, \(1,4,6,4,1\), is row 4 of <b>Pascal's triangle</b>. There are \(2^4=16\) paths in all.</p>`,
        set: { rows: 4, p: .5, reset: true, nums: true, theory: false, drop: 0 } },
      { title: 'Drop some balls',
        text: String.raw`<p>Press <b>Drop 10</b> or <b>Drop 100</b>. The middle bin gets the most balls because \(6\) of the \(16\) paths end there, while each edge bin has only \(1\).</p><p>With equally likely paths, more paths means more balls.</p>`,
        set: { rows: 4, p: .5, reset: true, nums: true, theory: false, drop: 80 } },
      { title: 'More rows, a bell',
        text: String.raw`<p>With \(10\) rows there are \(1024\) paths and the pile forms a bell. The rings show the expected counts from Pascal's numbers.</p><p>Real piles wobble around the rings, and settle onto them as more balls fall.</p>`,
        set: { rows: 10, p: .5, reset: true, nums: false, theory: true, drop: 300 } },
      { title: 'Tilt the board',
        text: String.raw`<p>Now each peg sends a ball right only \(30\%\) of the time. The pile shifts left and becomes lopsided.</p><p>Paths are no longer equally likely. A path with \(j\) rights has chance \(p^j(1-p)^{n-j}\), and there are \(\binom{n}{j}\) such paths.</p>`,
        set: { rows: 10, p: .3, reset: true, nums: false, theory: true, drop: 300 } }
    ],
    formal: String.raw`
      <h3>Pascal's triangle</h3>
      <p>Row \(n\) of Pascal's triangle lists the numbers \(\binom{n}{0},\binom{n}{1},\ldots,\binom{n}{n}\), where each entry is the sum of the two above it:
      \[ \binom{n}{j}=\binom{n-1}{j-1}+\binom{n-1}{j}. \]
      It counts paths: to reach a peg you must arrive from the peg up-left or the peg up-right, so the paths to it are the paths to those two added together. The row sums are \(1,2,4,8,\ldots=2^n\).</p>
      <h3>Choosing</h3>
      <p>A ball's trip is a string of \(n\) left or right choices. The ball lands in bin \(j\) exactly when \(j\) of them are right, and \(\binom{n}{j}=\dfrac{n!}{j!\,(n-j)!}\) counts the strings with \(j\) rights.</p>
      <h3>The binomial distribution</h3>
      <p>If each peg sends the ball right with probability \(p\), the chance of landing in bin \(j\) is
      \[ P(j)=\binom{n}{j}\,p^{j}\,(1-p)^{n-j}. \]
      For \(p=\tfrac12\) every path has the same chance \(2^{-n}\), so \(P(j)=\binom{n}{j}/2^n\), the bell shape you see. As the number of rows grows, this shape approaches the normal curve.</p>`,
    check: [
      { q: 'What is the next row of Pascal\'s triangle after 1, 4, 6, 4, 1?',
        choices: ['1, 5, 10, 10, 5, 1', '1, 4, 6, 4, 1, 1', '1, 5, 9, 9, 5, 1', '1, 8, 12, 8, 1'], answer: 0,
        why: String.raw`Each entry is the sum of the two above: \(1,\ 1+4,\ 4+6,\ 6+4,\ 4+1,\ 1\) gives \(1,5,10,10,5,1\).`,
        hint: 'Each number is the sum of the two numbers above it. The edges are always 1.' },
      { q: 'A Galton board has 4 rows and each peg is fair. What fraction of balls should land in the middle bin?',
        choices: ['1/16', '4/16', '6/16', '8/16'], answer: 2,
        why: String.raw`The middle bin has \(\binom{4}{2}=6\) paths out of \(2^4=16\), so \(6/16=37.5\%\) of the balls.`,
        hint: 'Count the paths to the middle bin and divide by all 16 paths.' }
    ],
    links: { prereq: ['probability-with-repeated-trials'], related: ['mean-median-and-spread'] },

    mount({ stage, controls: C }) {
      const st = { rows: 4, p: .5 };
      let bins = [], total = 0, balls = [], queue = 0, raf = null, last = 0, acc = 0, showNums = true, showTheory = false;
      const P = new Plane(stage, { span: 8 });
      const resetBoard = () => { bins = new Array(st.rows + 1).fill(0); total = 0; balls = []; queue = 0; };
      resetBoard();
      const newBall = () => { const dirs = Array.from({ length: st.rows }, () => Math.random() < st.p ? 1 : 0); return { dirs, t: -.8, j: dirs.reduce((a, b) => a + b, 0) }; };
      const prob = j => binom(st.rows, j) * Math.pow(st.p, j) * Math.pow(1 - st.p, st.rows - j);

      const HB = 4;
      /* bar geometry shared by the drawing and by falling balls, so a ball lands on top of its bar */
      const geom = () => {
        const R = st.rows, bottom = -R * DY - .7 - HB;
        const maxC = Math.max(8, ...bins, showTheory ? total * Math.max(...bins.map((_, j) => prob(j))) : 0);
        return { R, bottom, unit: HB / maxC };
      };
      const ballPos = b => {
        const R = st.rows, t = Math.max(b.t, 0);
        if (b.t < 0) return [0, -b.t * DY];
        if (t >= R) return [b.j - R / 2, -R * DY - (t - R) * DY * 1.8];
        const r = Math.floor(t), f = t - r;
        let j = 0; for (let i = 0; i < r; i++) j += b.dirs[i];
        const x0 = j - r / 2, x1 = x0 + b.dirs[r] - .5, e = f * f * (3 - 2 * f);
        return [x0 + (x1 - x0) * e, -(r + f) * DY];
      };

      P.onDraw = (c, p) => {
        const { R, bottom, unit } = geom(), pal = p.pal;
        const topEdge = 1.3, botEdge = bottom - .9, sc = Math.min(p.w / (R + 2.8), p.h / (topEdge - botEdge));
        p.span = Math.min(p.w, p.h) / (2 * sc); p.cx = 0; p.cy = (topEdge + botEdge) / 2;
        const fs = clamp(p.scale * .38, 11, 16), rp = clamp(p.scale * .09, 2.5, 4.5);
        for (let r = 0; r < R; r++) for (let j = 0; j <= r; j++) p.dot(j - r / 2, -r * DY, rp, pal['grid-strong']);
        if (showNums) for (let r = 0; r <= R; r++) for (let j = 0; j <= r; j++)
          p.label(String(binom(r, j)), j - r / 2, -r * DY, { size: fs + 3, italic: false, color: pal.muted, dy: -12 });
        p.path([[-R / 2 - .6, bottom], [R / 2 + .6, bottom]], { stroke: pal['grid-strong'], width: 2 });
        bins.forEach((n, j) => {
          const x = j - R / 2, h = n * unit;
          if (h > 0) p.path([[x - .38, bottom], [x + .38, bottom], [x + .38, bottom + h], [x - .38, bottom + h]], { fill: alpha(pal.blue, .8), close: true });
          p.label(String(n), x, bottom, { size: fs + 2, italic: false, color: pal.muted, dy: 14 });
          if (showTheory && total) p.dot(x, bottom + total * prob(j) * unit, Math.max(5, rp * 1.8), null, pal.red, 2.5);
        });
        for (const b of balls) { const [x, y] = ballPos(b); p.dot(x, y, rp * 1.7, pal.yellow, pal.stage, 1.5); }
      };

      const upd = () => {
        const R = st.rows, mx = bins.indexOf(Math.max(...bins));
        ro.innerHTML = `<span class="k">Rows</span> n = ${R} &nbsp; <span class="k">Paths</span> 2<sup>${R}</sup> = ${Math.pow(2, R).toLocaleString('en')}<br>` +
          `<span class="k">Balls dropped</span> ${total}` + (total ? `<br><span class="k">Fullest bin</span> ${mx} (${(bins[mx] / total * 100).toFixed(0)}% of balls; theory ${(prob(mx) * 100).toFixed(0)}%)` : '');
      };
      const draw = () => { P.draw(); upd(); };
      const land = b => { bins[b.j]++; total++; };
      const tick = now => {
        if (!last) last = now;
        const dt = Math.min(now - last, 60); last = now; acc += dt;
        const iv = queue > 60 ? 14 : queue > 15 ? 40 : 160;
        while (queue > 0 && acc >= iv) { acc -= iv; balls.push(newBall()); queue--; }
        if (!queue) acc = 0;
        for (const b of balls) b.t += dt / ROW_MS;
        const g = geom();
        balls = balls.filter(b => { if (b.t >= st.rows && ballPos(b)[1] <= g.bottom + bins[b.j] * g.unit) { land(b); return false; } return true; });
        draw();
        if (balls.length || queue) raf = requestAnimationFrame(tick); else { raf = null; last = 0; }
      };
      const dropBalls = n => {
        if (reduceMotion) { for (let i = 0; i < n; i++) land(newBall()); draw(); return; }
        queue += n; if (!raf) { last = 0; raf = requestAnimationFrame(tick); }
      };
      const stop = () => { if (raf) cancelAnimationFrame(raf); raf = null; last = 0; queue = 0; balls = []; };
      const sync = () => { rowS.set(st.rows); pS.set(st.p); draw(); };

      C.title('Board');
      const rowS = C.slider({ label: 'Rows of pegs', min: 2, max: 12, step: 1, value: st.rows, format: v => String(Math.round(v)),
        onInput: v => { stop(); st.rows = Math.round(v); resetBoard(); draw(); } });
      const pS = C.slider({ label: 'Chance of bouncing right', min: .1, max: .9, step: .05, value: st.p, format: v => Math.round(v * 100) + '%',
        onInput: v => { stop(); st.p = Math.round(v * 100) / 100; resetBoard(); draw(); } });
      C.buttons([
        { label: 'Drop 1', onClick: () => dropBalls(1) },
        { label: 'Drop 10', primary: true, onClick: () => dropBalls(10) },
        { label: 'Drop 100', onClick: () => dropBalls(100) },
        { label: 'Clear', onClick: () => { stop(); resetBoard(); draw(); } }
      ]);
      C.title('Show');
      const numT = C.toggle({ label: "Pascal's triangle numbers", value: showNums, onChange: v => { showNums = v; P.draw(); } });
      const thT = C.toggle({ label: 'Expected counts (rings)', value: showTheory, onChange: v => { showTheory = v; P.draw(); } });
      const ro = C.readout(); upd();

      const apply = (patch, immediate) => {
        stop();
        if (patch.rows !== undefined) st.rows = patch.rows;
        if (patch.p !== undefined) st.p = patch.p;
        if (patch.nums !== undefined) { showNums = patch.nums; numT.checked = showNums; }
        if (patch.theory !== undefined) { showTheory = patch.theory; thT.checked = showTheory; }
        if (patch.reset || patch.rows !== undefined) resetBoard();
        sync();
        if (patch.drop) { if (immediate) { for (let i = 0; i < patch.drop; i++) land(newBall()); draw(); } else dropBalls(patch.drop); }
      };
      return { destroy: () => { stop(); P.destroy(); }, apply };
    }
  });
}
