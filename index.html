    formal: String.raw`
      <p>Two different lines in a plane either cross at exactly one point or never meet. Lines that never meet are <em>parallel</em>. Lines that cross at a right angle (\(90^\circ\)) are <em>perpendicular</em>. Both ideas are about slope, so write a non-vertical line as \(y=mx+b\).</p>
      <h3>Parallel lines have equal slopes</h3>
      <p>The lines \(y=m_1x+b_1\) and \(y=m_2x+b_2\) are parallel exactly when \(m_1=m_2\) and \(b_1\neq b_2\). Then the vertical gap between them is \(b_1-b_2\) at every \(x\). It never changes, so it is never \(0\). If the slopes differ, the gap \((m_1-m_2)x+(b_1-b_2)\) changes steadily and is \(0\) at one value of \(x\), where the lines cross.</p>
      <h3>Perpendicular lines have negative reciprocal slopes</h3>
      <p>Two lines that are neither horizontal nor vertical are perpendicular exactly when
      \[ m_1m_2=-1, \qquad\text{that is,}\qquad m_2=-\frac{1}{m_1}. \]
      To get the new slope, flip the fraction (swap rise and run) and change the sign. The slope \(\tfrac{2}{3}\) becomes \(-\tfrac{3}{2}\).</p>
      <p><b>Why.</b> Draw a slope triangle on a line, with run \(a\) and rise \(b\), so the slope is \(m=\tfrac{b}{a}\). Turn the whole picture, triangle and line, a quarter turn counterclockwise about a point on the line. The step "\(a\) right, \(b\) up" becomes "\(b\) left, \(a\) up": a run of \(-b\) and a rise of \(a\). A turn keeps lengths and angles, so the turned line makes a \(90^\circ\) angle with the original. Its slope is
      \[ \frac{a}{-b}=-\frac{a}{b}=-\frac{1}{m}, \qquad\text{and}\qquad \frac{b}{a}\cdot\left(-\frac{a}{b}\right)=-1. \]
      Any line with slope \(-\tfrac{a}{b}\) is parallel to the turned line, so it is perpendicular to the original as well.</p>
      <h3>The line through a given point</h3>
      <p>To build the line through \(P=(x_1,y_1)\) with slope \(m\), use <em>point-slope form</em>:
      \[ y-y_1=m\,(x-x_1). \]
      It says that from \(P\) the change in \(y\) is \(m\) times the change in \(x\). Multiply out and move \(y_1\) to the right side to get slope-intercept form \(y=mx+b\), where \(b=y_1-mx_1\).</p>
      <p>The recipe: read the slope \(m\) of the given line. Use \(m\) for the parallel or \(-\tfrac{1}{m}\) for the perpendicular. Put \(P\) into point-slope form.</p>
      <h3>Worked example</h3>
      <p>Find the lines through \(P=(-1,-2)\) that are parallel and perpendicular to \(y=-\tfrac{1}{2}x+1\).</p>
      <p><b>Parallel.</b> The slope stays \(-\tfrac{1}{2}\). Then \(y+2=-\tfrac{1}{2}(x+1)\), so \(y=-\tfrac{1}{2}x-\tfrac{1}{2}-2=-\tfrac{1}{2}x-\tfrac{5}{2}\).</p>
      <p><b>Perpendicular.</b> Flip \(-\tfrac{1}{2}\) to get \(-2\), then change the sign to get \(2\). Check: \(-\tfrac{1}{2}\cdot 2=-1\). Then \(y+2=2(x+1)\), so \(y=2x+2-2=2x\).</p>
      <h3>Horizontal and vertical lines</h3>
      <p>A horizontal line \(y=c\) has slope \(0\). A vertical line \(x=c\) has no slope, because its run is \(0\) and you cannot divide by \(0\). The rule \(m_1m_2=-1\) does not cover these two cases, so use the picture.<br>
      Given a horizontal line: the parallel through \(P\) is \(y=y_1\), and the perpendicular is the vertical line \(x=x_1\).<br>
      Given a vertical line: the parallel through \(P\) is \(x=x_1\), and the perpendicular is the horizontal line \(y=y_1\).</p>
      <h3>Checking an answer on a graph</h3>
      <p>1. Does the line go through \(P\)? Put the coordinates of \(P\) into your equation.<br>
      2. From \(P\), count the slope. For a parallel, use the same run and rise as the given line. For a perpendicular, the run and rise swap and one sign changes.<br>
      3. Read where your line crosses the y-axis and compare it with \(b\) in your equation.<br>
      4. Look at the corner where the perpendicular meets the given line. It should be a square corner. On a graphing tool, give both axes the same scale, or right angles will not look right.</p>`,
    check: [

    mount({ stage, controls: C }) {
      /* L: the blue line, through A with direction (dx, dy). P: the point. Q = P + (qx, qy): the ring on your line. rot: quarter turn of the copied triangle, 0 to 1. */
      const st = { ax: -3, ay: -1, dx: 3, dy: 2, px: 3, py: -1, qx: -2, qy: -1, rot: 0 };
      const fl = { scaf: true, par: false, perp: false, chk: false, goal: 'par', eqp: false };
      let cancel = () => {}, target = null, msg = '', warn = '', pi = 0, eqPick = -1, eqKey = '', eqOpts = [];
      /* A running animation always ends on its target, so the state stays on whole grid points when the student acts mid-way. */
      const finish = () => { cancel(); if (target) { Object.assign(st, target); target = null; } };
      const run = (patch, ms) => { finish(); target = patch; cancel = animateTo(st, patch, ms, sync, () => { target = null; }); };
      const P = new Plane(stage, { cx: 0, cy: 0, span: 8.6 });
      /* the view always shows x from -6.7 to 6.7 and y from -8.5 to 8.5 at least, with equal scales on both axes */
      const fitView = p => { const sc = Math.min(p.w / 13.4, p.h / 17); p.span = Math.min(p.w, p.h) / (2 * sc); p.cx = 0; p.cy = 0; };
      /* how far the ring on your line may go: the grid points that are on screen */
      const room = () => ({ x: Math.max(4, Math.floor(P.w / (2 * P.scale) - .4)), y: Math.max(4, Math.floor(P.h / (2 * P.scale) - .4)) });

      const kind = () => {
        const cr = st.dx * st.qy - st.dy * st.qx, dt = st.dx * st.qx + st.dy * st.qy;
        return zero(cr) ? 'par' : zero(dt) ? 'perp' : 'none';
      };
      const unit = (x, y) => { const n = Math.hypot(x, y) || 1; return [x / n, y / n]; };
      const foot = () => {
        const { ax, ay, dx, dy, px, py } = st, t = ((px - ax) * dx + (py - ay) * dy) / ((dx * dx + dy * dy) || 1);
        return [ax + t * dx, ay + t * dy];
      };
      /* the part of a line that is on screen */
      const ext = (x, y, ux, uy, bd) => {
        if (Math.hypot(ux, uy) < 1e-9) return null;
        let t0 = -1e9, t1 = 1e9;
        const lim = (p, u, lo, hi) => {
          if (Math.abs(u) < 1e-9) return;
          let a = (lo - p) / u, b = (hi - p) / u; if (a > b) [a, b] = [b, a];
          t0 = Math.max(t0, a); t1 = Math.min(t1, b);
        };

      };

      /* ---------- drawing helpers ---------- */
      const tri = (p, c0, c1, c2, col, t1, t2, fs, o = {}) => {
        const a = o.a ?? 1, la = o.la ?? 1, pts = [c0, c1, c2];
        p.path(pts, { fill: alpha(col, .13 * a), close: true });
        p.path(pts, { stroke: alpha(col, .95 * a), width: 2.6, dash: [7, 6] });
        const area = Math.abs((c1[0] - c0[0]) * (c2[1] - c1[1]) - (c1[1] - c0[1]) * (c2[0] - c1[0])) / 2;
        const g = [(c0[0] + c1[0] + c2[0]) / 3, (c0[1] + c1[1] + c2[1]) / 3];
        [[c0, c1, t1], [c1, c2, t2]].forEach(([u, v, t]) => {
          if (!t || Math.hypot(v[0] - u[0], v[1] - u[1]) < 1e-6) return;
          const mx = (u[0] + v[0]) / 2, my = (u[1] + v[1]) / 2;
          let n;
          if (area < 1e-6) {   /* flat triangle: put the label beside the leg */
            n = unit(-(p.Y(v[1]) - p.Y(u[1])), p.X(v[0]) - p.X(u[0]));
            if (n[1] > 1e-9 || (Math.abs(n[1]) < 1e-9 && n[0] < 0)) n = [-n[0], -n[1]];
          } else n = unit(p.X(mx) - p.X(g[0]), p.Y(my) - p.Y(g[1]));
          p.label(t, mx, my, { size: fs, italic: false, alpha: la * Math.min(1, a + .3), dx: n[0] * 20, dy: n[1] * 16 });
          if (o.taken && la > .5) o.taken.push([p.X(mx) + n[0] * 20, p.Y(my) + n[1] * 16, t.length * 3.8]);
        });
      };
      const square = (p, x, y, u1, u2, col) => {
        const s = Math.max(.5, 19 / p.scale);
        p.path([[x, y], [x + s * u1[0], y + s * u1[1]], [x + s * (u1[0] + u2[0]), y + s * (u1[1] + u2[1])], [x + s * u2[0], y + s * u2[1]]],
          { fill: alpha(col, .24), stroke: col, width: 2, close: true });
      };
      let taken = [];   /* pixel positions of labels drawn so far in this frame: [x, y, half width] */
      /* slope tag beside a line, near its right-hand end (above it, unless that sits on the tick numbers or on a ring) */
      const tag = (p, e, ux, uy, text, col, fs, avoid) => {
        if (!e) return;
        let [[x0, y0], [x1, y1]] = e;
        if (x0 > x1 + 1e-9 || (Math.abs(x0 - x1) < 1e-9 && y0 > y1)) [[x0, y0], [x1, y1]] = [[x1, y1], [x0, y0]];
        if (ux < -1e-9 || (Math.abs(ux) < 1e-9 && uy < 0)) { ux = -ux; uy = -uy; }
        const L = Math.hypot(ux, uy) || 1, nx = -uy / L, ny = ux / L, vert = Math.abs(nx) > .7;
        const at = (t, side) => [clamp(p.X(x0 + (x1 - x0) * t) + side * nx * 13, 46, p.w - 46), clamp(p.Y(y0 + (y1 - y0) * t) - side * ny * 19, 16, p.h - 16), side];
        const free = ([sx, sy]) => Math.abs(sy - (p.Y(0) + 15)) >= 13 && avoid.every(([rx, ry]) => Math.abs(sx - rx) > 56 || Math.abs(sy - ry) > 20);
        let pos = null;
        for (const t of [.87, .76, .65, .54, .43]) { for (const side of [1, -1]) { const c = at(t, side); if (free(c)) { pos = c; break; } } if (pos) break; }
        if (!pos) pos = at(.87, 1);
        const [mx, my] = p.toMath(pos[0], pos[1]);
        p.label(text, mx, my, { size: fs, italic: false, color: col, align: vert ? (pos[2] * nx < 0 ? 'right' : 'left') : 'center' });
        taken.push([pos[0] + (vert ? (pos[2] * nx < 0 ? -1 : 1) * text.length * 3.8 : 0), pos[1], text.length * 3.8]);
      };
      const dirAng = (ux, uy) => Math.atan2(-uy, ux);
      const mTag = (run, rise) => zero(run) ? 'm undefined' : 'm = ' + frac(rise, run);

      /* a small caption drawn on the canvas, so feedback is next to the drag */
      const banner = (p, rows, x, y, edge, anchor = 'tl') => {
        const c = p.ctx, bf = clamp(p.w / 30, 12.5, 15.5), lh = bf * 1.5, fnt = r => `${r.b ? 600 : 500} ${bf}px "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif`;
        let w = 0; rows.forEach(r => { c.font = fnt(r); w = Math.max(w, c.measureText(r.t).width); });
        w = Math.min(w + 22, p.w - 2 * x); const hh = rows.length * lh + 12, bx = anchor === 'bc' ? (p.w - w) / 2 : x, by = anchor === 'bc' ? p.h - y - hh : y;
        c.save();
        c.beginPath(); if (c.roundRect) c.roundRect(bx, by, w, hh, 8); else c.rect(bx, by, w, hh);
        c.fillStyle = alpha(p.pal.stage, .93); c.fill(); c.strokeStyle = edge; c.lineWidth = 1.6; c.stroke();
        c.textAlign = 'left'; c.textBaseline = 'middle';
        rows.forEach((r, i) => { c.font = fnt(r); c.fillStyle = r.c || p.pal.text; c.fillText(r.t, bx + 11, by + 6 + lh * (i + .5), w - 16); });
        c.restore();
      };
      const shortWhy = k => {
        const { dx, dy, qx, qy } = st, a = sl(dx, dy), b = sl(qx, qy), aV = zero(dx), bV = zero(qx);
        if (k === 'par') return aV ? 'both lines are vertical' : `both slopes are ${a}`;
        if (k === 'perp') return aV || bV ? 'horizontal meets vertical' : `${wrap(a)} × ${wrap(b)} = −1`;
        return aV || bV ? 'one vertical, one slanted' : `slopes ${a} and ${b}: not equal, product ${frac(dy * qy, dx * qx)}`;
      };

      P.onDraw = (c, p) => {
        fitView(p); taken = [];
        const pal = p.pal, bd = p.bounds(), fs = clamp(p.scale * .5, 16.5, 20), k = kind();
        const { ax, ay, dx, dy, px, py, qx, qy, rot } = st;
        p.grid(1); p.ticks(1);

        /* slope triangles: on the blue line, copied to P, and the copy turned a quarter turn */
        if (fl.scaf) {
          tri(p, [ax, ay], [ax + dx, ay], [ax + dx, ay + dy], pal.blue, 'run ' + num(dx), 'rise ' + num(dy), fs, { taken });
          tri(p, [px, py], [px + dx, py], [px + dx, py + dy], pal.green, 'run ' + num(dx), 'rise ' + num(dy), fs, { a: rot > .001 ? .45 : 1, la: rot > .001 ? 0 : 1, taken });
          if (rot > .001) {
            const th = rot * Math.PI / 2, cs = Math.cos(th), sn = Math.sin(th), R = (u, v) => [px + u * cs - v * sn, py + u * sn + v * cs];
            tri(p, [px, py], R(dx, 0), R(dx, dy), pal.red, 'rise ' + num(dx), 'run ' + num(-dy), fs, { la: clamp((rot - .85) / .15, 0, 1), taken });
            if (rot < .98) {

              c.beginPath(); c.arc(p.X(px), p.Y(py), 1.1 * p.scale, -a0, -(a0 + th), true);
              c.strokeStyle = pal.violet; c.lineWidth = 2.5; c.stroke();
            } else square(p, px, py, unit(dx, dy), unit(-dy, dx), pal.violet);
          }
        }

        /* the lines */
        const line = (x, y, ux, uy, col, w, dash) => { const e = ext(x, y, ux, uy, bd); if (e) p.path(e, { stroke: col, width: w, dash }); return e; };
        const eL = line(ax, ay, dx, dy, pal.blue, 3.6);
        const eP = fl.par ? line(px, py, dx, dy, pal.green, 3.2) : null;
        const eN = fl.perp ? line(px, py, -dy, dx, pal.red, 3.2) : null;
        const col = k === 'par' ? pal.green : k === 'perp' ? pal.red : pal.text;
        const eQ = line(px, py, qx, qy, col, 3.4);
        if (fl.eqp && eqPick >= 0 && eqOpts[eqPick]) { const o = eqOpts[eqPick]; line(o.x, o.y, o.run, o.rise, pal.violet, 3.4, [11, 8]); }

        /* square corner where the perpendicular meets the blue line */
        if (fl.perp || k === 'perp') { const f = foot(); square(p, f[0], f[1], unit(px - f[0], py - f[1]), unit(dx, dy), pal.violet); }

        /* where your line crosses the y-axis */
        if (fl.chk && !zero(qx)) {
          const b = py - qy / qx * px;
          if (Math.abs(b) < bd.y1 - .3) {
            p.dot(0, b, 7, pal.yellow, pal.stage, 2.5);
            p.label('b = ' + frac(py * qx - qy * px, qx), 0, b, { size: fs, italic: false, align: 'left', dx: 13, dy: -15 });

          }
        }

        /* slope tags */
        const avoid = [[ax, ay], [ax + dx, ay + dy], [px + qx, py + qy], [px, py]].map(([x, y]) => [p.X(x), p.Y(y)]);
        tag(p, eL, dx, dy, mTag(dx, dy), pal.blue, fs, avoid);
        if (eP && k !== 'par') tag(p, eP, dx, dy, mTag(dx, dy), pal.green, fs, avoid);
        if (eN && k !== 'perp') tag(p, eN, -dy, dx, mTag(-dy, dx), pal.red, fs, avoid);
        tag(p, eQ, qx, qy, mTag(qx, qy), k === 'none' ? pal.text : col, fs, avoid);

        /* handles */
        const ring = (x, y, dot) => { p.dot(x, y, 8.5, pal.stage, pal.brass, 3); if (dot) p.dot(x, y, 3.4, dot); };
        ring(ax, ay, pal.blue); ring(ax + dx, ay + dy, pal.blue);
        if (!fl.scaf) {

          p.label('tilt', ax + dx, ay + dy, { size: 14, italic: false, color: pal.muted, dy: -19 });
          taken.push([p.X(ax), p.Y(ay) - 19, 16], [p.X(ax + dx), p.Y(ay + dy) - 19, 12]);

        ring(px + qx, py + qy, col);
        p.dot(px, py, 9.5, pal.yellow, pal.brass, 3);

        /* label for P: in the direction farthest from the lines through P (and from the right-hand edge) */
        const angs = [dirAng(qx, qy)]; if (fl.par) angs.push(dirAng(dx, dy)); if (fl.perp) angs.push(dirAng(-dy, dx));
        let best = [-1, -1], bs = -9;
        for (const cd of [[-1, -1], [1, -1], [0, -1], [1, 1], [-1, 1], [0, 1], [-1, 0], [1, 0]]) {
          const ca = Math.atan2(cd[1], cd[0]);
          let m = Math.PI;
          for (const a of angs) { let d = (((ca - a) % Math.PI) + Math.PI) % Math.PI; d = Math.min(d, Math.PI - d); m = Math.min(m, d); }
          m += cd[1] < 0 ? .45 : cd[1] === 0 ? -.2 : 0;
          const lx = p.X(px) + cd[0] * 22, ly = p.Y(py) + cd[1] * (cd[0] === 0 ? 22 : 17);

        if (o.kind === 'ok') return g === 'par'

    <h2>A matrix is a motion of space</h2>
    <p>Every point of the plane is a combination of the two basis vectors \(\hat\imath = (1,0)\) and \(\hat\jmath = (0,1)\). A linear map only needs to decide where those two land. Their images are the columns of the matrix:</p>
    \[ \begin{bmatrix} a & b \\ c & d \end{bmatrix}\begin{bmatrix} x \\ y \end{bmatrix} = x\begin{bmatrix} a \\ c \end{bmatrix} + y\begin{bmatrix} b \\ d \end{bmatrix}. \]

    <h2>The determinant is an area</h2>
    <p>The shaded square starts with area 1. After the map its area is \(|ad-bc|\), and every other region is scaled by the same factor. When \(\det A < 0\) the plane has been flipped over, and when \(\det A = 0\) it has collapsed onto a line or a point.</p>
    <h2>Eigenvectors keep their direction</h2>

      else eg = [...new Set(e.list.map(x => fmt(x.l)))].join(', ');
      let note = '';
      if (Math.abs(det) < 1e-6) note = '<br>The plane collapses: the determinant is zero.';
      else if (det < 0) note = '<br>Negative determinant: orientation flips.';
      ro.innerHTML = `<span class="k">Matrix</span> [${fmt(a,1)}, ${fmt(b,1)}; ${fmt(c,1)}, ${fmt(d,1)}]<br>
        <span class="k">det</span> = ${fmt(det)}<br><span class="k">Eigenvalues</span> ${eg}${note}`;
    };
    const sync = () => { S.forEach((s, i) => s.set(st.M[i])); upd(); };
    const animateTo = M => {
      cancel(); st.M = M.slice(); st.t = 0; sync();
      cancel = tween(1600, q => { st.t = ease(q); P.draw(); });
    };

    C.title('Matrix entries');
    C.hint('Columns are where î and ĵ land. You can also drag the arrow tips.');
    const S = ['a (î, x)', 'c (î, y)', 'b (ĵ, x)', 'd (ĵ, y)'].map((label, j) => {
      const i = [0, 2, 1, 3][j];
      return { i, s: C.slider({ label, min: -3, max: 3, step: .1, value: st.M[i], format: v => fmt(v, 1),
        onInput: v => { cancel(); st.M[i] = v; st.t = 1; upd(); P.requestDraw(); } }) };
    }).sort((x, y) => x.i - y.i).map(x => x.s);
    C.title('Examples');
    C.buttons([
      { label: 'Shear', onClick: () => animateTo([1, 1, 0, 1]) },
      { label: 'Rotate 90°', onClick: () => animateTo([0, -1, 1, 0]) },
      { label: 'Stretch', onClick: () => animateTo([2, 1, 1, 2]) },
      { label: 'Reflect', onClick: () => animateTo([-1, 0, 0, 1]) },
      { label: 'Collapse', onClick: () => animateTo([1, 2, .5, 1]) }
    ]);
    C.buttons([{ label: 'Replay from identity', primary: true, onClick: () => animateTo(st.M) }]);
    C.toggle({ label: 'Show eigenvectors', value: true, onChange: v => { st.eig = v; P.requestDraw(); } });
    const ro = C.readout();

    draggable(P, {
      hit: (px, py) => {
        const [a, b, c, d] = cur();
        const di = Math.hypot(P.X(a) - px, P.Y(c) - py), dj = Math.hypot(P.X(b) - px, P.Y(d) - py);
        if (Math.min(di, dj) > 26) return null; return di <= dj ? 'i' : 'j';
      },
      move: (hd, x, y) => {
        cancel(); st.M = cur(); st.t = 1;
        const r = v => Math.round(clamp(v, -3, 3) * 10) / 10;
        if (hd === 'i') { st.M[0] = r(x); st.M[2] = r(y); } else { st.M[1] = r(x); st.M[3] = r(y); }
        sync(); P.requestDraw();
      }
    });
    sync();
    const startT = setTimeout(() => animateTo(st.M), 500);
    return () => { clearTimeout(startT); cancel(); P.destroy(); };
  }
});

/* =====================================================================
   VISUALIZATION 3 — Conformal maps (graduate)
   ===================================================================== */
const Cx = {
  add: ([a, b], [c, d]) => [a + c, b + d],
  sub: ([a, b], [c, d]) => [a - c, b - d],
  mul: ([a, b], [c, d]) => [a * c - b * d, a * d + b * c],
  div: ([a, b], [c, d]) => { const q = c * c + d * d; return [(a * c + b * d) / q, (b * c - a * d) / q]; }
};
const fmtC = ([x, y]) => `${fmt(x)} ${y < 0 ? '−' : '+'} ${Math.abs(y).toFixed(2)}i`;
const MAPS = {
  sq:   { label: 'f(z) = z²', f: z => Cx.mul(z, z), df: z => [2 * z[0], 2 * z[1]], span: 4.4 },
  exp:  { label: 'f(z) = eᶻ', f: ([x, y]) => { const e = Math.exp(x); return [e * Math.cos(y), e * Math.sin(y)]; },
          df: ([x, y]) => { const e = Math.exp(x); return [e * Math.cos(y), e * Math.sin(y)]; }, span: 4.8 },
  inv:  { label: 'f(z) = 1/z', f: z => Cx.div([1, 0], z), df: z => Cx.div([-1, 0], Cx.mul(z, z)), span: 3.2 },
  sin:  { label: 'f(z) = sin z', f: ([x, y]) => [Math.sin(x) * Math.cosh(y), Math.cos(x) * Math.sinh(y)],
          df: ([x, y]) => [Math.cos(x) * Math.cosh(y), -Math.sin(x) * Math.sinh(y)], span: 4.2 },
  jouk: { label: 'f(z) = z + 1/z (Joukowski)', f: z => Cx.add(z, Cx.div([1, 0], z)), df: z => Cx.sub([1, 0], Cx.div([1, 0], Cx.mul(z, z))), span: 3.4 },
  mob:  { label: 'f(z) = (z − i)/(z + i) (Cayley)', f: z => Cx.div([z[0], z[1] - 1], [z[0], z[1] + 1]),
          df: z => { const w = [z[0], z[1] + 1]; return Cx.div([0, 2], Cx.mul(w, w)); }, span: 2.6 }
};

register({
  id: 'conformal-maps', level: 'grad',
  title: 'Conformal maps of the complex plane',
  blurb: 'Watch holomorphic functions bend a grid while every tiny right angle stays a right angle.',
  thumb(c, p) {
    const pal = p.pal, f = MAPS.sq.f; p.span = 3.2;
    for (let k = -6; k <= 6; k++) {
      const v = k * .25 + 1e-4, A = [], B = [];
      for (let i = 0; i <= 80; i++) { const s = -1.5 + 3 * i / 80; A.push(f([v, s])); B.push(f([s, v])); }
      p.curve(A, { stroke: alpha(pal.blue, .85), width: 1 }); p.curve(B, { stroke: alpha(pal.yellow, .85), width: 1 });
    }
  },
  explain: String.raw`
    <h2>Bending without shearing</h2>
    <p>The grid lives in the \(z\)-plane. Moving the slider carries each point \(z\) along the straight path \((1-t)\,z + t\,f(z)\), so at the end you see the image of the grid under \(f\). The curves bend a lot, but wherever <span class="swatch" style="background:var(--blue)"></span> blue meets <span class="swatch" style="background:var(--yellow)"></span> yellow they still cross at right angles.</p>
    <h2>Why angles survive</h2>
    <p>Near a point \(z_0\), a holomorphic function looks like its first-order approximation:</p>
    \[ f(z_0 + h) \approx f(z_0) + f'(z_0)\,h. \]
    <p>Multiplying by the complex number \(f'(z_0) = r e^{i\theta}\) rotates by \(\theta\) and scales by \(r\). Rotations and uniform scalings preserve angles, so tiny squares map to tiny squares. The green and red cross at the probe point shows this directly. The argument fails only where \(f'(z_0) = 0\): try \(z^2\) with the probe at the origin and watch the right angle open to a straight line, because angles double there.</p>
    <h2>Things to look for</h2>
    <p>Under \(e^z\), horizontal lines become rays and vertical lines become circles, which is the logarithm read backwards. The Cayley map \(\frac{z-i}{z+i}\) sends the upper half-plane onto the unit disk, the classic bridge between two models of hyperbolic geometry. The Joukowski map sends circles near the unit circle to airfoil-like shapes, which is how early aerodynamics computed lift.</p>`,
  mount({ stage, controls: C }) {
    const st = { map: 'sq', grid: 'rect', t: 0, z0: [.8, .55] };
    let cancel = () => {};
    const R = 2;
    const P = new Plane(stage, { span: 2.5 });
    const W = z => { const w = MAPS[st.map].f(z), t = st.t; return [lerp(z[0], w[0], t), lerp(z[1], w[1], t)]; };

    const families = () => {
      const A = [], B = [], n = 260;
      if (st.grid === 'rect') {
        for (let k = -8; k <= 8; k++) {
          const v = k * .25 + 1e-4;
          const a = [], b = [];
          for (let i = 0; i <= n; i++) { const s = -R + 2 * R * i / n + 1e-4; a.push([v, s]); b.push([s, v]); }
          A.push(a); B.push(b);
        }
      } else {
        for (let k = 1; k <= 8; k++) {
          const r = k * .25, a = [];
          for (let i = 0; i <= n; i++) { const th = 2 * Math.PI * i / n; a.push([r * Math.cos(th), r * Math.sin(th)]); }
          A.push(a);
        }
        for (let k = 0; k < 24; k++) {
          const th = k * Math.PI / 12 + 1e-4, b = [];
          for (let i = 1; i <= n; i++) { const r = R * i / n; b.push([r * Math.cos(th), r * Math.sin(th)]); }
          B.push(b);
        }
      }
      return { A, B };
    };
    let fam = families();

    P.onDraw = (ctx, p) => {
      const pal = p.pal;
      p.span = lerp(2.5, MAPS[st.map].span, ease(st.t));
      p.grid(1, { color: alpha(pal.grid, .8) });
      const jump = Math.min(p.w, p.h) * .35;
      for (const l of fam.A) p.curve(l.map(W), { stroke: alpha(pal.blue, .85), width: 1.4, maxJump: jump });
      for (const l of fam.B) p.curve(l.map(W), { stroke: alpha(pal.yellow, .85), width: 1.4, maxJump: jump });

      const z0 = st.z0, w0 = W(z0), hh = .22, seg = dir => {
        const pts = []; for (let i = -10; i <= 10; i++) { const s = i / 10 * hh; pts.push(W([z0[0] + s * dir[0], z0[1] + s * dir[1]])); } return pts;
      };
      p.path([z0, w0], { stroke: pal.muted, width: 1.2, dash: [3, 5] });
      p.dot(z0[0], z0[1], 8, null, pal.text, 2);
      p.curve(seg([1, 0]), { stroke: pal.green, width: 4 });
      p.curve(seg([0, 1]), { stroke: pal.red, width: 4 });
      p.dot(w0[0], w0[1], 5, pal.text);
      p.label(MAPS[st.map].label, p.bounds().x0, p.bounds().y1, { size: 18, align: 'left', dx: 32, dy: 36 });
    };

    const upd = () => {
      const m = MAPS[st.map], z = st.z0, fz = m.f(z), d = m.df(z), r = Math.hypot(d[0], d[1]);
      const ang = Math.atan2(d[1], d[0]) * 180 / Math.PI;
      ro.innerHTML = `<span class="k">z₀</span> = ${fmtC(z)}<br><span class="k">f(z₀)</span> = ${isFinite(fz[0]) ? fmtC(fz) : '∞'}<br>` +
        (r < 1e-3 ? `f′(z₀) = 0, so angles are not preserved here.` :
          isFinite(r) ? `<span class="k">Near z₀, f scales by</span> ${r.toFixed(2)} <span class="k">and rotates by</span> ${fmt(ang, 0)}°` : 'f is undefined at z₀.');
    };
    const setBtn = () => { play.textContent = st.t > .5 ? 'Undo the map' : 'Apply the map'; };
    const run = to => {
      cancel(); const from = st.t;
      cancel = tween(2200 * Math.abs(to - from), q => { st.t = lerp(from, to, ease(q)); tS.set(st.t); P.draw(); }, setBtn);
    };

    C.select({ label: 'Function', value: st.map, options: Object.entries(MAPS).map(([value, m]) => ({ value, label: m.label })),
      onChange: v => { st.map = v; upd(); st.t = 0; tS.set(0); run(1); } });
    C.select({ label: 'Grid', value: st.grid, options: [{ value: 'rect', label: 'Rectangular' }, { value: 'polar', label: 'Polar' }],
      onChange: v => { st.grid = v; fam = families(); P.requestDraw(); } });
    const tS = C.slider({ label: 'Progress', min: 0, max: 1, step: .001, value: 0, format: v => Math.round(v * 100) + '%',
      onInput: v => { cancel(); st.t = v; setBtn(); P.requestDraw(); } });
    const [play] = C.buttons([{ label: 'Apply the map', primary: true, onClick: () => run(st.t < .5 ? 1 : 0) }]);
    C.hint('Tap or drag on the canvas to move the probe z₀ (hollow circle). The green and red cross is the image of a tiny plus sign at z₀.');
    const ro = C.readout();

    draggable(P, {
      hit: () => 'probe', hover: () => true,
      move: (_, x, y) => { st.z0 = [clamp(x, -R, R), clamp(y, -R, R)]; upd(); P.requestDraw(); }
    });
    upd();
    const startT = setTimeout(() => run(1), 500);
    return () => { clearTimeout(startT); cancel(); P.destroy(); };
  }
});

const NUMERALS = { school: '01', ugrad: '02', grad: '03' };

function renderHome(app) {
  document.title = 'Continuum: mathematics you can move';
  const heroCanvas = h('div', { class: 'hero-canvas', 'aria-hidden': 'true' });
  const cells = [0, 1, 2, 3].map(() => h('span', { class: 'm' }));
  const detEl = h('span', { class: 'v' }), eigEl = h('span', { class: 'v' });
  app.append(h('section', { class: 'hero' }, heroCanvas,
    h('div', { class: 'wrap hero-inner' },
      h('div', { class: 'hero-copy' },
        h('h1', { class: 'display hero-title' }, h('span', { class: 'line' }, 'Mathematics'), h('span', { class: 'line' }, 'you can move.')),
        h('p', { class: 'hero-sub' }, 'Interactive visualizations from middle school through graduate study. Drag, slide, and watch each idea change shape.'),
        h('div', { class: 'hero-cta' },
          h('a', { class: 'btn primary', href: '#/viz/linear-transformations' }, 'Start with linear maps'),
          h('a', { class: 'btn', href: '#/level/school' }, 'Browse all topics'))),
      h('div', { class: 'instrument', 'aria-hidden': 'true' },
        h('div', { class: 'inst-item inst-matrix' }, h('span', { class: 'k' }, 'Matrix on screen'), h('span', { class: 'matrix' }, cells)),
        h('div', { class: 'inst-item' }, h('span', { class: 'k' }, 'Determinant'), detEl),
        h('div', { class: 'inst-item' }, h('span', { class: 'k' }, 'Eigenvalues'), eigEl)))));

  /* Lesson finder, then one section per level with lessons grouped by course in curriculum order.
     Filtering only hides rows (thumbnails stay mounted), and the filter state lives in the URL hash. */
  const F = filterFromHash(location.hash), thumbs = [], rows = new Map(), sections = [];
  const levels = h('div', { class: 'wrap levels', id: 'lessons' });
  const empty = h('div', { class: 'finder-empty', hidden: true }, h('p', {}, 'No lessons match these filters.'),
    h('button', { type: 'button', class: 'btn', onclick: () => { Object.assign(F, emptyFilter()); finder.refresh(); apply(); } }, 'Clear filters'));
  for (const [key, L] of Object.entries(LEVELS)) {
    const live = VIZ.filter(v => v.level === key), todo = PLANNED[key].filter(t => !live.some(v => v.id === slug(t))), total = live.length + todo.length;
    const body = h('div', { class: 'level-body' }), groups = [];
    for (const c of COURSES.filter(c => c.level === key)) {
      const items = live.filter(v => v.course === c.id);
      if (!items.length) continue;
      const list = h('ul', { class: 'topics' }), n = h('span', { class: 'n' });
      for (const v of items) {
        const th = h('div', { class: 'thumb', 'aria-hidden': 'true' });
        if (v.thumb) thumbs.push([th, v.thumb]);
        const li = h('li', {}, h('a', { class: 'topic', href: '#/viz/' + v.id },
          th, h('div', { class: 'tt' }, h('span', { class: 't' }, v.title), h('span', { class: 'd' }, v.blurb), LessonTags(v, false, ProgressChip(v).el)),
          h('span', { class: 'go' }, 'Open')));
        rows.set(v.id, li); list.append(li);
      }
      const el = h('section', { class: 'course', 'aria-label': c.name }, h('h3', { class: 'course-head' }, c.name, n), list);
      groups.push({ el, items, n }); body.append(el);
    }
    let planned = null;
    if (todo.length) {
      planned = h('section', { class: 'course', 'aria-label': 'In development' }, h('h3', { class: 'course-head' }, 'In development'),
        h('ul', { class: 'topics' }, todo.map(t => h('li', { class: 'planned' }, h('div', { class: 'topic' },
          h('div', { class: 'thumb empty', 'aria-hidden': 'true' }),
          h('div', { class: 'tt' }, h('span', { class: 't' }, t), h('span', { class: 'd' }, 'In development')),
          h('span', { class: 'go' }, 'Soon'))))));
      body.append(planned);
    }
    const count = h('p', { class: 'count' });
    const el = h('section', { class: 'level lvl-' + key, id: 'level-' + key },
      h('div', { class: 'level-head' },
        h('span', { class: 'numeral', 'aria-hidden': 'true' }, NUMERALS[key]),
        h('div', {}, h('h2', { class: 'display' }, L.name), h('p', { class: 'desc' }, L.desc), count)),
      body);
    levels.append(el); sections.push({ el, live, total, groups, planned, count });
  }
  levels.append(empty);
  const apply = () => {
    const on = filterActive(F); let shown = 0;
    for (const S of sections) {
      let n = 0;
      for (const g of S.groups) {
        let k = 0;
        for (const v of g.items) { const ok = matches(v, F); rows.get(v.id).hidden = !ok; if (ok) k++; }
        g.el.hidden = !k; n += k;
        g.n.textContent = k === g.items.length ? `${k} ${k === 1 ? 'lesson' : 'lessons'}` : `${k} of ${g.items.length}`;
      }
      if (S.planned) S.planned.hidden = on;
      S.el.hidden = on && !n; shown += n;
      S.count.textContent = on ? `${n} of ${S.live.length} lessons shown` : `${S.live.length} of ${S.total} topics ready`;
    }
    empty.hidden = !on || shown > 0;
    const hash = on ? filterToken(F) : '#/';
    if (location.hash !== hash && (on || /^#(find|\/\?)/.test(location.hash))) { try { history.replaceState(null, '', hash); } catch (e) {} }   /* the URL is a convenience; a frame that refuses it must not break filtering */
  };
  const finder = Finder(F, apply);
  app.append(finder.el, levels);
  apply();
  const tPlanes = thumbs.map(([el, fn]) => { const P = new Plane(el, { span: 3 }); P.onDraw = fn; P.draw(); return P; });

  /* hero: a grid cycling through linear maps, with a live readout */
  const P = new Plane(heroCanvas, { span: 3.4, transparent: true });
  const Ms = [[1,0,0,1],[1,1,0,1],[0,-1,1,0],[1.6,.6,.4,1.2],[-1,.5,0,1],[.8,-.9,.9,.8]];
  const hold = 1200, move = 2400, seg = hold + move;
  const matAt = ms => {
    const i = Math.floor(ms / seg) % Ms.length, j = (i + 1) % Ms.length, q = ease(clamp((ms % seg - hold) / move, 0, 1));
    return Ms[i].map((v, k) => lerp(v, Ms[j][k], q));
  };
  const show = ([a, b, c, d]) => {
    [a, b, c, d].forEach((v, i) => { cells[i].textContent = fmt(v); });
    detEl.textContent = fmt(a * d - b * c);
    const e = eig2(a, b, c, d);
    eigEl.textContent = e.real ? [...new Set(e.list.map(x => fmt(x.l)))].join(', ') : `${fmt(e.re)} ± ${e.im.toFixed(2)}i`;
  };
  let M = reduceMotion ? Ms[1] : Ms[0], t0 = null, raf;
  P.onDraw = (ctx, p) => {
    p.cx = p.w > 900 ? -(p.w * .2) / p.scale : 0;
    const pal = p.pal, [a, b, c, d] = M, ap = (x, y) => [a * x + b * y, c * x + d * y], N = 18;
    p.grid(1);
    for (let k = -N; k <= N; k++) {
      p.path([ap(k, -N), ap(k, N)], { stroke: k ? alpha(pal.blue, .7) : pal.axis, width: k ? 1.2 : 2 });
      p.path([ap(-N, k), ap(N, k)], { stroke: k ? alpha(pal.blue, .7) : pal.axis, width: k ? 1.2 : 2 });
    }
    p.path([ap(0,0), ap(1,0), ap(1,1), ap(0,1)], { fill: alpha(pal.yellow, .3), stroke: pal.yellow, width: 2, close: true });
    p.arrow(0, 0, a, c, pal.green); p.arrow(0, 0, b, d, pal.red);
  };
  show(M); P.draw();
  if (!reduceMotion) {
    const loop = now => { if (t0 === null) t0 = now; M = matAt(now - t0); show(M); P.draw(); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
  }
  return () => { cancelAnimationFrame(raf); P.destroy(); tPlanes.forEach(t => t.destroy()); };
}

      }) : null;
  if (stepper) panel.append(stepper.el);
  const pg = (x, cls, k) => h('a', { class: 'pg ' + cls, href: '#/viz/' + x.id }, h('span', { class: 'k' }, k), h('span', { class: 't' }, x.title));
  app.append(h('article', { class: 'wrap viz lvl-' + v.level },
    h('nav', { class: 'crumbs', 'aria-label': 'Breadcrumb' },
      h('a', { href: '#/' }, 'Continuum'), h('span', { 'aria-hidden': 'true' }, '/'),
      h('a', { class: 'lvl-tag', href: '#/level/' + v.level }, LEVELS[v.level].name)),
    h('header', { class: 'viz-head' }, h('h1', { class: 'display' }, v.title), lede,
      h('div', { class: 'viz-meta' }, h('a', { class: 'tag course', href: '#find~course_' + v.course, title: 'See every ' + COURSE[v.course].name + ' lesson' }, COURSE[v.course].name), LessonTags(v, true, chip.el))),
    h('div', { class: 'workbench' }, stage, panel),
    body, check, tickets, conn, align,
    h('nav', { class: 'pager', 'aria-label': 'More topics' },
      prev ? pg(prev, 'prev', 'Previous') : null, next ? pg(next, 'next', 'Next') : null)));
  typeset(body); if (v.hook) typeset(lede);
  const ret = v.mount({ stage, controls: Controls(panel) });
  scene = typeof ret === 'function' ? { destroy: ret } : (ret || {});
  if (stepper) stepper.start(clamp(startStep, 0, v.steps.length - 1));
  return () => scene.destroy && scene.destroy();
}

/* =====================================================================
   ROUTER
   ===================================================================== */
const app = $('#app'); let teardown = null;
function route() {
  if (teardown) teardown(); teardown = null;
  app.innerHTML = '';
  const r = parseRoute(location.hash), v = r.id && VIZ.find(x => x.id === r.id);
  teardown = r.page === 'viz' && v ? renderViz(app, v, r.step) : r.page === 'ticket' && v ? renderTicket(app, v, r.key)
           : r.page === 'progress' ? renderProgress(app) : renderHome(app);
  const home = !(r.page === 'viz' && v) && !(r.page === 'ticket' && v) && r.page !== 'progress';
  const target = home && r.level ? document.getElementById('level-' + r.level) : home && r.filters ? document.getElementById('finder') : null;
  if (target) requestAnimationFrame(() => target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' }));
  else window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
document.querySelectorAll('.nav a, .wordmark').forEach(a => a.addEventListener('click', e => {
  if (location.hash === a.getAttribute('href')) { e.preventDefault(); route(); }
}));
applyCurriculum();
$('#footStat').textContent = `${VIZ.length} topics live, ${Object.values(PLANNED).flat().filter(t => !VIZ.some(v => v.id === slug(t))).length} in development.`;
route();
</script>
